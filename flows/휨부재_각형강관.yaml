부재: 휨부재
단면: 각형강관 (직사각형·정사각형, 2축대칭)
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 10  # 4.3.2.1.1.7 각형강관(휨) · 4.3.2.1.2.5 각형강관 및 상자형단면(전단)
목표검토: "설계휨강도 φb·Mn ≥ 소요휨강도 Mu   (전단은 φv·Vn ≥ Vu 별도)"

입력:
  - {기호: B,   설명: 각형강관 외측 폭 (플랜지 방향),  단위: mm}
  - {기호: H,   설명: 각형강관 외측 높이 (웨브 방향), 단위: mm}
  - {기호: t공칭, 설명: "공칭벽두께",                  단위: mm}
  - {기호: t,   설명: "★설계벽두께 — 전기저항용접(ERW)이면 공칭의 0.93배 / SAW 면 공칭 그대로", 단위: mm}
  - {기호: 제조법, 설명: "★전기저항용접 / 서브머지드 아크용접 — 설계벽두께가 갈린다", 단위: "-"}
  - {기호: b,   설명: "플랜지 평판폭 = 내측 모서리 반경을 뺀 웨브 간 순간격 (모르면 B − 3t)", 단위: mm}
  - {기호: h,   설명: "웨브 평판높이 = 코너반경 안쪽 플랜지 간 순거리 (모르면 H − 3t)", 단위: mm}
  - {기호: Z,   설명: 소성단면계수 (휨축),             단위: mm^3}
  - {기호: S,   설명: 탄성단면계수 (휨축),             단위: mm^3}
  - {기호: Fy,  설명: 강재 항복강도,                  단위: MPa}
  - {기호: E,   설명: 강재 탄성계수,                  단위: MPa}
  - {기호: Mu,  설명: 소요휨강도 (계수하중),           단위: "kN·m"}
  - {기호: Vu,  설명: 소요전단강도 (계수하중),         단위: kN}
  - {기호: N,   설명: "축력 (있으면) — 조합력 판정",   단위: kN}
  - {기호: T,   설명: "비틀림모멘트 (있으면) — 4.4.3 판정", 단위: "kN·m"}

흐름:
  - 단계: "1"
    이름: 축력·비틀림이 함께 작용하는지 확인
    근거: "KDS 14 31 10  4.4.1"
    작업: 판정
    식위치: >
      4.4.1.1(압축+휨) · 4.4.1.2(인장+휨) — 축력이 함께면 상관식으로 검토한다.
      **4.4.3** — 비틀림 동반. ★각형강관도 **폐단면이라 비틀림을 실제로 받는다**
      (원형강관과 같은 사정). 비틀림 트리(4.4.3.1)는 원형·각형 겸용이다.
    분기:
      - {조건: "축력 함께 — 압축", 결과: "조합력 트리로",
         다음트리: "조합력부재 (압축 + 휨)"}
      - {조건: "축력 함께 — 인장", 결과: "조합력 트리로",
         다음트리: "조합력부재 (인장 + 휨)"}
      - {조건: "비틀림이 함께 작용", 결과: "4.4.3 을 함께 검토",
         다음트리: "비틀림부재 / 원형·각형강관", 다음: "2"}
      - {조건: "순수 휨 (또는 조합력 트리에서 Mr 산출용으로 불려옴)",
         결과: "이 트리를 계속", 다음: "2"}

  - 단계: "2"
    이름: ★★설계벽두께 — 제조법으로 갈린다
    근거: "KDS 14 31 10  4.2.1.1.2"
    작업: 판정
    식위치: >
      4.2.1.1.2(1)④ — 각형강관의 폭·두께는 **설계벽두께 t** 로 계산하는데:
        **전기저항용접(ERW) 각형강관 → 공칭벽두께의 0.93배**
        **서브머지드 아크용접(SAW) 각형강관 → 공칭벽두께 그대로**
      ★★**공칭두께로 그냥 계산하면 ERW 관에서 7% 과대평가**다 — 단면계수·폭두께비·
      전단면적 전부에 걸린다. **원형강관·H형강 트리에는 없는, 각형강관 고유의 덫.**
      ★평판폭 — 플랜지 b 는 **내측 모서리 반경을 뺀 웨브 간 순간격**, 웨브 h 는
      **플랜지 간 순간격**. 모서리 반경을 모르면 **외측 치수 − 3t** 로 취한다.
    분기:
      - {조건: "전기저항용접(ERW)", 결과: "t = 0.93 × 공칭",   다음: "3"}
      - {조건: "서브머지드 아크용접(SAW)", 결과: "t = 공칭",    다음: "3"}
    출력: "설계벽두께 t · 평판폭 b · h"

  - 단계: "3"
    이름: 단면 분류 — 플랜지·웨브 각각
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: >
      표 4.3-2 — **각형강관 플랜지(균일 두께)** 와 **각형강관 웨브** 항이 따로 있다
      (λp·λr — 원문 이미지). b/t·h/t 를 [2] 의 설계벽두께로 계산해 분류한다.
      ★4.3.2.1.1.7 의 적용 범위 — **웨브는 조밀 또는 비조밀**까지, **플랜지는 조밀·
      비조밀·세장판** 전부. **웨브가 세장판이면 이 절 밖**이다(원문 확인).
      ★한계상태(표 4.3-1, 4.3.2.1.1.7 행): **항복 · 플랜지 국부좌굴 · 웨브 국부좌굴** —
      셋 중 최솟값. **횡비틀림좌굴이 없다** — 2축대칭 폐단면이라 비틀림강성이 커서
      횡좌굴이 성립하지 않는다(4.3.3.3.2.1 도 박스형에 명문으로 불요).
    분기:
      - {조건: "웨브 조밀·비조밀 + 플랜지 조밀/비조밀/세장", 결과: "4.3.2.1.1.7 적용", 다음: "4A"}
      - {조건: "★웨브 세장판", 결과: "이 절 적용 불가 — 원문 확인", 다음: "8"}
    출력: 단면 분류

  # ── [4A]~[4C] 는 **병렬**이다. 셋을 산정하고 [5] 에서 최솟값을 취한다.
  - 단계: "4A"
    이름: "〔병렬〕 항복강도 (소성모멘트)"
    근거: "KDS 14 31 10  4.3.2.1.1.7"
    작업: 산정
    식위치: "4.3.2.1.1.7(1) — **식 (4.3-41)** Mn = Mp = Fy·Z"
    출력: Mn(항복)

  - 단계: "4B"
    이름: "〔병렬〕 플랜지 국부좌굴강도"
    근거: "KDS 14 31 10  4.3.2.1.1.7"
    작업: 산정
    식위치: >
      4.3.2.1.1.7(2) —
        ① 조밀 플랜지 → **산정하지 않는다**
        ② 비조밀 플랜지 → **식 (4.3-42)** (b/t·Fy/E 함수)
        ③ 세장판 플랜지 → **식 (4.3-43)** — **유효폭 be 에 대한 유효단면계수 Se**,
          유효폭은 **식 (4.3-44)**
      ★세장판 플랜지는 **유효폭 개념**이 들어온다 — 원형강관에는 없던 갈래다.
    출력: Mn(플랜지 국부좌굴)

  - 단계: "4C"
    이름: "〔병렬〕 웨브 국부좌굴강도"
    근거: "KDS 14 31 10  4.3.2.1.1.7"
    작업: 산정
    식위치: >
      4.3.2.1.1.7(3) —
        ① 조밀 웨브 → **산정하지 않는다**
        ② 비조밀 웨브 → **식 (4.3-45)** (h/tw·Fy/E 함수, 강축 탄성단면계수)
      ★**웨브 국부좌굴 한계상태는 H형강 휨 트리에는 없다** — 각형강관 고유.
    출력: Mn(웨브 국부좌굴)

  - 단계: "5"
    이름: 공칭휨강도 결정
    근거: "KDS 14 31 10  4.3.2.1.1.7"
    작업: 판정
    식위치: "4.3.2.1.1.7 머리글 — **세 한계상태 중 최솟값**"
    출력: Mn

  - 단계: "6"
    이름: 설계휨강도 산정
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 계산
    식위치: "설계휨강도 = φb·Mn. 저항계수 φb 는 원문 (★교량이면 KDS 24 14 31 4.1.4.2)"
    출력: φbMn

  - 단계: "7"
    이름: ★전단강도 — 웨브 2개, 인장역작용 없음
    근거: "KDS 14 31 10  4.3.2.1.2.5"
    작업: 산정
    식위치: >
      4.3.2.1.2.5 — 공칭전단강도 Vn 은 **4.3.2.1.2.2(1)** 에 따라 산정하되:
        **Aw = 2·h·t** (웨브가 둘이다) · **kv = 5**
        h 는 **코너반경 안쪽 플랜지 간 순거리**(모르면 H − 3t) · t 는 **설계벽두께**.
      ★★H형강의 **인장역작용 분기(4.3.2.1.2.3)는 여기 없다** — 4.3.2.1.2.2(1) 만 인용.
      ★원형강관(4.3.2.1.2.6, 전단좌굴 두 식)과도 다른 절이다.
    출력: φvVn

  - 단계: "8"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: >
      Mu ≤ φb·Mn 이고 Vu ≤ φv·Vn 이면 OK.
      ★**NG 면 여기서 끝난다.** 단면 변경은 계산서에서 설계자가 한다.
      **후행작업은 OK 인 경우에만.**
    출력: "OK / NG"

  - 단계: "9"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 10  4.3"
    작업: 판정
    식위치: >
      **배타 선택이 아니라 체크리스트**다 — 해당하는 것을 **모두** 검토한다.
        □ 비틀림이 함께 작용하는가       → [10]  (4.4.3 — 폐단면)
        □ **이음·연결부**가 있는가 (볼트/용접 불문) → [11]
      해당 없으면 그대로 종료한다.
    출력: 해당 항목 목록

  - 단계: "10"
    이름: ★비틀림 검토 (해당하면)
    근거: "KDS 14 31 10  4.4.3"
    작업: 판정
    식위치: >
      4.4.3.1 — **원형과 각형강관의 비틀림강도**. 각형강관은 식 (4.4-8)~ (h/t 구간),
      비틀림전단상수 C 는 안전측 근사값 사용 가능(원문). 기존 비틀림 트리가 겸용.
    다음트리: "비틀림부재 / 원형·각형강관"
    출력: 비틀림 검토

  - 단계: "11"
    이름: ★연결부 있음 — 「연결부 설계」 단계로 (해당하면)
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: >
      ★★**여기서는 「연결부가 있다」는 것만 기록한다.** 실무 순서 — 부재별 단면검토를
      전부 마친 뒤 「연결부 설계」 단계(진입 트리 `강교 부재 / 전체` 의 [9])에서
      볼트/용접을 한 번만 갈라 처리한다.
      ★각형강관 인장 접합의 전단뒤짐계수는 **표 4.1-1 사례 6**(각형강관 전용 — 거셋
      한쪽/양쪽으로 갈림). 원형강관 사례 5 와 다르다.
      ★**부재가 OK 여도 접합부에서 파괴되면 그 부재는 못 쓴다.**
    출력: "연결부 있음 (형식은 연결부 설계 단계에서)"

  - 단계: "12"
    이름: 종료
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: "부재 검토와 해당하는 후행작업이 모두 끝났다"
    출력: "OK"

안전주의: >
  ★★★**설계벽두께가 각형강관 고유의 덫이다**(4.2.1.1.2(1)④) — **전기저항용접(ERW)
  관은 공칭벽두께의 0.93배**, 서브머지드 아크용접(SAW)만 공칭 그대로. 공칭두께로
  계산하면 ERW 에서 **7% 과대평가**가 단면계수·폭두께비·전단면적 전부에 퍼진다.
  **원형강관·H형강 트리에는 없는 규정**이니 각형강관에서만 특별히 챙길 것.
  제조법은 밀시트·도면에서 확인한다.

  ★★**한계상태가 셋**이다(4.3.2.1.1.7 머리글) — **항복 · 플랜지 국부좌굴 · 웨브
  국부좌굴**. 횡비틀림좌굴은 **없다**(2축대칭 폐단면). **웨브 국부좌굴 한계상태**는
  H형강 휨 트리에 없던 것이고, 세장판 플랜지의 **유효폭(식 4.3-44)** 은 원형강관에
  없던 것이다.
  ★★**적용 범위 — 웨브는 조밀·비조밀까지.** 웨브가 세장판이면 이 절 밖(원문 확인).
  ★★**전단은 4.3.2.1.2.5** — Aw = 2·h·t (웨브 둘), kv = 5, **인장역작용 분기 없음**.
  H형강(4.3.2.1.2.2/.3)·원형강관(4.3.2.1.2.6)과 모두 다른 절이다.
  ★평판폭 b·h 는 **모서리 반경을 뺀 순간격** — 모르면 **외측 치수 − 3t**.
  ★**비틀림을 빠뜨리지 말 것** — 폐단면이라 실제로 받는다(4.4.3.1 각형강관 항).
  ★인장 접합의 전단뒤짐계수는 **표 4.1-1 사례 6**(각형강관 전용).
  식·λp·λr 은 원문 이미지 — `kcsc_formula('KDS 14 31 10','4.3.2.1.1.7')` ·
  `('KDS 14 31 10','4.3.2.1.2.5')` 로 그림을 직접 보고 옮길 것.
  ★교량이면 φ 는 **KDS 24 14 31 4.1.4.2**. 다만 **교량 한계상태의 박스형 부재는
  4.3.3.3.2.2(2)(식 4.3-289)** 라는 교량용 절이 따로 있다 — `휨부재 / 기타 휨부재
  (강교)` 트리. 이 트리(건축용 절 4.3.2.1.1.7)를 교량 한계상태에 그대로 태우면
  위임 경로가 틀린다(원형강관과 같은 사정).
  ★철도교는 이 트리의 적용 범위 밖 — 철도교 안건이면 멈추고 원문을 볼 것.

