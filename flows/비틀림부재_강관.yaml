부재: 비틀림부재
단면: 원형·각형강관
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 10  # 4.4.3 비틀림 또는 비틀림·휨·전단력·축력 등을 동시에 받는 부재
목표검토: "Tu ≤ φT·Tn  및  4.4.3.2 의 상관식 ≤ 1.0 (비틀림이 지배할 때)"

# ─────────────────────────────────────────────────────────────────────────────
# ★이 트리는 **비틀림 하중**을 받는 부재를 다룬다.
#   압축부재의 비틀림좌굴(4.2.4)과는 **다른 이야기**다.
#     4.2.4   압축력에 의한 좌굴 한계상태 — 원형·각형강관에는 해당 없음(표 4.2-1)
#     4.4.3   비틀림 하중에 대한 강도 — 원형·각형강관에 **전용 조항**이 있음
#
# ★핵심 분기는 **20%** 다(4.4.3.2(1)) —
#   Tu ≤ 0.2·φT·Tn  이면 비틀림 효과를 **무시**하고 4.4.1 로 간다.
#   초과하면 식 (4.4-11) 의 상관식으로 축력·휨·전단·비틀림을 함께 본다.
#   ★그러니 20% 판정을 하려면 **먼저 φT·Tn 을 구해야 한다.** 순서가 정해져 있다.
# ─────────────────────────────────────────────────────────────────────────────
입력:
  - {기호: 단면형상, 설명: "★원형강관 / 각형강관 / 비강관 (조항이 갈린다)", 단위: "-"}
  - {기호: D,  설명: "원형강관 외경",                        단위: mm}
  - {기호: t,  설명: "관 두께 (각형은 설계벽두께)",           단위: mm}
  - {기호: L,  설명: 부재 길이,                              단위: mm}
  - {기호: h,  설명: "각형강관 — 내측 모서리 반경을 감한 플랜지 사이 순간격", 단위: mm}
  - {기호: Fy, 설명: 강재 항복강도,                          단위: MPa}
  - {기호: E,  설명: 강재 탄성계수,                          단위: MPa}
  - {기호: Tu, 설명: 소요비틀림강도,                         단위: kN·m}
  - {기호: Pu, 설명: 소요축강도,                             단위: kN}
  - {기호: Mu, 설명: 소요휨강도,                             단위: kN·m}
  - {기호: Vu, 설명: 소요전단강도,                           단위: kN}

흐름:
  - 단계: "1"
    이름: 단면 형상 확인 — 강관인가
    근거: "KDS 14 31 10  4.4.3"
    작업: 판정
    식위치: >
      4.4.3.1 은 **원형·각형(직사각형) 강관** 전용이다.
      강관이 아니면 4.4.3.3(비틀림과 조합응력을 받는 비강관 부재)으로 간다.
    분기:
      - {조건: "원형강관", 결과: "4.4.3.1 ① 경로", 다음: "2"}
      - {조건: "각형(직사각형)강관", 결과: "4.4.3.1 ② 경로", 다음: "2"}
      - {조건: "비강관 부재", 결과: "4.4.3.3 으로", 다음: "6"}
    출력: 적용 조항

  - 단계: "2"
    이름: 비틀림상수 C 산정
    근거: "KDS 14 31 10  4.4.3.1"
    작업: 계산
    식위치: "4.4.3.1(2) — 비틀림전단상수 C 는 안전측으로 취할 수 있다.
             ① 원형강관 / ② 각형강관 각각 식이 다르다(원문 이미지)"
    출력: C

  - 단계: "3"
    이름: 임계좌굴응력 Fcr 산정
    근거: "KDS 14 31 10  4.4.3.1"
    작업: 산정
    식위치: >
      ★**원형강관** — 식 (4.4-6) 과 식 (4.4-7) 중 **큰 값**. 단 **0.6·Fy 를 초과할 수 없다.**
        (L = 부재 길이, D = 외경)
      ★**각형강관** — h/t 조건에 따라 식 (4.4-8)·(4.4-9)·(4.4-10) 중 해당하는 것.
        h 는 4.2.1.1.2 에 정의된 내측 모서리 반경을 감한 플랜지 사이 순간격.
      값·식은 원문 이미지 → `kcsc_formula('KDS 14 31 10','4.4.3.1')`
    출력: Fcr

  - 단계: "4"
    이름: 설계비틀림강도 산정
    근거: "KDS 14 31 10  4.4.3.1"
    작업: 산정
    식위치: "식 (4.4-5) — Tn = Fcr·C. 설계비틀림강도 = φT·Tn.
             ★한계상태: **비틀림항복 · 비틀림좌굴** (4.4.3.1(1))"
    출력: φT·Tn

  - 단계: "5"
    이름: ★비틀림이 지배하는가 — **20% 판정**
    근거: "KDS 14 31 10  4.4.3.2"
    작업: 판정
    식위치: >
      4.4.3.2(1) — **소요비틀림강도 Tu 가 설계비틀림강도 φT·Tn 의 20% 이하이면
      비틀림 효과를 무시**하고 4.4.1 의 규정(축력·휨 상관식)으로 산정한다.
      **20% 를 초과하면** 식 (4.4-11) 로 비틀림·전단·휨·축력의 상관관계를 제한한다.
      ★이 판정을 하려면 φT·Tn 이 먼저 있어야 한다 — 그래서 [2]~[4] 가 앞에 온다.
    분기:
      - {조건: "Tu ≤ 0.2·φT·Tn — 비틀림 무시", 결과: "4.4.1 상관식으로",
         다음트리: "조합력부재 (압축 + 휨) / H형강"}
      - {조건: "Tu > 0.2·φT·Tn — 비틀림 고려", 결과: "식 (4.4-11) 상관식", 다음: "7"}
    출력: 비틀림 지배 여부

  - 단계: "6"
    이름: 비강관 부재의 설계비틀림강도
    근거: "KDS 14 31 10  4.4.3.3"
    작업: 산정
    식위치: >
      4.4.3.3(1) — **수직응력항복(식 4.4-12) · 전단응력항복(식 4.4-13) · 좌굴(식 4.4-14)**
      한계상태로 구한 값 중 **가장 작은 값**.
      좌굴 한계상태의 Fcr 은 **해석에 의해 결정**되는 단면의 좌굴응력이다.
      (2) 탄성영역에 이웃한 부분에는 약간의 제한된 국부항복을 허용한다.
    출력: φT·Tn (비강관)

  - 단계: "7"
    이름: 상관식 적용 (비틀림·전단·휨·축력)
    근거: "KDS 14 31 10  4.4.3.2"
    작업: 판정
    식위치: >
      식 (4.4-11) — Pu/Pc · Mu/Mc · Vu/Vc · Tu/Tc 의 상관관계.
      Pc 는 4.1(인장) 또는 4.2(압축) 로 산정한 설계강도,
      Mc 는 4.3, Vc 는 4.3.2.1.2, Tc 는 4.4.3.1 로 산정한 값이다.
      ★각 분모를 **다른 절에서 따로 구해 와야** 한다.
    출력: 상관식 값

  - 단계: "8"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.4.3.2"
    작업: 판정
    식위치: >
      Tu ≤ φT·Tn 이고, 비틀림이 지배하면 상관식 (4.4-11) 값 ≤ 1.0 이면 OK.
      ★NG 면 여기서 끝난다 — 단면 변경은 계산서에서 설계자가 한다.
    출력: "OK / NG"

  - 단계: "9"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 10  4.4.3"
    작업: 판정
    식위치: >
      **배타 선택이 아니라 체크리스트**다.
        □ **이음·연결부**가 있는가 (볼트/용접 불문) → [10]
      해당 없으면 그대로 종료한다.
    출력: 해당 항목 목록

  - 단계: "10"
    이름: ★연결부 있음 — 「연결부 설계」 단계로 (해당하면)
    근거: "KDS 14 31 10  4.4.3"
    작업: 판정
    식위치: >
      ★★**여기서는 「연결부가 있다」는 것만 기록한다.** 실무 순서가 그렇다 —
      **부재별 단면검토를 전부 마친 뒤** 「연결부 설계」 단계에서 처리한다.
      연결재가 **볼트냐 용접이냐**는 거기서 **한 번만** 갈린다
      (진입 트리 `강교 부재 / 전체` 의 [9]).
        볼트 → 4.1.3 `연결부 / 볼트접합`   ·   용접 → 4.1.2 `연결부 / 용접접합`
      그리고 **연결재 형식과 무관하게 접합부재 4.1.4** (`연결부 / 접합부재`) 를 **반드시**.
      ★**부재가 OK 여도 접합부에서 파괴되면 그 부재는 못 쓴다.**
    출력: "연결부 있음 (형식은 연결부 설계 단계에서)"

  - 단계: "11"
    이름: 종료
    근거: "KDS 14 31 10  4.4.3"
    작업: 판정
    식위치: "비틀림 검토와 해당하는 후행작업이 모두 끝났다"
    출력: "OK"

안전주의: >
  ★★**압축부재의 비틀림좌굴(4.2.4)과 이 트리(4.4.3)는 다른 이야기다.**
    4.2.4 — **압축력**에 의한 비틀림·휨비틀림 좌굴 한계상태.
             표 4.2-1 에서 **원형·각형강관에는 해당 없음**(폐단면이라 비틀림강성이 크다).
    4.4.3 — **비틀림 하중**에 대한 강도. 원형·각형강관에 **전용 조항**(4.4.3.1)이 있다.
    "원형강관에 비틀림 검토가 있다"는 맞는 말이지만, 그것은 4.2.4 가 아니라 여기다.

  ★★**20% 가 갈림길이다**(4.4.3.2(1)). Tu ≤ 0.2·φT·Tn 이면 비틀림을 **무시**하고 4.4.1 로
  간다. 그런데 **그 판정을 하려면 φT·Tn 을 먼저 구해야 한다** — 비틀림이 작아 보인다고
  φT·Tn 산정을 건너뛰면 판정 자체를 못 한다.

  ★원형강관 Fcr 은 식 (4.4-6)·(4.4-7) 중 **큰 값**이되 **0.6·Fy 를 넘을 수 없다.**
  상한을 놓치면 위험측이 된다.
  ★상관식 (4.4-11) 의 분모(Pc·Mc·Vc·Tc)는 **각각 다른 절**에서 구해 온다 —
  4.1/4.2(축), 4.3(휨), 4.3.2.1.2(전단), 4.4.3.1(비틀림). 앞단이 틀리면 상관식도 틀린다.
  ★교량에 쓸 때는 저항계수를 **KDS 24 14 31 4.1.4.2** 에서 가져온다.
  곡선 거더·아치 리브·트러스 현재 등 **비틀림이 함께 오는 부재**에서 이 트리가 필요하다.

검증일: "2026-08-06"
검증기준:
  "KDS 143110": "2024"
검증: 설계자확정
