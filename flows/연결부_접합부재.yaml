부재: 연결부
단면: 접합부재 (거셋플레이트·연결판)
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 25  # 강구조 연결 설계기준 (하중저항계수설계법) 4.1.4 접합부재의 설계강도
목표검토: "접합부재의 설계강도 ≥ 소요강도 (해당하는 한계상태 모두)"

입력:
  - {기호: Ag,  설명: 접합부재 총단면적,            단위: mm^2}
  - {기호: Ae,  설명: 유효단면적,                   단위: mm^2}
  - {기호: Agv, 설명: 전단저항 총단면적,            단위: mm^2}
  - {기호: Anv, 설명: 전단저항 순단면적,            단위: mm^2}
  - {기호: Ant, 설명: 인장저항 순단면적,            단위: mm^2}
  - {기호: Ubs, 설명: "인장응력 균일 1.0 / 불균일 0.5", 단위: "-"}
  - {기호: Fy,  설명: 접합부재 항복강도,            단위: MPa}
  - {기호: Fu,  설명: 접합부재 인장강도,            단위: MPa}
  - {기호: t,   설명: 접합부재 두께,                단위: mm}
  - {기호: 세장비, 설명: "접합부재의 세장비 (압축강도 경로 판정)", 단위: "-"}
  - {기호: Ru,  설명: 소요강도(계수하중),           단위: kN}

흐름:
  - 단계: "1"
    이름: ★이 검토는 볼트든 용접이든 똑같이 걸린다
    근거: "KDS 14 31 25  4.1.4"
    작업: 판정
    식위치: >
      4.1.4 는 **연결재(볼트·용접)가 아니라 「접합부재」 자체**의 강도를 다룬다.
      거셋플레이트·연결판이 **찢기거나 좌굴하는** 한계상태다.
      ★★**볼트로 붙이든 용접으로 붙이든 이 검토는 똑같이 해야 한다.**
      연결재가 OK 여도 **판이 먼저 나가면 접합부는 파괴된다.**
      ★**연결부 설계 단계에서 한 번만** 하면 된다 — 볼트 트리와 용접 트리가 각각
      따로 하는 것이 아니다.
    출력: 검토 대상 접합부재

  # ── [2]~[4] 는 **병렬**이다. 해당하는 것을 모두 산정하고 [5] 에서 판정한다.
  - 단계: "2"
    이름: "〔병렬〕 접합부재의 인장강도"
    근거: "KDS 14 31 25  4.1.4.1"
    작업: 산정
    식위치: >
      인장항복 **식 (4.1-16)** / 인장파단 **식 (4.1-17)** 중 **작은 값**.
      저항계수는 각 항 괄호(원문). **두 한계상태의 φ 가 다르다.**
    출력: φRn(인장)

  - 단계: "3"
    이름: "〔병렬〕 접합부재의 전단강도"
    근거: "KDS 14 31 25  4.1.4.2"
    작업: 산정
    식위치: "전단항복 **식 (4.1-18)** / 전단파단 **식 (4.1-19)** 중 **작은 값**"
    출력: φRn(전단)

  - 단계: "4"
    이름: ★★블록전단강도 — 거셋플레이트는 반드시
    근거: "KDS 14 31 25  4.1.4.3"
    작업: 산정
    식위치: >
      4.1.4.3(2) — 보단부 이음부의 **상단플랜지 없는 이음부, 거셋플레이트 등은
      검토해야 한다**(원문이 "해야 한다"로 못 박는다).
      **식 (4.1-20)** — 전단파단 + 인장파단 조합.
      ★★**Ubs 는 인장응력이 균일하면 1.0, 불균일하면 0.5** 다.
      **잘못 고르면 강도가 두 배 차이 난다.**
      ★원형강관을 슬롯으로 절개해 거셋을 끼운 상세에서는 **관 쪽에서도** 거셋을 따라
      찢겨 나가는(tear-out) 파괴를 볼 것.
    분기:
      - {조건: "거셋플레이트 · 상단플랜지 없는 보단부 이음", 결과: "블록전단 검토 필수", 다음: "5"}
      - {조건: "해당 없음", 결과: "블록전단 생략", 다음: "5"}
    출력: φRn(블록전단)

  - 단계: "5"
    이름: 접합부재의 압축강도
    근거: "KDS 14 31 25  4.1.4.4"
    작업: 산정
    식위치: >
      세장비 조건에 따라 **식 (4.1-21)** 또는 압축부재 규정으로 넘어간다(원문 ② 확인).
      ★**거셋플레이트가 압축을 받으면 판 자체가 좌굴한다.** 인장만 보면 놓친다.
      브레이싱 거셋은 하중방향이 뒤바뀌므로 압축이 실제로 걸린다.
    분기:
      - {조건: "세장비가 원문 ①의 한계 이하", 결과: "식 (4.1-21) 적용", 다음: "6"}
      - {조건: "그 밖의 경우", 결과: "압축부재 기준으로",
         다음기준: "KDS 14 31 10  4.2", 다음: "6"}
    출력: φRn(압축)

  - 단계: "6"
    이름: 검토(판정)
    근거: "KDS 14 31 25  4.1.4"
    작업: 판정
    식위치: >
      **해당하는 모든 한계상태**에서 Ru ≤ φRn 이면 OK —
      인장(4.1.4.1) · 전단(4.1.4.2) · **블록전단(4.1.4.3)** · 압축(4.1.4.4).
      ★**어느 하나라도 NG 면 접합부재는 NG 다.** 최솟값이 지배한다.
      ★**NG 면 여기서 끝난다.** 판 두께·형상 변경은 계산서에서 설계자가 한다.
    출력: "OK / NG"

  - 단계: "7"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 25  4.1"
    작업: 판정
    식위치: >
      **배타 선택이 아니라 체크리스트**다 — 해당하는 것을 **모두** 검토한다.
        □ **이음**부인가                → **4.1.6 이음**
        □ **끼움재**를 썼는가           → **4.1.5 끼움재** (미끄럼에도 영향, 4.1.3.6(2))
        □ 지압판·주각부인가             → **4.1.7 지압강도 · 4.1.8 주각부**
        □ **앵커볼트**인가              → **4.1.9 앵커볼트**
        □ 집중하중을 받는 플랜지·웨브인가 → **4.1.10**
      해당 없으면 그대로 종료한다.
    출력: 해당 항목 목록

  - 단계: "8"
    이름: 종료
    근거: "KDS 14 31 25  4.1.4"
    작업: 판정
    식위치: "접합부재 검토와 해당하는 후행작업이 모두 끝났다"
    출력: "OK"

안전주의: >
  ★★**이 검토는 연결재 형식과 무관하다.** 볼트로 붙이든 용접으로 붙이든 **접합부재
  자체의 강도(4.1.4)는 똑같이 걸린다.** 그래서 볼트 트리·용접 트리에서 각각 하지 않고
  **연결부 설계 단계에서 한 번만** 한다.

  ★★**연결재가 OK 여도 판이 먼저 나가면 접합부는 파괴된다.**
  네 한계상태 중 **어느 하나라도 NG 면 접합부재가 NG** 다 — 최솟값이 지배한다.

  ★★**블록전단은 거셋플레이트에서 반드시** 검토한다 — 4.1.4.3(2) 가 "검토해야 한다"로
  못 박는다. **가장 빠뜨리기 쉬운 자리**다.
  **Ubs 를 1.0 / 0.5 중 잘못 고르면 강도가 두 배 차이 난다.** 인장응력 분포를 보고
  고를 것.

  ★**압축을 놓치지 말 것**(4.1.4.4). 거셋플레이트가 압축을 받으면 **판 자체가 좌굴**한다.
  브레이싱 거셋은 하중방향이 뒤바뀌므로 압축이 실제로 걸린다.
  ★인장은 **항복(4.1-16)과 파단(4.1-17)의 저항계수가 다르다.** 전단도 마찬가지다.
  ★원형강관 슬롯 상세에서는 **관 쪽의 tear-out** 도 함께 볼 것.
  ★★**교량에 쓸 때 — 이 트리는 KDS 14 31 25(건축계열) 기준이다.**
  **KDS 24 계열의 대응 연결 조항을 반드시 확인**할 것. 부재 쪽 저항계수
  (KDS 24 14 31 4.1.4.2)와 **연결부는 별개**다.

