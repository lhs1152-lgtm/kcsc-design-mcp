부재: 휨부재
단면: 1축대칭 H형강 (비정형, 강축 휨)
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 10  # 4.3.2.1.1.4 강축 휨을 받는 기타 H형강(웨브 조밀 또는 비조밀단면)
목표검토: "설계휨강도 φb·Mn  ≥  소요휨강도 Mux   (전단은 φv·Vn ≥ Vu 별도)"

입력:
  - {기호: Sxc, 설명: 압축측 강축 탄성단면계수, 단위: mm^3}
  - {기호: Sxt, 설명: 인장측 강축 탄성단면계수, 단위: mm^3}
  - {기호: Iyc, 설명: 압축플랜지의 약축 단면2차모멘트, 단위: mm^4}
  - {기호: Iy,  설명: 약축 단면2차모멘트,       단위: mm^4}
  - {기호: hc,  설명: 웨브 압축부 높이(정의는 원문), 단위: mm}
  - {기호: tw,  설명: 웨브 두께,                단위: mm}
  - {기호: Lb,  설명: 횡지지 사이 비지지길이,   단위: mm}
  - {기호: Cb,  설명: 횡비틀림좌굴 보정계수,    단위: "-"}
  - {기호: Fy,  설명: 강재 항복강도,            단위: MPa}
  - {기호: E,   설명: 강재 탄성계수,            단위: MPa}
  - {기호: Mux, 설명: 소요휨강도(강축),         단위: kN·m}
  - {기호: Vu,  설명: 소요전단강도,             단위: kN}
  - {기호: N,   설명: "축력 (있으면) — 조합력 판정에 쓴다", 단위: kN}

흐름:
  # ★조합 여부를 **맨 앞에서** 묻는다(다른 부재 트리와 같은 배치).
  - 단계: "1"
    이름: 축력이 함께 작용하는지 확인
    근거: "KDS 14 31 10  4.4.1"
    작업: 판정
    식위치: "4.4.1.1(압축+휨) · 4.4.1.2(인장+휨) — 축력이 함께 작용하면 상관식으로 검토한다"
    분기:
      - {조건: "축력 함께 — 압축", 결과: "조합력 트리로",
         다음트리: "조합력부재 (압축 + 휨) / H형강"}
      - {조건: "축력 함께 — 인장", 결과: "조합력 트리로",
         다음트리: "조합력부재 (인장 + 휨) / H형강"}
      - {조건: "순수 휨 (또는 조합력 트리에서 Mrx 산출용으로 불려옴)",
         결과: "이 트리를 계속", 다음: "2"}

  - 단계: "2"
    이름: 적용 조항 확인 (웨브 분류)
    근거: "KDS 14 31 10  4.3.2.1.1.4"
    작업: 판정
    식위치: >
      4.3.2.1.1.4 머리글 — 웨브가 **조밀 또는 비조밀**인 1축대칭 H형강
      (및 비조밀 웨브 2축대칭)에 적용한다.
      ★한계상태(표 4.3-1, 4.3.2.1.1.4 행): **항복 · 횡비틀림좌굴 · 플랜지 국부좌굴 ·
      인장플랜지 항복** — 네 가지 전부.
    분기:
      - {조건: "웨브가 세장판 단면이다", 결과: "4.3.2.1.1.5 로",
         다음트리: "휨부재 / 세장판웨브 H형강"}
      - {조건: "웨브가 조밀 또는 비조밀", 결과: "이 조항 적용", 다음: "3"}
    출력: 적용 조항

  - 단계: "3"
    이름: 횡비틀림좌굴 보정계수 Cb 산정
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 계산
    식위치: "식 (4.3-1). 안전측으로 1.0 사용 가능"
    출력: Cb

  - 단계: "4"
    이름: ★웨브 소성화계수 Rpc 산정
    근거: "KDS 14 31 10  4.3.2.1.1.4"
    작업: 계산
    식위치: >
      식 (4.3-19a)·(4.3-19b)·(4.3-19c) — 웨브 폭두께비와 λpw·λrw(표 4.3-2)로 갈린다.
      ★**Rpc 는 [5A] 압축플랜지 항복강도와 [5B] 횡비틀림좌굴강도 두 곳에 모두 쓰인다.**
      (식 (4.3-11) Mn = Rpc·Myc, 식 (4.3-12) 의 Rpc·Myc)
      ★Iyc/Iy 조건에 따라 **비틀림상수 J 를 0 으로** 처리한다(4.3.2.1.1.4(2)가).
      값·식은 원문 이미지 → `kcsc_formula('KDS 14 31 10','4.3.2.1.1.4')`
    출력: Rpc

  # ── [5A]~[5D] 는 **병렬**이다. 넷을 모두 산정하고 [6] 에서 최솟값을 취한다.
  #    (해당 없는 것은 원문 단서에 따라 산정하지 않는다)
  - 단계: "5A"
    이름: "〔병렬〕 압축플랜지 항복강도"
    근거: "KDS 14 31 10  4.3.2.1.1.4"
    작업: 산정
    식위치: "식 (4.3-11) — Mn = Rpc·Myc. Myc 는 압축플랜지 항복모멘트(부록 B.2)"
    출력: Mn(압축플랜지 항복)

  - 단계: "5B"
    이름: "〔병렬〕 횡비틀림좌굴강도"
    근거: "KDS 14 31 10  4.3.2.1.1.4"
    작업: 산정
    식위치: >
      Lp 식 (4.3-17), Lr 식 (4.3-18), rt 식 (4.3-20)·(4.3-21).
      구간별 — Lb ≤ Lp 는 산정 불필요, 식 (4.3-12)·(4.3-13).
      응력 FL 은 식 (4.3-16a)·(4.3-16b). ★여기에도 **Rpc** 가 들어간다.
    분기:
      - {조건: "Lb ≤ Lp",      결과: "횡비틀림좌굴 산정 불필요", 다음: "5C"}
      - {조건: "Lp < Lb ≤ Lr", 결과: "식 (4.3-12)",              다음: "5C"}
      - {조건: "Lb > Lr",      결과: "식 (4.3-13)",              다음: "5C"}
    출력: Mn(횡비틀림좌굴)

  - 단계: "5C"
    이름: "〔병렬〕 압축플랜지 국부좌굴강도"
    근거: "KDS 14 31 10  4.3.2.1.1.4"
    작업: 산정
    식위치: "4.3.2.1.1.4(3) — ① 조밀단면 플랜지면 **산정하지 않는다**.
             ② 비조밀 / ③ 세장판 플랜지는 해당 식(원문)"
    출력: Mn(국부좌굴)

  - 단계: "5D"
    이름: "〔병렬〕 인장플랜지 항복강도"
    근거: "KDS 14 31 10  4.3.2.1.1.4"
    작업: 산정
    식위치: "4.3.2.1.1.4(4) — **Sxt ≥ Sxc 이면 산정하지 않는다**(원문 확인).
             ★1축대칭이라 Sxt 와 Sxc 가 다르다 — 이 판정이 실제로 갈린다"
    출력: Mn(인장플랜지 항복)

  - 단계: "6"
    이름: 공칭휨강도 결정
    근거: "KDS 14 31 10  4.3.2.1.1.4"
    작업: 판정
    식위치: "4.3.2.1.1.4 머리글 — 위 네 한계상태 중 **최솟값**"
    출력: Mn

  - 단계: "7"
    이름: 단면제한 확인
    근거: "KDS 14 31 10  4.3.2.1.1.13"
    작업: 판정
    식위치: "식 (4.3-80) — 1축대칭 H형강의 Iyc/Iy 단면제한.
             세장판 웨브면 (4.3-81)·(4.3-82) 도. 보강재 없는 보는 260 제한"
    출력: 단면제한 만족 여부

  - 단계: "8"
    이름: 설계휨강도 산정
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 계산
    식위치: "설계휨강도 = φb·Mn. 저항계수 φb 값은 원문
             (★교량이면 KDS 24 14 31 4.1.4.2 의 값)"
    출력: φbMn

  - 단계: "9"
    이름: ★전단강도 — 인장역작용을 쓸 것인가
    근거: "KDS 14 31 10  4.3.2.1.2.1"
    작업: 판정
    식위치: >
      4.3.2.1.2.1(2)① — 전단강도는 **두 가지 방법**으로 산정한다.
        가. 4.3.2.1.2.2 — 후좌굴강도(**인장역작용**)를 **이용하지 않고** 산정
        나. 4.3.2.1.2.3 — **인장역작용을 고려**하여 산정
      ★저항계수도 다르다 — 4.3.2.1.2.1(2)② 에 단서가 붙어 있다.
      ★인장역작용은 **적용 조건이 까다롭다.** 조건을 확인하지 않고 쓰면 위험측이다.
    분기:
      - {조건: "인장역작용 미고려 (보수적)", 결과: "4.3.2.1.2.2 적용", 다음: "10"}
      - {조건: "인장역작용 고려",             결과: "4.3.2.1.2.3 적용", 다음: "10"}
    출력: 전단 산정 방법

  - 단계: "10"
    이름: 전단강도 산정
    근거: "KDS 14 31 10  4.3.2.1.2.2"
    작업: 산정
    식위치: "선택한 방법으로 공칭전단강도 Vn 을 구하고 φv·Vn 을 산정한다.
             (인장역작용을 쓰면 4.3.2.1.2.3)"
    출력: φvVn

  - 단계: "11"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: >
      Mux ≤ φb·Mn 이고 Vu ≤ φv·Vn 이면 OK. 단면제한([7])도 만족해야 한다.
      ★**NG 면 여기서 끝난다.** 단면 변경은 계산서에서 설계자가 한다.
      **후행작업은 OK 인 경우에만** 이어진다.
    출력: "OK / NG"

  - 단계: "12"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 10  4.3"
    작업: 판정
    식위치: >
      **배타 선택이 아니라 체크리스트**다 — 해당하는 것을 **모두** 검토한다.
        □ **이음·연결부**가 있는가 (볼트/용접 불문) → [13]
      해당 없으면 그대로 종료한다.
    출력: 해당 항목 목록

  - 단계: "13"
    이름: ★연결부 있음 — 「연결부 설계」 단계로 (해당하면)
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: >
      ★★**여기서는 「연결부가 있다」는 것만 기록한다.** 실무 순서가 그렇다 —
      **부재별 단면검토를 전부 마친 뒤** 「연결부 설계」 단계에서 처리한다.
      연결재가 **볼트냐 용접이냐**는 거기서 **한 번만** 갈린다
      (진입 트리 `강교 부재 / 전체` 의 [9]).
        볼트 → 4.1.3 `연결부 / 볼트접합`   ·   용접 → 4.1.2 `연결부 / 용접접합`
      그리고 **연결재 형식과 무관하게 접합부재 4.1.4** (`연결부 / 접합부재`) 를 **반드시**.
      ★**부재가 OK 여도 접합부에서 파괴되면 그 부재는 못 쓴다.**
    출력: "연결부 있음 (형식은 연결부 설계 단계에서)"

  - 단계: "14"
    이름: 종료
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: "부재 검토와 해당하는 후행작업이 모두 끝났다"
    출력: "OK"

안전주의: >
  ★이 트리는 **비정형(1축대칭) H형강** 용이다. 상·하 플랜지가 다르면 **압축측이 어디냐에
  따라 Sxc·Iyc 가 통째로 달라지고** 강도가 크게 달라진다. **하중방향과 압축플랜지를
  먼저 확정할 것.**
  ★**한계상태가 네 가지 전부**다(표 4.3-1) — 항복 · 횡비틀림좌굴 · 플랜지 국부좌굴 ·
  **인장플랜지 항복**. 마지막 것은 2축대칭에는 없고 1축대칭에서만 실제로 걸린다
  (Sxt 와 Sxc 가 다르기 때문). 넷 중 최솟값이다.
  ★**Rpc 는 압축플랜지 항복강도와 횡비틀림좌굴강도 두 곳에 모두 들어간다.** 한 곳만
  반영하면 다른 쪽이 과대평가된다.
  ★Iyc/Iy 조건에 따라 **J = 0** 으로 처리한다(4.3.2.1.1.4(2)가). 그 조건값은 원문 이미지다.
  ★**단면제한(4.3.2.1.1.13)을 통과하지 못하면 앞의 강도 산정이 의미가 없다.**
  ★전단은 인장역작용 여부로 조항과 저항계수가 갈린다(4.3.2.1.2.1(2)①②).
  Rpc·Lp·Lr·rt 등 모든 식이 원문 이미지다 —
  `kcsc_formula('KDS 14 31 10','4.3.2.1.1.4')` 로 그림을 직접 보고 옮길 것.
  ★교량에 쓸 때는 저항계수를 **KDS 24 14 31 4.1.4.2** 에서 가져온다.

