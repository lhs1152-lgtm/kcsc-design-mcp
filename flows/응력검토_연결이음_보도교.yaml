부재: 응력검토
단면: 연결 이음 (강교 — 용접·고장력볼트) — 보도교 ASD, KDS 14 30 25
설계법: 허용응력설계법
근거: KDS 14 30 25  # 강구조 연결 설계기준(허용응력설계법) — 4.1 일반·세칙 · 4.2 용접 · 4.3 고장력볼트 · 4.5 블록전단 · 4.6 편심 · 4.8 이음 · 4.9 지압
목표검토: "연결부(용접·고장력볼트·이음판)의  작용응력(작용력) ≤ 허용응력(허용력) × 증가계수  + 세칙(치수·간격·연단) 만족"

입력:
  - {기호: 연결형식, 설명: "용접(맞댐/부분용입/필릿/플러그·슬롯) / 고장력볼트(마찰/지압) / 병용", 단위: "-"}
  - {기호: 부재조합, 설명: "H형강–H형강(가로보 이음·거셋) / 원형강관 거더–H형강 가로보(연결판·가지) / 강관–강관(축방향 이음)", 단위: "-"}
  - {기호: P·V·M, 설명: "연결부에 걸리는 축력·전단·모멘트 (사용하중, 조합별)", 단위: "N · N·mm"}
  - {기호: t,   설명: "접합판 두께 (얇은 쪽 · 두꺼운 쪽 — 최소치수 표가 어느 쪽인지 다르다)", 단위: mm}
  - {기호: s,   설명: 필릿 모살치수 (유효목두께 = 0.7 s), 단위: mm}
  - {기호: L,   설명: "용접 길이 (유효길이 = 총길이 − 2 s)",  단위: mm}
  - {기호: 볼트, 설명: "등급(F8T/F10T · 지압용 B8T/B10T · S10T) · 호칭(M16~M30) · 마찰면 수 · 전단면 수", 단위: "-"}
  - {기호: 강종, 설명: "모재·거셋 강종·판두께 (표 4.3-5 지압, 표 4.2-4 용접 = 모재와 동일 항목)", 단위: "-"}
  - {기호: 증가계수, 설명: "조합별 허용응력 증가계수 — 하중조합 트리(KDS 24 12 10 준용)", 단위: "-"}

흐름:
  - 단계: "1"
    이름: ★적용 확인 — 보도교 연결부는 KDS 14 30 25 체계 (24 14 30 4.6 이 아니다)
    근거: "KDS 14 30 25  4.1.1"
    작업: 판정
    식위치: >
      ★★설계자 확정(2026-08-17): 보도교 ASD 부재가 KDS 14 30 10 갈래이므로 **연결도 같은 뿌리
      KDS 14 30 25** 로 본다. 구판(KDS 24 14 30 4.6)의 규정은 여기 없거나 값이 다르다 —
      **다만 설계자가 조직 규정으로 유지하기로 한 둘(주요부재 75% · 현장용접 90%)만 24 에서
      준용**하고([2]·[5]·[6]), 나머지(80 mm·RT/UT·금지 목록)는 섞지 않는다.
      허용응력 증가계수는 하중조합 트리 값(24 12 10 준용)을 연결부 허용응력·허용력에도
      곱한다(14 30 05 5.1·4.2.2 — 보정계수 1.00).
      대상 — 가로보–거더 접합, 가로보 이음, 브레이싱 거셋, 지주 베이스, 강관–강관 축방향 이음.
    분기:
      - {조건: "보도교 연결부 (용접 · 고장력볼트 · 병용)", 결과: "이 트리", 다음: "2"}
      - {조건: "⛔철도교 · 도로교(자동차) 안건",           결과: "이 트리의 적용 범위 밖 / KDS ASD 근거 없음 — 멈춘다", 다음: "13"}
    출력: 적용 확인

  - 단계: "2"
    이름: ★연결 설계의 원칙 — 최소 30 kN · 편심 · 트러스 단부 1/2 · 거셋 양방향
    근거: "KDS 14 30 25  4.1.6"
    위임근거: "KDS 24 14 30  4.6.1"
    작업: 판정
    식위치: >
      **4.1.6(1)** — 접합부는 **30 kN 이상** 지지하도록 설계(연결재·새그로드·띠장 제외).
      **4.6.1** — 축력을 받는 교차부재는 중심축이 한 점에서 만나게; 아니면 **편심에 의한 휨·전단**
      조건 충족(브레이싱 거셋에서 자주 걸린다).
      **4.1.11(3)** — 거셋플레이트는 작용력이 일방향인 경우 외엔 **인장·압축 양쪽** 작용으로
      설계, 압축 시 **면외변형** 고려. **4.1.11(4)** — 트러스부재 단부 접합부 허용내력은
      **부재 허용내력의 1/2 이상**.
      ★★**75% 규정 — 조직 실무 규정으로 유지(설계자 확정 2026-08-17)**: KDS 14 30 25 엔 없지만
      **KDS 24 14 30 4.6.1(1)② "주요부재의 연결은 부재강도의 75% 이상"** 을 준용한다 —
      기준값은 인장부재 → 허용인장응력 / 압축부재 → 허용좌굴(압축)응력 / 둘 다 받으면 큰 쪽
      부재응력과 같은 부호의 허용응력. **작용력이 작아도 모재 허용력의 75% 는 물어야 한다** —
      작용력만으로 설계하면 이 하한을 놓친다. H형강 볼트접합·거셋에서 실제로 걸린다.
      계산서에 "KDS 24 14 30 4.6.1 준용(조직 규정)" 으로 근거 명시. 14 30 25 의 30 kN 최소·
      트러스 1/2 은 그 위에 함께 만족.
      **4.1.9** — 부분용입 용접 이음엔 휨모멘트·편심력이 걸리지 않게.
      **4.8** — 보의 맞댐용접이음은 **작은 쪽 이음 단면의 전강도**로, 그 밖 이음은 이음점 소요
      에 충분하게.
    출력: "원칙 적합 여부"

  - 단계: "3"
    이름: 연결재 형식 확인 — 용접 / 볼트 / 병용
    근거: "KDS 14 30 25  4.1.8"
    작업: 판정
    식위치: >
      **4.1.8 용접과 볼트의 병용** — (1) 고장력볼트는 기본적으로 용접과 조합해 하중을 분담시킬 수
      **없다 → 용접에 전체 하중**. (2) **마찰접합 고장력볼트를 먼저 시공한 뒤 용접**한 경우에만
      분담 가능. (3) 기존 구조 증·개축(볼트가 고정하중 지지 중)은 (2)로 설계 가능.
      ★구판(24)의 "병용 시 지압볼트 무시" 와 같은 취지지만 조건이 글자로 다르다.
    분기:
      - {조건: "용접",             결과: "4.2 용접 세칙·허용응력",       다음: "4"}
      - {조건: "고장력볼트",       결과: "4.3 마찰/지압",               다음: "8"}
      - {조건: "병용",             결과: "용접 전담이 원칙(마찰볼트 선시공만 분담) — 양쪽 검토", 다음: "4"}
    출력: 연결재 형식

  - 단계: "4"
    이름: 용접 유효면적 — 맞댐 / 필릿 (글자 규정)
    근거: "KDS 14 30 25  4.2.1"
    작업: 산정
    식위치: >
      **4.2.1 맞댐용접** — 유효면적 = 유효길이 × 유효목두께 · 유효길이 = 접합부 폭 ·
      **완전용입 유효목두께 = 얇은 쪽 판두께**.
      **4.2.3(1) 필릿용접** — 유효면적 = 유효길이 × 유효목두께 · **유효길이 = 총길이 − 2 × 모살치수**
      · **유효목두께 = 0.7 × 모살치수** · 구멍모살·슬롯필릿 유효길이 = 목두께 중심선 길이.
      **4.2.2** 부분용입 유효목두께는 원문(이미지 포함) 확인. **4.2.6** — 두 가지 이상 용접
      유형 혼용 시 용접군 축에 대해 **독립 계산**.
    출력: "유효면적 (mm²)"

  - 단계: "5"
    이름: ★필릿용접 최소치수·이음부 세칙 — 보도교는 「토목구조물」 표
    근거: "KDS 14 30 25  4.2.3"
    작업: 판정
    식위치: >
      **4.2.3(2)** — 필릿 최소치수는 **건축구조물 표 4.2-2**(얇은 쪽 소재 두께 기준: t<6 → 3 /
      6~12 → 5 / 12~20 → 6 / 20 이상 → 8 mm) / **토목구조물 표 4.2-3**(★**두꺼운 쪽** 소재 두께
      기준: t ≤ 20 → 6 / t > 20 → 8 mm). **보도교 = 토목구조물 → 표 4.2-3**, 기준 두께가
      「두꺼운 쪽」이다 — 건축 표를 대면 얇게 잡힌다.
      **4.1.10 이음부 세칙(글자)** — (1) 응력 전달 필릿 이음부 길이 ≥ **모살치수 10배 & 40 mm**
      (★구판 24 는 10배 & **80 mm** — 다르다) · (2) 겹침이음은 **2열 이상 필릿**, 겹침길이 ≥
      얇은 판 5배 & 20 mm.
      ★★**현장용접 90% — 조직 실무 규정으로 유지(설계자 확정 2026-08-17)**: KDS 14 30 25 엔
      없지만 **KDS 24 14 30 4.2.2 표 4.2-1 비고 ⑧ "현장용접은 공장용접에 준하는 품질을 얻을
      수 없는 경우 90%"** 를 준용한다(용접선 방향 인장·압축은 100% — 주 ④). [6] 의 허용응력에
      곱한다. 계산서에 "KDS 24 14 30 4.2.2 준용(조직 규정)" 명시.
      ★구판의 RT/UT 검사 조건·단속/플러그/슬롯 금지는 이 체계에 없다(플러그·슬롯은 4.2.4 로
      허용) — 조직 시방이 있으면 그것이 우선.
    출력: "최소치수·길이·겹침 적합 여부"

  - 단계: "6"
    이름: 용접부 허용응력 — 표 4.2-4 (허용응력 트리와 같은 표)
    근거: "KDS 14 30 25  4.2.5"
    작업: 산정
    식위치: >
      **표 4.2-4** — 완전용입: 직교 인장·압축 / 평행 인장·압축 → **모재와 동일**, 전단 → 식(이미지) ·
      부분용입: 직교압축·평행 인장압축 → 모재와 동일, 평행 전단·직교인장 → 식 · 필릿: 유효단면
      전단 → 식, 평행 인장·압축 → 모재와 동일 · 플러그·슬롯: 평행 전단 → 식.
      "각 강종에 적합한 용접재료" — 14 30 05 3.3.2(3) 용접재료 강도 ≥ 모재.
      ★필릿 전단 허용응력 식은 이미지 — `kcsc_formula('KDS 14 30 25','4.2.5')`. 이 값에
      **증가계수**를 곱하고, **현장용접이면 0.9 를 곱한다**(조직 규정 — KDS 24 14 30 4.2.2 준용,
      용접선 방향 인장·압축은 1.0).
    위임근거: "KDS 24 14 30  4.2.2"
    다음트리: "허용응력 / 구조용 강재·용접부"
    다음: "7"
    출력: "용접부 허용응력 (MPa)"

  - 단계: "7"
    이름: 용접부 응력검토
    근거: "KDS 14 30 25  4.2.5"
    작업: 계산
    식위치: >
      작용력 / 유효면적 = 작용응력 ≤ 허용응력 × 증가계수 — 조합별 전부. 필릿은 **유효단면 전단**
      으로 본다(방향 무관 전단 취급이 이 체계의 틀). 편심(4.6.1)·혼용(4.2.6)이면 용접군별 독립.
    분기:
      - {조건: "볼트도 있다(병용·이음판)", 결과: "볼트 검토로", 다음: "8"}
      - {조건: "용접만",                   결과: "이음판·판정으로", 다음: "11"}
    출력: "용접부 OK / NG"

  - 단계: "8"
    이름: ★고장력볼트 — 마찰이음이 기본, 지압이음은 별도 표
    근거: "KDS 14 30 25  4.3.1"
    작업: 판정
    식위치: >
      **표 4.3-1 설계볼트장력(kN, 글자)** — F10T: M16 105 / M20 164 / M22 203 / M24 236 / M27 307 /
      M30 376 (F8T·F13T 도 표에).
      **표 4.3-2 마찰이음용 고장력볼트의 허용력(kN, 1볼트·1마찰면)** — F10T·S10T: **M20 39 /
      M22 48 / M24 56** (F8T: 31 / 39 / 45). ★마찰면 수를 곱한다. ★M16·M27·M30 마찰 허용력은
      표에 없다 — 원문·설계자 판단.
      **지압이음** — 표 4.3-4 지압용 볼트 허용전단응력 **B8T 150 / B10T 190 MPa** · 표 4.3-5
      **모재 허용지압응력**(강종×판두께: SM355 16 이하 320 / 16~40 310 / 40~75 300 / 75~100 295 ·
      SS275 250/240/220/220 · TMC·HSB 100 이하 단일값).
      ★★**조직 실무(설계자 2026-08-17): 볼트 연결부는 마찰이음이 기본.** 지압이음은 사용자가
      지압이음 계산을 **요청한 경우에만** 표 4.3-4/4.3-5 로 안내한다 — 묻지 않았는데 지압으로
      가지 않는다.
      ★구판(24)의 "지압이음 나사부-전단면 금지" 와 다르다 — 이 체계는 표로 허용한다.
    분기:
      - {조건: "마찰이음 (★기본 — 별도 요청 없으면 이것)", 결과: "표 4.3-2 허용력 × 마찰면 수", 다음: "9"}
      - {조건: "지압이음 (사용자가 명시적으로 요청한 경우만)", 결과: "표 4.3-4 + 표 4.3-5", 다음: "9"}
    출력: "볼트 1개 허용력"

  - 단계: "9"
    이름: 볼트 허용응력·허용력 — 축단면적 기준, 인장·전단 조합은 감소
    근거: "KDS 14 30 25  4.3.2"
    작업: 산정
    식위치: >
      **표 4.3-3 고장력볼트 허용응력(MPa, 볼트 축단면적 기준)** — 인장 **F8T 250 / F10T 310**,
      전단 **F8T 120 / F10T 150**.
      **4.3.2(2)** 허용전단력 = 전단면 수 × 축단면적 × 허용전단응력(식 4.3-1) · **(3)** 허용인장력
      = 축단면적 × 허용인장응력(식 4.3-2).
      **4.3.3** — 인장·전단 동시 → 허용전단응력에 **감소계수(식 4.3-3: 볼트 인장응력·축단면적·
      설계볼트장력 표 4.3-1)** 를 곱한다(이미지).
      **4.9** 허용지압응력 — 기계가공면·핀구멍·지점 보강재 4.9-1, 볼트 접합부 4.9-2 (Fy 기반,
      이미지).
      ★값에 **증가계수** 곱한다.
    출력: "볼트 허용력 (인장·전단·조합)"

  - 단계: "10"
    이름: 볼트 배치 세칙 — 구멍·간격·연단 (글자 표)
    근거: "KDS 14 30 25  4.1.10"
    작업: 판정
    식위치: >
      **표 4.1-1 구멍지름** — d < 24 → d+2.0 / d ≥ 24 → d+3.0 mm (리벳 표 4.1-2, 일반볼트 d+0.5).
      **(4)** 구멍 중심간 거리 ≥ **공칭직경 2.5배**. **(5) 표 4.1-4 최소연단거리(mm)** — M16 28/22 ·
      M20 34/26 · M22 38/28 · M24 42/30 · M27 48/34 · M30 52/38 (연단/측단, 측단은 자동가스·
      기계톱 절단 시). **(6)** 볼트머리·너트가 접하는 부재 연단까지 최대거리 ≤ **판두께 12배 &
      150 mm**.
      ★**블록전단(4.5)** — 인장재 접합단부: 식 4.5-1(Fu·순전단면적·순인장면적, 이미지) —
      브레이싱 거셋·볼트 이음판에서 확인.
    출력: "배치 적합 · 블록전단 OK/NG"

  - 단계: "11"
    이름: 이음판·거셋·강관 접합부
    근거: "KDS 14 30 25  4.1.11"
    작업: 판정
    식위치: >
      **4.1.11** — 접합부 판넬 보플랜지 위치에 다이어프램 · **중공단면 기둥 외부 다이어프램은
      중공단면·다이어프램의 국부좌굴 방지** · 거셋은 인장·압축 양방향(압축 시 면외변형).
      ★★**원형강관 거더 – H형강 가로보 접합** — 강관 쪽은 KDS 14 30 10 **4.8.1.8** "부재축
      방향이 다른 부재와의 연결은 **연결판 연결 또는 가지 연결**", 강관–강관 축방향은 고력볼트
      또는 용접 직접연결 원칙(2차부재만 플랜지 연결). 집중하중이 드는 격점부는 **4.8.1.6 링보강재
      또는 다이아프램** + 변형량 식 4.8-4(원형강관 트리에 있음).
      이음판 자체는 부재로서 KDS 14 30 10(인장 4.3·압축 4.4·전단)으로 검토.
