안전주의: >
  ★★★**허용응력설계법이다.** 검토는 응력(허용력) 비교, 하중은 사용하중. 「강도」·γ·φ 는
  존재하지 않는 개념이다.

  ★★★**KDS 14 30 25 갈래 + 조직 규정 둘(설계자 확정 2026-08-17)** — 14 30 25 엔 없지만
  KDS 24 14 30 에서 **준용해 유지하는 것**: ⓐ**주요부재 연결은 모재 허용력의 75% 이상**
  (24 14 30 4.6.1(1)②) ⓑ**현장용접 90%**(24 14 30 4.2.2 비고 ⑧, 용접선 방향 100%).
  둘 다 계산서에 "준용(조직 규정)" 으로 근거 명시. **옮기지 않는 것**: 필릿 유효길이 80 mm
  (여기 40 mm) · RT/UT 조건 · 단속/플러그/슬롯 금지 · 지압이음 나사부-전단면 금지.
  ★★**볼트 연결은 마찰이음이 기본** — 지압이음은 사용자가 요청한 경우에만 안내.

  ★★**필릿 최소치수는 토목구조물 표 4.2-3(두꺼운 쪽 두께: ≤20 → 6 / >20 → 8 mm)** — 건축 표
  4.2-2(얇은 쪽)를 대면 얇아진다.
  ★★**병용 시 용접이 전담**(마찰볼트 선시공만 분담) — 4.1.8.
  ★**마찰이음 허용력은 1볼트·1마찰면 값**(표 4.3-2) — 마찰면 수 곱한다. M16·M27·M30 마찰값은
  표에 없다. **볼트 허용응력은 축단면적 기준**(표 4.3-3).
  ★**볼트 인장·전단 동시면 허용전단응력 감소**(4.3.3). **블록전단(4.5)** 은 인장재 단부 필수.
  ★**표 4.3-5 모재 지압응력은 판두께 구간**(16/40/75/100) — 24 표와 같은 함정.
  ★원형강관–가로보 접합은 강관 쪽 4.8.1.8·4.8.1.6(링보강재·변형량) — 원형강관 트리와 함께.
  ★식(필릿 전단·볼트 조합 감소·블록전단·지압)은 이미지 — `kcsc_formula('KDS 14 30 25', 절)`.
  ★철도교는 이 트리의 적용 범위 밖이다 — 철도교 안건이면 멈추고 원문을 볼 것.

