부재: 휨부재
단면: 세장판웨브 H형강 (1축 또는 2축대칭, 강축 휨)
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 10  # 4.3.2.1.1.5 강축 휨을 받는 세장판 단면웨브를 갖는 1축 또는 2축대칭 H형강
목표검토: "설계휨강도 φb·Mn  ≥  소요휨강도 Mux   (전단은 φv·Vn ≥ Vu 별도)"

입력:
  - {기호: Sxc, 설명: 압축측 강축 탄성단면계수, 단위: mm^3}
  - {기호: Sxt, 설명: 인장측 강축 탄성단면계수, 단위: mm^3}
  - {기호: hc,  설명: "웨브 압축부 높이 (정의는 원문)", 단위: mm}
  - {기호: tw,  설명: 웨브 두께,                단위: mm}
  - {기호: bfc, 설명: 압축플랜지 폭,            단위: mm}
  - {기호: tfc, 설명: 압축플랜지 두께,          단위: mm}
  - {기호: aw,  설명: "웨브/압축플랜지 면적비 (식 4.3-32 에 쓰임)", 단위: "-"}
  - {기호: Lb,  설명: 횡지지 사이 비지지길이,   단위: mm}
  - {기호: Cb,  설명: 횡비틀림좌굴 보정계수,    단위: "-"}
  - {기호: Fy,  설명: 강재 항복강도,            단위: MPa}
  - {기호: E,   설명: 강재 탄성계수,            단위: MPa}
  - {기호: Mux, 설명: 소요휨강도(강축),         단위: kN·m}
  - {기호: Vu,  설명: 소요전단강도,             단위: kN}
  - {기호: N,   설명: "축력 (있으면) — 조합력 판정에 쓴다", 단위: kN}

흐름:
  # ★조합 여부를 **맨 앞에서** 묻는다(다른 부재 트리와 같은 배치).
  - 단계: "1"
    이름: 축력이 함께 작용하는지 확인
    근거: "KDS 14 31 10  4.4.1"
    작업: 판정
    식위치: "4.4.1.1(압축+휨) · 4.4.1.2(인장+휨) — 축력이 함께 작용하면 상관식으로 검토한다"
    분기:
      - {조건: "축력 함께 — 압축", 결과: "조합력 트리로",
         다음트리: "조합력부재 (압축 + 휨) / H형강"}
      - {조건: "축력 함께 — 인장", 결과: "조합력 트리로",
         다음트리: "조합력부재 (인장 + 휨) / H형강"}
      - {조건: "순수 휨 (또는 조합력 트리에서 Mrx 산출용으로 불려옴)",
         결과: "이 트리를 계속", 다음: "2"}

  - 단계: "2"
    이름: 적용 조항 확인 (웨브가 세장판인가)
    근거: "KDS 14 31 10  4.3.2.1.1.1 + 표 4.3-2"
    작업: 판정
    식위치: >
      표 4.3-2 — 웨브 비조밀 한계 λrw 를 초과하면 **세장판 웨브**다.
      ★한계상태(표 4.3-1, 4.3.2.1.1.5 행): **항복 · 횡비틀림좌굴 · 플랜지 국부좌굴 ·
      인장플랜지 항복** — 네 가지 전부. 4.3.2.1.1.5 머리글이 "그 중 **최솟값**"이라 명시한다.
    분기:
      - {조건: "웨브가 세장판", 결과: "4.3.2.1.1.5 적용", 다음: "3"}
      - {조건: "웨브가 조밀 또는 비조밀", 결과: "4.3.2.1.1.4 로",
         다음트리: "휨부재 / 1축대칭 H형강"}
    출력: 적용 조항

  - 단계: "3"
    이름: 횡비틀림좌굴 보정계수 Cb 산정
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 계산
    식위치: "식 (4.3-1). 안전측으로 1.0 사용 가능"
    출력: Cb

  - 단계: "4"
    이름: ★휨강도 감소계수 Rpg 산정
    근거: "KDS 14 31 10  4.3.2.1.1.5"
    작업: 계산
    식위치: >
      ★**식 (4.3-32) — "휨강도 감소계수"** 다. 1축대칭 트리(4.3.2.1.1.4)의
      **웨브 소성화계수 Rpc 와 다른 계수**이니 혼동하지 말 것.
      세장판 웨브라서 소성화가 아니라 **감소**를 반영한다.
      식 (4.3-32) 에는 aw(웨브/압축플랜지 면적비)가 들어가고 **aw 는 10 을 초과할 수 없다**
      (식 (4.3-21) 로 산정).
      ★이 계수는 **압축플랜지 항복강도·횡비틀림좌굴강도·압축플랜지 국부좌굴강도** 에
      모두 곱해진다 (식 4.3-27·4.3-28·4.3-33). 한 곳만 반영하면 나머지가 과대평가된다.
      값·식은 원문 이미지 → `kcsc_formula('KDS 14 31 10','4.3.2.1.1.5')`
    출력: Rpg

  # ── [5A]~[5D] 는 **병렬**이다. 넷을 모두 산정하고 [6] 에서 최솟값을 취한다.
  - 단계: "5A"
    이름: "〔병렬〕 압축플랜지 항복강도"
    근거: "KDS 14 31 10  4.3.2.1.1.5"
    작업: 산정
    식위치: "4.3.2.1.1.5(1) — **식 (4.3-27)**. Rpg 가 곱해진다"
    출력: Mn(압축플랜지 항복)

  - 단계: "5B"
    이름: "〔병렬〕 횡비틀림좌굴강도"
    근거: "KDS 14 31 10  4.3.2.1.1.5"
    작업: 산정
    식위치: >
      4.3.2.1.1.5(2) — **식 (4.3-28)**. Lp 는 **식 (4.3-17)** 로, Lr 은 **식 (4.3-31)** 로
      산정한다. rt 는 4.3.2.1.1.4 의 유효단면2차반경을 쓴다.
      ① Lb ≤ Lp 는 산정하지 않는다 / ② 식 (4.3-29) / ③ 식 (4.3-30).
    분기:
      - {조건: "Lb ≤ Lp",      결과: "횡비틀림좌굴 산정 불필요", 다음: "5C"}
      - {조건: "Lp < Lb ≤ Lr", 결과: "식 (4.3-29)",              다음: "5C"}
      - {조건: "Lb > Lr",      결과: "식 (4.3-30)",              다음: "5C"}
    출력: Mn(횡비틀림좌굴)

  - 단계: "5C"
    이름: "〔병렬〕 압축플랜지 국부좌굴강도"
    근거: "KDS 14 31 10  4.3.2.1.1.5"
    작업: 산정
    식위치: >
      4.3.2.1.1.5(3) — **식 (4.3-33)**.
      ① 조밀단면 플랜지면 **산정하지 않는다** / ② 비조밀 식 (4.3-34) / ③ 세장판 식 (4.3-35).
      ★계수 kc 에 **0.35 ≤ kc ≤ 0.76** 의 상·하한이 걸린다(원문). 범위를 벗어나면 안 된다.
    출력: Mn(국부좌굴)

  - 단계: "5D"
    이름: "〔병렬〕 인장플랜지 항복강도"
    근거: "KDS 14 31 10  4.3.2.1.1.5"
    작업: 산정
    식위치: >
      4.3.2.1.1.5(4) — ① 원문 조건(Sxt 와 Sxc 관계)에 해당하면 **산정하지 않는다** /
      ② 그 밖의 경우 **식 (4.3-36)**.
      ★1축대칭이면 Sxt ≠ Sxc 라 이 판정이 실제로 갈린다.
    출력: Mn(인장플랜지 항복)

  - 단계: "6"
    이름: 공칭휨강도 결정
    근거: "KDS 14 31 10  4.3.2.1.1.5"
    작업: 판정
    식위치: "4.3.2.1.1.5 머리글 — 위 네 한계상태 중 **최솟값**"
    출력: Mn

  - 단계: "7"
    이름: 단면제한 확인
    근거: "KDS 14 31 10  4.3.2.1.1.13"
    작업: 판정
    식위치: >
      세장판 웨브는 식 (4.3-81)·(4.3-82) 의 a/h 제한을 만족해야 한다.
      **보강재가 없는 보는 그 값이 260 을 초과할 수 없고, 웨브 면적은 압축플랜지 면적의
      10배를 초과할 수 없다**(4.3.2.1.1.13(2)).
      1축대칭이면 식 (4.3-80) 의 Iyc/Iy 제한도 함께 본다.
    출력: 단면제한 만족 여부

  - 단계: "8"
    이름: 설계휨강도 산정
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 계산
    식위치: "설계휨강도 = φb·Mn. 저항계수 φb 값은 원문
             (★교량이면 KDS 24 14 31 4.1.4.2 의 값)"
    출력: φbMn

  - 단계: "9"
    이름: ★전단강도 — 인장역작용을 쓸 것인가
    근거: "KDS 14 31 10  4.3.2.1.2.1"
    작업: 판정
    식위치: >
      4.3.2.1.2.1(2)① — 전단강도는 **두 가지 방법**으로 산정한다.
        가. 4.3.2.1.2.2 — 후좌굴강도(**인장역작용**)를 **이용하지 않고** 산정
        나. 4.3.2.1.2.3 — **인장역작용을 고려**하여 산정
      ★저항계수도 다르다 — 4.3.2.1.2.1(2)② 에 단서가 붙어 있다.
      ★**세장판 웨브는 인장역작용의 실익이 큰 대신 적용 조건이 까다롭다.**
      조건을 확인하지 않고 쓰면 위험측이다.
    분기:
      - {조건: "인장역작용 미고려 (보수적)", 결과: "4.3.2.1.2.2 적용", 다음: "10"}
      - {조건: "인장역작용 고려",             결과: "4.3.2.1.2.3 적용", 다음: "10"}
    출력: 전단 산정 방법

  - 단계: "10"
    이름: 전단강도 산정
    근거: "KDS 14 31 10  4.3.2.1.2.2"
    작업: 산정
    식위치: "선택한 방법으로 공칭전단강도 Vn 을 구하고 φv·Vn 을 산정한다.
             (인장역작용을 쓰면 4.3.2.1.2.3)"
    출력: φvVn

  - 단계: "11"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: >
      Mux ≤ φb·Mn 이고 Vu ≤ φv·Vn 이면 OK. 단면제한([7])도 만족해야 한다.
      ★**NG 면 여기서 끝난다.** 단면 변경은 계산서에서 설계자가 한다.
      **후행작업은 OK 인 경우에만** 이어진다.
    출력: "OK / NG"

  - 단계: "12"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 10  4.3"
    작업: 판정
    식위치: >
      **배타 선택이 아니라 체크리스트**다 — 해당하는 것을 **모두** 검토한다.
        □ **이음·연결부**가 있는가 (볼트/용접 불문) → [13]
      해당 없으면 그대로 종료한다.
    출력: 해당 항목 목록

  - 단계: "13"
    이름: ★연결부 있음 — 「연결부 설계」 단계로 (해당하면)
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: >
      ★★**여기서는 「연결부가 있다」는 것만 기록한다.** 실무 순서가 그렇다 —
      **부재별 단면검토를 전부 마친 뒤** 「연결부 설계」 단계에서 처리한다.
      연결재가 **볼트냐 용접이냐**는 거기서 **한 번만** 갈린다
      (진입 트리 `강교 부재 / 전체` 의 [9]).
        볼트 → 4.1.3 `연결부 / 볼트접합`   ·   용접 → 4.1.2 `연결부 / 용접접합`
      그리고 **연결재 형식과 무관하게 접합부재 4.1.4** (`연결부 / 접합부재`) 를 **반드시**.
      ★**부재가 OK 여도 접합부에서 파괴되면 그 부재는 못 쓴다.**
    출력: "연결부 있음 (형식은 연결부 설계 단계에서)"

  - 단계: "14"
    이름: 종료
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: "부재 검토와 해당하는 후행작업이 모두 끝났다"
    출력: "OK"

안전주의: >
  ★★**감소계수의 이름과 식이 1축대칭 트리와 다르다.**
    4.3.2.1.1.4(웨브 조밀·비조밀) — **웨브 소성화계수 Rpc**, 식 (4.3-19a~c)
    4.3.2.1.1.5(웨브 세장판)     — **휨강도 감소계수 Rpg**, 식 **(4.3-32)**
  세장판 웨브는 소성화가 아니라 **감소**를 반영한다. 두 계수를 바꿔 쓰면 결과가 통째로 틀린다.
  식 번호도 전부 다르다 — 4.3.2.1.1.5 는 (4.3-27)~(4.3-36) 을 쓴다.

  ★Rpg 는 **압축플랜지 항복·횡비틀림좌굴·압축플랜지 국부좌굴** 세 곳에 모두 곱해진다
  (식 4.3-27·4.3-28·4.3-33). 한 곳만 반영하면 나머지가 과대평가된다.
  ★식 (4.3-32) 의 **aw 는 10 을 초과할 수 없다**(식 4.3-21).
  ★압축플랜지 국부좌굴의 **kc 는 0.35 ≤ kc ≤ 0.76** 로 상·하한이 걸린다.
  ★**세장판 웨브는 플레이트거더 영역**이다. 교량용 거더라면 이 트리가 아니라
  4.3.3(교량용 거더)을 따라야 한다 — 조항이 통째로 다르다.
  ★단면제한(4.3.2.1.1.13(2)) — 보강재 없는 보는 260 초과 불가, 웨브 면적은 압축플랜지
  면적의 10배 초과 불가. **통과하지 못하면 앞의 강도 산정이 의미가 없다.**
  ★전단은 인장역작용 여부로 조항과 저항계수가 갈린다(4.3.2.1.2.1(2)①②).
  모든 식이 원문 이미지다 — `kcsc_formula('KDS 14 31 10','4.3.2.1.1.5')` 로 보고 옮길 것.
  ★교량에 쓸 때는 저항계수를 **KDS 24 14 31 4.1.4.2** 에서 가져온다.

