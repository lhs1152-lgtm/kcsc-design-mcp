부재: 플레이트거더
단면: 강교 I형 거더 (합성·비합성)
설계법: 한계상태설계법
근거: KDS 24 14 31  # 4.6(1) 이 플레이트거더 설계를 KDS 14 31 10(4.3.3.1) 로 위임한다
목표검토: "시공성 · 사용 · 피로 · 강도 한계상태를 **모두** 만족 (φf·Mn ≥ Mu · φv·Vn ≥ Vu)"

# ─────────────────────────────────────────────────────────────────────────────
# ★설계조건 (계산서 맨 앞에서 먼저 받는다)
#   `교량형식` 이 정해져야 검토 위치가 정해진다.
#     단순교 — 중앙부에 **정모멘트만** 발생 → 정모멘트부만 검토
#     연속교 — 중앙부 정모멘트 + 지점부 **부모멘트** → **둘 다** 검토
#   `하중조합처리` 는 설계자가 고른다.
#     전체병렬 — 모든 하중조합을 그대로 펼쳐 검토(계산서에 전부 남긴다)
#     최대조합 — 모든 조합을 훑어 **최대 단면력이 나오는 조합 하나**만 검토
# ─────────────────────────────────────────────────────────────────────────────
입력:
  - {기호: 교량형식,     설명: "★단순교 / 연속교 (검토 위치를 결정한다)", 단위: "-"}
  - {기호: 하중조합처리, 설명: "★전체병렬 / 최대조합",                    단위: "-"}
  - {기호: D,   설명: 웨브 높이,                    단위: mm}
  - {기호: tw,  설명: 웨브 두께,                    단위: mm}
  - {기호: bf,  설명: 플랜지 폭,                    단위: mm}
  - {기호: tf,  설명: 플랜지 두께,                  단위: mm}
  - {기호: do,  설명: 중간수직보강재 간격,          단위: mm}
  - {기호: Fyw, 설명: 웨브 항복강도,                단위: MPa}
  - {기호: Fyf, 설명: 플랜지 항복강도,              단위: MPa}
  - {기호: Dp,  설명: "바닥판 상단~소성중립축 거리 (합성)", 단위: mm}
  - {기호: Dt,  설명: 합성단면 전체높이,            단위: mm}
  - {기호: fl,  설명: 플랜지 횡방향 휨응력,         단위: MPa}
  - {기호: Mu정, 설명: "★정모멘트부 소요휨강도 (중앙부)",           단위: kN·m}
  - {기호: Vu정, 설명: "★정모멘트부 소요전단강도",                  단위: kN}
  - {기호: Mu부, 설명: "★부모멘트부 소요휨강도 (지점부) — 연속교만", 단위: kN·m}
  - {기호: Vu부, 설명: "★부모멘트부 소요전단강도 — 연속교만",        단위: kN}
  - {기호: φf,  설명: "휨 저항계수 (★KDS 24 14 31 4.1.4.2)",   단위: "-"}
  - {기호: φv,  설명: "전단 저항계수 (★KDS 24 14 31 4.1.4.2)", 단위: "-"}

흐름:
  - 단계: "1"
    이름: ★설계조건 — 교량형식 확인
    근거: "KDS 24 14 31  4.1.1"
    작업: 판정
    식위치: >
      계산서 맨 앞에서 받는 설계조건이다.
      **단순교** — 중앙부에 정모멘트만 발생 → 정모멘트부 입력란만 활성화.
      **연속교** — 중앙부 정모멘트 + 지점부 부모멘트 → **두 위치 모두** 활성화하고
      각각의 단면력을 따로 입력받아 각각 검토한다.
    분기:
      - {조건: "단순교", 결과: "정모멘트부만 검토 (Mu정·Vu정)",              다음: "2"}
      - {조건: "연속교", 결과: "정모멘트부 + 부모멘트부 둘 다 (Mu정·Mu부 각각)", 다음: "2"}
    출력: 검토 위치

  - 단계: "2"
    이름: 하중조합 처리 방식 선택
    근거: "KDS 24 14 31  4.1.4.1"
    작업: 판정
    식위치: >
      하중조합은 KDS 24 12 11. 강교는 **사용Ⅱ 도 필수**(KDS 24 14 31 4.1.2(2)).
      **전체병렬** — 모든 조합을 펼쳐 검토하고 계산서에 전부 남긴다.
      **최대조합** — 모든 조합을 훑은 뒤 **최대 단면력이 나오는 조합 하나**만 검토한다.
      어느 쪽이든 조합을 **훑는 것 자체는 빠뜨리면 안 된다.**
    분기:
      - {조건: "전체병렬", 결과: "모든 조합을 각각 검토", 다음트리: "하중조합 / 도로교", 다음: "3"}
      - {조건: "최대조합", 결과: "지배 조합 하나만 검토", 다음트리: "하중조합 / 도로교", 다음: "3"}
    출력: "Mu정·Vu정 (+ 연속교면 Mu부·Vu부)"

  - 단계: "3"
    이름: ★저항계수 φ 확정 (교량 고유)
    근거: "KDS 24 14 31  4.1.4.2"
    작업: 산정
    식위치: "4.1.4.2 — 휨 φf · 전단 φv. **건축 기준의 φ 가 아니다.**
             값은 원문 이미지 → `kcsc_formula('KDS 24 14 31','4.1.4.2')`"
    출력: "φf, φv"

  - 단계: "4"
    이름: 단면 종류 판별
    근거: "KDS 14 31 10  4.3.3.1.1"
    위임근거: "KDS 24 14 31  4.6"
    작업: 판정
    식위치: "4.3.3.1.1.1 합성단면 / 4.3.3.1.1.2 비합성단면 / 4.3.3.1.1.3 하이브리드 단면"
    분기:
      - {조건: "합성단면",   결과: "바닥판과 합성 거동", 다음: "5"}
      - {조건: "비합성단면", 결과: "합성 거동 없음",     다음: "5"}
      - {조건: "하이브리드", 결과: "웨브·플랜지 강종이 다름", 다음: "5"}
    출력: 단면 종류

  - 단계: "5"
    이름: 하이브리드 단면 제한 확인 (해당하면)
    근거: "KDS 14 31 10  4.3.3.1.1.3"
    위임근거: "KDS 24 14 31  4.6"
    작업: 판정
    식위치: >
      4.3.3.1.1.3(1) — 웨브 최소항복강도는 **강도가 큰 플랜지 최소항복강도의 65% 이상**.
      웨브 항복강도가 플랜지보다 크면 **작은 플랜지 최소항복강도의 120% 이하**.
      (정모멘트 합성단면에서 웨브 > 압축플랜지인 경우는 그대로 적용 가능)
    출력: 하이브리드 적합 여부

  - 단계: "6"
    이름: 단면비 제한 확인
    근거: "KDS 14 31 10  4.3.3.1.2"
    위임근거: "KDS 24 14 31  4.6"
    작업: 판정
    식위치: "4.3.3.1.2.1 웨브단면비 · 4.3.3.1.2.2 플랜지 단면비 (한계값은 원문 이미지)"
    출력: 단면비 적합 여부

  # ── 여기부터 [7]~[10] 은 **병렬 검토 항목**이다. 순서는 표기상의 것일 뿐
  #    앞 항목이 뒤 항목의 전제가 아니다. 넷을 모두 만족해야 한다(KDS 24 14 31 4.1.1(2)).
  - 단계: "7"
    이름: "〔병렬〕 시공성 검토"
    근거: "KDS 14 31 10  4.3.3.1.3"
    위임근거: "KDS 24 14 31  4.6"
    작업: 판정
    식위치: "4.3.3.1.3.1 일반 · .2 휨 · .3 전단 · .4 바닥판 시공 · .5 고정하중 처짐.
             ★가설 중 단계도 검토 대상이다(KDS 24 14 31 4.1.1(1))"
    출력: 시공성 판정

  - 단계: "8"
    이름: "〔병렬〕 사용한계상태 검토"
    근거: "KDS 14 31 10  4.3.3.1.4"
    위임근거: "KDS 24 14 31  4.1.2"
    작업: 판정
    식위치: "4.3.3.1.4.1 탄성처짐 · 4.3.3.1.4.2 영구처짐.
             하중조합은 KDS 24 12 11 의 **사용Ⅱ**(KDS 24 14 31 4.1.2(2))"
    출력: 사용성 판정

  - 단계: "9"
    이름: "〔병렬〕 피로 및 파단한계상태 검토"
    근거: "KDS 14 31 10  4.3.3.1.5"
    위임근거: "KDS 24 14 31  4.1.3"
    작업: 판정
    식위치: "4.3.3.1.5.1 피로 · .2 파단 · .3 **웨브의 피로요구조건**.
             피로 상세는 KDS 14 31 20(4), 피로 활하중은 KDS 24 12 21(4.3.2)"
    다음기준: "KDS 14 31 20  4"
    출력: 피로 판정

  - 단계: "10"
    이름: "〔병렬〕 강도한계상태 — 휨 검토 경로 판별"
    근거: "KDS 14 31 10  4.3.3.1.6.2"
    위임근거: "KDS 24 14 31  4.6"
    작업: 판정
    식위치: >
      4.3.3.1.6.1 — 강도한계상태 하중조합 적용.
      ★**합성 정모멘트부만 4.3.3.1.7** 이고, **비합성은 정·부 모두 4.3.3.1.8** 이다
      (그 조항 제목이 "부모멘트부의 합성단면과 **비합성단면**"이다).
      비합성 거더를 4.3.3.1.7 로 보내면 안 된다.
    분기:
      - {조건: "합성단면 · 정모멘트부", 결과: "4.3.3.1.7 로", 다음: "11"}
      - {조건: "비합성단면 (정·부 모두)", 결과: "4.3.3.1.8 로", 다음: "12"}
      - {조건: "합성단면 · 부모멘트부 (연속교)", 결과: "4.3.3.1.8 로", 다음: "12"}
    출력: 휨 검토 경로

  - 단계: "11"
    이름: "휨강도 — 정모멘트부 합성단면"
    근거: "KDS 14 31 10  4.3.3.1.7"
    위임근거: "KDS 24 14 31  4.6"
    작업: 산정
    식위치: >
      ★**중앙부 정모멘트 · 합성단면**에 대한 검토.
      4.3.3.1.7.1 조밀단면 — 판정식 (4.3-146), Mn 은 Dp/Dt 조건에 따라
      식 (4.3-147) 또는 (4.3-148). Mp 는 부록 B.1, My 는 부록 B.2.
      4.3.3.1.7.2 비조밀단면 / 4.3.3.1.7.3 연성 요구조건.
      ★강종에 따라 갈린다 — 460MPa 이하 / 690MPa (원문 ①②).
    분기:
      - {조건: "★단순교 — 부모멘트 없음", 결과: "부모멘트부 검토 생략", 다음: "13"}
      - {조건: "★연속교 — 지점부 부모멘트 있음", 결과: "부모멘트부도 검토", 다음: "12"}
    출력: Mn(정)

  - 단계: "12"
    이름: "휨강도 — 부모멘트부 / 비합성단면"
    근거: "KDS 14 31 10  4.3.3.1.8"
    위임근거: "KDS 24 14 31  4.6"
    작업: 산정
    식위치: >
      ★**지점부 부모멘트**(연속교) 와 **비합성단면**(정·부 모두)이 여기로 온다.
      4.3.3.1.8.1 일반 · .2 **압축플랜지 휨저항강도** · .3 인장플랜지 휨강도.
      웨브 휨좌굴강도는 4.3.3.1.1.9, 플랜지 응력감소계수는 4.3.3.1.1.10.
    출력: Mn(부 / 비합성)

  - 단계: "13"
    이름: "〔병렬〕 강도한계상태 — 전단"
    근거: "KDS 14 31 10  4.3.3.1.9.1"
    위임근거: "KDS 24 14 31  4.6"
    작업: 판정
    식위치: >
      식 (4.3-179) — φv·Vn ≥ Vu.
      ★**수직보강재를 두지 않는 웨브는 실무에 없다.** 4.3.3.1.9.1(3) 의 요점은
      "**아래와 같이** 수직보강재를 설치하고 4.3.3.1.9.3 을 적용하여 설계한다" —
      즉 **보강/비보강의 분기가 아니라 수직보강재 간격 상한을 명시**한 조항이다.
      그래서 이 트리는 언제나 4.3.3.1.9.3 으로 간다. 갈리는 것은 **간격 기준**뿐이다.
      (4.3.3.1.9.2 비보강 웨브는 실무 경로가 아니다)
    분기:
      - {조건: "균질·하이브리드 거더의 **내측** 웨브 — 수평보강재 없음",
         결과: "4.3.3.1.9.1(3)① 의 간격 상한 적용", 다음: "14"}
      - {조건: "균질·하이브리드 거더의 **내측** 웨브 — 수평보강재 1개 이상",
         결과: "4.3.3.1.9.1(3)② 의 간격 상한 적용", 다음: "14"}
      - {조건: "그 밖의 웨브(외측 등)",
         결과: "별도 명시된 간격 기준이 있으면 그것, 없으면 설계자가 정한 간격", 다음: "14"}
    출력: 수직보강재 간격 do

  - 단계: "14"
    이름: 보강 웨브의 공칭전단강도
    근거: "KDS 14 31 10  4.3.3.1.9.3"
    위임근거: "KDS 24 14 31  4.6"
    작업: 산정
    식위치: "4.3.3.1.9.3 — 수직보강재를 둔 웨브의 공칭전단강도.
             **단부 패널**의 수직보강재는 (3)항 규정을 따른다"
    출력: Vn

  - 단계: "15"
    이름: 전단연결재 (합성단면이면)
    근거: "KDS 14 31 10  4.3.3.1.10"
    위임근거: "KDS 24 14 31  4.6"
    작업: 산정
    식위치: "4.3.3.1.10.1 일반 · .2 **피로강도** · .3 영구하중 휨 변곡점구간 특별요구 ·
             .4 강도한계상태"
    출력: 전단연결재 배치

  - 단계: "16"
    이름: 보강재 설계
    근거: "KDS 14 31 10  4.3.3.1.11"
    위임근거: "KDS 24 14 31  4.6"
    작업: 산정
    식위치: "4.3.3.1.11.1 중간수직보강재 · .2 하중집중점 지압보강재 · .3 수평보강재"
    출력: 보강재

  - 단계: "17"
    이름: 덮개판 (선택)
    근거: "KDS 14 31 10  4.3.3.1.12"
    위임근거: "KDS 24 14 31  4.6"
    작업: 산정
    식위치: "4.3.3.1.12.1 일반사항 · .2 단부 요구조건. **필요에 따라 선택**"
    출력: 덮개판

  - 단계: "18"
    이름: 검토(판정)
    근거: "KDS 24 14 31  4.1.4.2"
    작업: 판정
    식위치: >
      φf·Mn ≥ Mu 이고 φv·Vn ≥ Vu — **검토한 각 위치에서 각각**.
      단순교는 정모멘트부, 연속교는 정모멘트부와 부모멘트부 **각각** 판정한다.
      ★φ 는 단계 3 의 **교량 값**을 쓴다.
      네 한계상태(시공성·사용·피로·강도)를 **모두** 만족해야 한다(KDS 24 14 31 4.1.1(2)).
    출력: "OK / NG (위치별)"

안전주의: >
  ★★**강도식은 KDS 14 31 10, 저항계수 φ 는 KDS 24 14 31 4.1.4.2.** 이 트리의 존재 이유다.
  KDS 24 14 31 4.6(1) 이 플레이트거더 설계를 KDS 14 31 10(4.3.3.1) 로 위임하므로 식은
  건축 기준을 쓰지만, **φ 를 건축 기준에서 가져오면 안 된다.**

  ★**단순교 / 연속교를 먼저 정한다.** 단순교는 중앙부 정모멘트만, 연속교는 중앙부 정모멘트와
  **지점부 부모멘트를 둘 다** 검토한다. 계산서는 두 위치의 단면력을 **각각** 입력받아
  **각각** 판정해야 한다. 연속교에서 부모멘트부를 빠뜨리면 지점부가 통째로 미검토가 된다.

  ★**수직보강재를 두지 않는 웨브는 실무에 없다.** 4.3.3.1.9.1(3) 은 보강/비보강의 분기가
  아니라 **수직보강재 간격 상한을 명시한 조항**이다("아래와 같이 수직보강재를 설치하고
  4.3.3.1.9.3 을 적용하여 설계한다"). 내측 웨브가 아니어도 수직보강재는 설치하고
  4.3.3.1.9.3 으로 설계하며, 간격은 별도 명시가 없으면 설계자가 정한다.

  ★한계상태 넷(시공성·사용·피로·강도)은 **병렬**이다. 앞이 뒤의 전제가 아니고 모두 만족해야
  한다. 하중조합은 전부 펼쳐 검토하든 최대 단면력 조합 하나만 검토하든 설계자가 정하되,
  **조합을 훑는 것 자체는 빠뜨리면 안 된다.**
  플레이트거더는 **피로가 지배하는 경우가 흔하다**(4.3.3.1.5.3 웨브의 피로요구조건).
  ★하이브리드 단면은 웨브/플랜지 항복강도 비율 제한(65% · 120%)을 먼저 통과해야 한다.
  곡선 거더·박스거더는 이 트리가 아니다 — 박스거더는 KDS 14 31 10 (4.3.3.2).
  ★**부모멘트 구간의 최소 바닥판철근(4.3.3.1.1.7)은 이 트리에 없다.** 바닥판 철근 검토는
  단면검토 흐름이 아니라 **바닥판 검토**에서 다룬다(KDS 24 14 31 4.10). 여기로 끌어들이면
  거더 단면검토와 바닥판 검토가 뒤섞인다.

  ⚠️기준 원문 오타: **4.3.3.1.9.1(4) 의 "6.3.1.9.2" 는 존재하지 않는 조항이다.**
  이 기준에는 6장이 없다(1~4장 + 부록). 문맥상 **4.3.3.1.9.2**(비보강 웨브의 공칭강도)를
  가리키는 것으로 읽어야 한다. 다만 위와 같이 비보강 경로는 실무에서 쓰지 않는다.

