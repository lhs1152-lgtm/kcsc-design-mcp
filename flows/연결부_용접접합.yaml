안전주의: >
  ★★★**이 트리는 「토목구조물(교량)」 갈래 전용이다** — 4.1.2.4**(1)**,
  **단위길이당** 설계강도 **식 (4.1-2)** · **표 4.1-7**, 소요강도는 **식 (4.1-3)** 의
  **3방향 벡터 합**.
  ⚠️건축구조물은 4.1.2.4**(2)** 로 **산정 체계 자체가 다르다**(모재 식 4.1-4 와 용접재
  식 4.1-5 중 작은 값, **표 4.1-8**). **표 4.1-8 을 교량에 가져다 쓰면 근거부터 틀린다.**
  부재 트리들은 "저항계수만 KDS 24 에서 가져온다" 였지만 **용접은 식과 표가 통째로 갈린다.**

  ★★★**비파괴시험을 면제하면 필릿용접 설계강도가 50% 가 된다**(4.1.2.4(4),
  품질관리 구분 '나'). **검사 계획과 설계강도가 묶여 있다.** 시공 조건을 확인하지 않고
  계산값을 그대로 쓰면 **2배 과대평가**다.

  ★★**필릿 최소치수는 「토목 표 4.1-6(b) · 두꺼운 쪽」 기준이다**(4.1.2.2.2(1)).
  건축용 표 4.1-6(a) 는 **얇은 쪽** 기준이라 **보는 판이 반대다.** 습관적으로 얇은 쪽을
  보면 교량에서 최소치수가 과소해진다.

  ★★**긴 용접은 유효길이가 줄어든다**(4.1.2.2.2(5)) — 치수의 100배까지는 그대로,
  100~300배는 **식 (4.1-1)** 감소계수, **300배를 넘으면 치수의 180배로 자른다.**
  실제 길이를 그대로 쓰면 과대평가된다.

  ★★**슬롯에 거셋플레이트를 끼워 두른 용접은 「필릿용접」이다** — 표 4.1-8 이
  "필릿용접(**구멍, 슬롯**, 빗방향 T조인트 필릿 포함)" 이라고 명시한다.
  **4.1.2.3 의 「슬롯용접」(슬롯을 용접재로 메우는 것)과 다른 것**이니 조항을 바꿔 쓰지 말 것.

  ★**유효길이는 총길이가 아니다** — 총길이 − 용접치수의 2배(4.1.2.2.1(2)).
  **유효목두께는 90° 일 때만 0.7배**다. 원형강관처럼 곡면에 붙이면 각도가 90° 가 아닌
  자리가 생기고, 그때는 **내접 삼각형의 높이**로 잡아야 한다(4.1.2.2.1(3)).
  ★**완전용입 그루브용접은 용접축에 평행한 인장·압축을 별도 검토하지 않는다**(표 4.1-7).
  ★**두 가지 이상 용접유형을 병용하면 용접군의 축에 대해 각각 구분 계산**한다(4.1.2.5).
  ★**4.1.4 접합부재의 강도는 볼트든 용접이든 똑같이 걸린다.** 용접부가 OK 여도
  거셋플레이트가 찢기거나 좌굴하면 접합부는 파괴된다.
  ★이 트리에 **없는 것**: **건축구조물 갈래(4.1.2.4(2)·표 4.1-8)**,
  그루브용접의 유효면적 상세(4.1.2.1.1·4.1.2.1.2),
  플러그·슬롯용접의 제한사항·공칭강도(4.1.2.3.2·4.1.2.3.3). 해당하면 원문을 볼 것.
  표 4.1-7·4.1-8 의 공칭강도 식은 **원문 이미지**다 —
  `kcsc_formula('KDS 14 31 25','4.1.2.4')` 로 그림을 직접 보고 옮길 것.

