부재: 연결부
단면: 용접접합 (그루브 · 필릿 · 플러그/슬롯) — 토목구조물(교량)
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 25  # 강구조 연결 설계기준 (하중저항계수설계법) 4.1.2 용접
목표검토: "용접부의 단위길이당 설계강도 ≥ 소요강도  (★토목구조물 = 4.1.2.4(1) 갈래)"

입력:
  - {기호: 구조물구분, 설명: "★토목구조물(교량) 인지 확인 — 건축이면 이 트리가 아니다", 단위: "-"}
  - {기호: 용접종류, 설명: "완전용입 그루브 / 부분용입 그루브 / 필릿 / 플러그·슬롯", 단위: "-"}
  - {기호: s,    설명: 필릿용접 치수(다리길이),        단위: mm}
  - {기호: L실제, 설명: 필릿용접의 실제 길이,          단위: mm}
  - {기호: Le,   설명: "유효길이 (총길이 − 용접치수의 2배)", 단위: mm}
  - {기호: te,   설명: "유효목두께 (90° 이면 용접치수의 0.7배)", 단위: mm}
  - {기호: Awe,  설명: "용접재의 유효면적 = Le × te",  단위: mm^2}
  - {기호: t두꺼운, 설명: "접합부 「두꺼운 쪽」 소재 두께 (★토목 최소치수 기준)", 단위: mm}
  - {기호: FEXX, 설명: 용접재의 인장강도(등급강도),    단위: MPa}
  - {기호: Fu모재, 설명: 모재의 인장강도,              단위: MPa}
  - {기호: P직각, 설명: "유효면에 작용하는 수직력 (토목 식 4.1-3)",       단위: N/mm}
  - {기호: V직각, 설명: "용접축에 직각방향 전단력 (토목 식 4.1-3)",       단위: N/mm}
  - {기호: V평행, 설명: "용접축에 평행 전단력 (토목 식 4.1-3)",           단위: N/mm}
  - {기호: 비파괴면제, 설명: "★비파괴시험을 면제했는가 (필릿이면 50% 감소)", 단위: "-"}

흐름:
  - 단계: "1"
    이름: ★★구조물 구분 — 토목인가 건축인가
    근거: "KDS 14 31 25  4.1.2.4"
    작업: 판정
    식위치: >
      ★★**여기서 갈리면 뒤가 전부 다르다.** 4.1.2.4 는 두 갈래를 아예 따로 쓴다 —
        **(1) 토목구조물** — **용접의 단위길이당** 설계강도 **식 (4.1-2)**, **표 4.1-7**.
                          소요강도도 단위길이당이며 **식 (4.1-3)**.
        **(2) 건축구조물** — **모재 강도 식 (4.1-4)** 와 **용접재 강도 식 (4.1-5)** 중
                          **작은 값**, **표 4.1-8**.
      ★★**교량은 토목구조물이다** → **(1)** 을 쓴다. 표 4.1-8(건축)을 가져다 쓰면 안 된다.
      ★★**이 트리는 (1) 토목구조물 갈래만 담는다**(조직이 교량을 한다). 건축 안건이면
      **여기서 멈추고 원문 4.1.2.4(2)·표 4.1-8 을 직접 볼 것.**
      ★4.1.2.4(3) — 책임구조기술자가 용접재 등급을 별도로 선택해 설계하는 경우에는
      (1) 대신 용접재와 모재의 강도를 고려해 결정할 수 있다.
    분기:
      - {조건: "★토목구조물 (교량)", 결과: "4.1.2.4(1) — 식 (4.1-2)·표 4.1-7", 다음: "2"}
      - {조건: "⛔건축구조물",       결과: "★이 트리의 범위 밖 — 여기서 멈춘다", 다음: "5B"}
    출력: 적용 갈래

  - 단계: "2"
    이름: ★용접 종류 판정 — 슬롯에 끼운 거셋은 「필릿」이다
    근거: "KDS 14 31 25  4.1.2"
    작업: 판정
    식위치: >
      4.1.2.1 그루브용접(4.1.2.1.1 완전용입 / 4.1.2.1.2 부분용입) ·
      4.1.2.2 필릿용접 · 4.1.2.3 플러그 및 슬롯용접.
      ★★**혼동 주의** — 표 4.1-8 은 **"필릿용접(구멍, 슬롯, 빗방향 T조인트 필릿 포함)"**
      이라고 적는다. **원형강관에 슬롯을 뚫어 거셋플레이트를 끼우고 그 둘레를 용접하는
      상세는 「필릿용접」**이지, **4.1.2.3 의 「슬롯용접」이 아니다.**
      (4.1.2.3 의 슬롯용접은 판에 낸 슬롯을 용접재로 **메우는** 용접이다.)
      ★**완전용입 그루브용접은 용접축에 평행한 인장·압축을 「별도 검토하지 않는다」**
      (표 4.1-7·4.1-8). 강도가 모재로 제한되기 때문이다.
    분기:
      - {조건: "완전용입 그루브", 결과: "4.1.2.1.1 — 강도가 모재로 제한됨", 다음: "3"}
      - {조건: "부분용입 그루브", 결과: "4.1.2.1.2",                     다음: "3"}
      - {조건: "필릿 (슬롯에 끼운 거셋 포함)", 결과: "4.1.2.2",          다음: "3"}
      - {조건: "플러그·슬롯용접", 결과: "4.1.2.3",                       다음: "3"}
    출력: 용접 종류

  - 단계: "3"
    이름: 유효면적 산정
    근거: "KDS 14 31 25  4.1.2.2.1"
    작업: 계산
    식위치: >
      필릿용접 — 유효면적 = **유효길이 × 유효목두께**.
        **유효길이 = 총길이 − 용접치수의 2배**(4.1.2.2.1(2)). 시·종단을 빼는 것이다.
        **유효목두께 = 용접치수의 0.7배**(4.1.2.2.1(3)).
        ★접합 각도가 90° 가 아니거나 **다리 크기가 서로 다르면** 0.7배가 아니라
        **용접루트를 꼭지점, 외측면을 밑변으로 하는 내접 삼각형의 높이**다.
        원형강관에 판을 끼우면 곡면이라 각도가 90° 가 아닌 자리가 생긴다 — 주의.
      플러그·슬롯용접 — 유효길이는 **목두께 중심을 잇는 용접중심선의 길이**(4.1.2.2.1(4)).
      그루브용접 — 유효면적은 4.1.2.1.1 · 4.1.2.1.2 를 본다.
    출력: "Le · te · Awe"

  - 단계: "4"
    이름: ★★제한사항 확인 — 최소치수의 기준 두께가 토목·건축이 다르다
    근거: "KDS 14 31 25  4.1.2.2.2"
    작업: 판정
    식위치: >
      ★★**4.1.2.2.2(1) — 필릿용접 최소치수는 「토목구조물 표 4.1-6(b)」를 쓴다.**
        **표 4.1-6(b)** — 접합부의 **「두꺼운 쪽」** 소재 두께 기준. **6 / 8 mm**
      ⚠️건축용 표 4.1-6(a) 는 **「얇은 쪽」** 기준(3/5/6/8 mm)이라 **기준으로 삼는 판이
      반대다.** 습관적으로 얇은 쪽을 보면 교량에서 최소치수가 과소해진다.
      **반드시 두꺼운 쪽으로 볼 것.**

      ★**(3) 최소길이** — 강도 기반으로 설계되는 필릿용접의 최소길이는 **공칭용접치수의
        4배 이상.** 또는 유효용접치수가 유효길이의 1/4 이하.
      ★★**(5) 긴 용접의 유효길이 감소** — 부재 단부 필릿용접에서
        길이 ≤ 치수의 **100배**            → 실제 길이를 그대로 쓴다
        치수의 100배 < 길이 ≤ **300배**    → **식 (4.1-1)** 의 감소계수를 곱한다
        길이 > 치수의 **300배**            → **치수의 180배**로 자른다
      **긴 용접을 실제 길이 그대로 쓰면 과대평가된다.**
      ★(2) 겹침이음의 최대치수 · (6) 단속 필릿용접(세그먼트 ≥ 치수의 4배, 최소 38 mm) ·
      (7) 최소 겹침길이(얇은 쪽 두께의 5배 또는 25 mm) · (8) 횡방향 필릿만인 겹침이음은
      **양쪽 단부를 용접해야 한다** — 해당하면 원문을 볼 것.
    출력: 제한사항 만족 여부

  - 단계: "5A"
    이름: ★토목구조물 — 단위길이당 설계강도
    근거: "KDS 14 31 25  4.1.2.4"
    작업: 산정
    식위치: >
      4.1.2.4(1)① — **식 (4.1-2)**. **용접의 단위길이당** 설계강도다.
      공칭강도와 저항계수는 **표 4.1-7** 을 쓴다(표는 글자로 읽힌다) —
        완전용입 그루브 : 직각 인장·압축은 **모재와 동일**, 축 평행은 **별도 검토 안 함**,
                         전단 **φ = 0.8**
        부분용입 그루브 : 직각 인장 **φ = 0.8**, 전단 **φ = 0.75**
        필릿용접        : 전단 **φ = 0.75**
        플러그·슬롯용접 : 접합면 평행 전단 **φ = 0.75**
      ★표 4.1-7 주 1) — 공칭강도는 **용접부 「모재」의 인장강도**이며,
        **언더매칭용접이면 「용접재」의 인장강도**를 적용한다.
      ★표 4.1-7 주 2) — **HSB460(600 MPa)** 과 **HSA650·HSB690(800 MPa)** 은 별도 값이고,
        그 사이 강종은 **보간법**을 적용한다.
    출력: 단위길이당 설계강도

  - 단계: "5B"
    이름: ⛔건축구조물이면 여기서 멈춘다
    근거: "KDS 14 31 25  4.1.2.4"
    작업: 판정
    식위치: >
      ★**이 트리는 토목구조물(교량) 전용이다.** 조직이 하는 일이 교량이라 건축 갈래는
      담지 않았다.
      건축 안건이면 **4.1.2.4(2)** 를 원문에서 직접 볼 것 —
      **모재의 인장파단·전단파단 강도(식 4.1-4)** 와 **용접재의 파단 강도(식 4.1-5)**
      중 **작은 값**이고, φ 는 **표 4.1-8** 이다. **표 4.1-7 과 다른 표다.**
      ★**토목 갈래([5A])의 식·표를 건축에 가져다 쓰면 안 된다.** 그 반대도 마찬가지다.
    출력: "★건축 — 이 트리 범위 밖 (원문 4.1.2.4(2) 확인)"

  - 단계: "6"
    이름: ★소요강도 산정 — 토목은 3방향 벡터 합이다
    근거: "KDS 14 31 25  4.1.2.4"
    작업: 계산
    식위치: >
      4.1.2.4(1)②. **식 (4.1-3)**. 필릿용접의 단위길이당 소요강도는
      **용접 단위길이당 작용하는 「모든 방향」 힘들의 합력**이다.
      유효면에서 서로 직각인 **3방향**(유효면에 작용하는 **수직력**, 용접축에 **직각인
      전단력**, 용접축에 **평행한 전단력**)으로 나누어 벡터 합으로 구한다.
      ★**한 방향만 보고 설계하면 위험측이다.** 거셋플레이트 접합은 세 성분이 같이 걸린다.
    출력: 단위길이당 소요강도

  - 단계: "7"
    이름: ★★비파괴시험 면제 확인 — 필릿이면 설계강도가 반이 된다
    근거: "KDS 14 31 25  4.1.2.4"
    작업: 판정
    식위치: >
      ★★**4.1.2.4(4)** — **"KCS 14 31 20 에 따른 품질관리 구분 '나' 의 구조물 중
      용접검사 비파괴시험을 면제한 경우, 필릿용접부에 대해서는 식 (4.1-2)에 의해 계산한
      값의 50%를 용접의 단위길이 당 설계강도값으로 취한다."**
      → **강도가 절반이 된다.** 검사 계획과 설계강도가 묶여 있는 조항이다.
      **시공 조건을 확인하지 않고 계산값을 그대로 쓰면 2배 과대평가**가 된다.
    분기:
      - {조건: "★비파괴시험 면제 + 필릿용접", 결과: "★설계강도를 50% 로", 다음: "8"}
      - {조건: "비파괴시험 실시 (또는 필릿이 아님)", 결과: "그대로", 다음: "8"}
    출력: 최종 설계강도

  - 단계: "8"
    이름: 검토(판정)
    근거: "KDS 14 31 25  4.1.2.4"
    작업: 판정
    식위치: >
      설계강도 ≥ 소요강도 이면 OK. **제한사항([4])도 모두 만족해야 한다.**
      ★**NG 면 여기서 끝난다.** 용접치수·길이 변경은 계산서에서 설계자가 한다.
      **후행작업은 OK 인 경우에만** 이어진다.
    출력: "OK / NG"

  - 단계: "9"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 25  4.1.2.5"
    작업: 판정
    식위치: >
      **배타 선택이 아니라 체크리스트**다 — 해당하는 것을 **모두** 검토한다.
        □ **두 가지 이상의 용접유형을 병용**했는가 → [10]  (4.1.2.5)
        □ 거셋플레이트 등 **접합부재**가 있는가    → [11]  (4.1.4)
        □ 같은 접합부에 **볼트**도 있는가          → [12]
      해당 없으면 그대로 종료한다.
    출력: 해당 항목 목록

  - 단계: "10"
    이름: 용접의 병용 (해당하면)
    근거: "KDS 14 31 25  4.1.2.5"
    작업: 판정
    식위치: >
      4.1.2.5(1) — 한 연결부에서 **그루브·필릿·플러그·슬롯 중 둘 이상을 병용**하면
      **용접군의 축에 대하여 각각 구분하여 계산해야 한다.** 합쳐서 한 번에 보면 안 된다.
    출력: 병용 검토

  - 단계: "11"
    이름: ★접합부재(거셋플레이트)의 강도 (해당하면)
    근거: "KDS 14 31 25  4.1.4"
    작업: 판정
    식위치: >
      **4.1.4 접합부재의 설계강도는 볼트든 용접이든 똑같이 걸린다.**
        4.1.4.1 인장 · 4.1.4.2 전단 · 4.1.4.3 **블록전단** · 4.1.4.4 압축
      ★**용접부가 OK 여도 거셋플레이트 자체가 찢기거나 좌굴하면 접합부는 파괴된다.**
      ★원형강관 슬롯 상세에서는 **관을 절개한 자리에서 거셋을 따라 찢겨 나가는
      (tear-out) 파괴**를 특히 볼 것.
      ★**볼트든 용접이든 똑같이 걸리는 검토**라 별도 트리로 분리해 두었다.
      **연결부 설계 단계에서 한 번만** 한다.
