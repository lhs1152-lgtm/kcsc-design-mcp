부재: 허용응력
단면: 구조용 강재·용접부 (보도교 ASD — KDS 14 30 체계)
설계법: 허용응력설계법
근거: KDS 14 30 05  # 강구조 설계 일반사항(허용응력설계법) — 3.3 재료의 강도 · 4.2.2 보정계수 · 5.1 허용응력 · 5.2 단기하중
목표검토: "부재 응력검토에 쓸 재료 강도(Fy·Fu)·허용응력 체계·증가계수·용접부 허용응력을 확정한다 — 작용응력과의 비교는 부재 트리에서"

입력:
  - {기호: 강종,   설명: "H형강·강판: SS·SM·SMA·SN·SHN(표 3.3-1) / 원형강관: SGT·STP·SNT(표 3.3-2) 또는 제작관이면 강판 강종", 단위: "-"}
  - {기호: t,      설명: "★판두께 — 표 3.3-1 의 Fy 행이 두께 구간(16/40/75/100/200)으로 갈린다", 단위: mm}
  - {기호: 강관종류, 설명: "기성강관(SGT 등, 표 3.3-2 · 적용두께 상한 있음) / 제작강관(강판을 말아 용접 → 강판 Fy)", 단위: "-"}
  - {기호: 용접종류, 설명: "완전용입 / 부분용입 / 필릿 / 플러그·슬롯 (14 30 25 표 4.2-4)", 단위: "-"}
  - {기호: 증가계수, 설명: "하중조합 트리(`하중조합 / 보도교`)에서 정한 조합별 허용응력 증가계수", 단위: "-"}

흐름:
  - 단계: "1"
    이름: ★체계 확인 — 허용응력은 「표」가 아니라 「Fy 로 세우는 식」이다
    근거: "KDS 14 30 05  5.1"
    작업: 판정
    식위치: >
      **5.1(1)** — "모든 구조 부재, 접합부, 연결재의 작용하중으로 인한 응력은 … **KDS 14 30 10,
      KDS 14 30 20, KDS 14 30 25 에 명시된 허용응력**을 초과하지 않아야 한다."
      ★★KDS 24 14 30 처럼 강종×판두께 격자의 「기본허용응력 표」가 **없다.** 이 체계에서
      허용응력은 **부재별 식**이다 — 인장 4.3.2 · 압축 4.4.3 · 휨 4.5.2 · 전단 4.5.3 ·
      조합 4.6(14 30 10), 용접·볼트 4.2.5/4.3.2(14 30 25). 강종·판두께는 **Fy·Fu 로만**
      들어간다. 그래서 이 트리의 일은 ①Fy·Fu 를 정확히 고르고 ②증가계수·보정계수를
      정합시키고 ③용접부 값을 잡아 부재 트리로 넘기는 것이다.
      ★★**KDS 24 14 30 의 표 4.2-1·4.2-2 값을 여기 끌어오지 않는다**(설계자 확정 2026-08-17)
      — 계보(안전율 배치)가 달라 14 30 10 식과 섞이면 어긋난다.
      **5.1(2)** — 특수 지점·이 기준에 없는 강재는 8가지(이론-실제 차이·시공/완성 외력 변화·
      피로/열화·하중 차이·파괴 양상·중요도·유지보수 난이도·예측불가 외력)를 보고 정한다.
    분기:
      - {조건: "보도교 (원형강관 거더 · H형강 부부재), 허용응력설계법", 결과: "이 체계로 진행", 다음: "2"}
      - {조건: "⛔철도교 · 도로교(자동차) · 건축물 주요 부재",  결과: "★철도교는 이 트리의 적용 범위 밖(24 14 30 원문) · 도로교 ASD 는 KDS 에 없음 · 건축물은 14 30 05 4.1 하중 체계 — 이 트리 범위 밖", 다음: "8"}
    출력: 허용응력 체계 (KDS 14 30 10/20/25)

  - 단계: "2"
    이름: ★강종·판두께 → Fy·Fu 확정 (표 3.3-1 · 표 3.3-2)
    근거: "KDS 14 30 05  3.3.1"
    작업: 산정
    식위치: >
      **표 3.3-1 주요 구조용 강재 — 글자 표.** Fy 는 **판두께 5구간**(16 이하 / 16~40 /
      40~75 / 75~100 / 100~200)으로 갈리고 Fu 는 단일값. 예: SM355 → 355 / 345 / 335 / 325 /
      305, Fu 490. SS275 → 275 / 265 / 245 / 245 / 235, Fu 410.
      ★★**SS410·SS450·SS550 은 40 mm 초과 칸이 「-」** — 그 두께로는 쓸 수 없다. 옆 값으로
      메꾸지 말 것(24 14 30 표와 같은 함정).
      ★**TMC 강재는 두께 저감 없이 16 mm 이하 값**(주 3, 표 계속: SM355-TMC 355·Fu 490,
      100 mm 이하) · HSB380/460/690 은 100 mm 이하 단일값(HSB690 은 80 mm 이하).
      ★SN·SHN(건축구조용)은 표 계속 — SHN 은 75 mm 이내.
      **표 3.3-2 강관 — 원형강관 거더가 여기다.** SGT275 → Fy 275·Fu 410 / SGT355 → 355·500 /
      SGT410 → 410·540 … ★**적용두께 상한이 주에 있다**: SGT·SRT 40 mm 이하, SRT 30 mm 이하,
      SHT460 25 mm 이하 — 두꺼운 대구경 강관은 기성 SGT 로 못 잡는 경우가 있다.
      ★★**제작강관(강판을 원통으로 말아 아크용접, 14 30 10 4.8.1.1(4))** 은 강관 표가
      아니라 **강판의 Fy(표 3.3-1, 판두께 구간 적용)** 를 쓴다 — 예 SM355 t=20 → 345.
      원형강관 거더가 어느 쪽인지 도면·재료 규격에서 먼저 확인.
      ★3.1.1(1) — KS 외 강재는 "건축 구조물 주요 부재를 제외한 일반강구조물"에만 인정.
      ★머리글 3.1(1) — 시설물 기준에 별도 재료 규정이 있으면 그것이 우선(보도교 ASD 는
      해당 시설물 기준이 없다 → 이 표).
      ★★**조직 실무(설계자, 2026-08-17): 원형강관 거더는 주로 제작강관, 가끔 기성강관.**
      → 기본은 표 3.3-1(강판 Fy·판두께 구간)이고, 기성강관일 때만 표 3.3-2 로 간다.
    분기:
      - {조건: "제작 원형강관 (강판 롤 벤딩 + 용접) — ★조직 기본", 결과: "표 3.3-1 강판 Fy (판두께 구간) — 4.8.1.1(4). 예 SM355 t=20 → 345", 다음: "3"}
      - {조건: "기성 원형강관 (SGT·STP·SNT) — 가끔",             결과: "표 3.3-2 — 단일 Fy, ★적용두께 상한(SGT 40 mm) 확인", 다음: "3"}
      - {조건: "H형강 · 강판 (압연 형강·조립) — 가로보·부부재",  결과: "표 3.3-1 — Fy 는 판두께 구간 행", 다음: "3"}
    출력: "Fy · Fu (MPa) — 부재·판두께별"

  - 단계: "3"
    이름: ★구조물별 허용응력 보정계수 — 보도교는 표에 없다
    근거: "KDS 14 30 05  4.2.2"
    작업: 판정
    식위치: >
      **4.2.2(1)** — "허용응력은 기본적으로 **표 4.2-1 의 구조물별 보정계수**를 적용하여
      KDS 14 30 10/20/25 에 따라 산정한다. … **관련 구조물이 없는 경우에는 4.2.2 와 4.2.3 을
      참고하여 합리적으로 결정하고 그 근거를 제시한다.**"
      **표 4.2-1** — 송전용 철탑 1.00 · 수압철관 0.85 · 석유/해저 파이프라인 0.75 · 수문 0.75 ·
      LNG 저장탱크 1.00 · 강관널말뚝기초 0.90 · 개착터널 0.90 · 해양 강구조물 0.90.
      ★**교량·보도교는 없다.** → 보정계수 **1.00**(기본, 건축물·철탑과 같은 수준)으로 하고
      **계산서에 "표 4.2-1 에 해당 구조물 없음 — 4.2.2(1)에 따라 1.00 적용" 을 근거로 적는다.**
      (0.9 이하로 깎는 구조물은 수압·유류·해양 등 특수 조건 — 보도교와 유사성이 없다.)
      ★설계자 확인(2026-08-17): **보도교도 일반 교량과 똑같이 취급** — 따로 깎거나
      올리지 않는다. 1.00.
    출력: "보정계수 = 1.00 (근거 명시)"

  - 단계: "4"
    이름: ★★증가계수 정합 — 14 30 05 5.2 의 1.33 은 쓰지 않는다 (조직 규정)
    근거: "KDS 14 30 05  5.2"
    작업: 판정
    식위치: >
      **5.2(1)** — "풍하중, 지진하중 등과 같은 **단기하중에 의한 허용응력은 5.1 에서 규정한
      허용응력의 1.33배**로 한다."
      ★★**설계자 확정(2026-08-17): 하중·하중조합·증가계수는 KDS 24 에서 가져온다** —
      `하중조합 / 보도교` 트리의 **KDS 24 12 10 표 4.2-1(강교) 준용** 값을 쓴다:
      온도 1.15 · 풍 1.25 · 지진 1.55 · 충돌 1.60 · 가설 1.25 · 주하중만 1.0.
      → **14 30 05 5.2 의 1.33 은 적용하지 않는다.** 둘을 겹쳐 곱하면 이중 증가(위험측),
      골라 쓰면 조합마다 체계가 뒤섞인다.
      ★값이 다르다는 사실은 알고 쓴다: 풍 1.25(24) vs 1.33(14) · 지진 1.55(24) vs 1.33(14).
      계산서에 "증가계수는 KDS 24 12 10 표 4.2-1 준용, KDS 14 30 05 5.2 미적용" 명시.
      ★4.2.3 의 구조물별 하중조합 보정계수 표(철탑·파이프라인 …)도 보도교엔 해당 없음.
    출력: "조합별 증가계수 = 하중조합 트리 값 (1.33 미적용)"

  - 단계: "5"
    이름: 부재별 허용응력 — KDS 14 30 10 의 식으로 (부재 트리에서 산정)
    근거: "KDS 14 30 10  4.1.1"
    작업: 판정
    식위치: >
      허용응력의 실제 값은 부재 트리가 낸다. **자리만 확인**:
        인장 **4.3.2** (총단면 / 유효순단면 두 값) · 압축 **4.4.3** (한계세장비 기준 2구간,
        식 4.4-1/2) · 휨 **4.5.2** (단면 분류 → 0.66Fy·0.6Fy·횡좌굴 식 4.5-8~10, 약축
        4.5-11~13, 강관 4.5.2.3) · 전단 **4.5.3** (4.5-18/19) · 조합력 **4.6.2** (4.6-1~3).
        원형강관 세칙 **4.8.1**(허용응력은 4.3~4.7 과 14 30 25 를 준용 — 4.8.1.2).
      ★식은 **전부 이미지** — 값은 `kcsc_formula('KDS 14 30 10','4.4.3')` 등으로 그림을
      보고 옮긴다. 이 트리는 Fy·Fu·보정계수·증가계수만 넘긴다.
    출력: "부재별 허용응력 조항 위치"

  - 단계: "6"
    이름: 용접부 허용응력 — KDS 14 30 25 표 4.2-4
    근거: "KDS 14 30 25  4.2.5"
    작업: 산정
    식위치: >
      **표 4.2-4 용접의 허용응력** — 글자로 읽히는 부분:
        완전용입: 유효단면에 직교 인장·압축 / 용접선 평행 인장·압축 → **모재와 동일**;
                  유효단면 전단 → 〔그림〕(식, 이미지)
        부분용입: 직교압축 / 평행 인장·압축 → 모재와 동일; 평행 전단·직교인장 → 〔그림〕
        필릿:     유효단면 전단 → 〔그림〕; 용접선 평행 인장·압축 → 모재와 동일
        플러그·슬롯: 유효단면 평행 전단 → 〔그림〕
      ★"다만, **각 강종에 적합한 용접재료**를 사용하여야 한다" · 14 30 05 3.3.2(3) "용접이음
      재료의 강도는 용접 후 모재의 재료강도 이상".
      ★★KDS 24 14 30 에 있던 **현장용접 90% 규정·RT/UT 검사 조건은 이 체계엔 없다** — 대신
      14 30 25 4.2 의 용접 세칙(유효목두께·최소 사이즈·유효길이)이 값을 좌우한다. 24 의
      90% 를 습관으로 곱하지도, 안 곱히니 안심하지도 말 것 — 연결 트리에서 세칙 확인.
      ★볼트 허용응력은 14 30 25 4.3.2 표 4.3-3(F8T/F10T/F13T, 축단면적 기준) · 지압은 4.9
      (식 4.9-1/2, Fy 기반) — `응력검토 / 연결 이음` 트리(14 30 25 + 조직 규정 75%·현장 90%)에서.
    출력: "용접부 허용응력 (완전용입 = 모재 · 필릿 전단 = 표 4.2-4 식)"

  - 단계: "7"
    이름: 피로 — KDS 14 30 20 트랙 (보도교는 대개 비지배)
    근거: "KDS 14 30 05  5.1"
    작업: 판정
    식위치: >
      5.1(1) 이 든 세 기준 중 **14 30 20(강구조 피로 및 파단·허용응력)** 이 피로를 맡는다.
      보도교는 활하중 진폭이 작아 피로가 단면을 지배하는 일이 드물지만, **원형강관–H형강
      가로보 용접 접합부** 같은 상세는 확인 대상(설계자 판단). 이 트리 밖 — 별도 트리 후보.
    출력: 피로 트랙 위치

  - 단계: "8"
    이름: 종료 — 부재 응력검토로
    근거: "KDS 14 30 05  5.1"
    작업: 판정
    식위치: >
      여기서 확정한 **Fy·Fu(판두께별) · 보정계수 1.00 · 조합별 증가계수(24 12 10 준용) ·
      용접부 허용응력**을 들고 부재 트리로 간다 — 원형강관 거더 `응력검토 / 원형강관`
      (14 30 10 4.8.1), H형강 가로보·부부재 `응력검토 / H형강`(14 30 10 4.3~4.6), 연결부는
      `응력검토 / 연결 이음`(14 30 25).
      ★[1] 에서 범위 밖으로 판정된 경우는 아래 링크를 타지 않는다.
    분기:
      - {조건: "원형강관 거더",        결과: "거더 응력검토",   다음트리: "응력검토 / 원형강관"}
      - {조건: "H형강 가로보·부부재",  결과: "부부재 응력검토", 다음트리: "응력검토 / H형강 (강교 — 가로보·세로보·브레이싱·지주)"}
      - {조건: "연결부",               결과: "연결 검토",       다음트리: "응력검토 / 연결 이음"}
      - {조건: "범위 밖으로 판정됨",   결과: "멈춘다 — 원문",   다음기준: "KDS 14 30 05  5.1"}
    출력: "Fy·Fu · 보정계수 · 증가계수 · 용접부 허용응력 일람"

안전주의: >
  ★★★**허용응력설계법이다.** 검토는 **작용응력 ≤ 허용응력 (× 증가계수)** 이고
  하중은 사용하중이다. 「강도」·γ·φ 는 여기 존재하지 않는 개념이다.

  ★★★**이 체계에는 「기본허용응력 표」가 없다** — 허용응력은 KDS 14 30 10 의 부재별 식이고
  강종·판두께는 Fy·Fu 로만 들어간다. **KDS 24 14 30 표 4.2-1·4.2-2 값을 끌어오지 않는다**
  (설계자 확정 2026-08-17 — 계보가 달라 섞으면 안전율 체계가 어긋난다).

  ★★**Fy 는 판두께 구간(16/40/75/100/200)으로 떨어진다**(표 3.3-1). SS410·450·550 의
  40 mm 초과는 「-」(사용 불가). TMC 는 저감 없음. **제작 원형강관은 강판 Fy** — 기성강관
  표(3.3-2)를 잘못 대면 두꺼운 판에서 과대평가.
  ★★**증가계수는 KDS 24 12 10 표 4.2-1 준용(하중조합 트리)** — 14 30 05 5.2 의 1.33 은
  **적용하지 않는다.** 겹쳐 곱하면 이중 증가(위험측). 계산서에 미적용 사실 명시.
  ★**보정계수 1.00 — 표 4.2-1 에 보도교 없음**, 4.2.2(1)에 따라 근거를 계산서에 적는다.
  ★**현장용접 90%·RT/UT 조건(24 14 30)은 이 체계에 없다** — 대신 14 30 25 4.2 세칙.
  ★식은 이미지다 — 값의 최종 확인은 원문으로: `kcsc_read('KDS 14 30 05','3.3.1')`,
  `kcsc_read('KDS 14 30 25','4.2.5')`, `kcsc_formula('KDS 14 30 10','4.4.3')`.
  ★철도교는 이 트리의 적용 범위 밖이다 — 철도교 안건이면 멈추고 원문을 볼 것.

