부재: 사용성
단면: 보도교 ASD (처짐 · 진동 · 솟음 · 신축 · 부식) — KDS 14 30 50
설계법: 허용응력설계법
근거: KDS 14 30 50  # 강구조 사용성 설계(허용응력설계법) — 4.2 솟음 · 4.3 팽창과 수축 · 4.4 처짐·진동·수평변위 · 4.5 부식 · 4.6 물고임. 한계값은 조직 규정(ASD 거더교 L/600 · f1 1.5~2.3 Hz 회피)
목표검토: "보도교의  처짐 δ ≤ δa (ASD 거더교 L/600 — 조직 규정) · 진동(상하 고유진동수 1.5~2.3 Hz 회피 — 조직 규정) · 솟음 · 신축 · 부식 대책 확인 — 응력 검토와 별개 트랙"

입력:
  - {기호: L,   설명: "지간 (내민보는 내민 길이)",                       단위: mm}
  - {기호: δ,   설명: "보도 활하중(자중 제외)에 의한 최대 처짐 — 총단면적으로 계산 (14 30 50 4.4.1)", 단위: mm}
  - {기호: q,   설명: "보도 활하중 (하중조합 트리 — 표 4.1-10 보·기둥 3.5 kN/m²)",  단위: "kN/m²"}
  - {기호: f1,  설명: "상하 1차 고유진동수 (보행자 유발 진동 판단 — KDS 밖, 조직 근거)", 단위: Hz}
  - {기호: ΔT,  설명: "온도변화 범위 (24 12 20 4.1.4(2): −20~+50 ℃ / 가설온도 미상 ±35 ℃) — 신축량", 단위: "℃"}
  - {기호: 구조, 설명: "원형강관 거더 / 트러스 / 지주(라멘) — 솟음·수평변위·강관 내부 방식 항목이 갈린다", 단위: "-"}

흐름:
  - 단계: "1"
    이름: ★적용 확인 — 사용성은 응력과 별개 트랙, 기준은 KDS 14 30 50 (얇다)
    근거: "KDS 14 30 50  4.1"
    작업: 판정
    식위치: >
      **1.2** "이 기준은 강구조물의 사용성 설계에 적용한다." **4.1(1)** 사용성 설계 = 기능·외관·
      유지관리·내구성·사용자 편리함을 일정 기준 이상으로. **(2)** 변위 제한값은 용도에 따라 다르게.
      ★★KDS 14 30 50 은 **한계값을 거의 주지 않는다** — 처짐은 "관련 구조물 기준이 있으면 준용,
      없으면 합리적 자료로 근거 제시"(4.4.1), 진동은 "처짐 제한 형식 또는 합리적 방법"(4.4.2).
      그래서 보도교 값은 **조직 규정(설계자 확정 2026-08-17)** 으로 간다 — 처짐 **ASD 거더교
      L/600**([2], 한계상태일 때의 L/1,000 과 다르다) · 보행자 진동 **상하 고유진동수 1.5~2.3 Hz
      회피**([3]). 둘 다 KDS 안에 ASD 보도교 값이 없어 14 30 50 4.4.1 의 "근거 제시" 로 적는다.
      ★사용성은 **응력 검토와 별개** — 하중조합 트리의 증가계수와 무관하게 사용하중(보도 활하중)
      으로 본다. 원형강관 거더의 **바람 진동**은 원형강관 트리(14 30 10 4.8.1.4)에서 별도.
    분기:
      - {조건: "보도교 (원형강관 거더 · H형강 부부재 · 트러스 · 지주)", 결과: "이 트리", 다음: "2"}
      - {조건: "⛔철도교 · 도로교(자동차) 안건", 결과: "철도교 처짐은 24 10 10 4.1.4 — 이 트리의 적용 범위 밖 · 도로교는 24 10 11 직접(한계상태) — 멈춘다", 다음: "9"}
    출력: 적용 확인

  - 단계: "2"
    이름: "★처짐 — δ ≤ δa, ASD 거더교 δa = L/600 (조직 규정 · 한계상태일 때는 L/1,000)"
    근거: "KDS 14 30 50  4.4.1"
    작업: 판정
    식위치: >
      **14 30 50 4.4.1(1)** — 식 4.4-1 **δ ≤ δa**. δ 는 "보통 **구조체 자중을 제외한 하중**작용에 대해
      부재의 **총단면적**을 적용하여 산출". δa 는 "관련 구조물의 설계기준에 정한 바가 있는 경우
      **준용**, 없는 경우 합리적인 자료에 기초하여 판단하고 **근거를 제시**".
      ★★**설계자 확정(2026-08-17): 허용응력설계법 보도교(거더교)의 처짐 한계는 L/600.**
      한계상태설계법으로 할 때는 L/1,000(KDS 24 10 11 2.5.2.6(2)②아 (나) "차량하중 또는 보행자하중
      지간/1,000" — 선택적 규정) — **설계법에 따라 값이 다르다, 섞지 말 것.** ASD 의 L/600 은 KDS 안에
      없는 조직 규정(구 도로교설계기준 ASD 처짐 규정 계보)이므로 계산서에 "KDS 14 30 50 4.4.1 에
      따른 근거 제시 — 조직 규정 L/600" 으로 적는다.
      ★하중 — 보도 활하중(하중조합 트리 표 4.1-10 3.5 kN/m²), 충격 없음(보도교), 자중 제외, 총단면.
      ★트러스교·내민부는 설계자 확정이 "거더교 L/600" 이라 별도 — 설계자 확인(참고: 24 10 11 내민보
      보행자 L/375, 한계상태).
      ★24 10 11 (3) 경간–높이비(표 2.5-1: 보행자 구조물 보 0.035L·트러스 0.100L)는 선택적 참고.
    분기:
      - {조건: "거더교 (원형강관 거더 · I형)", 결과: "δa = L/600 (조직 규정)", 다음: "3"}
      - {조건: "트러스교 · 내민부",           결과: "★설계자 확인 — 값 미정(근거 명시)", 다음: "3"}
    다음트리: "하중조합 / 보도교"
    출력: "δ (보도 활하중, 총단면) ≤ L/600 여부"

  - 단계: "3"
    이름: "★진동 — 4.4.2 는 원칙뿐, 보행자 유발 진동은 조직 규정: 상하 고유진동수 1.5~2.3 Hz 회피"
    근거: "KDS 14 30 50  4.4.2"
    작업: 판정
    식위치: >
      **4.4.2(1)** — 진동 안전성 검토는 **처짐 제한 형식이면 식 4.4-1 준용, 그 밖은 합리적인 방법**.
      **(2)** 바닥구조는 상하진동으로 불쾌감이 없도록 **강성·고유진동수·감쇠효과** 고려. (3) 건축물
      수평 가속도(풍) — 건축 문맥.
      ★★**보행자 유발 진동 기준은 KDS 에 없다** — 2026-08-17 실측: KDS 14 30 50 · 24 10 11(4.7 은
      차량·풍 진동만) · 24 12 21 · 24 12 20 에 "보도교 진동·Hz" 0건.
      ★★**설계자 확정(2026-08-17): 보도교의 상하 1차 고유진동수 f1 이 1.5~2.3 Hz 사이에 있으면
      안 된다**(조직 규정 — 보행 주파수 공진 회피, 구 도로교설계기준 보도교 진동 규정 계보).
      계산서에 "KDS 14 30 50 4.4.2(1) 합리적 방법 — 조직 규정 f1 ∉ [1.5, 2.3] Hz" 로 근거 명시.
      ★f1 은 고정하중(+ 부대시설) 상태의 상하 1차 모드 — 보도 활하중을 질량에 넣을지는 설계자
      (넣으면 f1 이 낮아진다 — 회피 범위 위쪽에 있는 교량은 안전측 확인이 된다).
      ★f1 이 범위 안이면 강성 증대(단면·경간)·질량 조정·감쇠 장치 — 설계자.
      ★원형강관 부재의 **바람 진동**은 원형강관 트리 [진동] 단계(14 30 10 4.8.1.4 식 4.8-1)에서.
    분기:
      - {조건: "f1 < 1.5 Hz 또는 f1 > 2.3 Hz", 결과: "회피 범위 밖 — OK", 다음: "4"}
      - {조건: "1.5 ≤ f1 ≤ 2.3 Hz",           결과: "★NG — 강성·질량·감쇠 조정 후 재산정 (설계자)", 다음: "4"}
    출력: 진동 판단 (f1)

  - 단계: "4"
    이름: 솟음 — 4.2 (트러스·바닥보) + 14 30 10 4.8.2.6.3
    근거: "KDS 14 30 50  4.2"
    작업: 판정
    식위치: >
      **4.2(1)** 바닥보·트러스처럼 처짐이 사용성 문제를 일으킬 우려가 있으면 **적절한 솟음**. **(2)**
      제작·조립 과정의 과도한 처짐은 사전 솟음으로 조정. 트러스는 14 30 10 4.8.2.6.3(고정하중 솟음)
      과 같은 자리. 원형강관 거더 장경간이면 고정하중 처짐분 솟음 여부를 설계자가 정한다.
    출력: 솟음 계획

  - 단계: "5"
    이름: 팽창·수축 — 4.3 (온도 신축 → 받침·신축이음 이동량)
    근거: "KDS 14 30 50  4.3"
    작업: 판정
    식위치: >
      **4.3(1)** 구조물은 사용성에 적합하도록 **팽창과 수축에 대해 적절한 조치**. 온도 범위는 하중조합
      트리 [2](24 12 20 4.1.4(2): 강교 −20~+50 ℃, 가설온도 미상 ±35 ℃, 선팽창계수 12×10⁻⁶) —
      **신축이음·받침 이동량은 현장 설치 온도로 재산정**(24 12 20 4.1.4(2)④(나)).
    출력: 신축량 · 받침/신축이음 이동량

  - 단계: "6"
    이름: 수평변위 — 4.4.3 (지주·라멘형 보도교에서)
    근거: "KDS 14 30 50  4.4.3"
    작업: 판정
    식위치: >
      **4.4.3(1)** 풍·지진 등 수평하중에 의한 수평변위로 마감재 손상·구조물 피해·인접물 충돌이 없도록
      **수평강성 확보** — 건축물 문맥이지만 **강관 지주·라멘형 보도교의 지주 수평변위**에 그대로
      해당. 한계값은 없다 — 관련 기준(하부구조)·발주처·설계자.
    출력: 수평변위 확인

  - 단계: "7"
    이름: 부식 · 물고임 — 4.5 · 4.6 (원형강관 내부 밀폐 · 배수)
    근거: "KDS 14 30 50  4.5"
    작업: 판정
    식위치: >
      **4.5(1)** 구조요소는 부식에 견디도록. **(2)** 부식 노출 부재는 **내부 표면 피막 또는 청소·도장이
      가능한 충분한 간격**. **4.6** 물고임 — 자연배수 경사, 고일 경우 대비.
      ★원형강관 거더 — 내부는 **밀폐(단부 온둘레 용접 — 원형강관 트리 세칙)** 하거나 배수·점검구.
      바닥판 아래 강관 상면·가로보 상단의 물고임 방지. 강관 밀폐부는 도장 불가라 밀폐 품질이 곧 방식.
    출력: 방식·배수 대책

  - 단계: "8"
    이름: 검토(판정)
    근거: "KDS 14 30 50  4.1"
    작업: 판정
    식위치: >
      처짐(δ ≤ L/600, 조직 규정) · 진동(f1 ∉ 1.5~2.3 Hz, 조직 규정) · 솟음 · 신축 ·
      수평변위 · 부식/배수 전부 확인하면 OK. ★사용성은 안전과 별개 — NG 여도 응력 OK 일 수 있다.
      **NG 면 여기서 끝난다** — 강성 증대·솟음·감쇠 조치는 설계자.
    출력: "OK / NG"

  - 단계: "9"
    이름: 종료
    근거: "KDS 14 30 50  4.1"
    작업: 판정
    식위치: "사용성 검토가 끝났다. [1] 에서 범위 밖으로 판정된 경우는 원문·다른 체계로."
    출력: "OK"

안전주의: >
  ★★★**허용응력설계법 안건의 사용성 트랙이다** — 응력 검토(작용응력 ≤ 허용응력 × 증가계수)와
  별개이고 증가계수를 쓰지 않는다. 「강도」·γ·φ 는 존재하지 않는 개념이다.

  ★★★**KDS 14 30 50 은 한계값을 주지 않는다** — 처짐은 "관련 기준 준용 / 없으면 근거 제시",
  진동은 "처짐 제한 형식 또는 합리적 방법". 그래서 **조직 규정(설계자 확정 2026-08-17)** 둘:
  · **처짐 — 허용응력설계법 보도교(거더교) δa = L/600.** 한계상태설계법이면 L/1,000(KDS 24 10 11
    2.5.2.6, 선택적) — **설계법에 따라 값이 다르다, 섞지 말 것.** 트러스교·내민부는 별도 확인.
  · **진동 — 상하 1차 고유진동수 f1 이 1.5~2.3 Hz 사이에 있으면 안 된다.** KDS 안에 보도교 진동
    기준은 없다(2026-08-17 실측 0건). 계산서에 근거(조직 규정) 명시.
  ★처짐 δ 는 **자중 제외 하중·총단면적**(4.4.1). 보도교는 충격 없음 — 24 10 11 의 "충격 포함"은
  차량 문맥. ★원형강관 바람 진동은 원형강관 트리. ★신축·받침 이동량은 현장 온도로 재산정.
  ★원형강관 내부 부식 = 밀폐 품질(온둘레 용접) 문제. ★철도교는 이 트리의 적용 범위 밖이다.

검증일: "2026-08-17"
검증기준:
  "KDS 143050": "2024"
검증: 설계자확정
