부재: 휨부재
단면: 원형강관
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 10  # 4.3.2.1.1.8 원형강관(휨) · 4.3.2.1.2.6 원형강관(전단)
목표검토: "설계휨강도 φb·Mn ≥ 소요휨강도 Mu   (전단은 φv·Vn ≥ Vu 별도)"

입력:
  - {기호: D,   설명: 원형강관의 외경,          단위: mm}
  - {기호: t,   설명: 원형강관의 두께,          단위: mm}
  - {기호: Z,   설명: 소성단면계수,             단위: mm^3}
  - {기호: S,   설명: 탄성단면계수,             단위: mm^3}
  - {기호: Ag,  설명: 강관의 전단면적,          단위: mm^2}
  - {기호: Lv,  설명: "★최대전단력 작용점과 전단력이 0인 점 사이의 거리", 단위: mm}
  - {기호: Fy,  설명: 강재 항복강도,            단위: MPa}
  - {기호: E,   설명: 강재 탄성계수,            단위: MPa}
  - {기호: Mu,  설명: 소요휨강도(계수하중),     단위: kN·m}
  - {기호: Vu,  설명: 소요전단강도(계수하중),   단위: kN}
  - {기호: N,   설명: "축력 (있으면) — 조합력 판정에 쓴다", 단위: kN}
  - {기호: T,   설명: "비틀림모멘트 (있으면) — 4.4.3 판정에 쓴다", 단위: kN·m}

흐름:
  # ★다른 힘이 함께 작용하는지를 **맨 앞에서** 묻는다(다른 부재 트리와 같은 배치).
  - 단계: "1"
    이름: 축력·비틀림이 함께 작용하는지 확인
    근거: "KDS 14 31 10  4.4.1"
    작업: 판정
    식위치: >
      4.4.1.1(압축+휨) · 4.4.1.2(인장+휨) — 축력이 함께 작용하면 상관식으로 검토한다.
      **4.4.3** — 비틀림, 또는 비틀림·휨·전단력·축력을 **동시에** 받는 부재.
      ★**원형강관은 비틀림이 실제로 걸리는 단면**이다. 폐단면이라 비틀림강성이 커서
      비틀림을 실제로 받아 낸다 — H형강처럼 "웬만하면 무시"가 통하지 않는다.
    분기:
      - {조건: "축력 함께 — 압축", 결과: "조합력 트리로",
         다음트리: "조합력부재 (압축 + 휨)"}
      - {조건: "축력 함께 — 인장", 결과: "조합력 트리로",
         다음트리: "조합력부재 (인장 + 휨)"}
      - {조건: "비틀림이 함께 작용", 결과: "4.4.3 을 함께 검토",
         다음트리: "비틀림부재 / 원형·각형강관", 다음: "2"}
      - {조건: "순수 휨 (또는 조합력 트리에서 Mr 산출용으로 불려옴)",
         결과: "이 트리를 계속", 다음: "2"}

  - 단계: "2"
    이름: ★적용 범위 확인 — D/t 한계
    근거: "KDS 14 31 10  4.3.2.1.1.8"
    작업: 판정
    식위치: >
      4.3.2.1.1.8 머리글 — **이 조항은 D/t 비가 원문이 정한 한계보다 「적은」 원형강관에만
      적용한다.** 그 한계값은 원문 이미지다.
      ★★**한계를 넘는 얇은 관에는 이 절을 쓸 수 없다.** 값을 확인하지 않고 그냥
      식 (4.3-46)~(4.3-48) 을 쓰면 **적용 범위 밖에서 계산한 것**이 된다.
      ★한계상태는 **둘뿐**이다 — **항복(소성모멘트) · 국부좌굴**. 그 중 **최솟값**.
      ★**횡비틀림좌굴이 없다.** 원형이라 약축·강축 구분이 없고 횡좌굴이 성립하지 않는다.
      H형강 트리의 Cb·Lb·Lp·Lr 이 여기서는 **아예 나오지 않는다.**
      값은 `kcsc_formula('KDS 14 31 10','4.3.2.1.1.8')` 로 그림을 보고 확인할 것.
    분기:
      - {조건: "D/t 가 원문 한계 미만", 결과: "4.3.2.1.1.8 적용", 다음: "3A"}
      - {조건: "D/t 가 한계 이상",     결과: "★이 절 적용 불가 — 원문 확인", 다음: "8"}
    출력: 적용 여부

  # ── [3A]·[3B] 는 **병렬**이다. 둘을 산정하고 [4] 에서 최솟값을 취한다.
  - 단계: "3A"
    이름: "〔병렬〕 항복강도 (소성모멘트)"
    근거: "KDS 14 31 10  4.3.2.1.1.8"
    작업: 산정
    식위치: "4.3.2.1.1.8(1) — **식 (4.3-46)**. 소성단면계수 Z 기반"
    출력: Mn(항복)

  - 단계: "3B"
    이름: "〔병렬〕 국부좌굴강도 (조밀이면 산정 안 함)"
    근거: "KDS 14 31 10  4.3.2.1.1.8"
    작업: 산정
    식위치: >
      4.3.2.1.1.8(2) —
        ① **조밀단면이면 플랜지 국부좌굴강도를 산정하지 않는다.**
        ② 비조밀단면  → **식 (4.3-47)**
        ③ 세장판 단면 → **식 (4.3-48)**, 이때 임계응력은 **식 (4.3-49)**
      ★원형강관의 단면 분류는 **D/t 지름두께비**로 한다(표 4.3-2). H형강의 b/t·h/tw 가
      아니다.
    출력: Mn(국부좌굴)

  - 단계: "4"
    이름: 공칭휨강도 결정
    근거: "KDS 14 31 10  4.3.2.1.1.8"
    작업: 판정
    식위치: "4.3.2.1.1.8 머리글 — **항복강도와 국부좌굴강도 중 최솟값**"
    출력: Mn

  - 단계: "5"
    이름: 설계휨강도 산정
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 계산
    식위치: "설계휨강도 = φb·Mn. 저항계수 φb 값은 원문
             (★교량이면 KDS 24 14 31 4.1.4.2 의 값)"
    출력: φbMn

  - 단계: "6"
    이름: ★전단강도 — 원형강관은 전용 조항이 따로 있다
    근거: "KDS 14 31 10  4.3.2.1.2.6"
    작업: 산정
    식위치: >
      ★★**원형강관 전단은 4.3.2.1.2.6 이다.** H형강의 4.3.2.1.2.2 / 4.3.2.1.2.3
      (**인장역작용 분기**)을 가져다 쓰면 안 된다 — **원형강관에는 그 분기가 없다.**
      한계상태는 **전단항복 · 전단좌굴** 둘이다.
      **식 (4.3-98)** — 공칭전단강도 Vn. 강관의 전단면적 Ag 를 쓴다.
      ★임계응력은 **식 (4.3-99) 와 식 (4.3-100) 중 「큰 값」** 을 쓰되,
      **원문이 정한 상한을 초과할 수 없다**(상한값은 원문 이미지).
      **큰 값을 고른 뒤 상한으로 자르는 두 단계**다. 한 단계만 하면 틀린다.
      ★**Lv 의 정의에 주의** — "최대전단력 작용점과 **전단력이 0인 점** 사이의 거리"다.
      부재 전장이나 지간이 아니다. 단순보 등분포면 지간의 절반쯤이 된다.
    출력: φvVn

  - 단계: "7"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: >
      Mu ≤ φb·Mn 이고 Vu ≤ φv·Vn 이면 OK.
      ★**NG 면 여기서 끝난다.** 단면 변경은 계산서에서 설계자가 한다.
      **후행작업은 OK 인 경우에만** 이어진다.
    출력: "OK / NG"

  - 단계: "8"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 10  4.3"
    작업: 판정
    식위치: >
      **배타 선택이 아니라 체크리스트**다 — 해당하는 것을 **모두** 검토한다.
        □ 비틀림이 함께 작용하는가            → [9]  (4.4.3) ★원형강관은 흔하다
        □ **이음·연결부**가 있는가 (볼트/용접 불문)        → [10]
      해당 없으면 그대로 종료한다.
    출력: 해당 항목 목록

  - 단계: "9"
    이름: ★비틀림 검토 (해당하면)
    근거: "KDS 14 31 10  4.4.3"
    작업: 판정
    식위치: >
      4.4.3 — 비틀림, 또는 비틀림·휨·전단력·축력을 동시에 받는 부재.
      원형강관의 비틀림강도는 **4.4.3.1**(원형과 각형강관의 비틀림강도)이다.
    다음트리: "비틀림부재 / 원형·각형강관"
    출력: 비틀림 검토

  - 단계: "10"
    이름: ★연결부 있음 — 「연결부 설계」 단계로 (해당하면)
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: >
      ★★**여기서는 「연결부가 있다」는 것만 기록한다.** 실무 순서가 그렇다 —
      **부재별 단면검토를 전부 마친 뒤** 「연결부 설계」 단계에서 처리한다.
      연결재가 **볼트냐 용접이냐**는 거기서 **한 번만** 갈린다
      (진입 트리 `강교 부재 / 전체` 의 [9]).
        볼트 → 4.1.3 `연결부 / 볼트접합`   ·   용접 → 4.1.2 `연결부 / 용접접합`
      그리고 **연결재 형식과 무관하게 접합부재 4.1.4** (`연결부 / 접합부재`) 를 **반드시**.
      ★**부재가 OK 여도 접합부에서 파괴되면 그 부재는 못 쓴다.**
      ★원형강관은 **슬롯을 뚫어 거셋플레이트를 끼우는** 접합이 흔하다 — 그 상세는 **용접**이고,
        전단뒤짐계수도 **표 4.1-1 사례 5**(원형강관 전용)로 H형강과 다르다.
    출력: "연결부 있음 (형식은 연결부 설계 단계에서)"

  - 단계: "11"
    이름: 종료
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: "부재 검토와 해당하는 후행작업이 모두 끝났다"
    출력: "OK"

안전주의: >
  ★★**원형강관 휨에는 횡비틀림좌굴이 없다.** 한계상태는 **항복(소성모멘트) · 국부좌굴**
  둘뿐이다(4.3.2.1.1.8 머리글). 원형이라 강축·약축 구분이 없고 횡좌굴이 성립하지 않는다.
  **H형강 트리의 Cb·Lb·Lp·Lr 은 여기서 아예 나오지 않는다.** 가져다 쓰면 없는 검토를
  넣는 것이다.

  ★★**적용 범위가 D/t 로 제한된다.** 4.3.2.1.1.8 은 "D/t 비가 (원문값)보다 **적은**
  원형강관에 적용한다"고 머리글에서 못 박는다. **한계를 넘는 얇은 관은 이 절 밖이다.**
  값을 확인하지 않고 식만 가져다 쓰면 적용 범위 밖에서 계산한 것이 된다.

  ★★**전단은 4.3.2.1.2.6 — 원형강관 전용 조항이다.**
  H형강의 **인장역작용 분기(4.3.2.1.2.2 / 4.3.2.1.2.3)가 원형강관에는 없다.**
  임계응력은 **식 (4.3-99)·(4.3-100) 중 큰 값**을 쓰되 **원문 상한으로 자른다** —
  두 단계다.
  ★**Lv 는 "최대전단력 작용점과 전단력이 0인 점 사이의 거리"** 다. 지간이나 부재
  전장이 아니다. **정의를 잘못 잡으면 전단강도가 통째로 달라진다.**

  ★**단면 분류는 D/t (지름두께비)** 로 한다(표 4.3-2). H형강의 b/t·h/tw 가 아니다.
  ★**원형강관은 비틀림이 실제로 걸리는 단면**이다(폐단면이라 비틀림강성이 크다).
  4.4.3 / 4.4.3.1 을 챙길 것 — H형강처럼 "웬만하면 무시"가 통하지 않는다.
  ★슬롯 거셋플레이트 접합이면 전단뒤짐계수가 **표 4.1-1 사례 5**(원형강관 전용)다.
  모든 식·한계값이 원문 이미지다 —
  `kcsc_formula('KDS 14 31 10','4.3.2.1.1.8')` · `('KDS 14 31 10','4.3.2.1.2.6')`
  으로 그림을 직접 보고 옮길 것.
  ★교량에 쓸 때는 저항계수를 **KDS 24 14 31 4.1.4.2** 에서 가져온다. 다만 교량기준
  (KDS 24 14 30 · 24 14 31)에는 **원형강관 전용 부재강도 조항이 사실상 없다** —
  실무는 이 KDS 14 31 10 조항을 쓰고 저항계수만 교량 것으로 바꾸는 형태가 된다.

검증일: "2026-08-06"
