부재: 압축부재
단면: 원형강관 (원형단면)
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 10  # 강구조 부재 설계기준 (하중저항계수설계법) 4.2 압축부재
목표검토: "설계압축강도 φc·Pn  ≥  소요압축강도 Pu"

# ─────────────────────────────────────────────────────────────────────────────
# 이 트리는 패키지 동봉 예제(`검증: 예제`)를 **실사용 확정본**으로 옮긴 것이다.
# 동봉 예제는 배포용 형식 견본으로 그대로 두고, 실사용은 이 파일을 쓴다
# (같은 부재·단면·설계법이면 사용자 폴더가 이긴다).
#
# ★원형강관은 H형강과 **한계상태가 다르다.** 표 4.2-1 의 단면 그림을 직접 확인했다 —
#   4행이 원형강관이고, 비세장판은 **4.2.3(휨좌굴)** 만, 세장판은 **4.2.7(국부좌굴·휨좌굴)** 이다.
#   **비틀림좌굴이 없다.** 폐단면이라 비틀림강성이 커서 지배하지 않는다.
#   4.2.4(비틀림·휨비틀림좌굴) 적용범위에도 원형강관은 들어가지 않는다.
#   ※다만 **비틀림 하중**을 받으면 이야기가 다르다 — 4.4.3 으로 간다([1] 참고).
# ─────────────────────────────────────────────────────────────────────────────
입력:
  - {기호: D,  설명: 원형강관 외경,          단위: mm}
  - {기호: t,  설명: 관 두께,                단위: mm}
  - {기호: Ag, 설명: 총단면적,               단위: mm^2}
  - {기호: r,  설명: 단면2차반경,            단위: mm}
  - {기호: L,  설명: 부재 길이,              단위: mm}
  - {기호: K,  설명: 유효길이계수,           단위: "-"}
  - {기호: Fy, 설명: 강재 항복강도,          단위: MPa}
  - {기호: E,  설명: 강재 탄성계수,          단위: MPa}
  - {기호: Pu, 설명: 소요압축강도(계수하중),  단위: kN}
  - {기호: Tu, 설명: "소요비틀림강도 (있으면) — 4.4.3 판정에 쓴다", 단위: kN·m}

흐름:
  - 단계: "1"
    이름: 함께 작용하는 하중 확인 (조합·비틀림)
    근거: "KDS 14 31 10  4.4"
    작업: 판정
    식위치: >
      순수 압축이 아니면 이 트리를 타면 안 된다.
      휨이 함께 → 4.4.1 상관식(조합력 트리).
      ★**비틀림이 함께 → 4.4.3**. 원형강관은 4.4.3.1 에 **전용 비틀림강도 조항**이 있고,
      4.4.3.2 가 "소요비틀림강도가 설계비틀림강도의 **20% 이하면 비틀림을 무시**하고
      4.4.1 을 따른다"고 정한다. 20% 판정을 하려면 먼저 φT·Tn 을 구해야 한다.
    분기:
      - {조건: "비틀림이 함께 작용", 결과: "★4.4.3 으로 — 20% 판정이 먼저다",
         다음트리: "비틀림부재 / 원형·각형강관"}
      - {조건: "휨이 함께 작용 (비틀림 없음)", 결과: "조합력 트리로",
         다음트리: "조합력부재 (압축 + 휨) / H형강"}
      - {조건: "순수 압축 (또는 상위 트리에서 Pr 산출용으로 불려옴)",
         결과: "이 트리를 계속", 다음: "2"}

  - 단계: "2"
    이름: 유효길이·세장비
    근거: "KDS 14 31 10  4.2.2"
    작업: 계산
    식위치: "4.2.2 — 세장비 = K·L/r. 유효길이계수 K 는 표 4.2-3.
             ★원형단면은 축이 대칭이라 강축·약축 구분이 없다"
    출력: 세장비

  - 단계: "3"
    이름: 단면의 세장판 분류
    근거: "KDS 14 31 10  4.2.1.1.3 + 표 4.2-2"
    작업: 판정
    식위치: "표 4.2-2 **9행(원형강관)** — 폭두께비 = D/t, 한계값 λr (식은 원문 이미지)"
    분기:
      - {조건: "D/t ≤ λr (비세장판)", 결과: "4.2.3 만", 다음: "4"}
      - {조건: "D/t > λr (세장판)",   결과: "4.2.7 로", 다음: "5"}
    출력: 단면 분류

  - 단계: "4"
    이름: 휨좌굴에 대한 압축강도
    근거: "KDS 14 31 10  4.2.3"
    작업: 산정
    식위치: >
      식 (4.2-1) Pn = Fcr·Ag. Fcr 은 식 (4.2-2)·(4.2-3), Fe 는 식 (4.2-4).
      ★한계상태: **휨좌굴 하나뿐**이다. 표 4.2-1 원형강관 행에 4.2.4 가 없다 —
      H형강 트리를 그대로 베끼면 안 된다.
    출력: Pn(휨좌굴)

  - 단계: "5"
    이름: 세장판 단면의 압축강도
    근거: "KDS 14 31 10  4.2.7"
    작업: 산정
    식위치: >
      4.2.7 — ★**원형강관은 전용 경로(②)** 를 따른다(H형강 등은 ①).
      유효단면적 Ae 를 D/t 조건에 따라 식 (4.2-23)·(4.2-24) 로 구한다.
      ★한계상태: **국부좌굴 · 휨좌굴** (표 4.2-1 원형강관 행). 비틀림좌굴은 없다.
    출력: Pn(세장판 — 국부좌굴 반영)

  - 단계: "6"
    이름: 공칭압축강도 결정
    근거: "KDS 14 31 10  4.2.1 + 표 4.2-1"
    작업: 판정
    식위치: >
      표 4.2-1 **원형강관 행**(단면 그림 4행) —
      비세장판: 4.2.3 **휨좌굴**
      세장판:   4.2.7 **국부좌굴 · 휨좌굴**
      해당 한계상태 중 **최솟값**을 취한다.
    출력: Pn

  - 단계: "7"
    이름: 설계압축강도 산정
    근거: "KDS 14 31 10  4.2.1 (1)"
    작업: 계산
    식위치: "설계압축강도 = φc·Pn. 저항계수 φc 값은 원문
             (★교량이면 KDS 24 14 31 4.1.4.2 의 값)"
    출력: φcPn

  - 단계: "8"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.2.1"
    작업: 판정
    식위치: >
      Pu ≤ φc·Pn 이면 OK, 아니면 NG.
      ★**NG 면 여기서 끝난다.** 단면 변경은 계산서에서 설계자가 하는 일이다.
      **후행작업은 OK 인 경우에만** 이어진다.
    출력: "OK / NG"

  - 단계: "9"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 10  4.2"
    작업: 판정
    식위치: >
      **배타 선택이 아니라 체크리스트**다 — 해당하는 것을 **모두** 검토한다.
        □ **이음·연결부**가 있는가 (볼트/용접 불문) → [10]
      해당 없으면 그대로 종료한다.
    출력: 해당 항목 목록

  - 단계: "10"
    이름: ★연결부 있음 — 「연결부 설계」 단계로 (해당하면)
    근거: "KDS 14 31 10  4.2.1"
    작업: 판정
    식위치: >
      ★★**여기서는 「연결부가 있다」는 것만 기록한다.** 실무 순서가 그렇다 —
      **부재별 단면검토를 전부 마친 뒤** 「연결부 설계」 단계에서 처리한다.
      연결재가 **볼트냐 용접이냐**는 거기서 **한 번만** 갈린다
      (진입 트리 `강교 부재 / 전체` 의 [9]).
        볼트 → 4.1.3 `연결부 / 볼트접합`   ·   용접 → 4.1.2 `연결부 / 용접접합`
      그리고 **연결재 형식과 무관하게 접합부재 4.1.4** (`연결부 / 접합부재`) 를 **반드시**.
      ★**부재가 OK 여도 접합부에서 파괴되면 그 부재는 못 쓴다.**
    출력: "연결부 있음 (형식은 연결부 설계 단계에서)"

  - 단계: "11"
    이름: 종료
    근거: "KDS 14 31 10  4.2.1"
    작업: 판정
    식위치: "부재 검토와 해당하는 후행작업이 모두 끝났다"
    출력: "OK"

안전주의: >
  ★★**원형강관에는 압축부재 한계상태로서의 비틀림좌굴이 없다.** 표 4.2-1 의 단면 그림을
  직접 확인한 결과 4행이 원형강관이고 비세장판은 4.2.3(휨좌굴)만, 세장판은
  4.2.7(국부좌굴·휨좌굴)이다. 폐단면이라 비틀림강성이 커서 지배하지 않으며,
  4.2.4 적용범위에도 원형강관은 들어가지 않는다. **H형강 트리를 베껴 4.2.4 를 넣으면 안 된다.**

  ★**그러나 "비틀림 검토"가 없는 것은 아니다.** 비틀림 **하중**을 받으면
  4.4.3.1(원형·각형강관의 비틀림강도 — 비틀림항복·비틀림좌굴 한계상태)과
  4.4.3.2(비틀림·전단·휨·축력 동시)로 간다. 둘은 서로 다른 이야기다 —
  4.2.4 는 **압축력에 의한 좌굴**, 4.4.3 은 **비틀림 하중에 대한 강도**다.

  ★4.2.7 은 원형강관 전용 경로(②)가 따로 있다. ①(원형강관 제외)을 쓰면 안 된다.
  λr·Fcr·φc 등 모든 값·식이 원문 이미지다 — `kcsc_formula` 로 그림을 보고 옮길 것.
  ★교량에 쓸 때는 저항계수 φc 를 **KDS 24 14 31 4.1.4.2** 에서 가져온다.

검증일: "2026-08-06"
검증기준:
  "KDS 143110": "2024"
검증: 설계자확정
