부재: 압축부재
단면: H형강 (2축대칭)
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 10  # 강구조 부재 설계기준 (하중저항계수설계법) 4.2 압축부재
목표검토: "설계압축강도 φc·Pn  ≥  소요압축강도 Pu"

입력:
  - {기호: Ag, 설명: 총단면적,              단위: mm^2}
  - {기호: bf, 설명: 플랜지 폭,             단위: mm}
  - {기호: tf, 설명: 플랜지 두께,           단위: mm}
  - {기호: h,  설명: 웨브 순높이,           단위: mm}
  - {기호: tw, 설명: 웨브 두께,             단위: mm}
  - {기호: rx, 설명: 강축 단면2차반경,      단위: mm}
  - {기호: ry, 설명: 약축 단면2차반경,      단위: mm}
  - {기호: L,  설명: 부재 길이,             단위: mm}
  - {기호: K,  설명: 유효길이계수,          단위: "-"}
  - {기호: Lz, 설명: 비틀림 비지지길이,     단위: mm}
  - {기호: Fy, 설명: 강재 항복강도,         단위: MPa}
  - {기호: E,  설명: 강재 탄성계수,         단위: MPa}
  - {기호: Pu, 설명: 소요압축강도(계수하중), 단위: kN}

흐름:
  # ★조합 여부를 **맨 앞에서** 묻는다(인장부재 트리와 같은 이유).
  #   휨이 함께 작용하면 순수 압축 흐름을 타면 안 된다.
  #   ※조합력 트리가 **Pr 산출을 위해** 이 트리를 불러온 경우에는 이미 조합력 쪽에 있으므로
  #     이 분기를 건너뛰고 [2] 부터 돈다.
  - 단계: "1"
    이름: 압축 + 휨 조합인지 확인
    근거: "KDS 14 31 10  4.4.1.1"
    작업: 판정
    식위치: "4.4.1.1 — 휨이 함께 작용하면 상관식으로 검토해야 한다"
    분기:
      - {조건: "휨이 함께 작용", 결과: "조합력 트리로 넘어간다",
         다음트리: "조합력부재 (압축 + 휨) / H형강"}
      - {조건: "순수 압축 (또는 조합력 트리에서 Pr 산출용으로 불려옴)",
         결과: "이 트리를 계속", 다음: "2"}

  - 단계: "2"
    이름: 유효길이·세장비
    근거: "KDS 14 31 10  4.2.2"
    작업: 계산
    식위치: "4.2.2 — 세장비 = K·L/r. **강축·약축 각각** 구한다.
             유효길이계수 K 는 표 4.2-3"
    출력: 세장비(강축·약축)

  - 단계: "3"
    이름: 단면의 세장판 분류
    근거: "KDS 14 31 10  4.2.1.1.3 + 표 4.2-2"
    작업: 판정
    식위치: "표 4.2-2 — H형강 플랜지는 사례1(압연)·사례2(용접), 웨브는 사례5.
             한계값 λr 은 원문 이미지"
    분기:
      - {조건: "플랜지·웨브 모두 λr 이하 (비세장판)", 결과: "비세장판 경로", 다음: "4"}
      - {조건: "하나라도 λr 초과 (세장판)",           결과: "세장판 경로",   다음: "6"}
    출력: 단면 분류

  - 단계: "4"
    이름: 휨좌굴에 대한 압축강도
    근거: "KDS 14 31 10  4.2.3"
    작업: 산정
    식위치: "식 (4.2-1) Pn = Fcr·Ag. Fcr 은 식 (4.2-2)·(4.2-3), Fe 는 식 (4.2-4).
             ★한계상태: **휨좌굴**"
    출력: Pn(휨좌굴)

  - 단계: "5"
    이름: 비틀림좌굴·휨비틀림좌굴 검토 필요 여부
    근거: "KDS 14 31 10  4.2.4"
    작업: 판정
    식위치: >
      4.2.4(1) — 비틀림에 대한 유효 비지지길이가 휨좌굴에 대한 유효 비지지길이보다
      **큰 경우** 이 절도 검토한다.
      ★한계상태: **비틀림좌굴 · 휨비틀림좌굴** (표 4.2-1 이 비세장판 단면에 드는 것)
    분기:
      - {조건: "비틀림 비지지길이가 더 길다", 결과: "4.2.4 도 산정", 다음: "7"}
      - {조건: "해당 없음",                   결과: "휨좌굴만",      다음: "7"}
    출력: Pn(비틀림좌굴)

  - 단계: "6"
    이름: 세장판 단면의 압축강도
    근거: "KDS 14 31 10  4.2.7"
    작업: 산정
    식위치: >
      4.2.7 — 유효단면적 Ae 로 감소를 반영한다. H형강은 **원형강관을 제외한 경로(①)** 를 따른다.
      ★한계상태: **국부좌굴 · 휨좌굴 · 비틀림좌굴** (표 4.2-1).
      세장판 단면은 **국부좌굴이 추가로 걸린다** — 비세장판 경로와 달라지는 지점이다.
      감소계수·유효폭 식은 원문 이미지 → `kcsc_formula('KDS 14 31 10','4.2.7')`
    출력: Pn(세장판 — 국부좌굴 반영)

  - 단계: "7"
    이름: 공칭압축강도 결정
    근거: "KDS 14 31 10  4.2.1 + 표 4.2-1"
    작업: 판정
    식위치: >
      표 4.2-1 — **해당 단면 행**의 적용 절과 한계상태를 확인하고 그중 **최솟값**을 취한다.
      비세장판 단면: 4.2.3(휨좌굴) · 4.2.4(비틀림좌굴·휨비틀림좌굴)
      세장판 단면:   4.2.7(**국부좌굴**·휨좌굴·비틀림좌굴)
    출력: Pn

  - 단계: "8"
    이름: 설계압축강도 산정
    근거: "KDS 14 31 10  4.2.1 (1)"
    작업: 계산
    식위치: "설계압축강도 = φc·Pn. 저항계수 φc 값은 원문
             (★교량이면 KDS 24 14 31 4.1.4.2 의 값)"
    출력: φcPn

  - 단계: "9"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.2.1"
    작업: 판정
    식위치: >
      Pu ≤ φc·Pn 이면 OK, 아니면 NG.
      ★**NG 면 여기서 끝난다.** 단면을 바꿔 다시 도는 것은 계산서에서 설계자가 하는 일이지
      트리가 되돌릴 일이 아니다. **후행작업은 OK 인 경우에만** 이어진다.
    출력: "OK / NG"

  - 단계: "10"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 10  4.2"
    작업: 판정
    식위치: >
      부재가 만족했을 때 이어서 볼 것들. **배타 선택이 아니라 체크리스트**다 —
      해당하는 것을 **모두** 검토한다.
        □ **이음·연결부**가 있는가 (볼트/용접 불문) → [11]
      해당 없으면 그대로 종료한다.
    출력: 해당 항목 목록

  - 단계: "11"
    이름: ★연결부 있음 — 「연결부 설계」 단계로 (해당하면)
    근거: "KDS 14 31 10  4.2.1"
    작업: 판정
    식위치: >
      ★★**여기서는 「연결부가 있다」는 것만 기록한다.** 실무 순서가 그렇다 —
      **부재별 단면검토를 전부 마친 뒤** 「연결부 설계」 단계에서 처리한다.
      연결재가 **볼트냐 용접이냐**는 거기서 **한 번만** 갈린다
      (진입 트리 `강교 부재 / 전체` 의 [9]).
        볼트 → 4.1.3 `연결부 / 볼트접합`   ·   용접 → 4.1.2 `연결부 / 용접접합`
      그리고 **연결재 형식과 무관하게 접합부재 4.1.4** (`연결부 / 접합부재`) 를 **반드시**.
      ★**부재가 OK 여도 접합부에서 파괴되면 그 부재는 못 쓴다.**
    출력: "연결부 있음 (형식은 연결부 설계 단계에서)"

  - 단계: "12"
    이름: 종료
    근거: "KDS 14 31 10  4.2.1"
    작업: 판정
    식위치: "부재 검토와 해당하는 후행작업이 모두 끝났다"
    출력: "OK"

안전주의: >
  ★H형강은 **약축 세장비가 지배**하는 경우가 대부분이다. 강축만 보고 넘어가면 위험측이다.
  ★**세장판 단면은 국부좌굴이 추가로 걸린다**(표 4.2-1). 비세장판 경로(4.2.3·4.2.4)와
  달라지는 지점이 바로 그것이다. 4.2.7 로 갔으면 국부좌굴을 반영한 값인지 확인할 것.
  ★비틀림 비지지길이(Lz)가 휨좌굴 비지지길이보다 길면 **4.2.4(비틀림·휨비틀림좌굴)를
  추가로** 검토해야 한다(4.2.4(1)). 빠뜨리기 쉬운 자리다.
  λr·Fcr·φc 등 모든 값·식이 원문 이미지다 — `kcsc_formula` 로 그림을 보고 옮길 것.
  ★교량에 쓸 때는 저항계수 φc 를 **KDS 24 14 31 4.1.4.2** 에서 가져온다. 강도식은 같지만
  φ 는 다르다.
  이 트리에 **없는 것**: 4.2.5 단일ㄱ형강 압축부재, 4.2.6 조립 압축재.
  브레이싱 등에 쓰일 수 있으나 실적 자료가 없어 넣지 않았다. 해당 부재가 나오면
  원문(4.2.5·4.2.6)을 따로 볼 것.

검증일: "2026-08-06"
검증기준:
  "KDS 143110": "2024"
검증: 설계자확정
