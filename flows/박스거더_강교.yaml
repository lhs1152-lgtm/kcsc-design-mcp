부재: 박스거더
단면: 강교 박스거더 (다중·단일 박스, U형)
설계법: 한계상태설계법
근거: KDS 24 14 31  # 강교 설계기준(한계상태설계법) 4.7 박스거더
위임근거: "KDS 24 14 31  4.7"
목표검토: "강도한계상태 Mu ≤ φf·Mn · Vu ≤ φv·Vn  (+ 비틀림 전단·뒤틀림 응력 제한 · 사용·피로 병렬)"

입력:
  - {기호: 박스형식, 설명: "★단일 박스 / 다중 박스 / U형 · 직선교 / 곡선교", 단위: "-"}
  - {기호: bf,  설명: 박스플랜지 폭,                  단위: mm}
  - {기호: tf,  설명: 박스플랜지 두께,                단위: mm}
  - {기호: D,   설명: "웨브 높이 (★경사 웨브는 경사를 따라 잰 높이)", 단위: mm}
  - {기호: tw,  설명: 웨브 두께,                      단위: mm}
  - {기호: θ,   설명: "연직축에 대한 웨브 경사각 (★1/4 한계)", 단위: "°"}
  - {기호: Le,  설명: "유효 경간장 (연속교는 변곡점 간 거리)", 단위: mm}
  - {기호: a,   설명: "인접 박스 간 플랜지 중심간격 (다중 박스 분배계수 제한)", 단위: mm}
  - {기호: w,   설명: "각 박스단면의 플랜지 중심간격",  단위: mm}
  - {기호: fv,  설명: "계수하중에 의한 순수비틀림 전단응력", 단위: MPa}
  - {기호: Mu,  설명: 소요휨강도 (계수하중),           단위: "N·mm"}
  - {기호: Vu,  설명: 소요전단강도 (계수하중),         단위: N}

흐름:
  - 단계: "1"
    이름: 위임 경로·박스 형식 확인
    근거: "KDS 24 14 31  4.7"
    작업: 판정
    식위치: >
      KDS 24 14 31 4.7(1) — **"박스거더 교량의 설계는 KDS 14 31 10(4.3.3.2)의
      해당규정을 따른다."** 플레이트거더(4.6 → 4.3.3.1)와 같은 위임 패턴이고,
      **φ 는 KDS 24 14 31 4.1.4.2** 다.
      ★박스 형식(단일/다중/U형)과 직선/곡선을 먼저 확정할 것 — 이후 단계마다 갈린다:
      **곡선교는 정모멘트부도 무조건 비조밀**(4.3.3.2.6.2(2)①),
      **단일 박스·곡선교는 비틀림 전단을 반드시 합산**(4.3.3.2.9(2)).
    출력: "형식 · 위임 경로"

  - 단계: "2"
    이름: ★단면비 요구조건 — 웨브 경사 1/4
    근거: "KDS 14 31 10  4.3.3.2.2"
    위임근거: "KDS 24 14 31  4.7"
    작업: 판정
    식위치: >
      4.3.3.2.2.1 — 웨브는 경사 또는 수직. ★**경사는 (하부플랜지 수직면 대비) 1/4
      을 초과할 수 없다.** 경사 웨브는 **모든 검토에서 경사를 따라 잰 웨브 길이**를
      쓴다. U형단면의 상부플랜지 웨브는 **플랜지 폭 중앙**에 부착.
      수평보강재 없는 웨브 **식 (4.3-242)** / 있는 웨브 **식 (4.3-243)** (세장비 한계 —
      이미지).
      4.3.3.2.2.2 — U형 상부플랜지는 **식 (4.3-244)~(4.3-246)** 을 만족(이미지).
    출력: 단면비 적합 여부

  - 단계: "3"
    이름: ★다중 박스 — 활하중 분배계수의 특별제한
    근거: "KDS 14 31 10  4.3.3.2.2.3"
    위임근거: "KDS 24 14 31  4.7"
    작업: 판정
    식위치: >
      분배계수로 활하중 휨모멘트를 산정하려면 **기하 조건을 전부 만족**해야 한다
      (수치가 글자다):
        · 지간 중앙 인접 박스 간 플랜지 중심간격 a = 각 박스 플랜지 중심간격 w 의
          **80% ~ 120%** (비평행 배치면 지점에서 **65% ~ 135%** 도 추가)
        · 각 박스단면의 플랜지 중심간격은 **동일**
        · 웨브 경사 ≤ **1/4**
        · 바닥판 내민부(난간·연석 포함) ≤ 인접 박스 상부플랜지 평균 중심간격의
          **60%** 이고 **1,800 mm 이내**
        · **베어링 연결선이 사각(斜角)을 이루지 않을 것**
      ★**하나라도 어기면 분배계수를 못 쓴다** — 정밀해석(격자 등)으로 가야 한다.
    분기:
      - {조건: "다중 박스 + 조건 전부 만족", 결과: "분배계수 사용 가능", 다음: "4"}
      - {조건: "단일 박스 · 곡선교 · 조건 미달", 결과: "★정밀해석 + 비틀림 전단 합산", 다음: "4"}
    출력: 해석 방법

  - 단계: "4"
    이름: ★유효폭·비틀림·뒤틀림 응력
    근거: "KDS 14 31 10  4.3.3.2.1.1"
    위임근거: "KDS 24 14 31  4.7"
    작업: 판정
    식위치: >
      4.3.3.2.1.1 —
      (1) **유효폭** — 플랜지 폭 ≤ **유효 경간장의 1/5** 이면 전폭 유효, 초과하면
        **경간장의 1/5 만** 유효. ★연속교의 유효 경간장 = **영구하중 변곡점 간 거리**.
      (2) **순수비틀림 전단** — 단일 박스·곡선교·전폭 비유효 단면은 휨전단과 합산
        검토. 계수 비틀림 전단응력 ≤ **계수비틀림 전단강도 (식 4.3-241)**.
      (3) **단면 뒤틀림** —
        ★횡방향 휨응력은 강도한계상태에서 **135 MPa 을 초과할 수 없다** (글자 값).
        종방향 뒴응력은 **피로에서는 고려, 강도한계상태에서는 무시 가능**.
        웨브·플랜지의 수직보강재는 횡방향 휨에 저항하는 것으로 간주.
    출력: "유효폭 · 비틀림/뒤틀림 응력 판정"

  - 단계: "5"
    이름: 강도한계상태 — 휨 (정모멘트부)
    근거: "KDS 14 31 10  4.3.3.2.6"
    위임근거: "KDS 24 14 31  4.7"
    작업: 판정
    식위치: >
      4.3.3.2.6.2(2) —
      ★**곡선교 단면은 무조건 비조밀**로 본다 → 4.3.3.2.7.2.
      직선교가 **조밀단면**이 되려면 다섯 조건 **전부**:
        가. 플랜지·웨브 최소항복강도 ≤ **455 MPa**
        나. 웨브 4.3.3.2.2.1(2) 만족 / 다. 4.3.3.2.2.3 만족(분배계수 제한)
        라. 플랜지 **전체 유효** / 마. 웨브 세장비 **식 (4.3-252)**
      조밀 → 4.3.3.2.7.1 (**식 4.3-253** — Mu ≤ φf·Mn, 연속교는 식 4.3-152 한계 이내)
      비조밀 → 4.3.3.2.7.2. 조밀·비조밀 모두 **연성요구조건**(4.3.3.1.7.3).
      인장플랜지에 구멍이 있으면 4.3.3.1.1.8.
    분기:
      - {조건: "직선교 + 조밀 조건 5개 전부", 결과: "4.3.3.2.7.1 (조밀)", 다음: "6"}
      - {조건: "곡선교 · 조건 미달",          결과: "4.3.3.2.7.2 (비조밀)", 다음: "6"}
    출력: "정모멘트부 휨 검토"

  - 단계: "6"
    이름: ★강도한계상태 — 휨 (부모멘트부)
    근거: "KDS 14 31 10  4.3.3.2.8"
    위임근거: "KDS 24 14 31  4.7"
    작업: 판정
    식위치: >
      4.3.3.2.6.2(3) — 부모멘트부는 4.3.3.2.8 을 적용한다.
      ★★**부록 A 적용 불가 · 내측 지점 부모멘트의 재분배 설계 불가** — 명문 금지다.
      플레이트거더에서 허용되던 것을 박스거더에 끌어오면 안 된다.
      압축플랜지(4.3.3.2.8.2) —
        비보강 플랜지: **식 (4.3-265)** — 공칭압축좌굴강도(3구간, 식 4.3-266~268)와
        **전단좌굴강도(식 4.3-269~271)의 상호작용**. ★**순수비틀림 전단응력 fv 가
        휨강도식 안에 들어온다** — 비틀림을 무시하면 위험측.
        종방향보강재로 보강된 플랜지: 4.3.3.2.8.2(3).
      인장플랜지: 4.3.3.2.8.3.
    출력: "부모멘트부 휨 검토"

  - 단계: "7"
    이름: 강도한계상태 — 전단
    근거: "KDS 14 31 10  4.3.3.2.9"
    위임근거: "KDS 24 14 31  4.7"
    작업: 산정
    식위치: >
      4.3.3.2.9 — 웨브 1개씩, 플레이트거더 전단 규정(4.3.3.1.9)을 준용하되:
      ★**경사 웨브** — 웨브 높이는 경사를 따라 잰 값, 웨브 1개의 계수전단력은
        **식 (4.3-282)** (Vu/cosθ 꼴 — 경사로 커진다).
      ★단일 박스·곡선교·전폭 비유효 다중 박스는 전단력에 **순수비틀림 전단을 합산**.
      박스플랜지의 검토 폭은 **웨브 사이 유효플랜지폭의 1/2**(상한 18·tf).
      웨브 보강재는 4.3.3.2.11.1.
    출력: "전단 검토"

  - 단계: "8"
    이름: 압축플랜지 종방향보강재 (해당하면)
    근거: "KDS 14 31 10  4.3.3.2.11.2"
    위임근거: "KDS 24 14 31  4.7"
    작업: 판정
    식위치: >
      4.3.3.2.11.2 — 박스플랜지의 종방향보강재는:
        **플랜지폭을 가로질러 등간격** 배치, **항복강도는 플랜지 이상**.
        돌출폭 **식 (4.3-284)** · 단면2차모멘트 **식 (4.3-285)** (보강재 개수별 계수 —
        1개 0.125·2개 1.120 등, 판 좌굴계수 포함).
      ★ASD 판요소 트리에서 확인한 원칙과 같은 뿌리 — **보강재가 먼저 좌굴하면
      보강이 아니다.**
    출력: "플랜지 보강재 검토"

  - 단계: "9"
    이름: 시공성·상세 (해당하면)
    근거: "KDS 14 31 10  4.3.3.2.3"
    위임근거: "KDS 24 14 31  4.7"
    작업: 판정
    식위치: >
      4.3.3.2.3 — **시공성**(가설 단계의 휨·전단 — 바닥판 타설 전 비합성 상태가
      지배하는 경우가 많다).
      4.3.3.2.1.2 받침 · 4.3.3.2.1.3 플랜지-웨브 연결 · **4.3.3.2.1.4 접근 및 배수**
      (박스 내부 점검·배수 — 유지관리 상세) — 원문 확인.
    출력: "시공성·상세 확인"

  - 단계: "10"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.3.3.2.6"
    위임근거: "KDS 24 14 31  4.7"
    작업: 판정
    식위치: >
      강도한계상태(휨·전단·비틀림 전단·뒤틀림 135 MPa)와 단면비·보강재·시공성이
      모두 만족하면 OK.
      ★**NG 면 여기서 끝난다.** 단면 변경은 계산서에서 설계자가 한다.
    출력: "OK / NG"

  - 단계: "11"
    이름: 종료 — 사용·피로는 병렬로
    근거: "KDS 24 14 31  4.7"
    작업: 판정
    식위치: >
      강도한계상태가 끝났다. **사용한계상태(4.3.3.2.4)는 `사용한계상태 / 강교` 트리와,
      피로(4.3.3.2.5)는 `피로파괴한계상태 / 강교` 트리**와 병렬로 챙긴다 —
      ★박스거더는 **종방향 뒴응력을 피로에서 고려**해야 한다([4]).
      전단연결재(4.3.3.2.6.4·4.3.3.2.10)·연결부는 진입 트리 [9]로.
    다음트리: "피로파괴한계상태 / 강교 (하중유발·변형유발 피로 + 파괴인성)"
    출력: "OK"

안전주의: >
  ★★★**박스거더는 비틀림이 검토의 중심에 들어온다** — 플레이트거더와 결정적으로
  다른 점이다.
    · 단일 박스·곡선교·전폭 비유효 단면은 **휨전단 + 순수비틀림전단 합산**(4.3.3.2.9(2))
    · 부모멘트부 압축플랜지의 휨강도식에 **비틀림 전단응력 fv 가 직접 들어간다**
      (4.3.3.2.8.2 — 압축좌굴×전단좌굴 상호작용)
    · 단면 뒤틀림의 **횡방향 휨응력 ≤ 135 MPa** (강도한계상태, 글자 값)
    · **종방향 뒴응력은 강도에선 무시 가능하지만 피로에선 고려** — 반대로 알면 위험.

  ★★★**부모멘트부에서 부록 A 적용 불가·모멘트 재분배 불가**(4.3.3.2.6.2(3)) —
  플레이트거더에서 허용되던 것이 박스거더에선 명문 금지다.
  ★★**곡선교는 정모멘트부도 무조건 비조밀**(4.3.3.2.6.2(2)①).
  직선교 조밀 조건은 다섯(455 MPa·웨브·분배제한·전폭 유효·세장비) — **전부** 만족해야 한다.
  ★★**다중 박스의 활하중 분배계수는 기하 조건부**(4.3.3.2.2.3 — 80~120%·경사 1/4·
  내민 60%·1,800 mm·사각 금지). 하나라도 어기면 정밀해석으로.
  ★★**경사 웨브** — 높이는 경사를 따라 재고, 웨브 전단력은 식 (4.3-282)로 커진다.
  경사 한계 1/4.
  ★**유효폭** — 플랜지 폭 > 유효 경간장의 1/5 이면 잘린다. 연속교의 유효 경간장은
  **변곡점 간 거리**(지간이 아니다).
  ★플랜지 종방향보강재 — 등간격·항복강도 플랜지 이상·돌출폭/강성 하한(4.3-284/285).
  ★시공성(4.3.3.2.3) — 바닥판 타설 전 비합성 상태가 지배하는 경우가 많다.
  식·세장비 한계는 원문 이미지 — `kcsc_formula('KDS 14 31 10','4.3.3.2.8.2')` 등으로
  그림을 직접 보고 옮길 것. ★φ 는 KDS 24 14 31 4.1.4.2.
  ★철도교는 이 트리의 적용 범위 밖 — 철도교 안건이면 멈추고 원문을 볼 것.

