부재: 강교 부재
단면: 전체 (진입 트리)
설계법: 한계상태설계법
근거: KDS 24 14 31  # 강교 설계기준(한계상태설계법)
목표검토: "극한·극단상황·사용·피로 네 한계상태를 모두 만족 (4.1.1(2))"

# ─────────────────────────────────────────────────────────────────────────────
# ★이 트리는 **부재 하나**에 대한 것이다.
#   계산서는 앞쪽에서 거더·가로보·브레이싱 등의 **부재 목록과 단면제원**을 입력받고,
#   부재마다 이 흐름을 **한 벌씩 펼친다.** 되돌이가 아니라 반복 전개다.
#
# ★강도식은 KDS 14 31 10 에 위임하되 **저항계수 φ 는 KDS 24 14 31 4.1.4.2** 다.
#   4.12(말뚝)가 그 관계를 그대로 말한다 —
#   "말뚝의 설계는 KDS 14 31 10(4.5.3)을 따른다. **다만 극한한계상태에 대한 저항계수는
#    4.1.4.2에 규정된 값으로 한다.**"
# ─────────────────────────────────────────────────────────────────────────────
입력:
  - {기호: 부재,     설명: "검토할 부재 (거더 / 가로보 / 브레이싱 / …)", 단위: "-"}
  - {기호: 단면제원, 설명: "★계산서 앞에서 입력한 그 부재의 단면 형상·치수", 단위: "-"}
  - {기호: N,  설명: "축력 (인장 + / 압축 −) — 부재 성격 판정에 쓴다", 단위: kN}
  - {기호: M,  설명: 휨모멘트,   단위: kN·m}
  - {기호: V,  설명: 전단력,     단위: kN}
  - {기호: φ,  설명: "저항계수 (4.1.4.2 — ★교량 고유값)", 단위: "-"}

흐름:
  - 단계: "1"
    이름: 부재에 관한 일반사항 확인
    근거: "KDS 24 14 31  4.3"
    작업: 판정
    식위치: >
      단면검토 **앞에서** 정해지는 것들이다.
      4.3.1 유효지간 — 받침부·지지부 중심 간격.
      4.3.2 솟음 — 고정하중 처짐 보정과 현장 조립을 위해 **제작 시 설치해야 한다**.
      4.3.3 강재의 최소두께 — 수직·수평브레이싱과 연결판 포함 **모든 강재 8.0mm 이상**.
             압연형강 복부판·강바닥판 폐단면리브는 **7.0mm 이상**. 부식 우려 시 두께 증가.
      4.3.4 다이아프램·수직브레이싱 / 4.3.5 수평브레이싱 — 설계는 KDS 14 31 10 으로 위임.
             ★수평브레이싱은 **모든 시공단계·사용단계에서 필요성을 반드시 검토**한다.
      4.3.6 핀.
    출력: 유효지간 · 솟음 · 최소두께 · 브레이싱 계획

  - 단계: "2"
    이름: 소요 단면력 확보 (하중조합)
    근거: "KDS 24 14 31  4.1.4.1"
    작업: 산정
    식위치: "4.1.4.1 — KDS 24 12 11 의 적합한 조합. 강교는 **사용Ⅱ** 도 필수(4.1.2(2)).
             활하중·충격 등 값은 KDS 24 12 21"
    다음트리: "하중조합 / 도로교"
    출력: "N, M, V (조합별)"

  - 단계: "3"
    이름: ★저항계수 φ 확정 (교량 고유)
    근거: "KDS 24 14 31  4.1.4.2"
    작업: 산정
    식위치: >
      4.1.4.2 — 휨·전단·축방향압축(강재/합성)·인장(총단면 항복/순단면 파단)·핀 지압·
      볼트 지압·전단연결재·고장력볼트(인장/전단)·일반볼트·블록전단·용접(완전용입/부분용입/
      필릿)·말뚝 등 30여 항목. **값은 전부 원문 이미지** →
      `kcsc_formula('KDS 24 14 31','4.1.4.2')`
      ★건축 기준(KDS 14 31 10)의 φ 가 아니다.
    출력: φ

  - 단계: "4"
    이름: 검토할 부재와 단면제원 확인
    근거: "KDS 24 14 31  4.3"
    작업: 판정
    식위치: >
      계산서 앞에서 입력한 **그 부재의 단면 형상과 치수**를 가져온다.
      단면 형상(H형강 · 원형강관 · 플레이트거더 · 박스거더 …)이 뒤의 분기를 정한다.
    출력: 단면 형상

  - 단계: "5"
    이름: ★단면력 성격 판정 (축력을 보고)
    근거: "KDS 24 14 31  4.4"
    위임근거: "KDS 24 14 31  4.4"
    작업: 판정
    식위치: >
      축력 N 의 **부호와 크기**로 판정하거나 설계자가 직접 고른다.
      N > 0 (인장) · N < 0 (압축) · N ≈ 0 (순수 휨) · N 과 M 이 함께 크면 **조합력**.
      ★조합력이면 인장/압축 트리가 아니라 조합력 트리로 가야 한다(4.4(2)·4.5(2)).
    출력: "인장 / 압축 / 순수 휨 / 조합력"

  - 단계: "6"
    이름: "〔병렬·극한/극단상황〕 강도 검토 — 단면 형상별로 위임"
    근거: "KDS 24 14 31  4.4"
    위임근거: "KDS 24 14 31  4.4"
    작업: 판정
    식위치: >
      4.4(1)·4.5(1)·4.6(1)·4.7(1)·4.8(1) 이 각각 KDS 14 31 10 의 해당 절로 위임한다.
      **단계 5 의 성격 × 단계 4 의 단면 형상**으로 갈 곳이 정해진다.
    분기:
      - {조건: "인장 · H형강", 결과: "KDS 14 31 10 (4.1)",
         다음트리: "인장부재 / H형강 / 하중저항계수설계법 (LRFD)", 다음: "7"}
      - {조건: "압축 · H형강", 결과: "KDS 14 31 10 (4.2)",
         다음트리: "압축부재 / H형강 / 하중저항계수설계법 (LRFD)", 다음: "7"}
      - {조건: "압축 · 원형강관", 결과: "KDS 14 31 10 (4.2)",
         다음트리: "압축부재 / 원형강관 / 하중저항계수설계법 (LRFD)", 다음: "7"}
      - {조건: "인장 · 각형강관", 결과: "KDS 14 31 10 (4.1) — 사례 6",
         다음트리: "인장부재 / 각형강관 / 하중저항계수설계법 (LRFD)", 다음: "7"}
      - {조건: "압축 · 각형강관", 결과: "KDS 14 31 10 (4.2) — 휨좌굴만",
         다음트리: "압축부재 / 각형강관 / 하중저항계수설계법 (LRFD)", 다음: "7"}
      - {조건: "조합력 (압축 + 휨)", 결과: "KDS 14 31 10 (4.4)",
         다음트리: "조합력부재 (압축 + 휨) / H형강 / 하중저항계수설계법 (LRFD)", 다음: "7"}
      - {조건: "조합력 (인장 + 휨)", 결과: "KDS 14 31 10 (4.4)",
         다음트리: "조합력부재 (인장 + 휨) / H형강 / 하중저항계수설계법 (LRFD)", 다음: "7"}
      - {조건: "휨 · 플레이트거더", 결과: "KDS 14 31 10 (4.3.3.1)",
         다음트리: "플레이트거더 / 강교 I형 거더 (합성·비합성) / 한계상태설계법", 다음: "7"}
      - {조건: "휨 · 박스거더", 결과: "4.7 → KDS 14 31 10 (4.3.3.2)",
         다음트리: "박스거더 / 강교 박스거더 (다중·단일 박스, U형) / 한계상태설계법", 다음: "7"}
      - {조건: "★휨 · 원형강관", 결과: "4.8 → KDS 14 31 10 4.3.3.3 (교량용 절 — 건축용 절이 아니다)",
         다음트리: "휨부재 / 기타 휨부재 (강교 — 원형강관·약축 H형·박스형 등) / 한계상태설계법", 다음: "7"}
      - {조건: "휨 · 기타 휨부재", 결과: "KDS 14 31 10 (4.3.3.3)",
         다음트리: "휨부재 / 기타 휨부재 (강교 — 원형강관·약축 H형·박스형 등) / 한계상태설계법", 다음: "7"}
    출력: 공칭강도 Rn

  - 단계: "7"
    이름: "〔병렬·사용〕 사용한계상태 검토"
    근거: "KDS 24 14 31  4.1.2"
    위임근거: "KDS 24 14 31  4.1.2"
    작업: 판정
    식위치: "4.1.2 — KDS 24 10 11(2.5.2.6)·KDS 14 31 10(4.3.3.1.4) 적용.
             하중조합은 KDS 24 12 11 의 **사용한계상태조합 Ⅱ**"
    다음트리: "사용한계상태 / 강교 (처짐·영구처짐)"
    출력: 사용성 판정

  - 단계: "8"
    이름: "〔병렬·피로/파괴〕 피로 및 파괴한계상태 검토"
    근거: "KDS 24 14 31  4.1.3"
    위임근거: "KDS 24 14 31  4.1.3"
    작업: 판정
    식위치: >
      4.1.3 — 피로는 KDS 14 31 20(4), 피로 활하중은 KDS 24 12 21(4.3.2),
      파괴인성은 KDS 14 31 20(4.2). 플레이트거더는 KDS 14 31 10(4.3.3.2.5),
      전단연결재 피로는 KDS 14 31 10(4.3.3.2.10),
      볼트 인장피로는 KDS 14 31 25(4.1.3) — 프라잉력 식 (4.1-1) 포함.
    다음기준: "KDS 14 31 20  4"
    다음트리: "피로파괴한계상태 / 강교 (하중유발·변형유발 피로 + 파괴인성)"
    출력: 피로 판정

  - 단계: "9"
    이름: ★연결부(이음) 검토 — 단면검토가 끝난 뒤
    근거: "KDS 24 14 31  4.9"
    작업: 판정
    식위치: >
      ★★**여기가 「연결부 설계」 단계다.** 실무 순서 그대로 — **부재별 단면검토를 전부
      마친 뒤**, 연결부가 있는 부재에 대해 **연결재가 볼트인지 용접인지에 따라** 설계한다.
      부재가 OK 여도 접합부에서 파괴되면 그 부재는 못 쓴다.
      ★★**연결재 형식은 여기서 한 번만 갈린다.** 부재 트리들은 "연결부가 있다"는 것만
      기록하고 넘긴다 — 부재 트리마다 볼트/용접을 따로 묻지 않는다.
        볼트 → **4.1.3** (`연결부 / 볼트접합`)  ·  용접 → **4.1.2** (`연결부 / 용접접합`)
      한 접합부에 볼트와 용접이 **같이** 있으면 **둘 다** 검토한다 — 배타가 아니다.
      ★★그리고 **연결재 형식과 무관하게 「접합부재 4.1.4」를 반드시** 검토한다([9B]).
    분기:
      - {조건: "★볼트접합", 결과: "4.1.3 — 볼트 검토",
         다음트리: "연결부 / 볼트접합 / 하중저항계수설계법 (LRFD)", 다음: "9B"}
      - {조건: "★용접접합", 결과: "4.1.2 — 용접 검토",
         다음트리: "연결부 / 용접접합 / 하중저항계수설계법 (LRFD)", 다음: "9B"}
      - {조건: "★볼트 + 용접 함께", 결과: "양쪽 모두 검토 (배타 아님)",
         다음트리: "연결부 / 볼트접합 / 하중저항계수설계법 (LRFD)", 다음: "9B"}
      - {조건: "연결부 없음", 결과: "생략", 다음: "10"}
    출력: 연결부 판정

  - 단계: "9B"
    이름: ★★접합부재(거셋플레이트) 검토 — 연결재 형식과 무관하게 필수
    근거: "KDS 14 31 25  4.1.4"
    위임근거: "KDS 24 14 31  4.9"
    작업: 판정
    식위치: >
      **4.1.4 접합부재의 설계강도** — 인장(4.1.4.1) · 전단(4.1.4.2) ·
      **블록전단(4.1.4.3)** · 압축(4.1.4.4).
      ★★**볼트든 용접이든 똑같이 걸린다.** 그래서 연결재 검토와 **별도로 한 번** 한다.
      ★**연결재가 OK 여도 거셋플레이트가 찢기거나 좌굴하면 접합부는 파괴된다.**
      블록전단은 거셋에서 **반드시** 검토한다(4.1.4.3(2)가 "해야 한다"로 못 박는다).
    다음트리: "연결부 / 접합부재 / 하중저항계수설계법 (LRFD)"
    다음: "10"
    출력: 접합부재 검토

  - 단계: "10"
    이름: 바닥판과 바닥틀 (해당하면)
    근거: "KDS 24 14 31  4.10"
    위임근거: "KDS 24 14 31  4.10"
    작업: 산정
    식위치: >
      4.10 — 연직하중을 받는 강재·콘크리트 바닥판과 바닥틀.
      4.10.3 한계상태 · 4.10.5 강재 바닥판 · 4.10.6 콘크리트 바닥판.
      조건을 만족하는 일체 콘크리트 바닥판은 **경험적 설계**를 허용한다(4.10.1(2)).
      ★**부모멘트 구간의 최소 바닥판철근은 KDS 14 31 10 (4.3.3.1.1.7)** 이다.
      거더 단면검토가 아니라 **여기(바닥판 검토)** 에서 다룬다.
    다음기준: "KDS 14 31 10  4.3.3.1.1.7"
    다음트리: "바닥판·바닥틀 / 강교 (콘크리트 바닥판 · 바닥틀 · 단부보)"
    출력: 바닥판 검토

  - 단계: "11"
    이름: 구조형식별 특별 규정 (해당하면)
    근거: "KDS 24 14 31  4.11"
    작업: 판정
    식위치: "4.11.1 중로교·하로교 · 4.11.2 트러스교 · 4.11.3 강바닥판 · 4.11.4 충복아치"
    출력: 구조형식 규정

  - 단계: "12"
    이름: 말뚝 (해당하면)
    근거: "KDS 24 14 31  4.12"
    위임근거: "KDS 24 14 31  4.12"
    작업: 산정
    식위치: >
      4.12 — 말뚝 설계는 KDS 14 31 10(4.5.3) 을 따른다.
      ★**다만 극한한계상태에 대한 저항계수는 4.1.4.2 에 규정된 값으로 한다** —
      기준이 직접 "강도식은 건축, φ 는 교량"을 못 박은 자리다.
    출력: 말뚝 검토

  - 단계: "13"
    이름: 검토(판정)
    근거: "KDS 24 14 31  4.1.1"
    작업: 판정
    식위치: >
      소요강도 ≤ φ·Rn. ★φ 는 단계 3 의 **교량 값**을 쓴다.
      4.1.1(2) — **극한·극단상황·사용·피로 네 한계상태를 모두** 만족해야 한다.
      4.1.1(1) — 건설 중·이동 운반 중·가설 시를 포함해 **가장 큰 응력이 발생할 수 있는
      모든 단계**를 검토한다.
      ※이 트리는 부재 하나에 대한 것이다. 계산서는 **부재마다 한 벌씩** 펼친다.
    출력: "OK / NG (부재별)"

안전주의: >
  ★★**강도식은 KDS 14 31 10, 저항계수 φ 는 KDS 24 14 31 4.1.4.2.**
  4.4·4.5·4.6·4.7·4.8·4.12 가 부재 설계를 KDS 14 31 10 에 명시적으로 위임하므로 강도식은
  공유한다. 그러나 **φ 를 건축 기준에서 가져오면 식이 맞아도 결과가 틀린다.**
  4.12(말뚝)가 그 관계를 문장으로 못 박고 있다 — "…를 따른다. **다만 극한한계상태에 대한
  저항계수는 4.1.4.2에 규정된 값으로 한다.**"

  ★**한계상태 넷은 병렬**이다. 앞이 뒤의 전제가 아니고 모두 만족해야 한다(4.1.1(2)).
  극한만 보고 끝내면 안 된다.
  ★**가설 중·운반 중 단계도 검토 대상**이다(4.1.1(1)). 완성계만 보면 안 된다.

  ★부재 성격은 **축력을 보고** 정한다. 축력과 휨이 함께 크면 인장/압축 트리가 아니라
  **조합력 트리**로 가야 한다(4.4(2)·4.5(2)). 축력만 보고 인장부재로 보내면 조합 효과가
  통째로 빠진다.
  ★**연결부는 단면검토가 끝난 뒤**다. 부재가 OK 여도 이음부에서 파괴되면 못 쓴다.
  ★강재 최소두께 8.0mm(브레이싱·연결판 포함), 압연형강 복부판·폐단면리브 7.0mm 는
  단면제원을 정할 때 먼저 걸리는 제약이다(4.3.3).
  ★수평브레이싱은 **모든 시공단계와 사용단계에서 필요성을 검토**해야 한다(4.3.5(1)).

  하중·하중조합은 교량 계열이다 — KDS 24 12 21(설계하중)·KDS 24 12 11(하중조합).
  건축 기준의 하중조합을 쓰면 안 된다.

