부재: 압축부재
단면: 각형강관 (직사각형·정사각형, 2축대칭)
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 10  # 강구조 부재 설계기준 (하중저항계수설계법) 4.2 압축부재
목표검토: "설계압축강도 φc·Pn  ≥  소요압축강도 Pu"

입력:
  - {기호: B,   설명: 각형강관 외측 폭,               단위: mm}
  - {기호: H,   설명: 각형강관 외측 높이,             단위: mm}
  - {기호: t공칭, 설명: 공칭벽두께,                    단위: mm}
  - {기호: t,   설명: "★설계벽두께 — ERW 0.93×공칭 / SAW 공칭", 단위: mm}
  - {기호: 제조법, 설명: "★전기저항용접 / 서브머지드 아크용접", 단위: "-"}
  - {기호: b,   설명: "플랜지 평판폭 (모서리 반경 제외 순간격, 모르면 B − 3t)", 단위: mm}
  - {기호: h,   설명: "웨브 평판폭 (모르면 H − 3t)",  단위: mm}
  - {기호: Ag,  설명: 총단면적,                       단위: mm^2}
  - {기호: rx,  설명: 강축 단면2차반경,               단위: mm}
  - {기호: ry,  설명: 약축 단면2차반경,               단위: mm}
  - {기호: K,   설명: 유효길이계수,                   단위: "-"}
  - {기호: L,   설명: 부재 길이,                      단위: mm}
  - {기호: Fy,  설명: 강재 항복강도,                  단위: MPa}
  - {기호: E,   설명: 강재 탄성계수,                  단위: MPa}
  - {기호: Pu,  설명: 소요압축강도 (계수하중),        단위: kN}
  - {기호: M,   설명: "휨모멘트 (있으면) — 조합력 판정", 단위: "kN·m"}
  - {기호: T,   설명: "비틀림모멘트 (있으면) — 4.4.3 판정", 단위: "kN·m"}

흐름:
  - 단계: "1"
    이름: 함께 작용하는 하중 확인 (조합·비틀림)
    근거: "KDS 14 31 10  4.4"
    작업: 판정
    식위치: >
      휨이 함께면 **4.4.1.1** 조합력 트리, 비틀림이 함께면 **4.4.3**(폐단면 — 각형강관도
      비틀림을 실제로 받는다). 순수 압축이면 계속.
    분기:
      - {조건: "비틀림이 함께 작용", 결과: "비틀림 트리로",
         다음트리: "비틀림부재 / 원형·각형강관"}
      - {조건: "휨이 함께 작용 (비틀림 없음)", 결과: "조합력 트리로",
         다음트리: "조합력부재 (압축 + 휨) / H형강"}
      - {조건: "순수 압축 (또는 상위 트리에서 Pr 산출용으로 불려옴)", 결과: "이 트리를 계속", 다음: "2"}
    출력: 하중 성격

  - 단계: "2"
    이름: ★★설계벽두께 — 제조법으로 갈린다
    근거: "KDS 14 31 10  4.2.1.1.2"
    작업: 판정
    식위치: >
      4.2.1.1.2(1)④ — **전기저항용접(ERW) 각형강관은 공칭벽두께의 0.93배**,
      서브머지드 아크용접(SAW)은 공칭 그대로가 **설계벽두께 t** 다.
      폭두께비·단면적·단면2차반경 전부 이 t 로 계산한다.
      ★★**공칭두께로 계산하면 ERW 에서 7% 과대평가.** 원형강관·H형강 압축 트리에
      없는 각형강관 고유 규정이다.
      평판폭 b·h 는 **내측 모서리 반경을 뺀 순간격**, 모르면 **외측 치수 − 3t**.
    분기:
      - {조건: "전기저항용접(ERW)",       결과: "t = 0.93 × 공칭", 다음: "3"}
      - {조건: "서브머지드 아크용접(SAW)", 결과: "t = 공칭",        다음: "3"}
    출력: "설계벽두께 t · 평판폭 b · h"

  - 단계: "3"
    이름: 유효길이·세장비
    근거: "KDS 14 31 10  4.2.2"
    작업: 계산
    식위치: >
      4.2.2 — 유효세장비 KL/r. ★각형강관은 **강축·약축의 r 이 다르다**(정사각형만 같다) —
      **KL/r 을 양축에 대해 구해 큰 쪽**을 쓴다. 좌굴길이가 축마다 다르면 각각.
      세장비 상한(권장 200 등)은 4.2.2 원문 확인.
    출력: "KL/r (지배축)"

  - 단계: "4"
    이름: ★단면의 세장판 분류 — 플랜지·웨브 각각
    근거: "KDS 14 31 10  4.2.1.1.3 + 표 4.2-2"
    작업: 판정
    식위치: >
      표 4.2-2 — **「균일한 두께를 갖는 각형강관과 박스의 벽」** 항의 λr(양연지지판)로
      **b/t 와 h/t 를 각각** 판정한다. **하나라도 λr 을 넘으면 세장판 단면**이다.
      ★표 4.2-1 의 각형강관 행 — 한계상태는 **휨좌굴만**(비세장판) /
      **국부좌굴 + 휨좌굴**(세장판). **비틀림좌굴·휨비틀림좌굴은 없다** — 2축대칭
      폐단면이라 비틀림강성이 크다(원형강관과 같은 사정, H형강과 다르다).
    분기:
      - {조건: "b/t · h/t 모두 ≤ λr (비세장판)", 결과: "4.2.3 휨좌굴", 다음: "5"}
      - {조건: "하나라도 > λr (세장판)",         결과: "4.2.7 세장판요소", 다음: "6"}
    출력: 단면 분류

  - 단계: "5"
    이름: 휨좌굴에 대한 압축강도 (비세장판)
    근거: "KDS 14 31 10  4.2.3"
    작업: 산정
    식위치: >
      4.2.3 — 임계응력 Fcr 은 KL/r 구간(비탄성/탄성)에 따라 두 식(원문 이미지 —
      `kcsc_formula('KDS 14 31 10','4.2.3')`). Pn = Fcr·Ag.
      ★H형강·원형강관 압축 트리와 **같은 절**이다 — 각형강관 고유의 것은 [2]·[4] 다.
    다음: "7"
    출력: Pn(휨좌굴)

  - 단계: "6"
    이름: ★세장판 단면의 압축강도 — 유효폭
    근거: "KDS 14 31 10  4.2.7"
    작업: 산정
    식위치: >
      4.2.7 — 세장판 단면은 **유효단면적 Ae** 로 강도를 구한다: **식 (4.2-18)** Pn = Fcr·Ae.
      (2)① **원형강관을 제외한 세장판 부재**의 유효폭 be — **식 (4.2-19)/(4.2-20)**
      (λ 와 한계 λr·Fy/Fcr 의 관계로 두 구간, 유효폭 불완전 조정계수 c1·c2 는 표 4.2-4).
      Ae = Ag − Σ(b − be)·t (감소분을 뺀다).
      ★**원형강관과 다른 갈래다** — 원형강관은 (2)② 의 별도 식(4.2-24). 각형강관은
      **판요소별 유효폭**으로 간다. 플랜지·웨브 각각 유효폭을 구해 합산.
      Fcr 은 4.2.3 로 계산한 임계응력(각형강관은 비틀림좌굴 없음).
    출력: Pn(세장판)

  - 단계: "7"
    이름: 공칭압축강도 결정
    근거: "KDS 14 31 10  4.2.1 + 표 4.2-1"
    작업: 판정
    식위치: "표 4.2-1 각형강관 행 — 해당 한계상태(휨좌굴 / 국부좌굴+휨좌굴) 중 최솟값"
    출력: Pn

  - 단계: "8"
    이름: 설계압축강도 산정
    근거: "KDS 14 31 10  4.2.1"
    작업: 계산
    식위치: "설계압축강도 = φc·Pn. 저항계수 φc 는 원문 (★교량이면 KDS 24 14 31 4.1.4.2)"
    출력: φcPn

  - 단계: "9"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.2.1"
    작업: 판정
    식위치: >
      Pu ≤ φc·Pn 이면 OK.
      ★**NG 면 여기서 끝난다.** 단면 변경은 계산서에서 설계자가 한다.
      **후행작업은 OK 인 경우에만.**
    출력: "OK / NG"

  - 단계: "10"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 10  4.2"
    작업: 판정
    식위치: >
      **배타 선택이 아니라 체크리스트**다 — 해당하는 것을 **모두** 검토한다.
        □ **이음·연결부**가 있는가 (볼트/용접 불문) → [11]
      해당 없으면 그대로 종료한다.
    출력: 해당 항목 목록

  - 단계: "11"
    이름: ★연결부 있음 — 「연결부 설계」 단계로 (해당하면)
    근거: "KDS 14 31 10  4.2.1"
    작업: 판정
    식위치: >
      ★★**여기서는 「연결부가 있다」는 것만 기록한다.** 실무 순서 — 부재별 단면검토를
      전부 마친 뒤 「연결부 설계」 단계(진입 트리 `강교 부재 / 전체` 의 [9])에서
      볼트/용접을 한 번만 갈라 처리한다.
      ★**부재가 OK 여도 접합부에서 파괴되면 그 부재는 못 쓴다.**
    출력: "연결부 있음 (형식은 연결부 설계 단계에서)"

  - 단계: "12"
    이름: 종료
    근거: "KDS 14 31 10  4.2.1"
    작업: 판정
    식위치: "부재 검토와 해당하는 후행작업이 모두 끝났다"
    출력: "OK"

안전주의: >
  ★★★**설계벽두께 0.93배(ERW)** — 4.2.1.1.2(1)④. 각형강관 고유의 덫이고,
  압축에서는 **폭두께비·Ag·r 전부**에 퍼진다. 제조법은 밀시트에서 확인.
  ★★**한계상태는 휨좌굴(+ 세장판이면 국부좌굴)뿐** — 표 4.2-1 각형강관 행.
  **비틀림좌굴·휨비틀림좌굴이 없다**(2축대칭 폐단면). H형강 압축 트리의 4.2.4 를
  끌어오면 없는 검토를 넣는 것이다.
  ★★**세장판 분류는 플랜지·웨브 각각** — 하나라도 λr 초과면 세장판. 그때는
  **판요소별 유효폭(4.2-19/20)** 으로 Ae 를 구한다 — 원형강관의 (4.2-24)와 다른 갈래.
  ★**강축·약축 r 이 다르다**(정사각형 제외) — KL/r 은 큰 쪽, 좌굴길이가 축마다
  다르면 각각.
  ★평판폭 = 모서리 반경 제외 순간격, 모르면 외측 −3t.
  ★비틀림 동반이면 4.4.3.1(각형강관 항) — 폐단면이라 실제로 받는다.
  식·λr·표 4.2-4 는 원문 이미지 — `kcsc_formula('KDS 14 31 10','4.2.7')` 등.
  ★교량이면 φ 는 KDS 24 14 31 4.1.4.2. ★철도교는 이 트리의 적용 범위 밖 — 철도교 안건이면 멈추고 원문을 볼 것.

검증일: "2026-08-06"
검증기준:
  "KDS 143110": "2024"
검증: 설계자확정
