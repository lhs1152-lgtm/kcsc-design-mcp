부재: 응력검토
단면: H형강 (강교 — 가로보·세로보·브레이싱·지주) — 보도교 ASD, KDS 14 30 10
설계법: 허용응력설계법
근거: KDS 14 30 10  # 강구조 부재 설계기준(허용응력설계법) — 인장 4.3 · 압축 4.4 · 휨 4.5 · 조합력 4.6 · 국부좌굴 4.1.6
목표검토: "H형강 부부재의  작용응력 ≤ 허용응력 × 보정계수(1.00) × 증가계수  — 인장·압축·휨·전단·조합력 전부"

입력:
  - {기호: 부재역할, 설명: "가로보 / 세로보 / 브레이싱 / 지주 — 힘의 성격(인장·압축·휨·조합)과 좌굴길이가 다르다", 단위: "-"}
  - {기호: P,   설명: 축방향력 (사용하중),            단위: N}
  - {기호: M,   설명: "휨모멘트 (사용하중, 강축 Mx · 약축 My)", 단위: "N·mm"}
  - {기호: V,   설명: 전단력 (사용하중),              단위: N}
  - {기호: bf,  설명: "플랜지 폭 (비구속요소 폭 b = bf/2 — 4.1.6.1(2)①)", 단위: mm}
  - {기호: tf,  설명: 플랜지 두께,                    단위: mm}
  - {기호: h,   설명: "복부 순높이 (플랜지 사이, 필렛 제외 — 4.1.6.1(3)①)", 단위: mm}
  - {기호: tw,  설명: 복부 두께,                      단위: mm}
  - {기호: d,   설명: 전체 높이 (전단면적 d·tw 에 쓴다 — 4.5.3.1(2)①), 단위: mm}
  - {기호: K,   설명: "좌굴길이계수 — ★기본값 1.0, 접합방법(핀/강접·가새 유무)에 따라 설계자가 수정 (4.2.2)", 단위: "-"}
  - {기호: L,   설명: "부재 길이 (KL = 좌굴길이, 강·약축 각각)", 단위: mm}
  - {기호: r,   설명: "단면2차반경 (강·약축 각각 — KL/r 양축)", 단위: mm}
  - {기호: Lb,  설명: "압축플랜지 횡방향 비지지길이 (횡좌굴 — 4.5.2.1)", 단위: mm}
  - {기호: rT,  설명: "압축플랜지 + 압축 복부 1/3 의 복부축 단면2차반경 (4.5-8/9)", 단위: mm}
  - {기호: Cb,  설명: "모멘트 구배 계수 (M1/M2, 단·복곡률 부호 — 4.5.2.1(3)②)", 단위: "-"}
  - {기호: Fy,  설명: "★판두께 구간별 항복점 — 허용응력 트리(14 30 05 표 3.3-1)에서", 단위: MPa}
  - {기호: 증가계수, 설명: "조합별 허용응력 증가계수 — 하중조합 트리(KDS 24 12 10 준용)", 단위: "-"}

흐름:
  - 단계: "1"
    이름: ★적용 확인 — 보도교 H형강 부부재, KDS 14 30 10 체계 (원형강관 거더와 같은 갈래)
    근거: "KDS 14 30 10  4.5.1"
    작업: 판정
    식위치: >
      ★★설계자 확정(2026-08-17): 보도교 ASD 는 **원형강관 거더도 H형강 부부재도 전부 KDS 14 30 10
      갈래**로 검토한다 — 구판(KDS 24 14 30 표 4.2-2 등가세장비 틀)은 그 기준이 원문 1.1 에서
      「철도교」 기준이라 뺐다. **24 의 허용응력 값을 여기 섞지 않는다.**
      **4.5.1(4)** — "건축물 이외의 **일반강구조물**의 허용휨응력은 4.5.2~4.5.7 의 허용응력에
      KDS 14 30 05 의 4.2 에 규정된 **구조물별 보정계수와 하중조합별 보정계수를 곱한 값**" →
      보도교 = 일반강구조물: **보정계수 1.00**(허용응력 트리) × **조합별 증가계수(24 12 10 준용,
      하중조합 트리)**. 이 곱이 이 트리 전 단계의 「× 증가계수」다.
      대상 — 가로보·세로보·브레이싱·지주 등 보도교의 H형강 부부재.
      ★주거더급 조립 I형(복부 판폭두께비가 4.5.1(3) 한계 초과)은 **4.5.6 플레이트거더** —
      원형강관 거더 보도교엔 보통 없다. 있으면 원문으로.
    분기:
      - {조건: "가로보·세로보·브레이싱·지주 등 H형강 부부재", 결과: "이 트리", 다음: "2"}
      - {조건: "복부 판폭두께비 큰 조립 I형 (플레이트거더급)", 결과: "14 30 10 4.5.6 (인장역작용·보강재) — 트리 없음, 원문", 다음기준: "KDS 14 30 10  4.5.6", 다음: "2"}
      - {조건: "⛔철도교 · 도로교(자동차) 안건",           결과: "이 트리의 적용 범위 밖 / KDS 에 ASD 근거 없음 — 멈춘다", 다음: "13"}
    출력: 적용 확인

  - 단계: "2"
    이름: 재료·허용응력 체계 — Fy(판두께)·보정계수·증가계수를 받아 온다
    근거: "KDS 14 30 10  4.1.1"
    작업: 판정
    식위치: >
      `허용응력 / 구조용 강재·용접부 (보도교 ASD)` 트리에서 — **Fy 는 판두께 구간**(14 30 05
      표 3.3-1: SM355 = 355/345/335/…), 보정계수 1.00, 조합별 증가계수(온도 1.15·풍 1.25·
      지진 1.55·충돌 1.60·가설 1.25·주하중만 1.0).
      ★이 트리의 허용응력 식은 **전부 Fy 로 쓰인다** — 판두께 구간을 틀리면 전 항목이 틀린다.
    다음트리: "허용응력 / 구조용 강재·용접부"
    다음: "3"
    출력: "Fy · 보정계수 · 증가계수"

  - 단계: "3"
    이름: 세장비 제한·지지점 구속 — 24 와 값도 성격도 다르다
    근거: "KDS 14 30 10  4.1.8"
    작업: 판정
    식위치: >
      **4.1.8** — 압축부재 KL/r 은 **가급적 200** 이하, 인장부재 L/r 은 **가급적 300** 이하
      (강봉·강대·매달린 부재 제외). ★**「가급적」= 권장**이다.
      ★★구판(KDS 24 14 30 표 4.1-1)의 **주압축재 100 / 부압축재 120 / 인장재 200 「원칙」**
      과 값·성격이 다르다 — 이 트리에서는 200/300 권장. 브레이싱을 24 습관으로 120 에
      맞춰 굵게 잡을 필요는 없지만, **조직 실무 상한이 따로 있으면 그것이 우선**(설계자).
      **4.1.7** — 보·트러스는 지지점에서 재축 회전이 구속되어야 한다(가로보 단부 상세).
      **4.1.5** — 전체·각 압축부재 안정성, 변형에 의한 하중 영향(2차 효과) 고려.
    출력: "세장비 적합 여부 (권장)"

  - 단계: "4"
    이름: ★단면 분류 — 조밀 / 비조밀 / 세장 (표 4.1-1)
    근거: "KDS 14 30 10  4.1.6"
    작업: 판정
    식위치: >
      **4.1.6.1** — 압축요소 폭두께비로 **조밀 / 비조밀 / 세장판** 단면을 가른다(표 4.1-1 의
      λp·λr — **값은 이미지**, `kcsc_formula('KDS 14 30 10','4.1.6')`).
      폭의 정의(글자): H형강 **플랜지 b = 전체 공칭폭의 1/2**(비구속요소, (2)①) /
      **복부 h = 필렛을 뺀 플랜지 사이 순간격**(구속요소, (3)①).
      ★이 분류가 **허용휨응력의 등급**을 정한다 — 조밀 0.66Fy / 비조밀 0.6Fy·식 / 세장은
      **4.1.6.2 "국부좌굴을 고려하여 설계"** 한 줄뿐(감소식 없음).
      ★★**세장판 단면이면 이 트리로 값이 안 나온다** — 압연 H형강은 거의 조밀·비조밀이니
      세장이면 단면을 바꾸는 것이 실무. (24 14 30 표 4.4-3 완화식을 끌어오지 않는다.)
      ★24 의 "플랜지 = 자유돌출판(SM355 → 10.5) / 복부 = 양연지지판(32)" 대응은 **여기 표
      4.1-1 로 대체** — 숫자가 다르다, 섞지 말 것.
    분기:
      - {조건: "조밀 (플랜지·복부 모두 λ ≤ λp)",  결과: "휨 0.66Fy 후보 (Lb 조건 별도)", 다음: "5"}
      - {조건: "비조밀 (λp < λ ≤ λr 요소 있음)",  결과: "휨 0.6Fy · 식 4.5-4~6 갈래",   다음: "5"}
      - {조건: "세장판 (λ > λr 요소 있음)",       결과: "★국부좌굴 고려(4.1.6.2) — 감소식 없음, 단면 변경 권고 · 설계자 판단", 다음: "5"}
    출력: 단면 분류

  - 단계: "5"
    이름: 단면력 성격 판정 — 검토 경로
    근거: "KDS 14 30 10  4.6.1"
    작업: 판정
    식위치: >
      부재에 걸리는 힘의 성격으로 경로가 정해진다. 축력과 휨이 **동시**면 4.6(조합력)이
      걸린다 — 인장·압축·휨 각각의 허용응력을 먼저 구하고 [10] 상관식으로 간다.
    분기:
      - {조건: "인장 (브레이싱 인장재 등)",        결과: "4.3 허용인장응력",             다음: "6"}
      - {조건: "압축 (지주·압축 브레이싱)",       결과: "4.4 허용압축응력 (좌굴)",      다음: "7"}
      - {조건: "휨 + 전단 (가로보·세로보)",       결과: "4.5 허용휨·전단응력",          다음: "8"}
      - {조건: "축력 + 휨 (지주 편심·가로보 축력)", 결과: "4.6 조합력 — 각 허용응력 산정 후 상관식", 다음: "6"}
    출력: 검토 경로

  - 단계: "6"
    이름: 인장 — 4.3 (총단면 / 유효순단면 두 값)
    근거: "KDS 14 30 10  4.3.2"
    작업: 산정
    식위치: >
      **4.3.2(1)** — 허용인장응력 Ft 는 **총단면적에 대해 하나, 유효순단면적에 대해 하나**
      (식은 이미지 — Fy 기반 / Fu 기반). 둘 다 만족.
      순단면적 4.1.3 · **유효순단면적 4.1.4**(연결 형태에 따른 감소 — 편측 연결 ㄱ형강·플랜지만
      볼트 연결된 H형강이 여기 걸린다).
      **4.3.2(2)** — 접합부 단부 **블록전단은 KDS 14 30 25 4.5** 로 확인(연결 트리).
      **4.3.1** — 중심축 인장, 하중축 = 도심축. 편심이면 4.6.
      ★24 14 30 의 "인장 = 순단면 기준 표값" 과 틀이 다르다 — 여기는 두 값 비교.
    분기:
      - {조건: "축력 + 휨",  결과: "4.6.3 (식 4.6-5)로", 다음: "10"}
      - {조건: "인장만",     결과: "ft ≤ Ft × 증가계수",  다음: "11"}
    출력: "Ft (총단면 · 유효순단면)"

  - 단계: "7"
    이름: ★압축 — 4.4.3 허용압축응력 (한계세장비 기준 2구간)
    근거: "KDS 14 30 10  4.4.3"
    작업: 산정
    식위치: >
      **4.4.3(1)** — 허용압축응력 Fa 는 KL/r 이 **한계세장비 Cc**(= √(2π²E/Fy) — 기호 정의는
      글자) 이하이면 **식 4.4-1**(비탄성 — 안전율이 세장비에 따라 변한다), 초과이면 **식 4.4-2**
      (탄성 — 오일러/안전율). 식은 이미지 — `kcsc_formula('KDS 14 30 10','4.4.3')`.
      **좌굴길이 KL** — **4.2.2**: 가새·전단벽 등으로 횡적 안정이 확보된 골조·트러스는
      **K = 1.0**(해석으로 더 작게 가능) / 강접 비가새골조는 **해석값, 1.0 이상**.
      ★★**설계자 확정(2026-08-17): K 는 기본값 1.0 으로 두고, 접합방법(핀·강접·가새 유무)에
      따라 설계자가 수정한다.** 계산서에 K 와 그 근거(접합 상세)를 적는다 — 비가새 강접
      골조인데 1.0 을 그대로 두면 위험측(4.2.2.2 는 1.0 이상 요구).
      ★**KL/r 은 강축·약축 양쪽** — 좌굴길이가 축마다 다르면(브레이싱 면내·면외 지지 간격)
      큰 쪽이 지배. 약축이 보통 지배하지만 확인.
      **4.4.1** — 조밀·비조밀 균일단면, 하중축 = 도심축. 세장판요소면 4.1.6(값 없음).
      **4.4.4** — 휨비틀림좌굴은 1축대칭(ㄱ·T)·비대칭·얇은 판 십자형에 "고려" — **2축대칭
      H형강 압연재는 보통 해당 없음**. 조립 얇은 판이면 설계자 판단.
      ★24 14 30 표 4.2-2(a) 의 3구간 값(215/215−1.47(λ−7.5)/785,000/λ²)을 여기 넣지 않는다.
    분기:
      - {조건: "축력 + 휨",  결과: "4.6.2 (식 4.6-1~3)로", 다음: "10"}
      - {조건: "압축만",     결과: "fa ≤ Fa × 증가계수",    다음: "11"}
    출력: "Fa (KL/r · Cc 구간)"

  - 단계: "8"
    이름: "★휨 — 4.5.2 허용휨응력 (강축은 단면 분류 + Lb, 약축은 Lb 무관)"
    근거: "KDS 14 30 10  4.5.2"
    작업: 산정
    식위치: >
      **4.5.2.1 강축휨 H형강** —
        (1) 조밀 + **Lb ≤ Lc**(식 4.5-2·4.5-3 중 작은 값) → **식 4.5-1**(0.66Fy 계열)
        (2) 비조밀 플랜지·조밀 복부 압연형강 → 식 4.5-4 / 비조밀 플랜지 조립 → 4.5-5 /
            그 밖 비조밀(Lb ≤ Lc) → 4.5-6 (하이브리드는 ③)  — 전부 Lb ≤ Lc 조건
        (3) **Lb > Lc** (조밀·비조밀 공통):
            인장측 → 식 4.5-7 (0.6Fy 계열)
            압축측 → **식 4.5-8 또는 4.5-9(Lb/rT 구간)와 식 4.5-10(플랜지 항) 중 큰 값,
            단 0.6Fy 초과 불가**. rT = 압축플랜지 + 압축 복부 1/3 의 복부축 단면2차반경,
            Cb = M1/M2 로 정하는 모멘트 구배 계수(단곡률 −, 복곡률 +; 캔틸레버·구간 내
            모멘트가 단부보다 크면 Cb = 1.0 취지 — 원문 (3)② 글자).
      **4.5.2.2 약축휨 H형강** — **Lb 제한 없음**: 조밀 4.5-11 / 플랜지 비조밀 4.5-12 /
