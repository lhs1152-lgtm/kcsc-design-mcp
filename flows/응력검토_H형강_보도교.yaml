안전주의: >
  ★★★**허용응력설계법이다.** 검토는 응력 비교, 하중은 사용하중. 「강도」·γ·φ 는
  존재하지 않는 개념이다.

  ★★★**KDS 14 30 10 갈래로 통일 — 24 14 30 값·틀을 섞지 않는다**(설계자 확정 2026-08-17).
  섞이기 쉬운 자리 넷: ①압축 — 24 표 4.2-2(a) 3구간 값 ✗ → 4.4.3 Cc 2구간 식 ②강축 휨
  횡좌굴 — 24 등가세장비 l/b·Aw/Ac ✗ → **Lb/rT·Cb** ③국부좌굴 — 24 표 4.4-1 숫자(10.5/32)
  ✗ → 표 4.1-1 λp/λr ④조합력 — 24 4.3.3 4식+좌굴검토 ✗ → 4.6 상관식. LRFD 의 Lp·Lr·Cb 도
  이름만 같고 식이 다르다.

  ★★**Fy 는 판두께 구간**(허용응력 트리) — 이 트리의 모든 식이 Fy 로 쓰인다.
  ★★**세장비 제한이 24 와 다르다** — 여기는 압축 200 / 인장 300 「가급적」(권장). 24 의
  100/120/200 원칙을 습관으로 강제하지 말되, 조직 상한이 있으면 그것이 우선.
  ★★**세장판 단면이면 이 트리로 값이 안 나온다**(4.1.6.2 감소식 없음) — 단면 변경이 실무.
  ★**KL/r 은 양축**, 좌굴길이가 축마다 다르면 큰 쪽. **K 는 기본 1.0, 접합방법에 따라
  설계자가 수정** — 비가새 강접이면 1.0 이상(4.2.2.2).
  ★**전단면적 정의가 h/tw 구간마다 다르다**(d·tw vs h·tw). 가로보 지점부·재하점은 **4.5.7
  집중하중** 검토 — 보강재 한 쌍(≥ d/2)이면 일부 면제.
  ★조합력은 **4.6-1 과 4.6-2 둘 다**, fa/Fa ≤ 0.15 이면 4.6-3.
  ★4.5.1(4) — 일반강구조물의 허용휨응력에 **보정계수(1.00) × 조합별 증가계수(24 12 10
  준용)** 를 곱한다. 14 30 05 5.2 의 1.33 은 쓰지 않는다(허용응력 트리).
  ★식은 전부 이미지 — 값의 최종 확인은 `kcsc_formula('KDS 14 30 10', 절번호)`.
  ★철도교는 이 트리의 적용 범위 밖이다 — 철도교 안건이면 멈추고 원문을 볼 것.

