부재: 바닥판·바닥틀
단면: 강교 (콘크리트 바닥판 · 바닥틀 · 단부보)
설계법: 한계상태설계법
근거: KDS 24 14 31  # 강교 설계기준(한계상태설계법) 4.10 바닥판과 바닥틀
목표검토: "한계상태별 요구(사용·피로·극한·극한하중) 만족 + 합성·단부·부모멘트 철근 상세"

입력:
  - {기호: 바닥판종류, 설명: "콘크리트 / 강재 격자 / 강바닥판 / 조합", 단위: "-"}
  - {기호: 설계법선택, 설명: "★경험적 설계 (KDS 24 14 21 4.6.5.2 조건 충족) / 해석적 설계", 단위: "-"}
  - {기호: S,   설명: "바닥판 지지부재의 중심간 거리 (처짐 한계 기준)", 단위: mm}
  - {기호: 보도부, 설명: "없음 / 있음 / 매우 중요 — 처짐 한계 3단계", 단위: "-"}
  - {기호: 합성여부, 설명: "지지부재와 합성 (원칙) / 비합성",  단위: "-"}
  - {기호: 부모멘트, 설명: "연속교 부모멘트 구간이 있는가 — 최소 철근 규정", 단위: "-"}
  - {기호: 부대시설, 설명: "연석·난간·방호울타리·분리대 (연속 여부)", 단위: "-"}
  - {기호: 거더수, 설명: "여러 거더 위 / 단일 지지 — 피로 검토 여부", 단위: "-"}

흐름:
  - 단계: "1"
    이름: 적용 범위·설계 방식 선택
    근거: "KDS 24 14 31  4.10.1"
    작업: 판정
    식위치: >
      4.10.1 — 연직하중을 받는 강재·콘크리트·조합 바닥판과 바닥틀. 바닥판과 지지구조는
      **연속·합성**이 바람직(3)(4).
      ★(2) — **규정된 조건을 만족하는 일체 콘크리트 바닥판은 「경험적 설계」를 허용** —
      해석 없이 설계한다. 조건은 **KDS 24 14 21(4.6.5.2)**.
      ★4.10.3.1(2) — 경험적 설계 규정을 만족하면 **사용성·피로·파괴·극한 요구를 모두
      만족한 것으로 가정**하고 4.10.3 의 다른 조항을 안 봐도 된다.
    분기:
      - {조건: "★경험적 설계 조건 충족 (KDS 24 14 21 4.6.5.2)", 결과: "한계상태 검토 생략 가능 — 상세로", 다음: "5"}
      - {조건: "해석적 설계",                                   결과: "4.10.3 한계상태 전부", 다음: "2"}
    출력: 설계 방식

  - 단계: "2"
    이름: 해석·하중
    근거: "KDS 24 14 31  4.10.4"
    작업: 판정
    식위치: >
      4.10.4.1 — 근사적 탄성방법(KDS 24 10 11 4.6.2) / 개선된 방법(4.6.11.2) /
      경험적 설계 중 택일. 하중·위치·타이어 접지면적·조합은 KDS 24 12 21·24 12 11.
      ★4.10.3.1(1) — **콘크리트 부대시설의 구조적 역할은 사용·피로에서만 고려**,
      **극한(강도)·극한하중에서는 고려하지 않는다.** 난간을 강도에 넣으면 위험측.
    다음트리: "하중조합 / 도로교"
    다음: "3"
    출력: 해석 방법·하중

  - 단계: "3"
    이름: ★사용한계상태 — 처짐 3단계
    근거: "KDS 24 14 31  4.10.3.2"
    작업: 판정
    식위치: >
      4.10.3.2 — 바닥구조·바닥틀을 **전체 탄성 구조**로 해석. 충격 포함 설계트럭 하중의
      허용처짐(글자):
        보도부 없음 → **S/800**
        보도부 있음 → **S/1,000**
        보도부가 매우 중요 → **S/1,200**
      (S = 바닥판 지지부재 중심간 거리)
      ★거더 사용한계상태(L/800·L/1,000)와 **기준 길이가 다르다** — 여기는 지지부재
      **간격 S**, 거더는 **지간 L**. 섞지 말 것.
    출력: 처짐 검토

  - 단계: "4"
    이름: 피로·극한·극한하중
    근거: "KDS 24 14 31  4.10.3"
    작업: 판정
    식위치: >
      4.10.3.3 피로 — ★**콘크리트 바닥판은 피로 검토 불요**(1). 강재 격자·강바닥판은
        4.10.5. **여러 거더 위에 있지 않은 콘크리트 바닥판은 KDS 24 14 21(4.3) 피로 검토**(3).
      4.10.3.4 극한 — 탄성 또는 비탄성 해석, KDS 24 14 21·24 14 31 조항 만족.
      4.10.3.5 극한하중 — **차량하중과 난간 하중으로부터 전달되는 힘**에 대해 설계.
      콘크리트 바닥판 본체 설계는 **KDS 24 14 21(4.6.5)**(4.10.6) — 콘크리트 기준.
    출력: 한계상태 검토

  - 단계: "5"
    이름: ★합성·연결 — 전단연결재
    근거: "KDS 24 14 31  4.10.2.1"
    작업: 판정
    식위치: >
      4.10.2.1(1) — 바닥판은 특별한 사유가 없는 한 지지부재와 **합성**시킨다.
      비합성이라도 **수직 분리를 막기 위해 연결**해야 한다.
      **전단연결재는 완전 합성작용을 가정하여 설계**하고, 상세는 KDS 14 31 10(4.3.3.1.10)
      → `전단연결재 / 합성거더` 트리.
      (2) 바닥판-부대시설·다른 구조요소 간 힘의 영향도 고려.
    다음트리: "전단연결재 / 합성거더 (스터드·ㄷ형강)"
    다음: "6"
    출력: 합성·연결

  - 단계: "6"
    이름: ★부모멘트 구간의 최소 바닥판철근 (연속교)
    근거: "KDS 14 31 10  4.3.3.1.1.7"
    위임근거: "KDS 24 14 31  4.10"
    작업: 판정
    식위치: >
      4.3.3.1.1.7(1) — 계수시공하중에 의한 바닥판 교축방향 인장응력이 **φ·fr(파괴계수)**
      를 넘으면 **교축방향 철근 ≥ 바닥판 총단면적의 1%**.
      상세(글자) — 철근 **fy ≥ 400 MPa** · **D19 이하** · 전폭에 **2단 등간격, 2/3 를
      위쪽** · 간격 **≤ 300 mm**.
      (2) — 전단연결재 없는 부모멘트 구간이면 **철근을 정모멘트 구간까지 연장**.
      ★바닥판 철근검토는 플레이트거더 트리가 아니라 바닥판 트리 쪽에서 다룬다 —
      하신 그 자리다 — 여기가 그 트리다.
    출력: 최소 철근 검토

  - 단계: "7"
    이름: 단부 지지·배수·부대시설·거푸집
    근거: "KDS 24 14 31  4.10.2"
    작업: 판정
    식위치: >
      4.10.2.4 — 단부 끝이 윤하중을 지지하도록 설계되지 않았으면 **단부보로 보강**.
        단부보는 바닥판과 **합성 또는 일체**, 유효폭 고려한 보로 설계(KDS 24 10 11 4.6.2).
      4.10.2.2 — 횡·종구배는 KDS 24 10 11(2.6.6), 배수 공간의 구조적 영향 고려.
      4.10.2.3 — 연석·난간·방호울타리·분리대는 **구조적으로 연속**이 좋다.
      ★4.10.2.5 — **캔틸레버부에는 합성되지 못하는 존치거푸집 사용 금지.**
    출력: 상세 적합 여부

  - 단계: "8"
    이름: 검토(판정)
    근거: "KDS 24 14 31  4.10.3"
    작업: 판정
    식위치: >
      선택한 설계 방식의 요구(경험적 조건 / 한계상태 4종)와 합성·최소철근·단부·상세가
      모두 만족하면 OK. ★**NG 면 여기서 끝난다.**
    출력: "OK / NG"

  - 단계: "9"
    이름: 종료
    근거: "KDS 24 14 31  4.10.1"
    작업: 판정
    식위치: "바닥판·바닥틀 검토가 끝났다. 강바닥판·격자는 4.10.5 — 원문 확인."
    출력: "OK"

안전주의: >
  ★★★**경험적 설계는 조건부 면제다** — KDS 24 14 21(4.6.5.2) 조건을 만족해야
  한계상태 검토를 생략할 수 있다(4.10.3.1(2)). 조건 확인 없이 "경험적"으로 넘기면 안 된다.
  ★★**부대시설(난간 등)의 구조적 역할은 사용·피로에서만** — 극한(강도)·극한하중에
  넣으면 위험측(4.10.3.1(1)).
  ★★**바닥판 처짐 한계의 기준 길이는 지지부재 간격 S** — 거더의 지간 L 과 다르다.
  3단계(S/800·S/1,000·**S/1,200**)이고 "보도부가 매우 중요"면 가장 엄격.
  ★★**부모멘트 구간 최소 철근**(4.3.3.1.1.7) — 총단면 1%, fy≥400, D19 이하, 2단·2/3 상단,
  ≤300 mm. 연결재 없는 구간이면 정모멘트 구간까지 연장.
  ★콘크리트 바닥판은 피로 불요 — 단 **여러 거더 위에 있지 않으면** 피로 검토(4.10.3.3(3)).
  ★캔틸레버부 비합성 존치거푸집 금지(4.10.2.5). 단부보는 합성/일체.
  ★콘크리트 바닥판 본체 설계는 KDS 24 14 21(4.6.5) — 콘크리트 기준 소관.
  ★철도교는 이 트리의 적용 범위 밖 — 철도교 안건이면 멈추고 원문을 볼 것.

검증일: "2026-08-06"
검증기준:
  "KDS 241431": "2018"
  "KDS 143110": "2024"
검증: 설계자확정
