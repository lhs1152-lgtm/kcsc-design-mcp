부재: 응력검토
단면: 브레이싱·다이아프램 (강교) — 보도교 ASD, KDS 14 30 10 (배치·간격은 24 14 30 4.7 준용)
설계법: 허용응력설계법
근거: KDS 14 30 10  # 강구조 부재 설계기준(허용응력설계법) 4.8.2.2.4 브레이싱 · 4.2.2 골조 안정성 · 4.1.7 지지점 구속 — 배치·설계하중·간격은 KDS 24 14 30 4.7 을 조직 규정으로 준용
목표검토: "브레이싱·다이아프램의 배치·간격·설계하중을 정하고, 부재는 H형강/원형강관 트리(14 30 10)로  작용응력 ≤ 허용응력 × 증가계수"

입력:
  - {기호: 구조형식, 설명: "상로 / 하로 · 거더(원형강관·I형) / 트러스 · 직선 / 곡선", 단위: "-"}
  - {기호: L,   설명: 지간,                                   단위: m}
  - {기호: bf,  설명: "거더 압축플랜지 폭 (I형 — 간격 한계 20bf)",  단위: mm}
  - {기호: w,   설명: "박스 복부판 중심간격 (박스 — 4w)",         단위: mm}
  - {기호: Pc,  설명: "압축현재(플랜지) 격간 좌우 압축력 합 (1% 격간 전단력)", 단위: N}
  - {기호: 부재, 설명: "브레이싱 부재 형강(H·ㄱ·ㄷ·강관) — 부재 검토는 H형강/원형강관 트리", 단위: "-"}
  - {기호: 증가계수, 설명: "조합별 허용응력 증가계수 — 하중조합 트리(KDS 24 12 10 준용)", 단위: "-"}

흐름:
  - 단계: "1"
    이름: ★적용 확인 — 부재는 KDS 14 30 10, 배치·간격·설계하중은 24 14 30 4.7 준용
    근거: "KDS 14 30 10  4.8.2.2.4"
    작업: 판정
    식위치: >
      **4.8.2.2.4(1)** — 수평·수직·교문브레이싱은 주 트러스(거더)와 함께 교량이 **입체적 기능을
      유지할 수 있도록 충분한 강성**을 가져야 하고 배치가 적당해야 한다. **(2)** 교차 부재의
      교점은 **연결**한다.
      ★★KDS 14 30 10 은 브레이싱에 대해 **이 두 문장뿐**이다 — 설계하중(1% 격간력)·간격 한계·
      하부수평브레이싱 생략 조건·지점부 단수직·교문브레이싱 규정이 없다. 그래서 그 부분은
      **KDS 24 14 30 4.7 을 조직 규정으로 준용**한다(75%·현장용접 90% 와 같은 방식 — ★설계자
      확정 2026-08-17 "준용 OK"). 부재 자체의 응력검토는 14 30 10(H형강 트리·원형강관 트리).
      **4.1.7** — 보·트러스는 지지점에서 재축 회전이 구속되어야 한다(지점부 브레이싱·다이아프램의
      역할). **4.2.2.1** — 가새로 횡적 안정이 확보된 골조는 K = 1.0 — 브레이싱이 이 조건을 만든다.
    분기:
      - {조건: "보도교 브레이싱·다이아프램 (거더 사이 수평·수직, 지점부)", 결과: "이 트리", 다음: "2"}
      - {조건: "⛔철도교(제동트러스 등) · 도로교(자동차) 안건", 결과: "이 트리의 적용 범위 밖 — 멈춘다", 다음: "9"}
    출력: 적용 확인

  - 단계: "2"
    이름: 배치 원칙 — 어디에 무엇을 두는가 (24 14 30 4.7.3 준용)
    근거: "KDS 24 14 30  4.7.3"
    위임근거: "KDS 14 30 10  4.8.2.2.4"
    작업: 판정
    식위치: >
      4.7.3(1) — 교량거더에는 **상부·하부 수평브레이싱 설치가 원칙**. 하로플레이트거더 → 하부만.
      폐상식으로 충분히 강한 바닥틀이 있으면 간략화.
      ★생략 조건(2) — 적당한 수직브레이싱·다이아프램이 있는 **상로 거더**에서 **직선 지간 ≤ 16 m /
      곡선 지간 ≤ 12 m** 이면 하부수평브레이싱 생략 가능(수치 글자).
      ★원형강관 거더 2본 보도교 — 거더 사이 수평브레이싱(상·하)과 지점부·중간 수직브레이싱
      (다이아프램)이 대상. 강관의 비틀림 강성이 커도 **횡하중 전달 경로**는 만들어야 한다.
    분기:
      - {조건: "생략 조건 해당 (상로, 직선≤16 m / 곡선≤12 m)", 결과: "하부 생략 가능", 다음: "3"}
      - {조건: "그 밖",  결과: "상·하부 배치 원칙대로", 다음: "3"}
    출력: 배치 계획

  - 단계: "3"
    이름: 부재 구성의 원칙 (24 14 30 4.7.2 준용 + 14 30 10 4.8.2.2.4(2))
    근거: "KDS 24 14 30  4.7.2"
    위임근거: "KDS 14 30 10  4.8.2.2.4"
    작업: 판정
    식위치: >
      4.7.2 — 수평브레이싱·다이아프램에는 **조합부재 또는 형강**, 부재가 교차하면 **교점을 연결**
      (14 30 10 4.8.2.2.4(2) 와 같은 요구). **길이가 긴 브레이싱 부재에는 가능한 한 충복 단면**.
      (제동트러스 4.7.4 는 철도 문맥 — 범위 밖.)
    출력: 부재 형식

  - 단계: "4"
    이름: ★설계하중 — 압축현재(플랜지) 압축력의 1% 격간 전단력 (24 14 30 4.7.3 준용)
    근거: "KDS 24 14 30  4.7.3"
    위임근거: "KDS 14 30 10  4.8.2.2.4"
    작업: 계산
    식위치: >
      4.7.3(3) — 트러스 **압축현재 간의 수평브레이싱**은 규정 하중(풍 등) 외에 **해당 격간 좌우
      현재 압축력 합계의 1% 격간 전단력**에 저항하도록 설계.
      ★★**이 격간 전단력은 「주하중」** — 증가계수 없이(1.0) 받는다. 분류를 놓치면 1.25 배 이득을
      잘못 취한다. 거더교에서는 압축플랜지(원형강관 상부)의 압축력으로 같은 취지 적용(설계자).
      ★14 30 10 에는 이 하중 규정이 없다 — 준용임을 계산서에 명시.
    출력: "브레이싱 설계하중 (풍 등 + 1% 격간력)"

  - 단계: "5"
    이름: ★중간수직브레이싱·다이아프램의 간격 — 이 간격이 H형강 트리의 Lb 다 (24 14 30 4.7.5 준용)
    근거: "KDS 24 14 30  4.7.5"
    위임근거: "KDS 14 30 10  4.8.2.2.4"
    작업: 판정
    식위치: >
      4.7.5 — 간격 한계(수치 글자): 트러스 → 가능한 한 각 격점 / **I형 상로 거더 → 압축플랜지 폭의
      20배 이하** / 박스 상로 → 복부판 중심간격의 4배 이하 / ★어느 경우에도 **8 m 이하**.
      ★★14 30 10 체계에서 이 간격은 **가로보·거더의 횡좌굴 비지지길이 Lb**(H형강 트리 4.5.2.1
      — Lb ≤ Lc 이면 0.66Fy, 넘으면 Lb/rT·Cb 식)로 바로 들어간다. 원형강관 거더는 횡좌굴 항목이
      없지만(원형강관 트리) 가로보·H형강 부부재에는 걸린다. 간격을 넓히면 허용휨응력이 깎인다.
      (무도상 바닥틀 5.5 m 는 철도 문맥 — 범위 밖.)
    출력: "간격 s ≤ min(20·bf 또는 4·w, 8 m) = Lb"

  - 단계: "6"
    이름: 지점부 단수직브레이싱·다이아프램 (24 14 30 4.7.6 준용 + 14 30 10 4.1.7)
    근거: "KDS 24 14 30  4.7.6"
    위임근거: "KDS 14 30 10  4.1.7"
    작업: 판정
    식위치: >
      4.7.6 — 상로 거더·트러스의 지점부에는 **상부수평브레이싱에 작용하는 전 횡하중을 지점에
      전달**하는 단수직브레이싱 또는 다이아프램을 설치하는 것이 원칙. 14 30 10 4.1.7 "보·트러스는
      지지점에서 재축에 대해 회전하지 않도록" — 같은 자리다.
      ★횡하중 **전달 경로를 완성하는 부재** — 중간브레이싱과 역할이 다르다. 원형강관 거더의
      지점부는 격점부 링보강재·다이아프램(14 30 10 4.8.1.6, 원형강관 트리)과 함께 본다.
    출력: 지점부 브레이싱

  - 단계: "7"
    이름: 교문브레이싱 · 병렬거더 연결 (해당하면 — 24 14 30 4.7.7 · 4.7.8 준용)
    근거: "KDS 24 14 30  4.7.7"
    위임근거: "KDS 14 30 10  4.8.2.2.4"
    작업: 판정
    식위치: >
      4.7.7 — 하로트러스(및 유사)에는 **교문브레이싱**으로 상현재의 전 횡하중을 지점에 전달, 가급적
      큰 니브레이스. 상로 구조면 해당 없음.
      4.7.8 — 병렬거더의 횡방향 연결은 **충분한 강성 + 휨·비틀림 영향을 적게 받는 힌지 구조** —
      강성은 키우되 구속은 푼다(강결이면 과도한 응력).
    출력: 교문브레이싱 · 병렬거더 연결

  - 단계: "8"
    이름: 브레이싱 부재의 응력검토 — H형강 / 원형강관 트리 (14 30 10)
    근거: "KDS 14 30 10  4.2.2"
    작업: 판정
    식위치: >
      브레이싱 부재 자체는 압축·인장(교차 X 형은 인장재로 보는 것이 원칙 — 24 14 30 4.2.2(3)다
      취지)으로 **H형강 트리(4.3~4.6, 세장비 200/300 권장, K 기본 1.0)** 또는 원형강관 트리로
      검토. 4.2.2.1 — 이 브레이싱 덕에 골조 K = 1.0 이 성립한다.
      ★교차 부재의 교점 연결(4.8.2.2.4(2)) 이 좌굴길이를 반으로 만든다 — 연결이 없으면 전 길이.
      연결부는 연결 트리(14 30 25 + 75%·현장 90% 조직 규정).
    다음트리: "응력검토 / H형강 (강교 — 가로보·세로보·브레이싱·지주)"
    다음: "9"
    출력: 부재 검토

  - 단계: "9"
    이름: 검토(판정) · 종료
    근거: "KDS 14 30 10  4.8.2.2.4"
    작업: 판정
    식위치: >
      배치(상·하부·지점부·교문) · 간격(≤ min(20bf|4w, 8 m)) · 설계하중(풍 등 + 1% 격간력, 주하중)
      · 부재 응력(H형강/원형강관 트리) · 연결까지 만족하면 OK. **NG 면 여기서 끝난다** — 배치·
      단면 변경은 설계자. [1] 에서 범위 밖으로 판정된 경우는 원문·다른 체계로.
    출력: "OK / NG"

안전주의: >
  ★★★**허용응력설계법이다.** 검토는 응력 비교, 하중은 사용하중. 「강도」·γ·φ 는 존재하지
  않는 개념이다.

  ★★★**KDS 14 30 10 은 브레이싱에 두 문장뿐**(4.8.2.2.4 — 충분한 강성·적당한 배치·교점 연결).
  배치·설계하중(1% 격간력)·간격 한계·생략 조건·지점부·교문브레이싱은 **KDS 24 14 30 4.7 을
  조직 규정으로 준용**(설계자 확정 2026-08-17 — 24 14 30 은 철도교 기준이지만 75%·현장 90% 와
  같은 방식). 계산서에 "KDS 24 14 30 4.7 준용(조직 규정)" 명시. 개정되면 검사기가 ❌ 로 잡는다.
  ★★**1% 격간 전단력은 주하중** — 증가계수 없이. ★★**중간 브레이싱 간격 = H형강 부재의 Lb** —
  14 30 10 4.5.2.1 횡좌굴 식에 바로 들어간다. 간격을 넓히면 허용휨응력이 깎인다.
  ★하부수평브레이싱 생략은 조건부(상로 직선 ≤ 16 m / 곡선 ≤ 12 m). ★지점부는 횡하중 전달 경로 —
  원형강관 거더면 격점부 링보강재(4.8.1.6)와 함께. ★교차 부재 교점은 연결(좌굴길이 반).
  ★철도 문맥(제동트러스·무도상 5.5 m)은 범위 밖. 철도교 안건이면 멈추고 원문을 볼 것.

검증일: "2026-08-17"
검증기준:
  "KDS 143010": "2024"
  "KDS 241430": "2019"
검증: 설계자확정
