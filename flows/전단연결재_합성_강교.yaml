부재: 전단연결재
단면: 합성거더 (스터드·ㄷ형강)
설계법: 한계상태설계법
근거: KDS 24 14 31  # 강교 설계기준(한계상태설계법) 4.6 플레이트거더 → KDS 14 31 10 4.3.3.1.10 전단연결재
위임근거: "KDS 24 14 31  4.6"
목표검토: "피치 p ≤ 피로 요구 (식 4.3-192)  ·  개수 n ≥ 강도 요구 (식 4.3-205)  ·  배치 상세"

입력:
  - {기호: 연결재형태, 설명: "스터드 / ㄷ형강",           단위: "-"}
  - {기호: d,   설명: "스터드 직경 (★높이/직경 ≥ 4)",     단위: mm}
  - {기호: n,   설명: "한 단면 내 배치된 전단연결재 개수", 단위: 개}
  - {기호: p,   설명: 거더 축방향 피치,                  단위: mm}
  - {기호: Vf,  설명: "피로하중조합 하의 수직전단력 발생범위", 단위: N}
  - {기호: Q,   설명: "단기 합성단면 중립축에 대한 바닥판 환산단면 단면1차모멘트", 단위: mm^3}
  - {기호: I,   설명: "단기 합성단면의 단면2차모멘트",     단위: mm^4}
  - {기호: N,   설명: "하중반복회수 (KDS 14 31 20 4.1.2.5)", 단위: 회}
  - {기호: 선형, 설명: "★직선 / 곡선 (사각 20° 기준) — 반경방향 피로전단 0 처리 여부", 단위: "-"}
  - {기호: 교량형식, 설명: "단순 / 연속(부모멘트부 합성·비합성) / 곡선 연속", 단위: "-"}
  - {기호: P,   설명: "총 공칭전단력 (4.3.3.1.10.4(2))",  단위: N}

흐름:
  - 단계: "1"
    이름: 위임 경로·설치 구간
    근거: "KDS 14 31 10  4.3.3.1.10.1"
    위임근거: "KDS 24 14 31  4.6"
    작업: 판정
    식위치: >
      KDS 24 14 31 4.10.2.1 — 바닥판은 지지부재와 **합성시키고**, 전단연결부 상세는
      **KDS 14 31 10(4.3.3.1.10)** 을 따른다.
      4.3.3.1.10.1(2)~(4) — 설치 구간:
        단경간 → **지간 전체** / 직선 연속교 → **전체 길이** (보통)
        부모멘트 영역 — 교축방향 철근을 합성단면 일부로 고려하면 설치. 아니면 생략
          가능하되 ★**영구하중 변곡점 구간에는 추가 연결재**(4.3.3.1.10.3).
        **곡선 연속교 → 반드시 전체 길이.**
      ★부모멘트부에 연결재를 안 두면 **교축방향 철근을 정모멘트 구간까지 연장**
      (4.3.3.1.1.7(2)).
    출력: 설치 구간

  - 단계: "2"
    이름: 형태·상세 제한 — 수치가 글자다
    근거: "KDS 14 31 10  4.3.3.1.10.1"
    위임근거: "KDS 24 14 31  4.6"
    작업: 판정
    식위치: >
      (5) 형태 — 콘크리트를 철저히 다질 수 있는 형태, **모든 방향의 이동에 저항**.
        ★**스터드 높이/직경 ≥ 4.0** · ㄷ형강은 **5 mm 이상 필릿용접**.
      (6)④ 피치 — **600 mm 이하, 직경의 6배 이상**.
      (7) 횡방향 — 스터드 중심 간격 **직경의 4배 이상**, 플랜지 연단과 순연단거리
        **25 mm 이상**.
      (8) 덮개·관입 — 원문 확인.
    출력: 상세 제한 적합 여부

  - 단계: "3"
    이름: ★피로한계상태 — 피치가 지배한다
    근거: "KDS 14 31 10  4.3.3.1.10.2"
    위임근거: "KDS 24 14 31  4.6"
    작업: 산정
    식위치: >
      4.3.3.1.10.1(6)② — 피치는 **식 (4.3-192)** p ≤ n·Zr / Vsr 를 만족해야 한다.
        Vsr = 수평방향 피로전단력 범위 = **종방향(4.3-194: Vf·Q/I)** 과 **반경방향
        (4.3-195 또는 4.3-196 중 큰 값)** 의 벡터합(4.3-193).
        ★★③ — **직선교 또는 사각 ≤ 20° 곡선교는 반경방향 항을 0** 으로 할 수 있다.
        곡선교는 반경방향이 실제로 걸린다 — 빼먹으면 위험측.
      4.3.3.1.10.2 — 연결재 1개의 전단피로강도 Zr:
        스터드 — 무한수명 **식 (4.3-197)** / 그 밖 **식 (4.3-198)**(N 함수, 4.3-199)
        ㄷ형강 — 무한수명 **식 (4.3-200)** / 그 밖 **식 (4.3-201)**(4.3-202)
      ★N 은 KDS 14 31 20(4.1.2.5) 의 반복회수 — 피로 트리와 같은 뿌리.
    다음트리: "피로파괴한계상태 / 강교 (하중유발·변형유발 피로 + 파괴인성)"
    다음: "4"
    출력: "피로 요구 피치 p"

  - 단계: "4"
    이름: 영구하중 변곡점 구간 (연속교, 해당하면)
    근거: "KDS 14 31 10  4.3.3.1.10.3"
    위임근거: "KDS 24 14 31  4.6"
    작업: 산정
    식위치: >
      4.3.3.1.10.3 — 부모멘트부에 연결재를 두지 않는 연속교에서 **영구하중에 의한
      휨모멘트 부호가 변하는 변곡점 구간에 추가 연결재**를 둔다(개수·배치 식은 원문).
      ★[1] 에서 "부모멘트부 생략"을 골랐으면 여기가 **필수**다.
    출력: 변곡점 추가 연결재

  - 단계: "5"
    이름: ★강도한계상태 — 개수가 지배한다
    근거: "KDS 14 31 10  4.3.3.1.10.4"
    위임근거: "KDS 24 14 31  4.6"
    작업: 산정
    식위치: >
      **식 (4.3-204)** — 연결재 1개의 설계전단강도 Qr = φsc·Qn (φsc 는 ★교량 값 —
      KDS 24 14 31 4.1.4.2).
      **식 (4.3-205)** — 최소개수 n ≥ P / Qr.
      총 공칭전단력 P (4.3.3.1.10.4(2)) — 단순교·비합성 부모멘트 연속교는 **최대
      정모멘트(활하중+충격) 지점과 인접 모멘트 0 점 사이 구간**에서 **식 (4.3-206)** —
      바닥판 총 종방향 전단력은 **콘크리트 측과 강재 측 중 작은 값**(원문 두 식).
      곡선교는 반경방향 성분을 합산(원문). Qn 은 4.3.3.1.10.4(3).
      ★★**피치(피로)와 개수(강도)는 별개 요구**다 — 둘 다 만족해야 한다.
      피로로 촘촘히 박아도 개수가 모자랄 수 있고, 그 반대도 있다.
    출력: "강도 요구 개수 n"

  - 단계: "6"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.3.3.1.10.1"
    위임근거: "KDS 24 14 31  4.6"
    작업: 판정
    식위치: >
      피치 ≤ 피로 요구(4.3-192) **그리고** 개수 ≥ 강도 요구(4.3-205) **그리고**
      상세 제한(600 mm·6d·4d·25 mm·h/d≥4)이 모두 만족하면 OK.
      ★**NG 면 여기서 끝난다.** 배치 변경은 계산서에서 설계자가 한다.
    출력: "OK / NG"

  - 단계: "7"
    이름: 종료
    근거: "KDS 24 14 31  4.10.2"
    작업: 판정
    식위치: >
      전단연결재 검토가 끝났다. 바닥판 쪽은 `바닥판·바닥틀 / 강교` 트리,
      거더 본체는 `플레이트거더 / 강교` 트리와 병렬.
    출력: "OK"

안전주의: >
  ★★★**피치(피로)와 개수(강도)는 별개 요구다** — 식 (4.3-192)로 피치를, 식 (4.3-205)로
  개수를 각각 만족해야 한다. 한쪽만 보고 배치하면 안 된다.
  ★★**곡선교(사각 > 20°)는 반경방향 피로전단(4.3-195/196)이 실제로 걸린다** —
  직선교 감각으로 0 처리하면 위험측. 곡선 연속교는 **전체 길이에 연결재 필수**.
  ★★**부모멘트부에 연결재를 안 두면 두 가지가 딸려온다** — 변곡점 구간 추가 연결재
  (4.3.3.1.10.3) + 교축방향 철근의 정모멘트 구간 연장(4.3.3.1.1.7(2)).
  ★상세 제한이 글자다 — 스터드 **h/d ≥ 4** · 피치 **≤ 600 mm, ≥ 6d** · 횡간격 **≥ 4d** ·
  연단 **≥ 25 mm** · ㄷ형강 필릿 **≥ 5 mm**.
  ★총 공칭전단력은 **콘크리트 측/강재 측 중 작은 값**(4.3-206) — 큰 값을 쓰면 과설계,
  방향이 헷갈리면 안 된다.
  ★φsc 는 **KDS 24 14 31 4.1.4.2** 의 값. 식은 원문 이미지 —
  `kcsc_formula('KDS 14 31 10','4.3.3.1.10.1')` 등.
  ★철도교는 이 트리의 적용 범위 밖 — 철도교 안건이면 멈추고 원문을 볼 것.

검증일: "2026-08-06"
검증기준:
  "KDS 241431": "2018"
  "KDS 143110": "2024"
검증: 설계자확정
