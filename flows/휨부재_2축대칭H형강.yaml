부재: 휨부재
단면: 2축대칭 H형강 (강축 휨)
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 10  # 강구조 부재 설계기준 (하중저항계수설계법) 4.3 휨부재
목표검토: "설계휨강도 φb·Mn  ≥  소요휨강도 Mu   (전단은 φv·Vn ≥ Vu 별도)"

입력:
  - {기호: Zx,  설명: 강축 소성단면계수,        단위: mm^3}
  - {기호: Sx,  설명: 강축 탄성단면계수,        단위: mm^3}
  - {기호: bf,  설명: 플랜지 폭,                단위: mm}
  - {기호: tf,  설명: 플랜지 두께,              단위: mm}
  - {기호: h,   설명: 웨브 순높이,              단위: mm}
  - {기호: tw,  설명: 웨브 두께,                단위: mm}
  - {기호: Lb,  설명: 횡지지 사이 비지지길이,   단위: mm}
  - {기호: Cb,  설명: 횡비틀림좌굴 보정계수,    단위: "-"}
  - {기호: Fy,  설명: 강재 항복강도,            단위: MPa}
  - {기호: E,   설명: 강재 탄성계수,            단위: MPa}
  - {기호: Mu,  설명: 소요휨강도(계수하중),     단위: kN·m}
  - {기호: Vu,  설명: 소요전단강도(계수하중),   단위: kN}
  - {기호: N,   설명: "축력 (있으면) — 조합력 판정에 쓴다", 단위: kN}

흐름:
  # ★조합 여부를 **맨 앞에서** 묻는다(인장·압축 트리와 같은 이유).
  #   축력이 함께 작용하면 순수 휨 흐름을 타면 안 된다.
  #   ※조합력 트리가 **Mr 산출을 위해** 이 트리를 불러온 경우에는 이미 조합력 쪽에 있으므로
  #     이 분기를 건너뛰고 [2] 부터 돈다.
  - 단계: "1"
    이름: 축력이 함께 작용하는지 확인
    근거: "KDS 14 31 10  4.4.1"
    작업: 판정
    식위치: >
      4.4.1.1(압축+휨) · 4.4.1.2(인장+휨) — 축력이 함께 작용하면 상관식으로 검토해야 한다.
      비틀림까지 함께면 4.4.3 이다.
    분기:
      - {조건: "축력 함께 — 압축", 결과: "조합력 트리로",
         다음트리: "조합력부재 (압축 + 휨)"}
      - {조건: "축력 함께 — 인장", 결과: "조합력 트리로",
         다음트리: "조합력부재 (인장 + 휨)"}
      - {조건: "순수 휨 (또는 조합력 트리에서 Mr 산출용으로 불려옴)",
         결과: "이 트리를 계속", 다음: "2"}

  - 단계: "2"
    이름: 횡비틀림좌굴 보정계수 Cb 산정
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 계산
    식위치: "식 (4.3-1) — 모멘트분포로 산정. 안전측으로 1.0 사용 가능(원문 (2)항 단서 확인)"
    출력: Cb

  - 단계: "3"
    이름: 단면 분류 (폭두께비)
    근거: "KDS 14 31 10  4.3.2.1.1.1 + 표 4.3-1 + 표 4.3-2"
    작업: 판정
    식위치: >
      표 4.3-1 단면 종류 · 표 4.3-2 폭두께비 한계값 λp·λr (원문 이미지).
      ★표 4.3-1 이 **절마다 한계상태**를 함께 적고 있다 — 그것을 따라간다.
    분기:
      - {조건: "웨브·플랜지 모두 조밀단면", 결과: "4.3.2.1.1.2 — 항복·횡비틀림좌굴", 다음: "4"}
      - {조건: "웨브 조밀 + 플랜지 비조밀 또는 세장",
         결과: "4.3.2.1.1.3 — 횡비틀림좌굴·플랜지 국부좌굴", 다음: "4P"}
      - {조건: "세장판 웨브 (1축 또는 2축대칭)", 결과: "4.3.2.1.1.5 로",
         다음트리: "휨부재 / 세장판웨브 H형강"}
      - {조건: "★약축 휨이다", 결과: "4.3.2.1.1.6 으로",
         다음트리: "휨부재 / 약축 H형강"}
      - {조건: "★1축대칭(비정형) H형강이다", 결과: "4.3.2.1.1.4 로",
         다음트리: "휨부재 / 1축대칭 H형강"}

  - 단계: "4"
    이름: 조밀단면 — 소성모멘트와 횡비틀림좌굴
    근거: "KDS 14 31 10  4.3.2.1.1.2"
    작업: 산정
    식위치: >
      식 (4.3-2) Mp = Fy·Zx. 한계길이 Lp 식 (4.3-6), Lr 식 (4.3-7), rts 식 (4.3-8).
      ★한계상태: **항복 · 횡비틀림좌굴** (표 4.3-1).
      조밀단면이므로 **플랜지 국부좌굴은 산정하지 않는다.**
    분기:
      - {조건: "Lb ≤ Lp",       결과: "횡비틀림좌굴 고려 불필요 (Mn = Mp)", 다음: "5"}
      - {조건: "Lp < Lb ≤ Lr",  결과: "비탄성 횡비틀림좌굴 — 식 (4.3-3)",    다음: "5"}
      - {조건: "Lb > Lr",       결과: "탄성 횡비틀림좌굴 — 식 (4.3-4)",      다음: "5"}
    출력: Mn

  - 단계: "4P"
    이름: 플랜지 비조밀·세장단면
    근거: "KDS 14 31 10  4.3.2.1.1.3"
    작업: 산정
    식위치: >
      4.3.2.1.1.3 — 웨브가 조밀하고 플랜지가 비조밀·세장인 2축대칭 H형강.
      ★한계상태: **횡비틀림좌굴 · 플랜지 국부좌굴** (표 4.3-1).
      조밀단면(4.3.2.1.1.2)과 달리 **플랜지 국부좌굴이 추가로 걸린다.**
    출력: Mn

  # 「기타 H형강(1축대칭)」·「약축」·「세장판 웨브」는 이 트리에서 다루지 않는다.
  # 단계 3 의 분기가 각각의 트리로 넘긴다 — 조항이 다르면 트리도 다르다.

  - 단계: "5"
    이름: 설계휨강도 산정
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 계산
    식위치: "4.3.2.1.1.1(1) — 설계휨강도 = φb·Mn. 저항계수 φb 값은 원문
             (★교량이면 KDS 24 14 31 4.1.4.2 의 값)"
    출력: φbMn

  - 단계: "6"
    이름: ★전단강도 — 인장역작용을 쓸 것인가
    근거: "KDS 14 31 10  4.3.2.1.2.1"
    작업: 판정
    식위치: >
      4.3.2.1.2.1(2)① — 전단강도는 **두 가지 방법**으로 산정한다.
        가. 4.3.2.1.2.2 — 후좌굴강도(**인장역작용**)를 **이용하지 않고** 산정
        나. 4.3.2.1.2.3 — **인장역작용을 고려**하여 산정
      ★저항계수도 다르다 — 4.3.2.1.2.1(2)② 에 단서가 붙어 있다
      (4.3.2.1.2.2(1)②가 의 경우는 다른 값).
      ★인장역작용은 **적용 조건이 까다롭다.** 조건을 확인하지 않고 쓰면 위험측이다.
    분기:
      - {조건: "인장역작용 미고려 (보수적)", 결과: "4.3.2.1.2.2 적용", 다음: "7"}
      - {조건: "인장역작용 고려",             결과: "4.3.2.1.2.3 적용", 다음: "7"}
    출력: 전단 산정 방법

  - 단계: "7"
    이름: 전단강도 산정
    근거: "KDS 14 31 10  4.3.2.1.2.2"
    작업: 산정
    식위치: "선택한 방법으로 공칭전단강도 Vn 을 구하고 φv·Vn 을 산정한다.
             (인장역작용을 쓰면 4.3.2.1.2.3)"
    출력: φvVn

  - 단계: "8"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: >
      Mu ≤ φb·Mn 이고 Vu ≤ φv·Vn 이면 OK.
      ★**NG 면 여기서 끝난다.** 단면을 바꿔 다시 도는 것은 계산서에서 설계자가 하는 일이다.
      **후행작업은 OK 인 경우에만** 이어진다.
    출력: "OK / NG"

  - 단계: "9"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 10  4.3"
    작업: 판정
    식위치: >
      **배타 선택이 아니라 체크리스트**다 — 해당하는 것을 **모두** 검토한다.
        □ **이음·연결부**가 있는가 (볼트/용접 불문) → [10]
      해당 없으면 그대로 종료한다.
    출력: 해당 항목 목록

  - 단계: "10"
    이름: ★연결부 있음 — 「연결부 설계」 단계로 (해당하면)
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: >
      ★★**여기서는 「연결부가 있다」는 것만 기록한다.** 실무 순서가 그렇다 —
      **부재별 단면검토를 전부 마친 뒤** 「연결부 설계」 단계에서 처리한다.
      연결재가 **볼트냐 용접이냐**는 거기서 **한 번만** 갈린다
      (진입 트리 `강교 부재 / 전체` 의 [9]).
        볼트 → 4.1.3 `연결부 / 볼트접합`   ·   용접 → 4.1.2 `연결부 / 용접접합`
      그리고 **연결재 형식과 무관하게 접합부재 4.1.4** (`연결부 / 접합부재`) 를 **반드시**.
      ★**부재가 OK 여도 접합부에서 파괴되면 그 부재는 못 쓴다.**
    출력: "연결부 있음 (형식은 연결부 설계 단계에서)"

  - 단계: "11"
    이름: 종료
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: "부재 검토와 해당하는 후행작업이 모두 끝났다"
    출력: "OK"

안전주의: >
  ★이 트리는 **강축 휨 · 2축대칭 H형강** 전용이다. 약축 휨은 4.3.2.1.1.6,
  1축대칭(비정형) H형강은 4.3.2.1.1.4, 세장판 웨브는 4.3.2.1.1.5 로 흐름이 갈린다 —
  단면을 잘못 분류하면 적용 조항 자체가 틀린다.
  ★**한계상태가 절마다 다르다**(표 4.3-1).
    4.3.2.1.1.2 조밀단면      — 항복 · 횡비틀림좌굴 (플랜지 국부좌굴 없음)
    4.3.2.1.1.3 플랜지 비조밀 — 횡비틀림좌굴 · **플랜지 국부좌굴**
  조밀단면 흐름을 비조밀에 그대로 쓰면 국부좌굴이 통째로 빠진다.
  ★**전단은 인장역작용 여부로 조항이 갈린다**(4.3.2.1.2.1(2)①).
  4.3.2.1.2.2(미고려) / 4.3.2.1.2.3(고려)이고 **저항계수도 다르다**(4.3.2.1.2.1(2)② 단서).
  인장역작용은 적용 조건이 까다롭다 — 조건을 확인하지 않고 쓰면 위험측이다.
  Lp·Lr·Cb·φb 등 실제 값·식은 반드시 원문에서 확인할 것(모두 이미지).
  ★교량에 쓸 때는 저항계수를 **KDS 24 14 31 4.1.4.2** 에서 가져온다.
  교량용 거더(플레이트거더·박스거더)는 4.3.3 을 따로 따른다 — 이 트리가 아니다.

