부재: 인장부재
단면: 원형강관 (슬롯 거셋플레이트 용접접합)
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 10  # 강구조 부재 설계기준 (하중저항계수설계법) 4.1 인장부재
목표검토: "설계인장강도 φt·Pn  ≥  소요인장강도 Pu"

입력:
  - {기호: D,   설명: 원형강관의 외경,          단위: mm}
  - {기호: t,   설명: 원형강관의 두께,          단위: mm}
  - {기호: Ag,  설명: 총단면적,                 단위: mm^2}
  - {기호: An,  설명: "순단면적 (★슬롯이면 Ag − 슬롯 전체 단면적)", 단위: mm^2}
  - {기호: A슬롯, 설명: "슬롯의 전체 단면적 (양쪽 두 군데)", 단위: mm^2}
  - {기호: Ae,  설명: 유효순단면적,             단위: mm^2}
  - {기호: U,   설명: "전단뒤짐계수 (★원형강관은 표 4.1-1 사례 5 또는 1)", 단위: "-"}
  - {기호: l,   설명: "접합(용접) 길이 — 사례 5 의 U 산정에 쓰임", 단위: mm}
  - {기호: L,   설명: 부재 길이,                단위: mm}
  - {기호: r,   설명: "단면2차반경 (원형강관은 전 방향 동일)", 단위: mm}
  - {기호: Fy,  설명: 강재 항복강도,            단위: MPa}
  - {기호: Fu,  설명: 강재 인장강도,            단위: MPa}
  - {기호: Pu,  설명: 소요인장강도(계수하중),   단위: kN}
  - {기호: 적용구분, 설명: "★건축·일반 강구조 / 교량 강구조 (세장비 제한이 다르다)", 단위: "-"}

흐름:
  - 단계: "1"
    이름: 인장 + 휨 조합인지 확인
    근거: "KDS 14 31 10  4.4.1.2"
    작업: 판정
    식위치: "4.4.1.2 — 휨이 함께 작용하면 상관식으로 검토해야 한다"
    분기:
      - {조건: "휨이 함께 작용", 결과: "조합력 트리로 넘어간다",
         다음트리: "조합력부재 (인장 + 휨) / H형강"}
      - {조건: "순수 인장 (또는 조합력 트리에서 Tr 산출용으로 불려옴)",
         결과: "이 트리를 계속", 다음: "2"}

  - 단계: "2"
    이름: 세장비 검토 — 제한을 보이고 설계자가 판단
    근거: "KDS 14 31 10  4.1.1"
    작업: 판정
    식위치: >
      계산서에 **제한값을 명시**하고 설계자가 보고 판단하게 한다. 기계적으로 막지 않는다.
      **건축·일반 강구조** (4.1.1(1)) — 최대 세장비 제한은 없다. 인장력에 기초해 설계되는
        부재의 L/r 은 **가급적 300 이하**(권장).
      **교량 강구조** (4.1.1(2)) — 아이바·봉강·케이블·판을 제외한 **모든 인장부재에 실제
        제한**이 걸린다. ① 교번응력을 받는 주부재 ② 교번응력을 받지 않는 주부재
        ③ 2차 부재 — 각각 다른 한계값이며 **값은 원문 이미지**다.
      ★**원형강관은 단면2차반경이 전 방향으로 같다.** H형강처럼 약축 r 을 따로 찾을
      필요가 없다 — 세장비가 방향에 무관하다.
    출력: "세장비 L/r · 적용한 제한 · 판단 근거"

  - 단계: "3"
    이름: ★순단면적 산정 — 슬롯 강관은 전용 규정이 있다
    근거: "KDS 14 31 10  4.1.2.2"
    작업: 계산
    식위치: >
      ★★**4.1.2.2(3)** — **"거셋플레이트에 슬롯이 있는 강관을 용접하는 경우 강관의
      순단면적은 총단면적에서 슬롯의 전체 단면적을 뺀 것으로 한다."**
      → **An = Ag − A슬롯**. 볼트구멍 공제식 (4.1-1)·(4.1-2) 가 아니다.
      ★**"슬롯의 전체 단면적"** 이다 — 슬롯은 관을 **양쪽으로 관통**하므로 **두 군데**가
      잘린다. 한 군데만 빼면 위험측이다.
      ★4.1.2.2(4) — 플러그용접·슬롯용접을 가로지르는 순단면적 계산에서 **용접재는
      포함하지 않는다.** 용접으로 메웠다고 단면을 되살리면 안 된다.
      ★볼트접합이면 (3) 이 아니라 (1) 의 구멍 공제식을 쓴다.
      ★4.1.2.2(5) — 볼트구멍이 없으면 An = Ag.
    분기:
      - {조건: "슬롯 거셋플레이트 용접", 결과: "4.1.2.2(3) — An = Ag − A슬롯", 다음: "4"}
      - {조건: "볼트접합",              결과: "4.1.2.2(1)(2) 구멍 공제",      다음: "4"}
      - {조건: "구멍·슬롯 없음",         결과: "4.1.2.2(5) — An = Ag",       다음: "4"}
    출력: An

  - 단계: "4"
    이름: ★유효순단면적 — 원형강관은 표의 사례가 다르다
    근거: "KDS 14 31 10  4.1.2.3 + 표 4.1-1"
    작업: 산정
    식위치: >
      **식 (4.1-3)** — Ae = An·U.
      ★★**원형강관에 쓸 수 있는 사례가 정해져 있다.**
        **사례 5** — "강관에서 슬롯을 통과하는 하나의 동일 중심의 거셋플레이트를 갖는
                  **원형 강관**". U 값과 적용조건(접합 길이 l 과 D 의 관계)은 원문 이미지.
        **사례 1** — 인장력이 각 단면요소에 **직접** 전달되는 경우
                  (단 사례 4·5·6 은 제외한다고 원문이 단서를 단다).
        ⛔**사례 2 는 "강관을 제외한 모든 인장재"** 라고 원문이 명시한다 — **쓸 수 없다.**
        ⛔**사례 6 은 각형강관**이다. 원형강관에 쓰면 안 된다.
      ★★**4.1.2.3(2) 의 U 하한 규정이 원형강관에는 적용되지 않는다.**
        원문 — "H형강, I형강, ㄷ형강, T형강, 단일ㄱ형강 및 쌍ㄱ형강과 같은 **개단면**의
        경우, U 는 연결된 요소 총단면적의 비 이상이어야 한다. **이 규정은 강관과 같은
        폐단면과 판재에는 적용하지 않는다.**"
        → H형강 트리의 그 하한을 원형강관에 끌어오면 **없는 제약을 거는 것**이다.
    출력: Ae

  # ── [5A]·[5B] 는 **병렬**이다. 둘 다 항상 산정하고 [6] 에서 작은 값을 취한다.
  - 단계: "5A"
    이름: "〔병렬〕 총단면의 항복 한계상태"
    근거: "KDS 14 31 10  4.1.3.1"
    작업: 산정
    식위치: "**식 (4.1-4)** — Pn = Fy·Ag. 저항계수 φt 값은 원문"
    출력: φtPn(항복)

  - 단계: "5B"
    이름: "〔병렬〕 유효순단면의 파단 한계상태"
    근거: "KDS 14 31 10  4.1.3.2"
    작업: 산정
    식위치: "**식 (4.1-5)** — Pn = Fu·Ae. ★저항계수 φt 가 항복(4.1.3.1)과 **다르다**"
    출력: φtPn(파단)

  - 단계: "6"
    이름: 설계인장강도 결정
    근거: "KDS 14 31 10  4.1.3"
    작업: 판정
    식위치: "4.1.3(1) — 두 한계상태 중 **작은 값**을 설계인장강도로 한다"
    출력: φtPn

  - 단계: "7"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.1.3"
    작업: 판정
    식위치: >
      Pu ≤ φt·Pn 이면 OK, 아니면 NG.
      ★**NG 면 여기서 끝난다.** 단면 변경은 계산서에서 설계자가 한다.
      **후행작업은 OK 인 경우에만** 이어진다.
    출력: "OK / NG"

  - 단계: "8"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 10  4.1"
    작업: 판정
    식위치: >
      **배타 선택이 아니라 체크리스트**다 — 해당하는 것을 **모두** 검토한다.
        □ **슬롯 거셋플레이트 용접**접합인가   → [9]  ★용접 기준 소관이다
        □ **이음·연결부**가 있는가 (볼트/용접 불문)        → [10]
      해당 없으면 그대로 종료한다.
    출력: 해당 항목 목록

  - 단계: "9"
    이름: ★슬롯 거셋플레이트라는 것을 기록 (해당하면)
    근거: "KDS 14 31 25  4.1.2"
    작업: 판정
    식위치: >
      ★★**슬롯 거셋플레이트는 「용접」 상세다** — 4.1.2.2(3) 이 "…강관을 **용접하는
      경우**" 라고 적는다. **연결부 설계 단계에서 용접 기준(4.1.2)으로** 검토한다.
      ★슬롯에 끼운 거셋 둘레 용접은 **필릿용접**이다(표 4.1-8 "필릿용접(구멍, **슬롯**, …)").
      4.1.2.3 의 「슬롯용접」(슬롯을 메우는 용접)과 **다른 것**이니 조항을 바꿔 쓰지 말 것.
      ★관을 절개한 자리에서 **거셋을 따라 찢겨 나가는(tear-out) 파괴**가 지배할 수 있다.
    출력: "용접 상세임 (연결부 설계 단계에서 4.1.2)"

  - 단계: "10"
    이름: ★연결부 있음 — 「연결부 설계」 단계로 (해당하면)
    근거: "KDS 14 31 10  4.1.2.3"
    작업: 판정
    식위치: >
      ★★**여기서는 「연결부가 있다」는 것만 기록한다.** 실무 순서가 그렇다 —
      **부재별 단면검토를 전부 마친 뒤** 「연결부 설계」 단계에서 처리한다.
      연결재가 **볼트냐 용접이냐**는 거기서 **한 번만** 갈린다
      (진입 트리 `강교 부재 / 전체` 의 [9]).
        볼트 → 4.1.3 `연결부 / 볼트접합`   ·   용접 → 4.1.2 `연결부 / 용접접합`
      그리고 **연결재 형식과 무관하게 접합부재 4.1.4** (`연결부 / 접합부재`) 를 **반드시**.
      ★**부재가 OK 여도 접합부에서 파괴되면 그 부재는 못 쓴다.**
      ★★**슬롯 거셋플레이트는 「용접」 상세다**(4.1.2.2(3) "…강관을 **용접하는 경우**").
        슬롯에 끼운 거셋 둘레 용접은 **필릿용접**이다(표 4.1-8). 4.1.2.3 의 슬롯용접이 아니다.
        관을 절개한 자리에서 **거셋을 따라 찢겨 나가는(tear-out) 파괴**를 특히 볼 것.
    출력: "연결부 있음 (형식은 연결부 설계 단계에서)"

  - 단계: "11"
    이름: 종료
    근거: "KDS 14 31 10  4.1.3"
    작업: 판정
    식위치: "부재 검토와 해당하는 후행작업이 모두 끝났다"
    출력: "OK"

안전주의: >
  ★★**원형강관 인장은 H형강과 세 군데가 실제로 다르다. H형강 트리를 복사해 쓰면 안 된다.**

    ⓐ **순단면적** — **4.1.2.2(3)** 이 슬롯 강관 전용 규정을 따로 둔다:
       "거셋플레이트에 슬롯이 있는 강관을 용접하는 경우 강관의 순단면적은 **총단면적에서
       슬롯의 전체 단면적을 뺀 것**으로 한다." 볼트구멍 공제식이 아니다.
       **슬롯은 관을 양쪽으로 관통하므로 두 군데가 잘린다.**

    ⓑ **전단뒤짐계수 사례** — 원형강관은 **표 4.1-1 사례 5**(슬롯 거셋플레이트) 또는
       **사례 1** 이다. **사례 2 는 원문이 "강관을 제외한" 이라고 명시**하므로 못 쓴다.
       **사례 6 은 각형강관**이라 원형에 쓰면 안 된다. H형강이 쓰는 사례 2·4·7 은 전부
       원형강관의 것이 아니다.

    ⓒ **U 의 하한 규정이 없다** — 4.1.2.3(2) 의 "연결된 요소 총단면적 비 이상" 규정은
       **개단면 전용**이고, 원문이 **"강관과 같은 폐단면과 판재에는 적용하지 않는다"** 고
       못 박는다. 그 하한을 원형강관에 끌어오면 없는 제약을 거는 것이다.

  ★두 한계상태(총단면 항복 4.1.3.1 / 유효순단면 파단 4.1.3.2)의 **저항계수 φt 가 서로
  다르다.** 값은 반드시 원문 식 (4.1-4)·(4.1-5) 에서 확인할 것. **작은 쪽이 지배한다.**
  ★4.1.2.2(4) — 플러그·슬롯 **용접재는 순단면적에 포함하지 않는다.** 용접으로 메웠다고
  단면을 되살리면 안 된다.
  ★**세장비 제한은 건축과 교량이 다르다**(4.1.1(1) 권장 300 ↔ 4.1.1(2) 실제 제한).
  적용구분을 먼저 정할 것. 다만 **원형강관은 r 이 전 방향 동일**해서 약축을 따로 찾을
  필요가 없다.
  ★★**슬롯 거셋플레이트는 「용접」 상세다.** 접합부 검토가 볼트가 아니라 **용접 기준
  (KDS 14 31 25 4.1.2)** 소관이 되고, `연결부 / 용접접합` 트리로 이어진다.
  슬롯 절개부에서 **거셋플레이트를 따라 찢겨 나가는 파괴**가 지배할 수 있다.
  ★이 트리에 **없는 것**: 4.1.4 조립 인장부재 · 4.1.5 핀접합부재 · 4.1.6 아이바.
  원형강관에는 잘 쓰지 않아 넣지 않았다 — 해당하면 원문을 따로 볼 것.
  ★교량에 쓸 때는 저항계수를 **KDS 24 14 31 4.1.4.2** 에서 가져온다.

