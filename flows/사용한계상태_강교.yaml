부재: 사용한계상태
단면: 강교 (처짐·영구처짐)
설계법: 한계상태설계법
근거: KDS 24 14 31  # 강교 설계기준(한계상태설계법) 4.1.2 사용한계상태
위임근거: "KDS 24 14 31  4.1.2"
목표검토: "사용한계상태조합에서  처짐 ≤ 제한값  ·  플랜지 응력 ≤ 영구처짐 제한 (식 4.3-138~141)"

입력:
  - {기호: L,   설명: 지간(경간장),                   단위: mm}
  - {기호: δ,   설명: "활하중 처짐 (충격 IM 포함)",    단위: mm}
  - {기호: 바닥판, 설명: "콘크리트 / 직교이방성 강바닥판 / 격자·경량 — 필수 여부가 갈린다", 단위: "-"}
  - {기호: 발주자요구, 설명: "★처짐·경간높이비 제한을 발주자가 요구했는가", 단위: "-"}
  - {기호: ff,  설명: "사용한계상태조합에 의한 플랜지 응력 (횡방향 휨 제외)", 단위: MPa}
  - {기호: fl,  설명: "플랜지 횡방향 휨응력 (4.3.3.1.1.6)", 단위: MPa}
  - {기호: fc,  설명: "압축플랜지 응력 (웨브 휨좌굴 검토용)", 단위: MPa}
  - {기호: 단면구성, 설명: "합성 / 비합성 · 정모멘트부 / 부모멘트부", 단위: "-"}

흐름:
  - 단계: "1"
    이름: ★하중조합 — 사용한계상태조합이 둘 쓰인다
    근거: "KDS 24 14 31  4.1.2"
    작업: 판정
    식위치: >
      4.1.2(2) — 강구조물은 **사용한계상태조합 Ⅱ** 의 조건을 만족해야 한다
      (KDS 24 12 11 표 4.1-1 — `하중조합 / 도로교` 트리에서 정한다).
      ★그런데 **처짐 조사에는 사용하중조합 Ⅰ 의 활하중 비율(충격 IM 포함)** 을 쓴다
      (KDS 24 10 11 2.5.2.6(2)②라).
      ★★**영구처짐(응력 제한)은 조합 Ⅱ, 처짐(변위)은 조합 Ⅰ 계열** — 하나로 뭉뚱그리면
      안 된다.
    다음트리: "하중조합 / 도로교"
    다음: "2"
    출력: 적용 조합

  - 단계: "2"
    이름: ★처짐 기준의 성격 — 원칙적으로 「선택적」이다
    근거: "KDS 24 14 31  4.1.2"
    작업: 판정
    식위치: >
      KDS 24 10 11 2.5.2.6(2)① — **처짐기준은 아래를 제외하고 「선택적」** 이다:
        가. **직교이방성 강바닥판** — **필수**
        나. 격자 강바닥판·경량 바닥판 — KDS 24 14 31(4.10.3.2) 사용성 규정 준수
      그 밖에는 **발주자가 처짐 제한을 요구하는 경우** 적용한다.
      ★실무에서는 발주처 지침이 사실상 항상 요구한다 — "선택적"이라고 건너뛰지 말고
      **과업지시서·발주처 기준을 확인**할 것.
      ⛔철도교의 처짐은 KDS 24 10 10(4.1.4) — 이 트리의 적용 범위 밖 — 철도교 안건이면 멈추고 원문을 볼 것. 멈추고 원문.
    분기:
      - {조건: "직교이방성 강바닥판", 결과: "★필수 — 지간/300 등 (2.5.2.6(2)④)", 다음: "3"}
      - {조건: "발주자 요구 (통상)",   결과: "처짐 검토 적용", 다음: "3"}
      - {조건: "요구 없음",           결과: "처짐은 선택 — 영구처짐([6])은 검토", 다음: "6"}
    출력: 처짐 검토 필요 여부

  - 단계: "3"
    이름: 처짐 계산의 원칙
    근거: "KDS 24 14 31  4.1.2"
    작업: 판정
    식위치: >
      KDS 24 10 11 2.5.2.6(2)② — 처짐을 조사할 때:
        가. 최대처짐 — **모든 재하차로에 재하**, 모든 지점(거더)은 **동일 처짐 가정**
        나. 합성설계 — 단면에 **도로 전폭 + 구조적으로 연속인 난간·보도·중앙분리대 포함**
        다. 부재간 상대처짐 — 가장 불리한 재하차로 수·위치 선정
        라. **사용하중조합 Ⅰ 활하중 비율, 충격 IM 포함**
        마·바. 활하중·동시재하는 KDS 24 12 21(4.3.1.7 · 4.3.1.2)
      ★"모든 거더 동일 처짐" 가정은 **격자해석 없이 전폭 하중을 거더 수로 나누는
      약산**을 허용하는 취지다 — 실제 해석 모델과 섞지 말 것.
    출력: 처짐 계산 조건

  - 단계: "4"
    이름: ★처짐 제한값 — 글자로 있다
    근거: "KDS 24 14 31  4.1.2"
    작업: 판정
    식위치: >
      KDS 24 10 11 2.5.2.6(2)②아 — 기타 기준이 없는 경우의 제한(강·알루미늄·콘크리트):
        차량하중 (일반)                  → **지간/800**
        차량하중 또는 보행자하중         → **지간/1,000**
        내민보의 차량하중                → **지간/300**
        내민보의 차량 또는 보행자하중    → **지간/375**
      직교이방성 강바닥판(④) — 바닥판 위 차량 **지간/300** · 가로보 위 **지간/1,000** ·
      인접 가로보 간 상대처짐 **2.5 mm**.
      ★**보행자 이용이 있으면 /800 이 아니라 /1,000** — 보도교·병용교에서 놓치기 쉽다.
    출력: "δ 허용값"

  - 단계: "5"
    이름: 경간-높이비 (발주자 요구 시)
    근거: "KDS 24 14 31  4.1.2"
    작업: 판정
    식위치: >
      KDS 24 10 11 2.5.2.6(3) — 발주자가 요구하면 **표 2.5-1** 의 최소높이를 적용
      (글자 표, 강재 행):
        합성형 I형 보의 **전체 높이**   → 단경간 **0.040 L** / 다경간 **0.032 L**
        합성형 I형 보에서 **I형 보 높이** → 0.033 L / 0.027 L
        트러스                          → 0.100 L / 0.100 L
      ★변단면이면 정·부모멘트 단면의 상대 강성변화를 고려해 조정 가능(표 머리글).
    출력: 최소높이 확인

  - 단계: "6"
    이름: ★영구처짐 — 플랜지 응력 제한 (조합 Ⅱ)
    근거: "KDS 14 31 10  4.3.3.1.4"
    위임근거: "KDS 24 14 31  4.1.2"
    작업: 판정
    식위치: >
      4.3.3.1.4.2 — **처짐(변위)이 아니라 「응력」으로 영구처짐을 제한**한다:
      (2)① 플랜지 요구조건 —
        합성단면 상부플랜지  → **식 (4.3-138)**
        합성단면 하부플랜지  → **식 (4.3-139)** (횡방향 휨 fl 의 절반이 들어간다)
        비합성단면 상·하부   → **식 (4.3-140)**
      ③ 웨브 휨좌굴 — **식 (4.3-141)**: 압축플랜지 응력 fc ≤ 웨브 공칭휨좌굴강도
        (정모멘트부 합성단면 중 4.3.3.1.2.1(1) 웨브 조건 만족 시 제외).
      (1)② 단면 가정 — 콘크리트 인장응력이 균열응력 기준 미만이면 바닥판 유효,
        넘으면 **철근만** 고려. 비합성 부모멘트부는 **강재단면만**.
      ★하이브리드 단면은 플랜지 응력감소계수(4.3.3.1.1.10(1))가 붙는다.
      식은 원문 이미지 — `kcsc_formula('KDS 14 31 10','4.3.3.1.4')`.
    출력: 영구처짐 검토 결과

  - 단계: "7"
    이름: 검토(판정)
    근거: "KDS 24 14 31  4.1.2"
    작업: 판정
    식위치: >
      해당하는 항목이 모두 만족하면 OK —
        처짐(적용 시): δ ≤ 제한값 · 경간-높이비(요구 시)
        영구처짐: 식 (4.3-138)~(4.3-141)
      ★**NG 면 여기서 끝난다.** 단면(강성) 변경은 계산서에서 설계자가 한다 —
      처짐 NG 는 보통 **높이(강성)를 키우는 문제**지 강도 문제가 아니다.
    출력: "OK / NG"

  - 단계: "8"
    이름: 종료 — 진입 트리로 복귀
    근거: "KDS 24 14 31  4.1.2"
    작업: 판정
    식위치: >
      사용한계상태 검토가 끝났다. 진입 트리 `강교 부재 / 전체` 의 [8](피로·파괴)와
      **병렬**이다 — 이것으로 피로가 면제되지 않는다.
      탄성처짐의 세부(4.3.3.1.4.1)는 "해당 설계기준의 규정" — 발주처 기준 확인.
    출력: "OK"

안전주의: >
  ★★★**사용한계상태는 강도검토가 아니다** — 통과해도 강도한계상태(극한·극단상황)와
  피로는 **별도**다. 진입 트리의 [6]·[7]·[8] 이 병렬인 이유다.

  ★★★**조합이 둘 쓰인다** — **영구처짐(응력 제한)은 사용한계상태조합 Ⅱ**
  (KDS 24 14 31 4.1.2(2)), **처짐(변위) 조사는 사용하중조합 Ⅰ 의 활하중 비율 + 충격 IM**
  (KDS 24 10 11 2.5.2.6(2)②라). 하나로 뭉뚱그리면 틀린다.

  ★★**처짐기준은 원칙적으로 「선택적」** 이고(직교이방성 강바닥판만 필수),
  발주자 요구로 적용된다 — 실무에선 사실상 항상 요구되니 **과업지시서를 확인**할 것.
  ★★**보행자 이용이 있으면 지간/800 이 아니라 지간/1,000** — 보도교·병용교의 덫.
  ★★**영구처짐은 변위가 아니라 「응력」 제한**이다(식 4.3-138~141) — 플랜지 응력에
  **횡방향 휨응력의 절반(fl/2)** 이 더해지는 꼴이고, **웨브 휨좌굴(4.3-141)** 도 같이
  걸린다.
  ★처짐 계산 — 모든 재하차로 재하 + **모든 거더 동일 처짐 가정**(약산 허용 취지),
  합성단면 폭에 **난간·보도 포함**, **IM 포함**.
  ★경간-높이비(표 2.5-1)는 강재 합성 I형: 전체 0.040L/0.032L · I형보 0.033L/0.027L.
  ★부모멘트부 단면 가정 — 콘크리트 균열응력 초과면 **철근만**, 비합성은 **강재만**.
  ⛔철도교 처짐(KDS 24 10 10 4.1.4)은 이 트리의 적용 범위 밖 — 멈추고 원문.

검증일: "2026-08-06"
검증기준:
  "KDS 241431": "2018"
  "KDS 143110": "2024"
검증: 설계자확정
