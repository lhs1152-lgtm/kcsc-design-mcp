부재: 조합력부재 (인장 + 휨)
단면: H형강 · 원형강관 · 각형강관 (1축 및 2축 대칭단면)
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 10  # 4.4.1.2 인장력과 휨을 받는 1축 및 2축 대칭단면 부재
목표검토: "4.4.1.2 의 상관식 값 ≤ 1.0"

입력:
  - {기호: Tu,  설명: 소요인장강도(계수하중),          단위: kN}
  - {기호: Tr,  설명: "설계인장강도 (4.1 로 산정 — 이 트리가 구하지 않는다)", 단위: kN}
  - {기호: Mux, 설명: 소요휨강도 — 강축,              단위: kN·m}
  - {기호: Mrx, 설명: "설계휨강도 — 강축 (4.3 으로 산정)", 단위: "kN·m"}
  - {기호: Muy, 설명: 소요휨강도 — 약축,              단위: kN·m}
  - {기호: Mry, 설명: "설계휨강도 — 약축 (4.3 으로 산정)", 단위: "kN·m"}
  - {기호: T,   설명: "비틀림모멘트 (있으면) — 4.4.3 판정에 쓴다", 단위: kN·m}

흐름:
  - 단계: "1"
    이름: ★비틀림이 함께 작용하는지 확인
    근거: "KDS 14 31 10  4.4.3"
    작업: 판정
    식위치: >
      4.4.3 — **비틀림 또는 비틀림·휨·전단력 또는/과 축력 등을 동시에 받는 부재**.
      ★4.4.1.2 는 **인장 + 휨**만 다룬다. 비틀림은 별도 조항이다.
    분기:
      - {조건: "비틀림이 함께 작용한다", 결과: "4.4.3 을 함께 검토",
         다음트리: "비틀림부재 / 원형·각형강관", 다음: "2"}
      - {조건: "비틀림 없음 (또는 무시할 수준)", 결과: "4.4.1.2 로", 다음: "2"}
    출력: 비틀림 검토 필요 여부

  - 단계: "2"
    이름: ★적용 확인 — 압축(4.4.1.1)과 조건이 다르다
    근거: "KDS 14 31 10  4.4.1.2"
    작업: 판정
    식위치: >
      4.4.1.2(1) — **기하축(x축 또는/과 y축)으로만 휨이 발생하도록 구속된 1축 대칭단면
      부재**에 적용한다.
      ★★**압축(4.4.1.1)과 달리 Iyc/Iy 0.1~0.9 제한이 없다.** 압축 트리의 적용조건을
      그대로 가져오면 안 된다.
      ★4.4.1.2(2) 단서 — 식 (4.4-1)·(4.4-2) **대신 좀 더 정밀한 해석결과를 쓸 수도 있다.**
    출력: 적용 여부

  - 단계: "3"
    이름: ★설계인장강도 Tr 산정 — 항복과 파단 두 한계상태
    근거: "KDS 14 31 10  4.1"
    작업: 산정
    식위치: >
      4.1 — 인장부재 기준으로 별도 산정한다. **이 트리가 구하지 않는다.**
      ★★**인장은 한계상태가 둘이다 — 총단면 항복 / 유효순단면 파단.**
      **저항계수가 서로 다르다**(원문 4.4.1.2 는 "φt : 4.1.3 참조" 라고만 적는다).
      **둘 중 작은 쪽이 Tr 이다.** 항복만 보고 넣으면 위험측이 된다.
    분기:
      - {조건: "H형강",   결과: "인장부재 트리에서 Tr 산출 후 복귀",
         다음트리: "인장부재 / H형강",   다음: "4A"}
      - {조건: "★원형강관", 결과: "인장부재 트리에서 Tr 산출 후 복귀",
         다음트리: "인장부재 / 원형강관", 다음: "4A"}
      - {조건: "각형강관", 결과: "인장부재 트리에서 Tr 산출 후 복귀",
         다음트리: "인장부재 / 각형강관", 다음: "4A"}
    출력: Tr

  # ── [4A]·[4B] 는 **병렬**이다. 강축과 약축을 각각 다른 트리로 구한다.
  - 단계: "4A"
    이름: "〔병렬〕 ★설계휨강도 Mrx (강축) 산정 — 단면에 맞는 트리로"
    근거: "KDS 14 31 10  4.3"
    작업: 산정
    식위치: >
      ★**강축 휨은 단면 분류에 따라 조항이 갈린다.** 아무 트리나 쓰면 안 된다.
        4.3.2.1.1.2·4.3.2.1.1.3 — 2축대칭 H형강
        4.3.2.1.1.4 — 1축대칭(비정형) H형강, 웨브 조밀·비조밀
        4.3.2.1.1.5 — 세장판 웨브
        ★**4.3.2.1.1.8 — 원형강관**(휨 전용 절. 횡비틀림좌굴 한계상태가 **없다**)
      각 트리의 `[1] 축력 함께 작용?` 분기에서 **"조합력 트리에서 Mr 산출용으로 불려옴"**
      을 골라 되돌아오지 않게 한다.
      ★2축대칭이면 [5] 의 Cb 증가를 여기에 반영한다.
    분기:
      - {조건: "2축대칭 H형강",        결과: "4.3.2.1.1.2 / 4.3.2.1.1.3",
         다음트리: "휨부재 / 2축대칭 H형강",     다음: "4B"}
      - {조건: "1축대칭(비정형) H형강", 결과: "4.3.2.1.1.4",
         다음트리: "휨부재 / 1축대칭 H형강",     다음: "4B"}
      - {조건: "세장판 웨브",          결과: "4.3.2.1.1.5",
         다음트리: "휨부재 / 세장판웨브 H형강", 다음: "4B"}
      - {조건: "★원형강관",            결과: "4.3.2.1.1.8",
         다음트리: "휨부재 / 원형강관",          다음: "4B"}
      - {조건: "★각형강관",            결과: "4.3.2.1.1.7",
         다음트리: "휨부재 / 각형강관",          다음: "4B"}
    출력: Mrx

  - 단계: "4B"
    이름: "〔병렬〕 ★설계휨강도 Mry (약축) 산정 — 약축은 조항이 다르다"
    근거: "KDS 14 31 10  4.3.2.1.1.6"
    작업: 산정
    식위치: >
      ★★**약축 휨은 4.3.2.1.1.6 이다. 강축 트리에서 뽑으면 안 된다.**
      약축에는 **횡비틀림좌굴 한계상태가 없다**(항복·플랜지 국부좌굴 둘뿐).
      Muy = 0 (약축 휨이 없음) 이면 이 단계를 건너뛴다.
      ★★**원형강관에는 약축이 없다.** 모든 방향의 단면성능이 같으므로 **Mry = Mrx** 이고
      [4A] 에서 이미 구한 값을 그대로 쓴다. 약축 트리로 갈 필요가 없다.
    분기:
      - {조건: "★원형강관 — 약축이 없다", 결과: "Mry = Mrx (4A 의 값 그대로)", 다음: "5"}
      - {조건: "★각형강관 — 약축도 4.3.2.1.1.7", 결과: "같은 절, 약축 단면성능으로 다시",
         다음트리: "휨부재 / 각형강관", 다음: "5"}
      - {조건: "H형강 · 약축 휨이 있다 (Muy ≠ 0)", 결과: "4.3.2.1.1.6 으로",
         다음트리: "휨부재 / 약축 H형강", 다음: "5"}
      - {조건: "약축 휨 없음 (Muy = 0)",  결과: "Mry 불필요", 다음: "5"}
    출력: Mry

  - 단계: "5"
    이름: ★Cb 증가 적용 여부 — 2축대칭 단면에만
    근거: "KDS 14 31 10  4.4.1.2"
    작업: 판정
    식위치: >
      4.4.1.2(2) — **2축대칭 단면**을 가진 부재에서 축방향 **인장력**과 휨이 동시에
      작용할 때, 4.3 의 **Cb 값을 증가시킬 수 있다**(증가계수 식은 원문 이미지).
      ★인장이 횡비틀림좌굴을 억제하기 때문이다. **압축(4.4.1.1)에는 이런 조항이 없다.**
      ★**1축대칭 단면에 쓰면 위험측이다.** 원문이 2축대칭으로 못 박고 있다.
      ★★**원형강관에는 이 조항이 실익이 없다.** Cb 는 횡비틀림좌굴 보정계수인데
      원형강관 휨(4.3.2.1.1.8)에는 **횡비틀림좌굴 한계상태 자체가 없어** Cb 가 쓰이지
      않는다. 원형강관이면 이 단계를 그냥 지나친다.
      ★적용하면 [4A] 의 Mrx 를 증가된 Cb 로 다시 산정한다. 안 쓰면 안전측이다.
    분기:
      - {조건: "2축대칭 + 증가 적용 (Mrx 재산정)", 결과: "증가된 Cb 로 Mrx 갱신", 다음: "6"}
      - {조건: "★원형강관 — Cb 가 쓰이지 않는다", 결과: "해당 없음",              다음: "6"}
      - {조건: "적용 안 함 (안전측)",             결과: "그대로 진행",            다음: "6"}
    출력: Cb 보정 여부

  - 단계: "6"
    이름: 상관식 적용
    근거: "KDS 14 31 10  4.4.1.2"
    작업: 판정
    식위치: >
      식 (4.4-1)·(4.4-2) 를 **인장 기준**으로 적용한다. 분기 기준은 원문 이미지 확인.
      ★저항계수 — 원문은 **φt : 4.1.3 참조**(항복과 파단이 다르다) · **φb = 0.90** 이다.
      **이 값은 KDS 14 31 10 (건축계열) 의 값이다.**
      ★**교량이면 KDS 24 14 31 4.1.4.2 의 저항계수를 쓴다.**
    출력: 상관식 값

  - 단계: "7"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.4.1.2"
    작업: 판정
    식위치: >
      상관식 값 ≤ 1.0 이면 OK, 아니면 NG.
      ★**NG 면 여기서 끝난다.** 단면 변경은 계산서에서 설계자가 한다.
      **후행작업은 OK 인 경우에만** 이어진다.
    출력: "OK / NG"

  - 단계: "8"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 10  4.4"
    작업: 판정
    식위치: >
      **배타 선택이 아니라 체크리스트**다 — 해당하는 것을 **모두** 검토한다.
        □ 플랜지에 **볼트구멍**이 있는가                → [9]  (4.4.4) ★인장이면 거의 항상
        □ **이음·연결부**가 있는가 (볼트/용접 불문)             → [10]
      해당 없으면 그대로 종료한다.
    출력: 해당 항목 목록

  - 단계: "9"
    이름: ★★구멍이 있는 플랜지의 인장파단 (해당하면)
    근거: "KDS 14 31 10  4.4.4"
    작업: 판정
    식위치: >
      4.4.4(1) — **식 (4.4-15)**. 축력과 주축휨이 조합된 하중상태에서 **인장을 받는
      플랜지의 볼트 구멍 위치**에서의 인장파단강도를 제한한다.
      ★원문이 못 박는다 — **"축력과 휨에 의해 인장을 받는 각각의 플랜지는 개별적으로
      검토되어야 한다."** 한쪽만 보면 안 된다.
      ★저항계수가 다르다 — **φt = 0.75(인장파단, 4.1.3.2)** · **φb = 0.90**.
      상관식(4.4.1.2)의 φt 와 다른 값이다.
      ★여기의 설계휨강도는 **4.3.2.1.1.13** 에 따르거나, 볼트구멍을 고려하지 않고
      산정한 소성모멘트를 쓴다(원문).
      ★**인장 + 휨에서는 이 검토가 거의 항상 걸린다.** 상관식(4.4.1.2)은 볼트구멍
      인장파단을 잡아 주지 않는다.
    출력: 인장파단 검토

  - 단계: "10"
    이름: ★연결부 있음 — 「연결부 설계」 단계로 (해당하면)
    근거: "KDS 14 31 10  4.4.1.2"
    작업: 판정
    식위치: >
      ★★**여기서는 「연결부가 있다」는 것만 기록한다.** 실무 순서가 그렇다 —
      **부재별 단면검토를 전부 마친 뒤** 「연결부 설계」 단계에서 처리한다.
      연결재가 **볼트냐 용접이냐**는 거기서 **한 번만** 갈린다
      (진입 트리 `강교 부재 / 전체` 의 [9]).
        볼트 → 4.1.3 `연결부 / 볼트접합`   ·   용접 → 4.1.2 `연결부 / 용접접합`
      그리고 **연결재 형식과 무관하게 접합부재 4.1.4** (`연결부 / 접합부재`) 를 **반드시**.
      ★**부재가 OK 여도 접합부에서 파괴되면 그 부재는 못 쓴다.**
    출력: "연결부 있음 (형식은 연결부 설계 단계에서)"

  - 단계: "11"
    이름: 종료
    근거: "KDS 14 31 10  4.4.1.2"
    작업: 판정
    식위치: "부재 검토와 해당하는 후행작업이 모두 끝났다"
    출력: "OK"

안전주의: >
  ★인장 + 휨은 압축 + 휨(4.4.1.1)과 **조항이 다르다.** 상관식 번호가 같아 보여도
  적용조건·저항계수·부가조항이 전부 다르다. 압축 트리를 가져다 쓰면 안 된다.

    적용조건 — 압축은 **Iyc/Iy 0.1~0.9** 제한이 붙지만 **인장에는 그 제한이 없다**
    Cb 증가 — **인장에만 있다**(4.4.1.2(2), 2축대칭 한정). 압축에는 없다
    저항계수 — 인장은 **φt 가 4.1.3 참조**(항복/파단이 다르다). 압축은 φc = 0.90 고정

  ★★**Tr 은 총단면 항복과 유효순단면 파단 중 작은 쪽이다.** 항복만 보고 넣으면 위험측이다.
  ★★**Mrx(강축)와 Mry(약축)는 서로 다른 조항·다른 트리에서 나온다.**
    강축 — 4.3.2.1.1.2/.3(2축대칭) · 4.3.2.1.1.4(1축대칭) · 4.3.2.1.1.5(세장판 웨브)
    약축 — **4.3.2.1.1.6** (횡비틀림좌굴 한계상태가 **없다**)

  ★★**4.4.4 볼트구멍 인장파단은 인장 + 휨에서 거의 항상 걸린다.**
  식 (4.4-15), **φt = 0.75(파단)** · φb = 0.90 이고, 원문이 **"인장을 받는 각각의
  플랜지를 개별적으로 검토"** 하라고 못 박고 있다.

  ★4.4.1.2(2) 의 **Cb 증가는 2축대칭 단면에만** 허용된다. 1축대칭에 쓰면 위험측이다.
  ★Tr·Mrx·Mry 는 이 트리가 산정하지 않는다 — 4.1(인장)·4.3(휨) 트리에서 구해 넣는 값이다.
  **그 앞단이 틀리면 상관식도 통째로 틀린다.**
  ★교량에 쓸 때는 저항계수를 **KDS 24 14 31 4.1.4.2** 에서 가져온다.

  ★★**원형강관도 이 트리를 쓴다.** 다만 **불러오는 하위 트리가 다르고**, 원형강관에만
  해당하는 사정이 셋 있다 —
    인장 Tr → `인장부재 / 원형강관` (슬롯 순단면적 4.1.2.2(3), 표 4.1-1 **사례 5**)
    휨  Mr → `휨부재 / 원형강관`   (**4.3.2.1.1.8**)
    ⓐ **약축이 없다** — Mry = Mrx. 약축 트리(4.3.2.1.1.6)로 가면 안 된다.
    ⓑ **4.4.1.2(2) 의 Cb 증가가 실익이 없다** — 원형강관 휨에는 **횡비틀림좌굴 한계상태
       자체가 없어** Cb 가 쓰이지 않는다.
    ⓒ **4.4.4 는 "인장을 받는 플랜지"의 조항**이라 원형강관에 그대로 대응되지 않는다.
       슬롯·구멍이 있으면 원문을 직접 확인할 것.

