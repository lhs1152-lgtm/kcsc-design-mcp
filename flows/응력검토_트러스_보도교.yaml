부재: 응력검토
단면: 트러스 (강교) — 보도교 ASD, KDS 14 30 10 4.8.2
설계법: 허용응력설계법
근거: KDS 14 30 10  # 강구조 부재 설계기준(허용응력설계법) 4.8.2 골조 구조물 — 4.8.2.2 트러스 · 4.8.2.5.1 접합부 · 4.8.2.6 전체 골조 유의사항 · 4.8.2.7 지점
목표검토: "트러스 부재(현재·수직재·사재)의 유효좌굴길이·2차응력·격점을 정하고, 부재는 H형강/원형강관 트리(14 30 10 4.3~4.6)로  작용응력 ≤ 허용응력 × 증가계수"

입력:
  - {기호: 트러스형식, 설명: "상로 / 하로 / 포니 · 워렌 / 프랫 / K — 면외 지지(브레이싱) 유무가 갈린다", 단위: "-"}
  - {기호: L,   설명: "부재 길이 (격점 중심 간)",                     단위: mm}
  - {기호: Lg,  설명: "거셋 연결 고력볼트군 중심 간 거리 (면내 유효좌굴길이 후보, ≥ 0.8 L)", 단위: mm}
  - {기호: 거셋, 설명: "양면 / 단면 거셋 (단면이면 0.9 L) · 두께 · 폭 b",  단위: "-"}
  - {기호: N1·N2, 설명: "인접 격간의 축력 (크기·부호가 다르면 면외 유효좌굴길이 식 4.8-8/4.8-9)", 단위: N}
  - {기호: h,   설명: "주 트러스 부재 높이 (2차응력 — h < L/10)",       단위: mm}
  - {기호: 부재단면, 설명: "H형강 / 원형강관 / 박스 — 부재 검토 트리가 갈린다", 단위: "-"}
  - {기호: 증가계수, 설명: "조합별 허용응력 증가계수 — 하중조합 트리(KDS 24 12 10 준용)", 단위: "-"}

흐름:
  - 단계: "1"
    이름: ★적용 확인 — 트러스는 KDS 14 30 10 4.8.2 골조 구조물 (24 14 30 4.10 이 아니다)
    근거: "KDS 14 30 10  4.8.2.1"
    작업: 판정
    식위치: >
      **4.8.2.1** — "4.8.2 는 트러스, 라멘, 아치 등의 설계에 적용된다."
      ★★설계자 확정(2026-08-17): 보도교 ASD 는 KDS 14 30 10 갈래 통일, "트러스도 해" → 구판
      (KDS 24 14 30 4.10 — 철도교 기준: 현재 박스단면·40% 판·연결판 11 mm·버팀부재 1/4 조건)을
      빼고 **14 30 10 4.8.2 로 다시 썼다.** 브레이싱 트리와 달리 트러스는 14 30 10 안에 유효좌굴
      길이·2차응력·거셋·전체좌굴이 있어 **24 준용이 필요 없다.**
      **4.8.2.2.1 트러스의 구성** — 부재 중심축과 단면 도심 일치(2차응력 최소) · 절점은 강결에 의한
      2차응력이 작게.
      부재 자체의 응력검토는 단면별 트리(H형강 4.3~4.6 / 원형강관 4.8.1)로, 격점은 연결 트리로.
    분기:
      - {조건: "보도교 트러스 (주 트러스 · 상로/하로/포니)", 결과: "이 트리", 다음: "2"}
      - {조건: "⛔철도교 · 도로교(자동차) 안건", 결과: "이 트리의 적용 범위 밖 / KDS ASD 근거 없음 — 멈춘다", 다음: "10"}
    출력: 적용 확인

  - 단계: "2"
    이름: 브레이싱·면외 지지 계획 먼저 — 유효좌굴길이가 여기서 정해진다
    근거: "KDS 14 30 10  4.8.2.2.4"
    작업: 판정
    식위치: >
      4.8.2.2.4 — 수평·수직·교문브레이싱은 주 트러스와 함께 **입체적 기능을 유지할 충분한 강성**,
      교차 부재 교점은 연결. **면외 유효좌굴길이는 이 지지점 간격**([3])이므로 배치를 먼저 정한다.
      배치·간격·1% 격간력은 `응력검토 / 브레이싱` 트리(24 14 30 4.7 준용).
    다음트리: "응력검토 / 브레이싱·다이아프램 (강교)"
    다음: "3"
    출력: 브레이싱 배치 · 면외 지지점

  - 단계: "3"
    이름: ★★압축부재의 유효좌굴길이 — 4.8.2.2.2 (트러스 설계의 심장부)
    근거: "KDS 14 30 10  4.8.2.2.2"
    작업: 판정
    식위치: >
      **(1) 트러스 면내** —
        ① **현재 → 부재길이**
        ② 거셋으로 현재에 연결된 **수직재·사재 → 연결 고력볼트군 중심 간 거리** 사용 가능,
           **단 부재길이의 0.8배 이상**. 수평·수직브레이싱 등 **양면에 거셋을 대지 않은 구조는
           부재길이의 0.9배**.
        ③ 부재 중간점을 다른 부재가 **유효하게 지지**하면 그 지지점 사이.
      **(2) 트러스 면외** — 부재길이. 단 수평·수직·교문브레이싱으로 지지된 주 트러스 현재·복부재는
        **그 지지점 간 길이**.
      **(3) 축력이 다른 부재** — 면외 지지가 없고 격간마다 압축력 크기가 다르면 **식 4.8-8**, K
        트러스 수직재처럼 **부호가 다르면 식 4.8-9**(이미지 — `kcsc_formula('KDS 14 30 10',
        '4.8.2.2.2')`), 단면 일정한 경우.
      ★구판(24 14 30 4.10.2)과 비교 — 0.8배 하한·0.9배 단면 거셋은 같고, **"버팀부재 지지 인정
      = 부압축재 설계 + 연결 1/4" 조건은 여기 없다**("유효하게 지지" 로만 — 설계자 판단).
      **4.8.2.2.3 직접하중을 받는 부재** — 절점 이외에 하중이 걸리면 축력 + 부가 휨을 **조합응력**
      (4.6)으로. 보도교 트러스 상현에 바닥틀·가로보가 격점 사이에 걸리면 여기.
    출력: "KL (면내·면외 각각)"

  - 단계: "4"
    이름: 부재 응력검토 — 단면별 트리로 (H형강 4.3~4.6 / 원형강관 4.8.1)
    근거: "KDS 14 30 10  4.4.2"
    작업: 판정
    식위치: >
      [3] 의 KL 로 세장비(4.1.8 권장 압축 200 / 인장 300)를 잡고, 허용압축응력(4.4.3 Cc 2구간)·
      인장(4.3.2 두 값)·직접하중 부재의 조합(4.6.2)은 **H형강 트리**로, 강관 부재는 **원형강관
      트리**(4.8.1 — 격점부 링보강재·변형량 포함)로 검토한다.
      ★구판의 "현재는 박스단면·트러스면 평행판 ≥ 40%·수직축 세장비 < 수평축" 요구는 24(철도교)
      규정 — 14 30 10 엔 없다. 단면 선택은 설계자(보도교 트러스는 H형강·강관이 보통).
    다음트리: "응력검토 / H형강 (강교 — 가로보·세로보·브레이싱·지주)"
    다음: "5"
    출력: 부재 응력검토 결과

  - 단계: "5"
    이름: ★2차응력 — 부재 높이 < 부재길이의 1/10 (4.8.2.2.5)
    근거: "KDS 14 30 10  4.8.2.2.5"
    작업: 판정
    식위치: >
      **(1)** 절점 2차응력이 작게 되도록 **주 트러스 부재의 높이는 부재길이의 1/10 보다 작게**.
      **(2)** 절점 강접에 의한 2차응력이 **무시할 수 없는 범위면 2차응력을 고려해 응력 검토**.
      ★h/L ≥ 1/10 이면 "무시할 수 없는" 쪽 신호 — 판단은 설계자. 재검토는 축력 + 강결 휨을 **4.6.2
      조합력**(H형강 트리 [10])으로.
    분기:
      - {조건: "h/L < 1/10 · 2차응력 무시 가능", 결과: "통과", 다음: "6"}
      - {조건: "무시할 수 없다 (h/L ≥ 1/10 등)", 결과: "★축력 + 격점 휨을 4.6.2 조합으로 재검토 — H형강 트리 [10]", 다음: "6"}
    출력: 2차응력 판단

  - 단계: "6"
    이름: ★격점(접합부) — 거셋 대칭 배치 · 두께 식 4.8-10 · 최소 9 mm (4.8.2.5.1)
    근거: "KDS 14 30 10  4.8.2.5.1"
    작업: 판정
    식위치: >
      **(1)** 절점은 단순한 구조로, 연결 용이·검사·청소 지장 없게.
      **(2)① 거셋 연결 고력볼트는 부재축에 대칭**, 부재–거셋 접촉면 전체에 이어지도록.
      **② 현재 복부판에 거셋을 겹쳐 붙이고 부재 양면에 거셋을 쓰는 경우 두께 = 식 4.8-10**(최대
      부재력 kN 과 접촉 폭 mm 의 함수 — 이미지, 강종 무관). **③ 거셋 최소두께 9 mm 표준.**
      ★구판(24 14 30 4.10.3)은 "식 4.10-3 이상 그리고 **11 mm**" — 하한이 다르다(9 vs 11).
      **설계자 확정(2026-08-17): 9 mm** — 14 30 10 값 그대로 쓴다.
      연결부(용접·볼트·블록전단·**75% 규정·현장 90%** 조직 규정)는 연결 트리로. 4.1.11(4) —
      트러스부재 단부 접합부 허용내력 ≥ 부재 허용내력 1/2.
    다음트리: "응력검토 / 연결 이음"
    다음: "7"
    출력: 격점 검토

  - 단계: "7"
    이름: 전체 골조 유의사항 — 전체좌굴 · 변위 · 솟음 (4.8.2.6)
    근거: "KDS 14 30 10  4.8.2.6"
    작업: 판정
    식위치: >
      **4.8.2.6.1(1)** — 전체 길이에 비해 **간격이 매우 좁은 트러스는 전체 좌굴을 합리적 방법으로
      조사** — 보도교 트러스(폭 좁고 길다)에 그대로 걸린다. 포니트러스(상현 면외 지지 없음)는
      상현재 면외 좌굴 = 사실상 전체좌굴 문제 — 수직재+가로보 U형 강성으로 지지(설계자, 원문에
      별도 식 없음 — 구판 24 의 4.10.6/4.8.4 U형 규정은 철도교 기준).
      **4.8.2.6.2** — 수평·수직 변위는 사용목적에 지장 없게(보도교 처짐·**보행자 진동**은 별도 —
      14 30 50 + 설계자). **4.8.2.6.3** — 필요 시 고정하중 솟음.
    출력: 전체좌굴·변위·솟음 확인

  - 단계: "8"
    이름: 지점 (4.8.2.7)
    근거: "KDS 14 30 10  4.8.2.7"
    작업: 판정
    식위치: >
      설계하중이 하부구조로 원활히 전달되도록 지점부를 세심히 — 지점부 단수직브레이싱·다이아프램
      (브레이싱 트리 [6]) + 지지점 회전 구속(4.1.7).
    출력: 지점부 확인

  - 단계: "9"
    이름: 검토(판정)
    근거: "KDS 14 30 10  4.8.2.1"
    작업: 판정
    식위치: >
      유효좌굴길이(면내·면외) · 부재 응력(H형강/원형강관 트리, 조합 포함) · 2차응력 · 격점(거셋
      두께·9 mm·연결 트리) · 전체좌굴 · 변위 · 지점 전부 만족하면 OK. ★기본 조합(증가 1.0)을
      빠뜨리지 말 것. **NG 면 여기서 끝난다** — 단면·형식 변경은 설계자.
    출력: "OK / NG"

  - 단계: "10"
    이름: 종료
    근거: "KDS 14 30 10  4.8.2.1"
    작업: 판정
    식위치: "트러스 검토가 끝났다. [1] 에서 범위 밖으로 판정된 경우는 원문·다른 체계로."
    출력: "OK"

안전주의: >
  ★★★**허용응력설계법이다.** 검토는 응력 비교, 하중은 사용하중. 「강도」·γ·φ 는 존재하지
  않는 개념이다.

  ★★★**KDS 14 30 10 4.8.2 갈래 — 24 14 30 4.10 을 섞지 않는다**(설계자 확정). 다른 자리:
  ⓐ현재 박스단면·40% 판·수직축<수평축 세장비 요구 — 여기 없음 ⓑ버팀부재 지지 인정 조건
  (부압축재 설계 + 연결 1/4) — 여기는 "유효하게 지지" 만 ⓒ거셋 하한 **9 mm**(24 는 11 mm)
  ⓓ포니트러스 U형 규정 — 여기 없음(전체좌굴 조사 4.8.2.6.1 로, 설계자). 조직 관행이 있으면 우선.
  ★★**유효좌굴길이** — 면내: 현재 = L, 거셋 연결 복부재 = 볼트군 중심 간(≥ 0.8 L), 단면 거셋
  0.9 L, 중간 지지 시 지지점 간 / 면외: L, 브레이싱 지지점 간 / 축력 다른 부재 식 4.8-8·4.8-9.
  ★★**2차응력** — 부재 높이 < L/10, 아니면 축력 + 격점 휨을 4.6.2 조합으로 재검토.
  ★**직접하중 부재(격점 사이 하중)는 조합응력**(4.8.2.2.3). ★**간격 좁은 트러스는 전체좌굴 조사**
  (보도교 트러스가 딱 그 경우). ★거셋 볼트 부재축 대칭·접촉면 전체, 두께 식 4.8-10·최소 9 mm.
  ★식(4.8-8·9·10)은 이미지 — `kcsc_formula('KDS 14 30 10','4.8.2')`.
  ★철도교는 이 트리의 적용 범위 밖이다 — 철도교 안건이면 멈추고 원문을 볼 것.

검증일: "2026-08-17"
검증기준:
  "KDS 143010": "2024"
검증: 설계자확정
