부재: 조합력부재 (압축 + 휨)
단면: H형강 · 원형강관 · 각형강관 (1축 및 2축 대칭단면)
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 10  # 강구조 부재 설계기준 (하중저항계수설계법) 4.4 조합력과 비틀림
목표검토: "4.4.1.1 의 상관식 값 ≤ 1.0"

입력:
  - {기호: Pu,  설명: 소요압축강도(계수하중),          단위: kN}
  - {기호: Pr,  설명: "설계압축강도 (4.2 로 산정 — 이 트리가 구하지 않는다)", 단위: kN}
  - {기호: Mux, 설명: 소요휨강도 — 강축,              단위: kN·m}
  - {기호: Mrx, 설명: "설계휨강도 — 강축 (4.3 으로 산정)", 단위: "kN·m"}
  - {기호: Muy, 설명: 소요휨강도 — 약축,              단위: kN·m}
  - {기호: Mry, 설명: "설계휨강도 — 약축 (4.3 으로 산정)", 단위: "kN·m"}
  - {기호: Iyc, 설명: 압축플랜지의 약축 단면2차모멘트, 단위: mm^4}
  - {기호: Iy,  설명: 약축 단면2차모멘트,             단위: mm^4}
  - {기호: T,   설명: "비틀림모멘트 (있으면) — 4.4.3 판정에 쓴다", 단위: kN·m}

흐름:
  - 단계: "1"
    이름: ★비틀림이 함께 작용하는지 확인
    근거: "KDS 14 31 10  4.4.3"
    작업: 판정
    식위치: >
      4.4.3 — **비틀림 또는 비틀림·휨·전단력 또는/과 축력 등을 동시에 받는 부재**.
      비틀림이 함께 작용하면 4.4.1.1 의 상관식만으로는 부족하다.
      ★4.4.1.1 은 **축력 + 휨**만 다룬다. 비틀림은 별도 조항이다.
    분기:
      - {조건: "비틀림이 함께 작용한다", 결과: "4.4.3 을 함께 검토",
         다음트리: "비틀림부재 / 원형·각형강관", 다음: "2"}
      - {조건: "비틀림 없음 (또는 무시할 수준)", 결과: "4.4.1.1 로", 다음: "2"}
    출력: 비틀림 검토 필요 여부

  - 단계: "2"
    이름: 적용 가능 여부 확인
    근거: "KDS 14 31 10  4.4.1.1"
    작업: 판정
    식위치: >
      4.4.1.1(1) — **2축 대칭단면**, 또는 **Iyc/Iy 가 0.1 이상 0.9 이하**이고
      **기하축(x축 또는/과 y축)으로만 휨이 발생하도록 구속된** 1축·2축 대칭단면에 적용한다.
      벗어나면 4.4.2 를 쓴다. (원문 단서: 이 조항 대신 4.4.2 를 적용할 수도 있다)
    분기:
      - {조건: "적용 범위 안",   결과: "4.4.1.1 적용",      다음: "3"}
      - {조건: "적용 범위 밖 (Iyc/Iy 벗어남·비대칭·기하축 외 휨)",
         결과: "4.4.2 로 넘어간다", 다음: "6"}

  - 단계: "3"
    이름: 설계압축강도 Pr 산정
    근거: "KDS 14 31 10  4.2"
    작업: 산정
    식위치: >
      4.2 — 압축부재 기준으로 별도 산정한다. **이 트리가 구하지 않는다.**
      압축부재 트리에서 Pr 을 산출해 돌아와 여기에 넣는다.
    # `다음트리` + `다음` 을 함께 쓰면 "그 트리로 가서 구해 오고, 돌아와 이 단계로" 라는 뜻이다.
    분기:
      - {조건: "H형강",   결과: "압축부재 트리에서 Pr 산출 후 복귀",
         다음트리: "압축부재 / H형강",   다음: "4A"}
      - {조건: "원형강관", 결과: "압축부재 트리에서 Pr 산출 후 복귀",
         다음트리: "압축부재 / 원형강관", 다음: "4A"}
      - {조건: "각형강관", 결과: "압축부재 트리에서 Pr 산출 후 복귀",
         다음트리: "압축부재 / 각형강관", 다음: "4A"}
    출력: Pr

  # ── [4A]·[4B] 는 **병렬**이다. 강축과 약축을 각각 다른 트리로 구한다.
  - 단계: "4A"
    이름: "〔병렬〕 ★설계휨강도 Mrx (강축) 산정 — 단면에 맞는 트리로"
    근거: "KDS 14 31 10  4.3"
    작업: 산정
    식위치: >
      ★**강축 휨은 단면 분류에 따라 조항이 갈린다.** 아무 트리나 쓰면 안 된다.
        4.3.2.1.1.2·4.3.2.1.1.3 — 2축대칭 H형강
        4.3.2.1.1.4 — 1축대칭(비정형) H형강, 웨브 조밀·비조밀
        4.3.2.1.1.5 — 세장판 웨브
        ★**4.3.2.1.1.8 — 원형강관**(휨 전용 절. 횡비틀림좌굴 한계상태가 **없다**)
      각 트리의 `[1] 축력 함께 작용?` 분기에서 **"조합력 트리에서 Mr 산출용으로 불려옴"**
      을 골라 되돌아오지 않게 한다.
    분기:
      - {조건: "2축대칭 H형강",        결과: "4.3.2.1.1.2 / 4.3.2.1.1.3",
         다음트리: "휨부재 / 2축대칭 H형강",     다음: "4B"}
      - {조건: "1축대칭(비정형) H형강", 결과: "4.3.2.1.1.4",
         다음트리: "휨부재 / 1축대칭 H형강",     다음: "4B"}
      - {조건: "세장판 웨브",          결과: "4.3.2.1.1.5",
         다음트리: "휨부재 / 세장판웨브 H형강", 다음: "4B"}
      - {조건: "★원형강관",            결과: "4.3.2.1.1.8",
         다음트리: "휨부재 / 원형강관",          다음: "4B"}
      - {조건: "★각형강관",            결과: "4.3.2.1.1.7",
         다음트리: "휨부재 / 각형강관",          다음: "4B"}
    출력: Mrx

  - 단계: "4B"
    이름: "〔병렬〕 ★설계휨강도 Mry (약축) 산정 — 약축은 조항이 다르다"
    근거: "KDS 14 31 10  4.3.2.1.1.6"
    작업: 산정
    식위치: >
      ★★**약축 휨은 4.3.2.1.1.6 이다. 강축 트리에서 뽑으면 안 된다.**
      약축에는 **횡비틀림좌굴 한계상태가 없고**(항복·플랜지 국부좌굴 둘뿐),
      전단도 4.3.2.1.2.7 로 조항이 다르다.
      Muy = 0 (약축 휨이 없음) 이면 이 단계를 건너뛴다.
      ★★**원형강관에는 약축이 없다.** 모든 방향의 단면성능이 같으므로
      **Mry = Mrx** 이고 [4A] 에서 이미 구한 값을 그대로 쓴다.
      다만 상관식(4.4.1.1)은 **x·y 성분을 따로 두므로**, 2축 휨이면 **Mux·Muy 를 각각
      넣되 Mrx = Mry** 로 계산한다. 약축 트리로 갈 필요가 없다.
    분기:
      - {조건: "★원형강관 — 약축이 없다", 결과: "Mry = Mrx (4A 의 값 그대로)", 다음: "5"}
      - {조건: "★각형강관 — 약축도 4.3.2.1.1.7", 결과: "같은 절, 약축 단면성능으로 다시",
         다음트리: "휨부재 / 각형강관", 다음: "5"}
      - {조건: "H형강 · 약축 휨이 있다 (Muy ≠ 0)", 결과: "4.3.2.1.1.6 으로",
         다음트리: "휨부재 / 약축 H형강", 다음: "5"}
      - {조건: "약축 휨 없음 (Muy = 0)",  결과: "Mry 불필요", 다음: "5"}
    출력: Mry

  - 단계: "5"
    이름: 상관식 적용
    근거: "KDS 14 31 10  4.4.1.1"
    작업: 판정
    식위치: >
      Pu/Pr 값으로 갈린다 — **식 (4.4-1)** 또는 **식 (4.4-2)**. 식 내용은 원문 이미지.
      ★저항계수는 원문에 **글자로** 적혀 있다 — **φc = 0.90(압축) · φb = 0.90(휨)**.
      **다만 이 값은 KDS 14 31 10 (건축계열) 의 값이다.**
      ★**교량이면 KDS 24 14 31 4.1.4.2 의 저항계수를 쓴다.**
    분기:
      - {조건: "Pu/Pr ≥ 0.2", 결과: "식 (4.4-1) 적용", 다음: "7"}
      - {조건: "Pu/Pr < 0.2", 결과: "식 (4.4-2) 적용", 다음: "7"}
    출력: 상관식 값

  - 단계: "6"
    이름: 비대칭·기타 단면 경로
    근거: "KDS 14 31 10  4.4.2"
    작업: 산정
    식위치: >
      4.4.2 — **휨과 축력을 받는 비대칭 단면 부재 및 기타 부재.**
      4.4.1.1 의 적용 범위를 벗어나면 이 조항을 쓴다.
      ★이 트리는 4.4.2 의 상세 흐름을 담고 있지 않다 — 원문을 직접 볼 것.
    출력: 상관식 값

  - 단계: "7"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.4.1.1"
    작업: 판정
    식위치: >
      상관식 값 ≤ 1.0 이면 OK, 아니면 NG.
      ★**NG 면 여기서 끝난다.** 단면 변경은 계산서에서 설계자가 한다.
      **후행작업은 OK 인 경우에만** 이어진다.
    출력: "OK / NG"

  - 단계: "8"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 10  4.4"
    작업: 판정
    식위치: >
      **배타 선택이 아니라 체크리스트**다 — 해당하는 것을 **모두** 검토한다.
        □ 플랜지에 **볼트구멍**이 있는가                → [9]  (4.4.4)
             ★4.4.4 는 "**인장을 받는 플랜지**"의 조항이다 — 원형강관은 플랜지가 없어
               그대로 대응되지 않는다. 슬롯·구멍이 있으면 원문을 직접 확인할 것.
        □ **비틀림**이 함께 작용하는가 (원형강관은 흔하다) → [1] 에서 이미 갈랐다
        □ **이음·연결부**가 있는가 (볼트/용접 불문)             → [10]
      해당 없으면 그대로 종료한다.
    출력: 해당 항목 목록

  - 단계: "9"
    이름: ★구멍이 있는 플랜지의 인장파단 (해당하면)
    근거: "KDS 14 31 10  4.4.4"
    작업: 판정
    식위치: >
      4.4.4 — **구멍이 있는 플랜지의 인장파단.**
      조합력 부재라도 **인장측 플랜지에 볼트구멍이 있으면 그 자리에서 파단**할 수 있다.
      상관식(4.4.1.1)은 이것을 잡아 주지 않는다 — 별도 조항이다.
    출력: 인장파단 검토

  - 단계: "10"
    이름: ★연결부 있음 — 「연결부 설계」 단계로 (해당하면)
    근거: "KDS 14 31 10  4.4.1.1"
    작업: 판정
    식위치: >
      ★★**여기서는 「연결부가 있다」는 것만 기록한다.** 실무 순서가 그렇다 —
      **부재별 단면검토를 전부 마친 뒤** 「연결부 설계」 단계에서 처리한다.
      연결재가 **볼트냐 용접이냐**는 거기서 **한 번만** 갈린다
      (진입 트리 `강교 부재 / 전체` 의 [9]).
        볼트 → 4.1.3 `연결부 / 볼트접합`   ·   용접 → 4.1.2 `연결부 / 용접접합`
      그리고 **연결재 형식과 무관하게 접합부재 4.1.4** (`연결부 / 접합부재`) 를 **반드시**.
      ★**부재가 OK 여도 접합부에서 파괴되면 그 부재는 못 쓴다.**
    출력: "연결부 있음 (형식은 연결부 설계 단계에서)"

  - 단계: "11"
    이름: 종료
    근거: "KDS 14 31 10  4.4.1.1"
    작업: 판정
    식위치: "부재 검토와 해당하는 후행작업이 모두 끝났다"
    출력: "OK"

안전주의: >
  ★이 트리는 **압축 + 휨** 조합이다. 인장 + 휨은 **4.4.1.2** 로 조항이 다르다.
  비틀림이 함께면 **4.4.3** 을 추가로 검토한다([1]).

  ★★**Mrx(강축)와 Mry(약축)는 서로 다른 조항·다른 트리에서 나온다.**
    강축 — 4.3.2.1.1.2/.3(2축대칭) · 4.3.2.1.1.4(1축대칭) · 4.3.2.1.1.5(세장판 웨브)
    약축 — **4.3.2.1.1.6** (횡비틀림좌굴 한계상태가 **없다**)
  약축 휨강도를 강축 트리에서 뽑으면 **없는 한계상태를 넣거나 있는 것을 빼게 된다.**

  ★Pr·Mrx·Mry 는 이 트리가 산정하지 않는다 — 4.2(압축)·4.3(휨) 각각의 트리로 먼저 구해
  여기에 넣는 값이다. **그 앞단이 틀리면 상관식도 통째로 틀린다.**
  ★분기 기준 **Pu/Pr** 은 KDS 표기다(AISC 의 Pr/Pc 와 기호가 다르니 혼동하지 말 것).
  ★저항계수 — 원문(4.4.1.1)에 **φc = 0.90 · φb = 0.90** 이 글자로 적혀 있으나 이는
  **건축계열(KDS 14) 값**이다. **교량이면 KDS 24 14 31 4.1.4.2 에서 가져온다.**
  ★적용 범위(Iyc/Iy 0.1~0.9, 기하축 구속)를 벗어나면 **4.4.2** 다. 억지로 4.4.1.1 을
  쓰면 안 된다.
  ★**소요강도 Pu·Mux·Muy 는 2차효과가 반영된 값**이어야 한다. 이 트리는 그 앞단
  (구조해석·하중조합)을 다루지 않는다.

  ★★**원형강관도 이 트리를 쓴다.** 4.4.1.1 은 **2축 대칭단면**에 적용되고 원형강관은
  2축대칭이므로 적용 범위 안이다(Iyc/Iy 조건을 따질 필요가 없다). 다만 **불러오는 하위
  트리가 다르다** —
    압축 Pr → `압축부재 / 원형강관`   (4.2)
    휨  Mr → `휨부재 / 원형강관`     (**4.3.2.1.1.8**, 횡비틀림좌굴 한계상태 **없음**)
  ★**원형강관에는 약축이 없다.** Mry = Mrx 이고 약축 트리(4.3.2.1.1.6)로 가면 안 된다 —
  그 절은 H형강·ㄷ형강 전용이다.
  ★**원형강관은 비틀림이 실제로 걸린다**(폐단면이라 비틀림강성이 크다). [1] 의 비틀림
  분기를 그냥 지나치지 말 것.
  ★**4.4.4(구멍이 있는 플랜지의 인장파단)는 "인장을 받는 플랜지"의 조항**이라
  원형강관에 그대로 대응되지 않는다. 슬롯·구멍이 있으면 원문을 직접 확인할 것.

