부재: 하중조합
단면: 보도교 (허용응력 — 원형강관 거더 · H형강 부부재)
설계법: 허용응력설계법
근거: KDS 24 12 10  # 교량 설계하중조합(일반설계법) 4.2.3 — 강교 표 4.2-1 을 보도교에 준용
목표검토: "각 하중조합에서  작용응력 ≤ 허용응력 × 허용응력 증가계수"

입력:
  - {기호: D,  설명: 고정하중 (강재 자중 · 바닥재 · 난간 · 부대시설),      단위: "-"}
  - {기호: L,  설명: "보도 활하중 (군중하중, 등분포)",                       단위: "kN/m²"}
  - {기호: PL, 설명: "난간 하중 (상단 수평 · 핸드레일 수직)",                단위: "N/m"}
  - {기호: W,  설명: 풍하중,                                                단위: "kN/m²"}
  - {기호: T,  설명: 온도변화의 영향,                                       단위: "℃"}
  - {기호: E,  설명: 지진의 영향,                                           단위: "-"}
  - {기호: SW, 설명: 설하중,                                                단위: "-"}
  - {기호: CO, 설명: "충돌하중 (도로 위를 건너는 경우 차량 충돌 등)",         단위: "-"}
  - {기호: ER, 설명: 가설 시 하중,                                          단위: "-"}
  - {기호: H,  설명: "토압 (교대·기초를 함께 보는 경우만)",                   단위: "-"}
  - {기호: Q,  설명: "수압·부력 또는 양압력 (하천 횡단 등 해당 시)",           단위: "-"}
  - {기호: CR, 설명: "콘크리트 크리프 (합성 바닥판일 때만)",                  단위: "-"}
  - {기호: SH, 설명: "콘크리트 건조수축 (합성 바닥판일 때만)",                단위: "-"}

흐름:
  - 단계: "1"
    이름: ★설계법·교량 종류 확인 — 이 트리는 「보도교 · 허용응력」 전용
    근거: "KDS 24 12 10  4.2.1"
    작업: 판정
    식위치: >
      ★★**허용응력설계법의 하중조합이다 — 계수하중이 아니다.** 사용하중 조합을 그대로
      쓰고 **「허용응력」쪽에 증가계수를 곱한다.** 한계상태설계법의 극한Ⅰ(γ=1.80 등)과는
      틀이 다르다.
      ★★**근거 기준의 정체를 알고 쓴다** — KDS 24 12 10 은 1.1 적용범위가 "철도교량의
      설계하중조합" 이고, 하중 크기를 주는 KDS 24 12 20 도 1.1 이 "철도교량" 이다.
      KDS 안에 보도교 허용응력설계법 전용 하중조합은 없다. **강교 표 4.2-1 을 보도교에
      준용하는 것은 설계자 확정(2026-08-17)** 이며, 계산서에 그렇게 밝힌다.
      ★증가계수 표가 교량 종류마다 다르다 — **강교 표 4.2-1** / 콘크리트교 표 4.2-2 /
      하부구조 표 4.2-3. 이 트리는 **강교 표 4.2-1** 을 쓴다.
    분기:
      - {조건: "보도교 (원형강관 거더 · H형강 부부재, 강 상부구조)", 결과: "표 4.2-1 준용", 다음: "2"}
      - {조건: "⛔철도교이다",           결과: "★이 트리의 적용 범위 밖 — 여기서 멈춘다.
              장대레일 종하중(LR)·탈선하중(DR)·차량횡하중(LF) 등 철도 고유 하중이 걸리므로 원문 확인", 다음: "9"}
      - {조건: "⛔도로교(자동차 하중)를 허용응력으로",  결과: "★KDS 에 근거가 없다(도로교는 한계상태설계법
              KDS 24 12 11 뿐). 구 도로교설계기준(2010)은 KDS 밖 — 이 트리를 쓰지 말고 멈춘다", 다음: "9"}
      - {조건: "콘크리트교 · 하부구조",  결과: "표 4.2-2 · 표 4.2-3 — 이 트리 범위 밖.
              ★증가계수 값이 강교와 다르다(지진: 강교 1.55 / 콘크리트교 1.40). 원문 확인", 다음: "9"}
    출력: 적용 표

  - 단계: "2"
    이름: ★보도교 하중의 크기 — KDS 24 12 20 에서 글자로 읽히는 것
    근거: "KDS 24 12 20  4.1.4"
    작업: 판정
    식위치: >
      **4.1.4(4)② 군중하중** — ★★**설계자 확정(2026-08-17): 표 4.1-10 으로 재하한다.**
      라. "구조계산의 대상에 따라 표 4.1-10 의 군중하중을 재하할 수 있다" —
      **표 4.1-10 (상시, kN/m²): 보·기둥 3.5 / 콘크리트 슬래브 5.0 / 교량점검시설 4.0.**
      → 거더·가로보·지주(보·기둥) = **3.5 kN/m²**. 표가 슬래브를 5.0 으로 따로 두므로
      콘크리트 바닥판을 함께 설계하면 그 부재는 5.0. (참고: 나. 항은 "보도부를 직접
      지지하는 구조 5 kN/m²" — 표 4.1-10 라. 항이 이를 대상별로 갈라 준 것이고, 어느 쪽을
      쓰는지는 계산서에 "표 4.1-10" 으로 근거 명시.)
      **4.1.4(4)③ 난간하중** — 상단 **수평 800 N/m**(특별한 경우 2.5 kN, 보도면 1.5 m 높이),
      핸드레일 **수직 800 N/m**. **라. "이 하중은 풍하중과 조합해야 한다."**
      ★설계자 확정: 난간하중은 **고정하중 분류(주하중 P)** 에 넣는다 → 모든 조합에 든다
      (풍 조합에도 자동으로 든다 — 라. 항 충족).
      **4.1.4(1) 풍하중** — 연직투사면 **3.0 kN/m²**(열차 없을 때 값 = 보도교의 상시).
      ★**④ 원형 또는 이에 준하는 단면 부재는 0.6배** — 원형강관 거더에 바로 걸린다.
      **4.1.4(2) 온도** — 강교 −20 ~ +50 ℃(가설 시 온도 기준), 가설 온도 미상이면 ±35 ℃
      (한냉지 ±45 ℃), 선팽창계수 12×10⁻⁶.
      ★**충격(I)·원심(CF)은 철도차량 하중의 부속** — 보도 활하중에는 걸지 않는다(원문에
      보도하중 충격 규정 없음). ★고정하중은 4.1.2 영구하중, 충돌은 4.1.5 특수하중.
      ★**보행자 진동(사용성)은 하중조합이 아니라 별도 검토** — 이 트리 밖(원문에 없음,
      설계자 확인).
    분기:
      - {조건: "거더 · 가로보 · 지주 (표 4.1-10 의 보·기둥)", 결과: "L = 3.5 kN/m² — 계산서에 근거 「KDS 24 12 20 표 4.1-10」 명시", 다음: "3"}
      - {조건: "콘크리트 바닥판(슬래브)을 함께 설계",          결과: "그 부재는 L = 5.0 kN/m² (표 4.1-10 슬래브 행)", 다음: "3"}
    출력: 하중 크기 (L · PL · W · T)

  - 단계: "3"
    이름: 하중 분류 — 주하중 / 부하중 / 특수하중
    근거: "KDS 24 12 10  4.2.3"
    작업: 판정
    식위치: >
      4.2.3(2) — 하중을 넷으로 나눈다(전부 글자로 읽힌다). **보도교에 걸리는 것만 남기면:**
        **주하중 (P)**  — 고정하중 D(**난간하중 PL 포함 — 설계자 확정**) · 활하중 L(보도) ·
                         크리프 CR · 건조수축 SH(합성일 때) · 토압 H · 수압·부력 Q(해당 시)
                         ※ 원문의 충격 I · 원심하중 CF · 장대레일 종하중 LR 은 **철도 고유
                         — 보도교엔 해당 없음**
        **부하중 (S)**  — 풍하중 W
                         ※ 원문의 차량횡하중 LF · 시동/제동하중 SB 는 **철도 고유 — 해당 없음**
        **주하중에 상당하는 특수하중 (PP)** — 설하중 SW · 지반변동 GD · 지점이동 SD · 파압 WP
        **부하중에 상당하는 특수하중 (PA)** — 온도 T · 지진 E · 가설 시 ER · 충돌 CO
                         ※ 원문의 탈선하중 DR 은 **철도 고유 — 해당 없음**
      ★**난간하중 PL** 은 4.2.3 분류표에 없다 → **고정하중과 같은 분류(P)** 에 넣는다
      (설계자 확정 2026-08-17). P 에 들어 있으니 모든 조합 — 풍 조합(24 12 20 4.1.4(4)③라
      "풍하중과 조합") 포함 — 에 자동으로 든다.
      ★이 분류가 증가계수를 정한다 — **주하중만의 조합이면 증가 없음**, 부하중·특수하중이
      끼면 조합별 증가계수가 붙는다(4.2.3(1)①②).
    출력: 하중 분류

  - 단계: "4"
    이름: ★기본 조합 — 주하중만 (증가계수 없음)
    근거: "KDS 24 12 10  4.2.3"
    작업: 판정
    식위치: >
      4.2.3(1)① — **주하중(P) 및 주하중에 해당하는 특수하중(PP)에 대한 허용응력은
      각 장에 규정한 값** 그대로다. 즉 **P + PP 조합은 증가계수 1.0** 이다.
      보도교에서는 **D(난간 포함) + L** 이 이 조합이고 **단면을 지배하는 경우가 가장 많다** —
      증가계수가 붙는 조합은 하중은 커져도 허용응력도 같이 커지기 때문이다.
    출력: "기본 조합 (증가 없음)"

  - 단계: "5"
    이름: "〔병렬·체크리스트〕 ★표 4.2-1 의 조합 11개 중 보도교에 걸리는 5개"
    근거: "KDS 24 12 10  4.2.3"
    작업: 판정
    식위치: >
      **표 4.2-1 (강교) — 글자 표라서 값이 그대로 읽힌다.** 11개 조합 중 LF·SB(철도
      고유)가 든 6개(2·3·5·6·7·8)는 보도교에 **해당 없음**. 남는 것을 **모두** 검토한다:
        1   P + PP + T   (온도)                     → **1.15**
        4   P + PP + W   (풍)                       → **1.25**
        9   P* + E       (지진)                     → **1.55**
        10  P + CO       (충돌)                     → **1.60**
        11  ER           (가설)                     → **1.25**
      ★★**증가계수는 「허용응력」에 곱한다** — 하중을 줄이는 계수가 아니다.
      ★난간하중 PL 은 P 에 들어 있으므로 조합 4 (풍)에도 자동으로 든다(24 12 20 4.1.4(4)③라 충족).
      ★원문 표에 **T + W 동시 조합은 없다**(강교 표) — 필요하다고 판단되면 설계자가
      별도로 정한다(4.2.3(3)② 가. 단서의 취지).
      적용 대상 허용응력은 **부재 트리(KDS 14 30 10 계열)가 정한 값**이다 — 이 트리는
      증가계수만 넘긴다.
    출력: 검토 대상 조합 목록

  - 단계: "6"
    이름: ★지진 조합(9)의 단서 — 주하중* 이 다르다
    근거: "KDS 24 12 10  4.2.3"
    작업: 판정
    식위치: >
      표 4.2-1 주) — 조합 9 (P* + E) 의 **주하중* 은 보통의 주하중과 다르다**:
        · **충격(I)과 원심하중(CF)을 포함시키지 않는다** (보도교엔 애초에 없음)
        · **단선 활하중을 포함시킨다** — ★철도 문맥의 문구다(복선 만재가 아니라 한 선만).
          보도교에는 대응 문구가 없다 → **설계자 확정(2026-08-17): 지진 조합에도 보도
          활하중을 동일하게(3.5 kN/m² 전부) 적용한다.** 즉 **P* = D(난간 포함) + L**.
      ★원문 주)의 취지(지진 시 만재 아님)를 보도교에 옮기지 않고 활하중을 그대로 두는
      것이라 안전측이다. 계산서에 "표 4.2-1 주)의 단선 활하중은 철도 문구, 보도 활하중
      전량 적용" 이라고 밝힌다.
    출력: 지진 조합의 주하중 구성 — P* = D(난간 포함) + L

  - 단계: "7"
    이름: ★가설하중 조합(11)의 단서
    근거: "KDS 24 12 10  4.2.3"
    작업: 판정
    식위치: >
      표 4.2-1 주) — **"가설기간이 특히 길거나 신공법으로 가설되는 교량에 대해서는
      허용응력을 증가시키지 않는다."**
      → 그 경우 조합 11 의 증가계수 1.25 를 **쓰면 안 된다** (1.0).
      ★가설 시 풍하중·지진을 함께 고려하는 경우의 증가계수는 표값과 무관하게
      **별도로 정한다**(4.2.3(3)② 가. 단서) — 가교지점 조건·시공 중 구조계를 보고.
      ★원형강관 거더 **일괄 가설(크레인 인양)** 이면 인양점 조건의 ER 이 지배할 수 있다.
    분기:
      - {조건: "가설기간이 길다 · 신공법", 결과: "★증가 없음 (1.0)", 다음: "8"}
      - {조건: "통상의 가설",             결과: "1.25 적용",        다음: "8"}
    출력: 가설 조합 증가계수

  - 단계: "8"
    이름: 피로 — 보도교는 별도 트랙, 대개 지배하지 않음
    근거: "KDS 24 12 10  4.2.3"
    작업: 판정
    식위치: >
      피로 검토용 하중은 증가계수 조합과 **별개 트랙**이다(허용응력 체계 공통).
      ★이 뼈대(KDS 14 30 10 계열)에서 피로는 **KDS 14 30 20(강구조 피로 및 파단·허용응력)**
      이 맡는다 — 부재 트리 쪽에서 잇는다. 보도교는 반복 활하중의 진폭이 작아 피로가
      단면을 지배하는 경우가 드물지만, **용접 상세(원형강관–H형강 가로보 접합부)** 는
      확인 대상이다(설계자 판단).
    출력: 피로 검토용 하중 구성 (별도)

  - 단계: "9"
    이름: 종료 — 부재 응력검토로
    근거: "KDS 24 12 10  4.2.3"
    작업: 판정
    식위치: >
      각 조합의 단면력으로 **부재 응력을 계산**하고, 부재별 **허용응력 × 그 조합의
      증가계수**와 비교한다. 부재 응력검토는 **KDS 14 30 10 계열** 트리로 이어진다 —
      원형강관 거더는 `응력검토 / 원형강관`, H형강 부부재는 `응력검토 / H형강`(둘 다 14 30 10).
      허용응력·증가계수 정합은 `허용응력 / 구조용 강재·용접부`, 처짐·진동은 `사용성 / 보도교`.
      ★철도교·도로교(ASD)·콘크리트교·하부구조로 판정된 경우는 이 트리 범위 밖 — 원문을
      볼 것 (그 경우 아래 링크를 타지 않는다).
    분기:
      - {조건: "원형강관 거더",         결과: "거더 응력검토", 다음트리: "응력검토 / 원형강관"}
      - {조건: "H형강 가로보·부부재",   결과: "부부재 응력검토", 다음트리: "응력검토 / H형강 (강교 — 가로보·세로보·브레이싱·지주)"}
      - {조건: "허용응력·증가계수 정합 먼저", 결과: "Fy·보정계수·증가계수", 다음트리: "허용응력 / 구조용 강재·용접부"}
      - {조건: "범위 밖으로 판정됨",     결과: "멈춘다 — 원문", 다음기준: "KDS 24 12 10  4.2.1"}
    출력: "조합별 (하중, 증가계수) 목록"

안전주의: >
  ★★★**허용응력설계법이다 — 「강도」라는 말을 쓰지 않는다.** 검토는
  **작용응력 ≤ 허용응력 × 증가계수** 이고, 하중은 **사용하중**(계수를 곱하지 않는다),
  안전 여유는 **허용응력 안에 이미 들어 있다.**
  한계상태설계법의 하중계수(γ)·저항계수(φ)는 여기 **존재하지 않는 개념**이다.

  ★★★**근거 기준은 철도교 기준이다.** KDS 24 12 10 1.1 "철도교량의 설계하중조합",
  KDS 24 12 20 1.1 "철도교량의 설계하중". KDS 에는 보도교 허용응력설계법 하중조합이
  따로 없다. **강교 표 4.2-1 과 24 12 20 의 보도·난간·풍·온도 값을 보도교에 준용하는
  것은 설계자 확정(2026-08-17)** — 계산서에 "KDS 24 12 10 표 4.2-1 준용" 이라고 밝힌다.
  철도 고유 하중(충격 I · 원심 CF · 장대레일 LR · 차량횡하중 LF · 시동/제동 SB · 탈선 DR)은
  **보도교에 해당 없음**으로 뺐다 — 철도교 안건이면 이 트리를 쓰지 말고 원문을 볼 것.

  ★★**증가계수는 허용응력에 곱하는 계수다** — 하중을 줄이는 계수가 아니다.
  방향을 반대로 쓰면 전 조합이 위험측이 된다.
  ★★**주하중만의 조합(D + L)은 증가 없음(1.0)** 이고, 보도교에서 이 조합이 단면을
  지배하는 경우가 가장 많다. 증가계수 조합만 보고 기본 조합을 빠뜨리면 안 된다.
  ★**보도 활하중은 KDS 24 12 20 표 4.1-10 으로 — 보·기둥 3.5 kN/m²**(설계자 확정
  2026-08-17). 표가 슬래브를 5.0 으로 따로 두므로 콘크리트 바닥판은 5.0. 계산서에
  근거를 「표 4.1-10」 으로 적는다(4.1.4(4)②나 의 5 kN/m² 문구와 다르게 읽히지 않도록).
  ★**원형강관 부재의 풍하중은 0.6배**(24 12 20 4.1.4(1)④) — 거더가 원형강관이면
  바로 걸린다. 난간·바닥은 0.6 대상이 아니다.
  ★**난간하중은 고정하중과 같은 분류(P)** (설계자 확정) → 모든 조합에 든다. 풍하중과의
  조합(24 12 20 4.1.4(4)③라)도 그로써 충족된다.
  ★**지진 조합에도 보도 활하중을 동일하게 전량 적용**(설계자 확정) — 표 4.2-1 주)의
  "단선 활하중"은 철도 문구라 보도교에 옮기지 않는다. 계산서에 명시.
  ★**가설기간이 길거나 신공법이면 가설 조합의 증가를 쓰지 않는다**(표 주).
  ★**표가 교량 종류마다 다르다** — 강교 표 4.2-1 / 콘크리트교 표 4.2-2 / 하부구조
  표 4.2-3. 지진 증가계수부터 다르다(강교 1.55 / 콘크리트교 1.40).
  ★**보행자 진동(사용성)은 이 트리 밖** — 하중조합으로 잡히지 않는다.
  ★표 4.2-1 은 **글자 표**라서 이 트리의 증가계수 값은 원문에서 그대로 읽어 옮긴
  것이다. 다만 **최종 확인은 원문으로** 할 것 — `kcsc_read('KDS 24 12 10','4.2.3')`,
  `kcsc_read('KDS 24 12 20','4.1.4')`.

검증일: "2026-08-17"
검증기준:
  "KDS 241210": "2016"
  "KDS 241220": "2021"
검증: 설계자확정
