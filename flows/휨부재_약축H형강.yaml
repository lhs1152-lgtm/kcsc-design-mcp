부재: 휨부재
단면: 약축 H형강 (약축 휨, ㄷ형강 포함)
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 10  # 4.3.2.1.1.6 약축 휨을 받는 H형강 또는 ㄷ형강 부재
목표검토: "설계휨강도 φb·Mn  ≥  소요휨강도 Muy   (전단은 φv·Vn ≥ Vuy 별도)"

입력:
  - {기호: Zy,  설명: 약축 소성단면계수,      단위: mm^3}
  - {기호: Sy,  설명: "약축 탄성단면계수 (★ㄷ형강은 최소단면계수)", 단위: mm^3}
  - {기호: bf,  설명: 플랜지 폭,              단위: mm}
  - {기호: tf,  설명: 플랜지 두께,            단위: mm}
  - {기호: Fy,  설명: 강재 항복강도,          단위: MPa}
  - {기호: E,   설명: 강재 탄성계수,          단위: MPa}
  - {기호: Muy, 설명: 소요휨강도(약축),       단위: kN·m}
  - {기호: Vuy, 설명: "소요전단강도(약축 방향)", 단위: kN}
  - {기호: N,   설명: "축력 (있으면) — 조합력 판정에 쓴다", 단위: kN}

흐름:
  # ★조합 여부를 **맨 앞에서** 묻는다(다른 부재 트리와 같은 배치).
  #   축력이 함께 작용하면 순수 휨 흐름을 타면 안 된다.
  - 단계: "1"
    이름: 축력이 함께 작용하는지 확인
    근거: "KDS 14 31 10  4.4.1"
    작업: 판정
    식위치: "4.4.1.1(압축+휨) · 4.4.1.2(인장+휨) — 축력이 함께 작용하면 상관식으로 검토한다"
    분기:
      - {조건: "축력 함께 — 압축", 결과: "조합력 트리로",
         다음트리: "조합력부재 (압축 + 휨) / H형강"}
      - {조건: "축력 함께 — 인장", 결과: "조합력 트리로",
         다음트리: "조합력부재 (인장 + 휨) / H형강"}
      - {조건: "순수 약축 휨 (또는 조합력 트리에서 Mry 산출용으로 불려옴)",
         결과: "이 트리를 계속", 다음: "2"}

  - 단계: "2"
    이름: 플랜지 폭두께비 분류
    근거: "KDS 14 31 10  4.3.2.1.1.1 + 표 4.3-2"
    작업: 판정
    식위치: >
      ★분류가 먼저다 — 분류 결과가 강도 산정 경로를 정한다.
      표 4.3-2 의 **조밀단면 플랜지 한계 λpf · 비조밀단면 플랜지 한계 λrf** (원문 이미지).
      ★한계상태(표 4.3-1, 4.3.2.1.1.6 행): **항복 · 플랜지 국부좌굴**.
      **횡비틀림좌굴이 없다** — 약축 휨의 특징이고 강축(4.3.2.1.1.2)과 결정적으로 다르다.
    분기:
      - {조건: "조밀단면 플랜지",     결과: "국부좌굴 산정 불필요 — 항복만", 다음: "3"}
      - {조건: "비조밀단면 플랜지",   결과: "식 (4.3-38)",                다음: "3"}
      - {조건: "세장판 단면 플랜지",  결과: "식 (4.3-39)",                다음: "3"}
    출력: 플랜지 분류

  - 단계: "3"
    이름: "〔병렬〕 항복강도(소성모멘트) 산정"
    근거: "KDS 14 31 10  4.3.2.1.1.6"
    작업: 산정
    식위치: "식 (4.3-37) — 약축 항복강도. Zy·Sy 기반(원문 이미지).
             ★ㄷ형강은 Sy 에 **최소단면계수**를 쓴다"
    출력: Mn(항복)

  - 단계: "4"
    이름: "〔병렬〕 플랜지 국부좌굴강도 산정 (조밀이면 생략)"
    근거: "KDS 14 31 10  4.3.2.1.1.6"
    작업: 산정
    식위치: >
      4.3.2.1.1.6(2) — ① 조밀단면 플랜지는 **산정하지 않는다**.
      ② 비조밀단면 플랜지 식 (4.3-38) / ③ 세장판 단면 플랜지 식 (4.3-39).
      Fcr 은 식 (4.3-40).
    출력: Mn(국부좌굴)

  - 단계: "5"
    이름: 공칭휨강도 결정
    근거: "KDS 14 31 10  4.3.2.1.1.6"
    작업: 판정
    식위치: "4.3.2.1.1.6 머리글 — 항복강도와 플랜지 국부좌굴강도 중 **최솟값**"
    출력: Mn

  - 단계: "6"
    이름: 설계휨강도 산정
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 계산
    식위치: "설계휨강도 = φb·Mn. 저항계수 φb 값은 원문
             (★교량이면 KDS 24 14 31 4.1.4.2 의 값)"
    출력: φbMn

  - 단계: "7"
    이름: ★약축 전단강도 검토
    근거: "KDS 14 31 10  4.3.2.1.2.7"
    작업: 산정
    식위치: >
      ★**약축 전단은 강축과 조항이 다르다.**
      4.3.2.1.2.7 — 약축에 하중이 작용하는 1축·2축대칭 단면의 **각 저항요소**에 대한
      공칭전단강도 Vn 은 **식 (4.3-85)** 와 **4.3.2.1.2.2(1)②나.** 에 따라 산정한다.
      단, 단면적과 계수에 그 절이 정한 단서가 붙는다(원문 이미지).
      강축 전단(4.3.2.1.2.2·4.3.2.1.2.3, 인장역작용 분기)을 그대로 쓰면 안 된다.
    출력: φvVn(약축)

  - 단계: "8"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: >
      Muy ≤ φb·Mn 이고 Vuy ≤ φv·Vn 이면 OK.
      ★**NG 면 여기서 끝난다.** 단면 변경은 계산서에서 설계자가 한다.
      **후행작업은 OK 인 경우에만** 이어진다.
    출력: "OK / NG"

  - 단계: "9"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 10  4.3"
    작업: 판정
    식위치: >
      **배타 선택이 아니라 체크리스트**다 — 해당하는 것을 **모두** 검토한다.
        □ **이음·연결부**가 있는가 (볼트/용접 불문) → [10]
      해당 없으면 그대로 종료한다.
    출력: 해당 항목 목록

  - 단계: "10"
    이름: ★연결부 있음 — 「연결부 설계」 단계로 (해당하면)
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: >
      ★★**여기서는 「연결부가 있다」는 것만 기록한다.** 실무 순서가 그렇다 —
      **부재별 단면검토를 전부 마친 뒤** 「연결부 설계」 단계에서 처리한다.
      연결재가 **볼트냐 용접이냐**는 거기서 **한 번만** 갈린다
      (진입 트리 `강교 부재 / 전체` 의 [9]).
        볼트 → 4.1.3 `연결부 / 볼트접합`   ·   용접 → 4.1.2 `연결부 / 용접접합`
      그리고 **연결재 형식과 무관하게 접합부재 4.1.4** (`연결부 / 접합부재`) 를 **반드시**.
      ★**부재가 OK 여도 접합부에서 파괴되면 그 부재는 못 쓴다.**
    출력: "연결부 있음 (형식은 연결부 설계 단계에서)"

  - 단계: "11"
    이름: 종료
    근거: "KDS 14 31 10  4.3.2.1.1.1"
    작업: 판정
    식위치: "부재 검토와 해당하는 후행작업이 모두 끝났다"
    출력: "OK"

안전주의: >
  ★★**약축 휨에는 횡비틀림좌굴 한계상태가 없다.** 한계상태는 **항복 · 플랜지 국부좌굴**
  둘뿐이다(표 4.3-1, 4.3.2.1.1.6 행). 강축 트리(4.3.2.1.1.2 — 항복·횡비틀림좌굴)의 흐름을
  그대로 가져다 쓰면 안 된다. Cb·Lp·Lr 이 여기서는 나오지 않는다.

  ★★**약축 전단도 조항이 다르다** — 4.3.2.1.2.7(약축에 대해 전단이 작용하는 1축·2축대칭
  단면). 식 (4.3-85) 와 4.3.2.1.2.2(1)②나. 를 쓰며, **각 저항요소**에 대해 산정한다.
  강축의 인장역작용 분기(4.3.2.1.2.2 / 4.3.2.1.2.3)를 약축에 적용하면 안 된다.

  ★**ㄷ형강은 Sy 에 최소단면계수**를 쓴다(4.3.2.1.1.6 여기서 항). H형강과 다르다.
  ★조밀단면 플랜지면 국부좌굴을 **산정하지 않는다**(4.3.2.1.1.6(2)①).
  Fcr·λpf·λrf 등 값·식은 모두 원문 이미지다 — `kcsc_formula` 로 그림을 보고 옮길 것.
  ★교량에 쓸 때는 저항계수를 **KDS 24 14 31 4.1.4.2** 에서 가져온다.

검증일: "2026-08-06"
검증기준:
  "KDS 143110": "2024"
검증: 설계자확정
