부재: 연결부
단면: 볼트접합
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 25  # 강구조 연결 설계기준 (하중저항계수설계법) 4.1.3 볼트
목표검토: "볼트의 설계강도 ≥ 소요강도 (해당하는 한계상태 모두)  ※접합부재(4.1.4)는 별도 트리"

입력:
  # ── 접합부재(거셋플레이트·연결판) 쪽
  - {기호: Ag,  설명: 접합부재 총단면적,            단위: mm^2}
  - {기호: Ae,  설명: 유효단면적,                   단위: mm^2}
  - {기호: Agv, 설명: 전단저항 총단면적,            단위: mm^2}
  - {기호: Anv, 설명: 전단저항 순단면적,            단위: mm^2}
  - {기호: Ant, 설명: 인장저항 순단면적,            단위: mm^2}
  - {기호: Ubs, 설명: 인장응력 균일 1.0 / 불균일 0.5, 단위: "-"}
  - {기호: Fy,  설명: 접합부재 항복강도,            단위: MPa}
  - {기호: Fu,  설명: 접합부재(피접합재) 인장강도,  단위: MPa}
  - {기호: t,   설명: 피접합재 두께,                단위: mm}
  # ── 볼트 쪽
  - {기호: 볼트강종, 설명: "F8T / F10T / F13T / 일반볼트 4.6", 단위: "-"}
  - {기호: Ab,  설명: 볼트 나사 없는 부분의 공칭단면적, 단위: mm^2}
  - {기호: db,  설명: 볼트 공칭직경,                단위: mm}
  - {기호: n,   설명: 볼트 개수,                    단위: "개"}
  - {기호: Lc,  설명: "하중방향 순간격 (구멍 끝~부재 끝 또는 인접구멍 끝)", 단위: mm}
  - {기호: L볼트열, 설명: "힘 방향 첫 볼트~맨 끝 볼트 중심거리 (★800 mm 판정)", 단위: mm}
  - {기호: Tu볼트, 설명: "볼트 1개의 소요인장력 (★지레작용 포함)", 단위: kN}
  - {기호: Ru,  설명: 소요강도(계수하중),           단위: kN}

흐름:
  - 단계: "1"
    이름: ★접합 형식 확인 — 지압접합인가 마찰접합인가
    근거: "KDS 14 31 25  4.1.3"
    작업: 판정
    식위치: >
      ★**배타 선택이 아니다.** 원문이 못 박는다 —
      4.1.3.6(1) **"마찰접합은 미끄럼을 방지하고 지압접합에 의한 한계상태에 대하여도
      검토해야 한다."**
      4.1.3.5(3) **"지압접합과 마찰접합 모두에 대하여 볼트구멍의 지압강도를 검토해야 한다."**
      → **마찰접합이면 미끄럼 + 지압 둘 다** 본다. 미끄럼만 보고 끝내면 안 된다.
      핀접합이면 4.1.3.8 로 간다.
    분기:
      - {조건: "지압접합",  결과: "볼트 전단 + 구멍 지압", 다음: "2"}
      - {조건: "마찰접합",  결과: "미끄럼 + 지압 **둘 다**", 다음: "2"}
      - {조건: "핀접합",    결과: "4.1.3.8 로",           다음: "8"}
    출력: 접합 형식

  # ══════════ 볼트 자체의 검토 (4.1.3) ══════════
  - 단계: "2"
    이름: ★볼트의 인장 및 전단강도
    근거: "KDS 14 31 25  4.1.3.3"
    작업: 산정
    식위치: >
      **식 (4.1-6)** — 인장파단·전단파단 한계상태. **표 4.1-9** 의 공칭강도를 쓴다.
      ★**표 4.1-9 는 이미지가 아니라 글자 표다** — 값이 그대로 읽힌다.
        공칭인장강도 Fnt : F8T 600 · F10T 750 · F13T 975 · 일반볼트(4.6) 300  (MPa)
        지압접합 공칭전단강도 Fnv —
          나사부가 전단면에 **포함될 때**     : 320 · 400 · 520 · 160
          나사부가 전단면에 **포함되지 않을 때**: 400 · 500 · 650 · 200
      ★★**주 2) 덫** — 위 전단강도는 힘 방향으로 **첫 볼트와 맨 끝 볼트의 중심거리가
      800 mm 이하**인 경우의 값이다. **초과하면 85% 를 적용한다.**
      ★4.1.3.3(2) — **소요인장강도는 접합부 변형에 의한 지레작용(prying)을 고려한
      인장력**으로 한다. 지레작용을 빼면 위험측이다.
      ★F13T 는 표 주 2) 에 **수소지연파괴 시험성적표** 조건이 붙어 있다.
    출력: φRn(볼트 인장·전단)

  - 단계: "3"
    이름: ★볼트구멍의 지압강도 — 지압·마찰 **양쪽 다** 검토
    근거: "KDS 14 31 25  4.1.3.5"
    작업: 산정
    식위치: >
      **식 (4.1-9)·(4.1-10)·(4.1-11)** — 구멍 종류와 지압력 방향으로 갈린다.
        ①가. 사용하중상태에서 구멍 변형을 **고려할 필요가 있는** 경우 → (4.1-9)
        ①나. **고려할 필요가 없는** 경우                          → (4.1-10)
        ② 장슬롯의 길이방향에 **직각**으로 작용하는 지압력          → (4.1-11)
      Lc(하중방향 순간격)·Fu(피접합재)·db·t 가 들어간다.
      ★4.1.3.5(2) — 연결부의 지압강도는 **각각 볼트의 지압강도의 합**으로 산정한다.
      ★4.1.3.5(3) — **지압접합과 마찰접합 모두** 이 검토를 해야 한다.
    출력: φRn(구멍 지압)

  - 단계: "4"
    이름: 마찰접합의 미끄럼강도 (마찰접합이면)
    근거: "KDS 14 31 25  4.1.3.6"
    작업: 산정
    식위치: >
      **식 (4.1-12)**. 구멍 종류에 따른 계수 — 표준구멍 또는 하중방향에 수직인
      단슬롯이면 1.00, 그 밖은 원문.
      ★4.1.3.6(2) — **끼움재**를 쓰면 미끄럼에 관련되는 **모든 접촉면**이 저항해야 한다.
      ★지압접합이면 이 단계를 건너뛴다.
    분기:
      - {조건: "마찰접합이다",  결과: "식 (4.1-12) 적용", 다음: "5"}
      - {조건: "지압접합이다",  결과: "미끄럼 검토 없음", 다음: "5"}
    출력: φRn(미끄럼)

  - 단계: "5"
    이름: ★볼트에 인장이 함께 걸리는가 — 접합 형식마다 조항이 다르다
    근거: "KDS 14 31 25  4.1.3.4"
    작업: 판정
    식위치: >
      ★**지압접합과 마찰접합의 조합 검토가 서로 다른 절이다.**
        지압접합 → **4.1.3.4** 식 (4.1-7)·(4.1-8). 전단응력 효과를 고려한 공칭인장강도.
        마찰접합 → **4.1.3.7** 식 (4.1-13). 인장으로 장력이 감소하므로
                  **설계미끄럼강도를 감소**시킨다(볼트 수·설계볼트장력 표 4.1-10·소요인장력).
      ★**면제 기준** — 4.1.3.4(3) : 전단 또는 인장에 의한 소요응력이 **설계응력의 20%
      이하**이면 조합응력의 효과를 **무시할 수 있다.**
      ★4.1.3.4(2) — 볼트의 설계전단응력이 소요전단응력 이상이 되도록 설계한다.
    분기:
      - {조건: "인장 없음 (또는 소요응력이 설계응력의 20% 이하)",
         결과: "조합 검토 생략", 다음: "6"}
      - {조건: "지압접합 + 인장·전단 조합", 결과: "4.1.3.4 적용", 다음: "6"}
      - {조건: "마찰접합 + 인장·전단 조합", 결과: "4.1.3.7 적용 (미끄럼강도 감소)", 다음: "6"}
    출력: 조합 검토 결과

  - 단계: "6"
    이름: ★접합부재(거셋플레이트)의 강도 — 별도 트리
    근거: "KDS 14 31 25  4.1.4"
    작업: 판정
    식위치: >
      **4.1.4 접합부재의 설계강도**(인장 4.1.4.1 · 전단 4.1.4.2 · **블록전단** 4.1.4.3 ·
      압축 4.1.4.4)는 **연결재가 볼트든 용접이든 똑같이 걸린다.**
      그래서 이 트리에 묻어 두지 않고 **`연결부 / 접합부재` 트리로 분리**했다 —
      **연결부 설계 단계에서 한 번만** 한다.
      ★볼트가 OK 여도 **거셋플레이트가 찢기거나 좌굴하면 접합부는 파괴된다.**
    다음트리: "연결부 / 접합부재"
    다음: "10"
    출력: 접합부재 검토 (별도 트리)

  - 단계: "8"
    이름: 핀접합 (해당하면)
    근거: "KDS 14 31 25  4.1.3.8"
    작업: 산정
    식위치: >
      **식 (4.1-14)** — 휨모멘트를 받는 핀의 설계강도(핀 항복강도 · 핀 소성단면계수).
      **식 (4.1-15)** — 휨모멘트를 받는 핀의 설계전단강도(핀 단면적).
      ★핀접합은 볼트와 별개 조항이다. 볼트 식을 가져다 쓰면 안 된다.
      ★핀의 구멍 지압은 **4.1.7.1**(공장가공면·핀의 구멍·지압보강재 등의 지압)을 본다.
    분기:
      - {조건: "핀 검토 완료", 결과: "판정으로", 다음: "10"}
    출력: φRn(핀)

  - 단계: "10"
    이름: 검토(판정)
    근거: "KDS 14 31 25  4.1.4"
    작업: 판정
    식위치: >
      **볼트의 모든 한계상태**에서 Ru ≤ φRn 이면 OK —
      인장·전단(4.1.3.3) · 구멍 지압(4.1.3.5) · 미끄럼(4.1.3.6) · 조합(4.1.3.4/.7).
      ★**어느 하나라도 NG 면 볼트는 NG 다.** 최솟값이 지배한다.
      ★**접합부재(4.1.4)는 `연결부 / 접합부재` 트리에서 따로 판정한다** — 둘 다 OK 여야
      접합부가 OK 다.
      ★**NG 면 여기서 끝난다.** 볼트 개수·배치·판 두께 변경은 계산서에서 설계자가 한다.
    출력: "OK / NG"

  - 단계: "11"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 25  4.1"
    작업: 판정
    식위치: >
      **배타 선택이 아니라 체크리스트**다 — 해당하는 것을 **모두** 검토한다.
        □ **접합부재(거셋플레이트)** 검토를 했는가 → `연결부 / 접합부재` 트리 ★필수
        □ **끼움재**를 썼는가                     → **4.1.5 끼움재** (미끄럼에도 영향, 4.1.3.6(2))
        □ **앵커볼트**인가                        → **4.1.9 앵커볼트**
      나머지(이음 4.1.6 · 지압 4.1.7 · 주각부 4.1.8 · 집중하중 4.1.10)는
      `연결부 / 접합부재` 트리의 체크리스트에 있다.
    출력: 해당 항목 목록

  - 단계: "12"
    이름: 종료
    근거: "KDS 14 31 25  4.1.4"
    작업: 판정
    식위치: "볼트·접합부재 검토와 해당하는 후행작업이 모두 끝났다"
    출력: "OK"

안전주의: >
  ★★**접합부 검토는 「연결재」와 「접합부재」 두 갈래다. 둘 다 해야 한다.**
    이 트리 — **볼트(4.1.3)**: 인장·전단 / 구멍 지압 / 미끄럼 / 인장·전단 조합 / 핀
    별도 트리 — **접합부재(4.1.4)**: 인장 / 전단 / **블록전단** / 압축
                 → `연결부 / 접합부재`. **볼트든 용접이든 똑같이 걸리므로 분리했다.**
  거셋플레이트가 OK 여도 **볼트가 전단으로 끊어지거나 구멍이 지압으로 찌그러지면**
  접합부는 파괴된다. 그 반대도 마찬가지다. **어느 하나라도 NG 면 접합부가 NG 다.**

  ★★**마찰접합은 미끄럼만 보는 것이 아니다.** 원문이 못 박는다 —
    4.1.3.6(1) "마찰접합은 미끄럼을 방지하고 **지압접합에 의한 한계상태에 대하여도**
               검토해야 한다."
    4.1.3.5(3) "**지압접합과 마찰접합 모두**에 대하여 볼트구멍의 지압강도를 검토해야 한다."

  ★★**표 4.1-9 주 2) 의 800 mm 덫.** 표의 지압접합 공칭전단강도는 힘 방향으로 첫 볼트와
  맨 끝 볼트의 **중심거리가 800 mm 이하**인 경우의 값이다. **초과하면 85% 를 적용한다.**
  긴 이음판에서 그냥 표값을 쓰면 15% 과대평가된다.

  ★**표 4.1-9 는 글자 표라서 값이 그대로 읽힌다** — 인장 F8T 600 / F10T 750 / F13T 975,
  일반볼트(4.6) 300 MPa. 전단은 **나사부가 전단면에 포함되느냐**로 갈린다
  (320/400/520 ↔ 400/500/650). **어느 쪽인지 도면에서 확인할 것.**
  ★F13T 는 **수소지연파괴 시험성적표**가 첨부된 제품에 한한다(표 주 2)).

  ★**소요인장강도는 지레작용(prying)을 고려한 값**이다(4.1.3.3(2)). 빼면 위험측이다.
  ★인장·전단 조합은 **접합 형식마다 절이 다르다** — 지압 4.1.3.4 / 마찰 4.1.3.7.
  소요응력이 설계응력의 **20% 이하면 조합효과를 무시**할 수 있다(4.1.3.4(3)).
  ★블록전단·Ubs·압축 등 **접합부재 쪽 주의는 `연결부 / 접합부재` 트리**에 있다.
  ★핀접합은 4.1.3.8(식 4.1-14·4.1-15) 로 **볼트와 별개 조항**이다.

  ★★**교량에 쓸 때 — 이 트리는 KDS 14 31 25(건축계열) 기준이다.**
  저항계수와 볼트 규정은 **KDS 24 계열의 대응 조항을 반드시 확인**할 것.
  부재 쪽 저항계수는 KDS 24 14 31 4.1.4.2 이지만 **연결부는 그것과 별개**이며,
  이 트리는 아직 KDS 24 쪽 연결 조항을 담고 있지 않다.

