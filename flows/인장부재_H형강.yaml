부재: 인장부재
단면: H형강 (볼트접합)
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 10  # 강구조 부재 설계기준 (하중저항계수설계법) 4.1 인장부재
목표검토: "설계인장강도 φt·Pn  ≥  소요인장강도 Pu"

입력:
  - {기호: Ag, 설명: 총단면적,                단위: mm^2}
  - {기호: An, 설명: 순단면적,                단위: mm^2}
  - {기호: Ae, 설명: 유효순단면적,            단위: mm^2}
  - {기호: U,  설명: 전단뒤짐계수,            단위: "-"}
  - {기호: L,  설명: 부재 길이,               단위: mm}
  - {기호: r,  설명: 단면2차반경(최소),       단위: mm}
  - {기호: Fy, 설명: 강재 항복강도,           단위: MPa}
  - {기호: Fu, 설명: 강재 인장강도,           단위: MPa}
  - {기호: Pu, 설명: 소요인장강도(계수하중),  단위: kN}
  - {기호: 적용구분, 설명: "★건축·일반 강구조 / 교량 강구조 (세장비 제한이 다르다)", 단위: "-"}
  - {기호: 핀접합, 설명: "★핀접합부재인가 (선택 검토)",                     단위: "-"}

흐름:
  # ★조합 여부를 **맨 앞에서** 묻는다. 휨이 함께 작용하면 순수 인장 흐름을 타면 안 된다.
  - 단계: "1"
    이름: 인장 + 휨 조합인지 확인
    근거: "KDS 14 31 10  4.4.1.2"
    작업: 판정
    식위치: "4.4.1.2 — 휨이 함께 작용하면 상관식으로 검토해야 한다"
    분기:
      - {조건: "휨이 함께 작용", 결과: "조합력 트리로 넘어간다",
         다음트리: "조합력부재 (인장 + 휨)"}
      - {조건: "순수 인장", 결과: "이 트리를 계속", 다음: "2"}

  - 단계: "2"
    이름: ★세장비 검토 — 제한을 보이고 설계자가 판단
    근거: "KDS 14 31 10  4.1.1"
    작업: 판정
    식위치: >
      계산서에 **제한값을 명시**하고 설계자가 보고 판단하게 한다. 기계적으로 막지 않는다.
      **건축·일반 강구조** (4.1.1(1)) — 최대 세장비 **제한은 없다.**
        다만 인장력에 기초해 설계되는 부재의 세장비 L/r 은 **가급적 300 이하**.
        인장을 받는 강봉·강대·매달린 부재에는 이 권장도 적용하지 않는다.
      **교량 강구조** (4.1.1(2)) — 아이바·봉강·케이블·판을 제외한 **모든 인장부재에
        실제 제한이 걸린다.** ① 교번응력을 받는 주부재 ② 교번응력을 받지 않는 주부재
        ③ 2차 부재 — 각각 다른 한계값이며 **값은 원문 이미지**다
        (`kcsc_formula('KDS 14 31 10','4.1.1')`).
      ★적용구분(건축/교량)을 먼저 정해야 어느 쪽 제한을 보는지 정해진다.
    출력: "세장비 L/r · 적용한 제한 · 판단 근거"

  - 단계: "3"
    이름: 총단면적 산정
    근거: "KDS 14 31 10  4.1.2.1"
    작업: 계산
    식위치: "4.1.2.1 — 총단면적 Ag"
    출력: Ag

  - 단계: "4"
    이름: 순단면적 산정
    근거: "KDS 14 31 10  4.1.2.2"
    작업: 계산
    식위치: "4.1.2.2 — 구멍 공제. 엇모배치는 s^2/4g 규정(원문)"
    출력: An

  - 단계: "5"
    이름: 유효순단면적 산정
    근거: "KDS 14 31 10  4.1.2.3 + 표 4.1-1"
    작업: 산정
    식위치: "4.1.2.3 — Ae = An·U. 전단뒤짐계수 U 는 표 4.1-1 의 해당 사례(원문 이미지)"
    출력: Ae

  # ── [6A]·[6B] 는 **병렬**이다. 둘 다 항상 산정하고 [7] 에서 작은 값을 취한다.
  - 단계: "6A"
    이름: "〔병렬〕 총단면의 항복 한계상태"
    근거: "KDS 14 31 10  4.1.3.1"
    작업: 산정
    식위치: "식 (4.1-4) — Pn = Fy·Ag. 저항계수 φt 값은 원문"
    출력: φtPn(항복)

  - 단계: "6B"
    이름: "〔병렬〕 유효순단면의 파단 한계상태"
    근거: "KDS 14 31 10  4.1.3.2"
    작업: 산정
    식위치: "식 (4.1-5) — Pn = Fu·Ae. ★저항계수 φt 가 항복(4.1.3.1)과 **다르다**"
    출력: φtPn(파단)

  - 단계: "7"
    이름: 설계인장강도 결정
    근거: "KDS 14 31 10  4.1.3"
    작업: 판정
    식위치: "4.1.3(1) — 두 한계상태 중 **작은 값**을 설계인장강도로 한다"
    출력: φtPn

  - 단계: "8"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.1.3"
    작업: 판정
    식위치: >
      Pu ≤ φt·Pn 이면 OK, 아니면 NG.
      ★**NG 면 여기서 끝난다.** 단면을 바꿔 다시 도는 것은 계산서에서 설계자가 하는 일이지
      트리가 되돌릴 일이 아니다. **후행작업은 OK 인 경우에만** 이어진다.
    출력: "OK / NG"

  - 단계: "9"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 10  4.1"
    작업: 판정
    식위치: >
      부재가 만족했을 때 이어서 볼 것들. **배타 선택이 아니라 체크리스트**다 —
      해당하는 것을 **모두** 검토한다. 핀접합이면서 볼트접합 이음도 있는 경우가 있다.
        □ 핀접합부재인가 → [10]
        □ **이음·연결부**가 있는가 (볼트/용접 불문) → [11]
      해당 없으면 그대로 종료한다.
    출력: 해당 항목 목록

  - 단계: "10"
    이름: ★핀접합부재 (해당하면)
    근거: "KDS 14 31 10  4.1.5"
    작업: 산정
    식위치: >
      4.1.5.1 — 핀접합부재의 설계인장강도는 **인장파단·전단파단·지압·항복** 한계상태 중
      **가장 작은 값**. 유효순단면 인장파단 식 (4.1-6)(유효연단거리 = 2t+16),
      유효단면 전단파단 식 (4.1-7).
      4.1.5.2 — 구조제한. **(1) 건축·일반 강구조**: 핀구멍은 하중 직각방향 가장자리 중간,
      핀구멍 직경은 핀직경 +1mm 이내, 플레이트 폭·연단거리 하한, 45° 절단 조건.
      ★**(2) 교량 강구조는 별도 제한**: 핀구멍 중심선 횡단면에서 모재판+핀 보강판 순단면적의
      합이 **핀구멍 없는 단면에 필요한 모재판 순단면적의 1.4배 초과** 등.
      적용구분에 맞는 항을 볼 것.
    출력: 핀접합 검토

  - 단계: "11"
    이름: ★연결부 있음 — 「연결부 설계」 단계로 (해당하면)
    근거: "KDS 14 31 10  4.1.2.3"
    작업: 판정
    식위치: >
      ★★**여기서는 「연결부가 있다」는 것만 기록한다.** 실무 순서가 그렇다 —
      **부재별 단면검토를 전부 마친 뒤** 「연결부 설계」 단계에서 처리한다.
      연결재가 **볼트냐 용접이냐**는 거기서 **한 번만** 갈린다
      (진입 트리 `강교 부재 / 전체` 의 [9]).
        볼트 → 4.1.3 `연결부 / 볼트접합`   ·   용접 → 4.1.2 `연결부 / 용접접합`
      그리고 **연결재 형식과 무관하게 접합부재 4.1.4** (`연결부 / 접합부재`) 를 **반드시**.
      ★**부재가 OK 여도 접합부에서 파괴되면 그 부재는 못 쓴다.**
      ★**블록전단파단**은 부재 기준이 아니라 **연결 기준(KDS 14 31 25 4.1.4.3)** 소관이며
        `연결부 / 접합부재` 트리에 있다.
    출력: "연결부 있음 (형식은 연결부 설계 단계에서)"

  - 단계: "12"
    이름: 종료
    근거: "KDS 14 31 10  4.1.3"
    작업: 판정
    식위치: "부재 검토와 해당하는 후행작업이 모두 끝났다"
    출력: "OK"

안전주의: >
  두 한계상태(총단면 항복 4.1.3.1 / 유효순단면 파단 4.1.3.2)의 저항계수 φt 가 서로
  다르다. 값은 반드시 원문 식 (4.1-4)·(4.1-5) 에서 확인할 것.
  전단뒤짐계수 U 는 접합 형태에 따라 표 4.1-1 의 사례가 달라진다 — 사례를 잘못 고르면
  Ae 가 통째로 틀린다.
  ★**세장비 제한은 건축과 교량이 다르다.** 건축은 "제한 없음, 가급적 300 이하"(권장)지만
  **교량은 실제 제한**이 걸린다(4.1.1(2) ①②③). 적용구분을 먼저 정할 것.
  계산서는 제한값을 **보여 주고 설계자가 판단**하게 한다 — 기계적으로 막지 않는다.
  ★블록전단파단은 부재 기준이 아니라 **연결 기준(KDS 14 31 25 4.1.4.3)** 소관이다.
  이 트리는 거기서 끊기지 않고 `연결부` 트리로 이어진다. **부재가 OK 여도 접합부에서
  파괴되면 그 부재는 못 쓴다.**
  ★핀접합부재는 **선택 검토**다(4.1.5). 교량용 구조제한(4.1.5.2(2))이 건축용과 다르다.
  이 트리에 **없는 것**: 4.1.4 조립 인장부재(판재·형강 조립, 긴결간격·레이싱·띠판 규정),
  4.1.6 아이바. 해당하는 부재가 나오면 원문을 따로 볼 것.

검증일: "2026-08-06"
검증기준:
  "KDS 143110": "2024"
검증: 설계자확정
