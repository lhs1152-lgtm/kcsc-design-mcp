부재: 휨부재
단면: 기타 휨부재 (강교 — 원형강관·약축 H형·박스형 등)
설계법: 한계상태설계법
근거: KDS 24 14 31  # 강교 설계기준(한계상태설계법) 4.8 기타 휨부재
위임근거: "KDS 24 14 31  4.8"
목표검토: "설계휨강도 φf·Mn ≥ 소요휨강도 Mu   (전단은 φv·Vn ≥ Vu — 강도한계상태)"

입력:
  - {기호: 단면, 설명: "비합성 H형(약축) / 박스형 / ★원형강관 / ㄷ·L·T·봉 / 합성", 단위: "-"}
  - {기호: D,   설명: 원형강관의 외경,               단위: mm}
  - {기호: t,   설명: 강관(판)의 두께,               단위: mm}
  - {기호: Zy,  설명: "약축 소성단면계수 (H형 약축 휨)", 단위: mm^3}
  - {기호: S,   설명: "휨축에 관한 단면계수 (박스형)", 단위: mm^3}
  - {기호: Lb,  설명: "비지지길이 (박스형 식 4.3-289)", 단위: mm}
  - {기호: Mu,  설명: 소요휨강도 (계수하중),          단위: "N·mm"}
  - {기호: Vu,  설명: 소요전단강도 (계수하중),        단위: N}
  - {기호: N,   설명: "축력 (있으면) — 조합 판정",     단위: N}

흐름:
  - 단계: "1"
    이름: ★★위임 경로 확인 — 건축용 절이 아니다
    근거: "KDS 24 14 31  4.8"
    작업: 판정
    식위치: >
      KDS 24 14 31 4.8(1) — **"기타 휨부재의 설계는 KDS 14 31 10(4.3.3.3)의 해당규정을
      따른다."**
      ★★**4.3.3.3 은 「교량용 기타 휨부재」 절이다** — 건축용 휨부재 절(4.3.2)과
      **다른 절, 다른 식 체계**다. 원형강관이면:
        건축용 4.3.2.1.1.8 → 식 (4.3-46)~(4.3-49) — 항복·국부좌굴 **최솟값**
        ★교량용 4.3.3.3.2.2(3) → 식 **(4.3-290)/(4.3-291)** — **D/t 두 구간**
      **LRFD 트리 `휨부재 / 원형강관`(건축용 절 기반)을 교량 한계상태에 그대로 쓰면
      위임 경로가 틀린다.** 교량이면 이 트리다.
      적용 범위(4.3.3.3.1.1) — ① 비합성 H형 ② 비합성 박스형 ③ **비합성 원형강관**
      ④ ㄷ·L·T형강 및 봉 ⑤ 매입형 압연형강 ⑥ 합성강관.
      ★저항계수 φ 는 **KDS 24 14 31 4.1.4.2** — 강교 위임 패턴 그대로다.
    출력: 위임 경로

  - 단계: "2"
    이름: ★횡방향비틀림좌굴 적용 여부
    근거: "KDS 14 31 10  4.3.3.3.2.1"
    위임근거: "KDS 24 14 31  4.8"
    작업: 판정
    식위치: >
      4.3.3.3.2.1(1) — **횡방향비틀림좌굴 규정을 적용할 필요가 없는** 단면:
        합성부재 · **비합성 박스형 부재** · **웨브와 평행한 축(약축)으로 휨을 받는
        H형 부재** · **원형강관**
      ★LRFD 건축 절에서 확인한 사실들(원형강관·약축 H형강에 횡좌굴 없음)과
      일관된다 — 교량용 절이 명문으로 못 박은 것.
    출력: 횡좌굴 적용 여부

  - 단계: "3"
    이름: 단면별 공칭휨강도
    근거: "KDS 14 31 10  4.3.3.3.2.2"
    위임근거: "KDS 24 14 31  4.8"
    작업: 산정
    식위치: >
      4.3.3.3.2.2 (비합성부재) —
      **(1) H형 부재 (약축 휨)** — 웨브와 평행한 축: **식 (4.3-288)** Mn = 약축
        소성휨강도. ★강축(웨브 수직축) 휨은 **4.3.3.1.8**(플레이트거더 규정)로 간다.
      **(2) 박스형 부재** — **식 (4.3-289)**. 비지지길이 Lb 가 들어간다.
      **(3) ★원형강관** — **D/t 두 구간**:
        원문 한계 이하 → **식 (4.3-290)** / 초과 → **식 (4.3-291)**
        (한계값·식은 원문 이미지 — `kcsc_formula('KDS 14 31 10','4.3.3.3.2.2')`)
      **(4) ㄷ·L·T형강·봉** — 비틀림 구속 ⊏형강은 4.3.3.1.8. 그 밖은
        **항복·횡방향비틀림좌굴·국부좌굴 중 최솟값**.
      합성부재는 4.3.3.3.2.3 — 원문 확인.
    분기:
      - {조건: "비합성 H형 — 약축 휨", 결과: "식 (4.3-288)", 다음: "4"}
      - {조건: "H형 — 강축 휨", 결과: "4.3.3.1.8 (플레이트거더 규정)",
         다음트리: "플레이트거더 / 강교 I형 거더 (합성·비합성)"}
      - {조건: "비합성 박스형", 결과: "식 (4.3-289)", 다음: "4"}
      - {조건: "★비합성 원형강관", 결과: "식 (4.3-290)/(4.3-291) — D/t 구간", 다음: "4"}
      - {조건: "ㄷ·L·T형강·봉 · 합성부재", 결과: "원문 확인 (4.3.3.3.2.2(4)·4.3.3.3.2.3)", 다음: "4"}
    출력: Mn

  - 단계: "4"
    이름: 설계휨강도 — 강도한계상태
    근거: "KDS 14 31 10  4.3.3.3.1.2"
    위임근거: "KDS 24 14 31  4.8"
    작업: 계산
    식위치: >
      **식 (4.3-286)** — 설계휨강도 = φf·Mn.
      ★φf 는 **KDS 24 14 31 4.1.4.2 의 강도저항계수** — 건축 기준의 φ 가 아니다
      (강교 위임 패턴: 식은 KDS 14, φ 는 KDS 24).
    출력: φfMn

  - 단계: "5"
    이름: 축방향력이 함께 작용하면 — 상관식
    근거: "KDS 14 31 10  4.3.3.3.1.2"
    위임근거: "KDS 24 14 31  4.8"
    작업: 판정
    식위치: >
      4.3.3.3.1.2(2) — 축방향 압축+휨은 **4.4.1.1**, 인장+휨은 **4.4.1.2** 의
      상관관계식을 적용한다 — 조합력 트리로 간다.
    분기:
      - {조건: "축력 함께 — 압축", 결과: "조합력 트리로",
         다음트리: "조합력부재 (압축 + 휨) / H형강 / 하중저항계수설계법 (LRFD)", 다음: "6"}
      - {조건: "축력 함께 — 인장", 결과: "조합력 트리로",
         다음트리: "조합력부재 (인장 + 휨) / H형강 / 하중저항계수설계법 (LRFD)", 다음: "6"}
      - {조건: "순수 휨", 결과: "계속", 다음: "6"}
    출력: 조합 여부

  - 단계: "6"
    이름: 전단강도 — 강도한계상태
    근거: "KDS 14 31 10  4.3.3.3.1.2"
    위임근거: "KDS 24 14 31  4.8"
    작업: 산정
    식위치: >
      **식 (4.3-287)** — 설계전단강도 = φv·Vn.
      Vn 은 **웨브에 대해 4.3.3.1.9.2**(비보강 웨브), 합성부재는 **4.3.3.3.3**.
      ★★**원형강관의 전단은 이 절이 명시하지 않는다** — 4.3.3.1.9.2 는 「웨브」
      규정이라 관에 그대로 대응되지 않는다. 건축용 절(4.3.2.1.2.6)을 참고하게 되는데
      **위임 근거가 명문이 아니다** — 적용 전에 설계자가 근거를 확정할 것.
    출력: φvVn

  - 단계: "7"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.3.3.3.1.2"
    위임근거: "KDS 24 14 31  4.8"
    작업: 판정
    식위치: >
      Mu ≤ φf·Mn 이고 Vu ≤ φv·Vn 이면 OK (강도한계상태).
      ★**NG 면 여기서 끝난다.** 단면 변경은 계산서에서 설계자가 한다.
    출력: "OK / NG"

  - 단계: "8"
    이름: 종료 — 진입 트리의 사용·피로 검토로 복귀
    근거: "KDS 24 14 31  4.1.1"
    작업: 판정
    식위치: >
      강도한계상태 검토가 끝났다. **사용한계상태(4.1.2)·피로(4.1.3)는 진입 트리
      `강교 부재 / 전체` 의 [7]·[8]** 에서 병렬로 챙긴다.
      연결부가 있으면 진입 트리 [9](연결부 설계)로.
    출력: "OK"

안전주의: >
  ★★★**위임 경로가 핵심이다.** 교량 한계상태의 기타 휨부재는
  KDS 24 14 31 4.8 → **KDS 14 31 10 4.3.3.3 (교량용 절)** 이다.
  같은 기준 안의 **건축용 절(4.3.2)과 식 체계가 다르다** — 원형강관이면
  건축용 (4.3-46)~(4.3-49) ↔ **교량용 (4.3-290)/(4.3-291)**.
  **LRFD 트리 `휨부재 / 원형강관`(건축용 절)을 교량 한계상태에 쓰면 위임 경로가
  틀린다.** 설계법·용도에 따라 트리를 골라 탈 것.

  ★★**φ 는 KDS 24 14 31 4.1.4.2** — 식은 KDS 14, φ 는 KDS 24 (강교 위임 패턴).
  ★★**원형강관 전단의 위임이 명문이 아니다**(4.3.3.3.1.2(3)은 「웨브」 규정만 든다).
  건축용 4.3.2.1.2.6 을 참고하려면 **설계자가 근거를 확정**해야 한다.
  ★횡방향비틀림좌굴 불요 목록(4.3.3.3.2.1) — 합성·박스형·약축 H형·원형강관.
  ★H형 **강축** 휨은 이 트리가 아니라 4.3.3.1.8(플레이트거더 규정) 이다.
  ★사용한계상태·피로는 이 트리에 없다 — 진입 트리 [7]·[8] 이 병렬로 챙긴다.
  식 (4.3-286)~(4.3-291)·D/t 한계값은 원문 이미지 —
  `kcsc_formula('KDS 14 31 10','4.3.3.3.2.2')` 로 그림을 직접 보고 옮길 것.
  ★철도교는 이 트리의 적용 범위 밖 — 철도교 안건이면 멈추고 원문을 볼 것.

검증일: "2026-08-06"
