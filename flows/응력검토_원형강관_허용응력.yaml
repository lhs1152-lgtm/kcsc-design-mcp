부재: 응력검토
단면: 원형강관
설계법: 허용응력설계법
근거: KDS 14 30 10  # 강구조 부재 설계기준(허용응력설계법) 4.8.1 강관 구조물 (+ 4.3~4.7 위임)
목표검토: "작용응력 ≤ 허용응력  + 강관 세칙(진동·보강재·격점부) — 허용응력은 4.3~4.7 위임"

입력:
  - {기호: D,   설명: 강관의 바깥지름,               단위: mm}
  - {기호: t,   설명: 강관의 판두께,                 단위: mm}
  - {기호: r,   설명: "강관의 반지름 (보강재 생략조건·격점부에 쓰임)", 단위: mm}
  - {기호: l,   설명: "부재의 길이 또는 유효좌굴길이 (★진동 검토는 m 단위)", 단위: m}
  - {기호: λ,   설명: "세장비 — 원형강관은 단면2차반지름이 전 방향 동일", 단위: "-"}
  - {기호: 용도, 설명: "★행거 / 지주 / 트러스부재 등 — 바람 진동 검토 대상 판정", 단위: "-"}
  - {기호: fa,  설명: 작용 축방향응력 (사용하중),     단위: MPa}
  - {기호: fb,  설명: 작용 휨응력 (사용하중),         단위: MPa}
  - {기호: τ,   설명: "작용 전단응력 (+ 비틀림 — 폐단면이라 실제로 걸린다)", 단위: MPa}
  - {기호: 굴곡, 설명: "굴곡관(꺾인 관)으로 부재를 구성하는가", 단위: "-"}

흐름:
  - 단계: "1"
    이름: ★★적용 근거 확인 — 교량 기준에는 원형강관 조항이 없다
    근거: "KDS 14 30 10  4.8.1.2"
    작업: 판정
    식위치: >
      ★★**교량 허용응력설계법 기준(KDS 24 14 30)에는 원형강관 전용 조항이 없다**
      (실측 — 본문 검색 0건). 그래서 강관 부재는 **KDS 14 30 10 의 4.8
      「일반 강구조물을 위한 추가 규정」 → 4.8.1 강관 구조물**을 쓴다.
      ★4.8.1.2 — **"강관의 허용응력은 4.3(인장)~4.7(합성)과 KDS 14 30 25(연결)의
      규정에 준한다."** 즉 이 절은 **허용응력 값을 새로 주지 않고 위임**하며,
      강관 고유의 것은 **세칙**(최소두께·진동·보강재·격점부·굴곡관·연결)이다.
      ★★**교량 안건이면 체계 혼합에 주의** — 하중조합·증가계수는 교량 체계
      (KDS 24 12 10 표 4.2-1)를 쓰면서 허용응력은 이 건축계열 기준에서 가져오게 된다.
      **두 체계의 정합은 설계자가 판단해야 한다** — 트리가 대신 정할 수 없는 자리다.
      ★★**→ 설계자가 정한 것이다(2026-08-17): 원형강관 보도교 ASD 는 이 갈래(KDS 14 30 10)가
      기본이다.** 하중·하중조합·증가계수는 `하중조합 / 보도교`(24 12 10 표 4.2-1 준용) ·
      Fy·보정계수 1.00·14 30 05 5.2 의 1.33 미적용은 `허용응력 / 구조용 강재·용접부` ·
      H형강 부부재는 `응력검토 / H형강` · 연결은 `응력검토 / 연결 이음` — 전부 14 30 갈래로
      맞춰져 있어 **여기서 "혼합"은 결정된 체계이지 미정 사항이 아니다.**
    분기:
      - {조건: "하중조합·증가계수를 아직 안 정했다",           결과: "먼저 정하고 돌아온다", 다음트리: "하중조합 / 보도교", 다음: "2"}
      - {조건: "Fy(판두께·제작/기성강관)·보정계수·증가계수 정합", 결과: "허용응력 트리에서 받아 온다", 다음트리: "허용응력 / 구조용 강재·용접부", 다음: "2"}
      - {조건: "둘 다 준비됨",                                 결과: "부재 검토로", 다음: "2"}
    출력: 적용 근거

  - 단계: "2"
    이름: 최소두께·단면 성립 확인
    근거: "KDS 14 30 10  4.8.1.3"
    작업: 판정
    식위치: >
      4.8.1.3 — **구조 내력상 중요한 부재에는 판두께 2.0 mm 이상**의 강관을 사용한다.
      (하한 규정이다 — 교량급 부재는 실무상 훨씬 두껍다. 부식 여유도 설계자 몫.)
      ★국부좌굴 — 원형강관의 지름두께비(D/t) 한계는 **4.1.6.2 세장압축요소** 표에
      원형강관 압축부재·휨부재 항이 따로 있다(값은 원문 이미지). 그 한계를 넘으면
      허용응력을 그대로 쓸 수 없다.
    출력: 단면 성립 여부

  - 단계: "3"
    이름: ★단일강관의 바람 진동 검토 (해당하면)
    근거: "KDS 14 30 10  4.8.1.4"
    작업: 판정
    식위치: >
      4.8.1.4(1) — **세장비가 큰 행거·지주·트러스부재**로 쓰이는 강관은 바람에 의한
      진동을 제한하기 위해 **바깥지름이 식 (4.8-1)을 만족**해야 한다
      (l·D·t 의 관계식 — 이미지. ★l·D 는 m, t 는 mm — 단위 혼합에 주의).
      예외 — **진동 대책을 세우고 풍동시험 등으로 효과를 확인**한 경우, 또는
      직접 바람의 영향을 받지 않는 부재.
      ★(2) — 이 규정으로 설계된 강관의 단부 용접이음은 **반드시 온둘레용접**
      (일반적으로 필릿). 원문 조건 이하면 V형 용접.
      ★(3) — 연결판·리브를 붙이면 그 앞부분의 **피로강도가 저하**된다 — 용접부를
      매끈하게 다듬질할 것.
    분기:
      - {조건: "세장한 행거·지주·트러스부재", 결과: "식 (4.8-1) 검토", 다음: "4"}
      - {조건: "해당 없음 (또는 예외 인정)",  결과: "건너뜀",          다음: "4"}
    출력: 진동 검토 결과

  - 단계: "4"
    이름: 허용응력 산정 — 4.3~4.7 위임
    근거: "KDS 14 30 10  4.8.1.2"
    작업: 산정
    식위치: >
      위임 지도 (KDS 14 30 10 안에서):
        인장   → **4.3 인장부재** (허용인장응력 4.3.2)
        압축   → **4.4 압축부재** (허용압축응력 4.4.3 — 세장비 함수. ★원형강관은
                 r 이 전 방향 동일해서 약축 구분이 없다)
        휨     → **4.5 휨부재** (허용휨응력 4.5.2 · 허용전단응력 4.5.3.
                 ★원형은 횡좌굴 개념이 서지 않는다 — 해당 항의 적용 조건을 원문으로
                 확인할 것)
        조합력 → **4.6 조합력을 받는 부재** (축압축+휨 4.6.2 / 축인장+휨 4.6.3)
      값·식은 전부 원문(상당수 이미지) — `kcsc_formula('KDS 14 30 10','4.4.3')` 등.
      ★교량 안건이면 여기서 나온 허용응력에 **교량 증가계수(KDS 24 12 10 표 4.2-1)**
      를 곱하는 혼합이 된다 — [1] 의 주의 그대로. **보도교 ASD 는 설계자 확정(2026-08-17)으로
      이 조합이 확정**: 허용응력(14 30 10) × 보정계수 1.00 × 증가계수(24 12 10 준용, 14 30 05
      5.2 의 1.33 미적용). Fy 는 판두께 구간(제작강관은 강판 Fy) — 허용응력 트리.
    출력: "허용응력 일람 (MPa)"

  - 단계: "5"
    이름: 응력검토
    근거: "KDS 14 30 10  4.8.1.2"
    작업: 판정
    식위치: >
      모든 하중조합에서 **작용응력 ≤ 허용응력** —
        축방향: fa ≤ Fa (인장/압축) · 휨: fb ≤ Fb · 전단: τ ≤ Fv
        조합력: 4.6 의 상관식(응력비 합 ≤ 1 꼴 — 원문)
      ★**비틀림을 빠뜨리지 말 것** — 원형강관은 폐단면이라 비틀림을 실제로 받는다.
      비틀림 전단응력을 τ 에 합산해 검토한다.
    출력: "응력검토 결과"

  - 단계: "6"
    이름: ★링보강재·다이아프램 — 원칙 설치
    근거: "KDS 14 30 10  4.8.1.5.1"
    작업: 판정
    식위치: >
      4.8.1.5.1 — 강관부재에는 **전단·비틀림에 의한 좌굴 또는 국부 변형을 방지**하기
      위한 링보강재 또는 다이아프램을 **설치하는 것이 원칙**이며,
      **최대간격은 바깥지름의 3배**다.
      ★생략 조건 — **식 (4.8-2)** (r/t 관계식 — 이미지)를 만족하면 생략할 수 있다.
      ★링보강재를 두면 폭·두께가 **식 (4.8-3)** 을 만족해야 한다(4.8.1.5.2).
      ★LRFD 원형강관 트리에는 없는 요구다 — 이 기준 고유의 세칙이니 잊기 쉽다.
    분기:
      - {조건: "식 (4.8-2) 만족",  결과: "보강재 생략 가능", 다음: "7"}
      - {조건: "만족 못 함",       결과: "링보강재·다이아프램 — 간격 ≤ 3D, 식 (4.8-3)", 다음: "7"}
    출력: 보강재 배치

  - 단계: "7"
    이름: ★격점부 — 집중하중 자리
    근거: "KDS 14 30 10  4.8.1.6"
    작업: 판정
    식위치: >
      4.8.1.6 — **집중하중이 작용하는 격점부·받침부는 링보강재 또는 다이아프램으로
      보강하는 것이 원칙**이다.
      **격점부의 변형량은 식 (4.8-4)** 를 만족해야 한다(변형량-반지름 관계 — 이미지).
      단면2차모멘트가 일정한 링보강재면 변형량을 **식 (4.8-5(a))(지지재 병용) /
      (4.8-5(b))(링만)** 로 구해도 된다.
      ★링보강재 단면2차모멘트 산출 시 **강관의 유효폭은 식 (4.8-6)** — 관 전체가
      아니라 보강재 주변 일부만 유효하다.
      ★관은 판이 얇아 **국부 변형이 응력보다 먼저 문제되는 단면**이다 — 격점부를
      응력만 보고 넘기면 안 된다.
    출력: 격점부 검토

  - 단계: "8"
    이름: 굴곡관 (해당하면)
    근거: "KDS 14 30 10  4.8.1.7"
    작업: 판정
    식위치: >
      4.8.1.7 — 굴곡관으로 부재를 구성하면 **굴곡부의 국부응력을 검토**해야 한다.
      단 **꺾임각이 식 (4.8-7)** 을 만족하면 직선부재로 설계해도 좋다
      (원호아치의 경우 꺾임각 = 직선부재 길이/곡률반경 — 원문).
      ★아치리브를 절판(折板)으로 제작할 때 걸리는 조항이다.
    출력: 굴곡부 검토

  - 단계: "9"
    이름: 강관의 연결
    근거: "KDS 14 30 10  4.8.1.8"
    작업: 판정
    식위치: >
      4.8.1.8 —
        강관-강관 **축방향 연결** → **고력볼트 또는 용접에 의한 직접연결이 원칙**.
        플랜지 연결은 **2차부재로서 부득이한 경우만**.
        부재축 방향이 다른 부재와의 연결 → **연결판 연결 또는 가지 연결**.
      연결부의 허용응력·상세는 **KDS 14 30 25**(강구조 연결, 허용응력설계법) —
      `응력검토 / 연결 이음` 트리(2026-08-17 재작성: 14 30 25 + 조직 규정 75%·현장용접 90%)로.
      원형강관–H형강 가로보 접합(연결판·가지 연결)과 격점부 링보강재는 그 트리 [11]과 여기 [격점부]
      를 함께 본다.
    다음트리: "응력검토 / 연결 이음"
    다음: "10"
    출력: 연결 형식·검토 방향

  - 단계: "10"
    이름: 검토(판정)
    근거: "KDS 14 30 10  4.8.1.2"
    작업: 판정
    식위치: >
      응력검토([5])와 강관 세칙(최소두께·진동·보강재·격점부·굴곡부·연결 원칙)을
      모두 만족하면 OK.
      ★**NG 면 여기서 끝난다.** 단면·보강 변경은 계산서에서 설계자가 한다.
      ★응력 OK 여도 **사용성(처짐 L/600·보행자 진동 1.5~2.3 Hz 회피·신축·부식)** 은 별도 —
      `사용성 / 보도교` 트리로.
    다음트리: "사용성 / 보도교"
    다음: "11"
    출력: "OK / NG"

  - 단계: "11"
    이름: 종료
    근거: "KDS 14 30 10  4.8.1.2"
    작업: 판정
    식위치: "원형강관 허용응력 검토가 끝났다"
    출력: "OK"

안전주의: >
  ★★★**허용응력설계법이다.** 검토는 응력 비교, 하중은 사용하중. 「강도」·γ·φ 는
  존재하지 않는 개념이다.

  ★★★**근거 구조가 LRFD 와 다르다.** LRFD 는 원형강관 전용 절(KDS 14 31 10 의 4.3.2.1.1.8 등)이
  있었지만, **허용응력설계법에는 전용 허용응력 조항이 없다** — 4.8.1.2 가 4.3~4.7 로
  위임하고, 강관 고유의 것은 **세칙**(진동·보강재·격점부)뿐이다.
  **LRFD 원형강관 트리를 응력 용어로 바꿔 쓰는 식으로는 만들 수 없는 트리**다.

  ★★★**교량 안건이면 체계 혼합이 된다** — 하중조합·증가계수는 교량(KDS 24 12 10),
  허용응력은 건축계열(KDS 14 30 10). 교량 허용응력 기준(KDS 24 14 30)에 원형강관
  조항이 없어서 생기는 공백이다. **보도교 ASD 는 설계자가 정한 값이다(2026-08-17)** — 이 조합이
  조직 체계이고(24 14 30 은 철도교 기준이라 뺐다), 하중조합·허용응력·H형강·연결·브레이싱·
  트러스·사용성 트리가 전부 여기에 맞춰져 있다. 다른 안건(건축·플랜트)이면 다시 판단.

  ★★**링보강재·다이아프램은 「원칙 설치, 최대간격 3D」** 다(4.8.1.5.1). 생략은
  식 (4.8-2) 를 만족할 때만. **LRFD 트리에 없던 요구라 잊기 쉽다.**
  ★★**격점부는 응력이 아니라 「변형량」 검토**가 걸린다(식 4.8-4) — 얇은 관은 국부
  변형이 먼저 문제된다. 링보강재 강성 계산의 **유효폭(식 4.8-6)** 도 관 전체가 아니다.
  ★★**세장한 행거·지주는 바람 진동 검토**(식 4.8-1)가 걸린다. ★식의 **l·D 는 m,
  t 는 mm** — 단위 혼합에 주의. 단부는 **온둘레용접 필수**.
  ★원형강관 D/t 한계는 **4.1.6.2 세장압축요소** 표에 있다(압축·휨 항 별도).
  ★**비틀림을 빠뜨리지 말 것** — 폐단면이라 실제로 받는다. LRFD 트리에서
  확인시킨 사실("원형강관이 비틀림좌굴이 없는 게 확실해?")과 같은 뿌리의 주의다.
  ★굴곡관(절판 아치리브)은 꺾임각 조건(식 4.8-7) 밖이면 국부응력 검토.
  ★연결은 KDS 14 30 25 위임 — `응력검토 / 연결 이음` 트리(조직 규정 75%·현장 90% 포함).
  ★처짐(L/600)·보행자 진동(1.5~2.3 Hz 회피)·바람 진동 외 사용성은 `사용성 / 보도교` 트리.
  식 (4.8-1)~(4.8-7)·4.1.6.2 표는 원문 이미지 — `kcsc_formula('KDS 14 30 10','4.8.1.4')`
  등으로 그림을 직접 보고 옮길 것.
  ★철도교는 이 트리의 적용 범위 밖 — 철도교 안건이면 멈추고 원문을 볼 것.

