부재: 하중조합
단면: 도로교
설계법: 한계상태설계법
근거: KDS 24 12 11  # 교량 설계하중조합(한계상태설계법)
목표검토: "총 설계하중 Q = Σ ηi·γi·Qi  (식 4.1-1) — 적용 가능한 **모든** 하중조합에 대해"

입력:
  - {기호: η,  설명: "하중수정계수 (KDS 24 10 11 1.3.2)",       단위: "-"}
  - {기호: γi, 설명: "하중계수 (표 4.1-1 · 표 4.1-2)",          단위: "-"}
  - {기호: Qi, 설명: "하중 또는 하중효과 (KDS 24 12 21)",        단위: "-"}
  - {기호: 한계상태, 설명: "극한 / 극단상황 / 사용 / 피로",       단위: "-"}
  - {기호: 조합,     설명: "극한Ⅰ~Ⅴ · 극단상황Ⅰ~Ⅱ · 사용Ⅰ~Ⅴ · 피로", 단위: "-"}

흐름:
  - 단계: "1"
    이름: 교량 종류 확인
    근거: "KDS 24 12 11  4.1"
    작업: 판정
    식위치: "표 4.1-1 은 **도로교**, 표 4.1(철)-1 은 **철도교** — 하중계수가 다르다
             (예: 극한Ⅰ 활하중계수 도로교 1.80 / 철도교 1.85, 철도교에는 극단상황Ⅲ 이 더 있다)"
    # ★철도교는 이 트리의 적용 범위 밖이다(철도교는 KDS 24 10 10 계열 별도 기준). 그래도 분기는 남긴다 —
    #   철도교 안건이 들어왔을 때 **도로교 계수로 조용히 진행되는 것**이 제일 위험하다.
    #   여기서 멈추고 원문 표를 보게 한다.
    분기:
      - {조건: "도로교", 결과: "표 4.1-1 적용", 다음: "2"}
      - {조건: "철도교", 결과: "⛔ 이 트리를 쓰면 안 된다 — 표 4.1(철)-1 을 원문에서 확인할 것 (이 트리의 적용 범위 밖)",
         다음기준: "KDS 24 12 11  4.1"}

  - 단계: "2"
    이름: 하중수정계수 η 확인
    근거: "KDS 24 12 11  4.1"
    작업: 산정
    식위치: >
      식 (4.1-1) 의 η — 연성·여용성·중요도에서 온다. KDS 24 10 11(1.3.2).
      ★실무에서는 **통상 1.0** 을 적용한다. 1.0 이 아닌 경우는 드물다.
    다음기준: "KDS 24 10 11  1.3.2"
    출력: η

  - 단계: "3"
    이름: 하중의 종류와 크기 산정
    근거: "KDS 24 12 11  4.1"
    작업: 산정
    식위치: "DC·DW·EH·EV·ES·EL·PS·CR·SH(상시) / LL·IM·BR·PL·LS·CF(활하중계) /
             WA·WS·WL·FR·TU·TG / EQ·IC·CT·CV(극단상황). 값은 KDS 24 12 21"
    다음기준: "KDS 24 12 21  4"
    출력: Qi

  # ── [4]~[8] 은 **고르는 것이 아니라 펼치는 것**이다. ─────────────────────────
  #   처음엔 "한계상태 하나 고르기 → 조합 하나 고르기 → 남은 것 있으면 되돌아가기" 로
  #   짰다가 바로잡았다. 하중조합은 표에 **전부 늘어놓고** 각 하중에 계수를 곱해 합산하는
  #   작업이지 하나씩 순회하는 작업이 아니다. 되돌이는 모델링이 잘못돼서 생겼던 것이다.
  - 단계: "4"
    이름: ★검토 대상 조합 전개
    근거: "KDS 24 12 11  4.1"
    작업: 판정
    식위치: >
      4.1(3) — **적절한 모든 하중조합에 대한 검토**가 이루어져야 한다.
      도로교(표 4.1-1)는 극한Ⅰ~Ⅴ · 극단상황Ⅰ~Ⅱ · 사용Ⅰ~Ⅴ · 피로 = **13개**.
      해당하지 않는 조합은 빼되, **뺀 이유를 계산서에 남긴다.**
    출력: 검토 대상 조합 목록

  - 단계: "5"
    이름: 극한한계상태 조합 Ⅰ~Ⅴ
    근거: "KDS 24 12 11  4.1"
    작업: 판정
    식위치: >
      4.1(2) ①~⑤ —
      Ⅰ 일반 차량통행(풍하중 없음) /
      Ⅱ 특수차량·통행허가차량(풍하중 없음) /
      Ⅲ 거더높이 풍속 25 m/s 초과, 풍하중 고려 /
      Ⅳ 활하중에 비해 고정하중이 매우 큰 경우 /
      Ⅴ 통행 가능 최대풍속 + 일상 차량통행
    출력: 극한 조합

  - 단계: "6"
    이름: 극단상황한계상태 조합 Ⅰ~Ⅱ
    근거: "KDS 24 12 11  4.1"
    작업: 판정
    식위치: "4.1(2) ⑥~⑦ — Ⅰ 지진하중 / Ⅱ 빙하중·선박·차량 충돌 및 감소된 활하중.
             ★극단상황Ⅰ의 활하중계수는 공사별 특별시방으로 정한다(4.1(9))"
    출력: 극단상황 조합

  - 단계: "7"
    이름: 사용한계상태 조합 Ⅰ~Ⅴ
    근거: "KDS 24 12 11  4.1"
    작업: 판정
    식위치: >
      4.1(2) ⑧~⑫ —
      Ⅰ 정상운용 + 풍하중 25 m/s (RC 사용성·옹벽/사면 안정) /
      Ⅱ 차량하중에 의한 강구조물 항복과 마찰이음부 미끄러짐 ★강교는 이것이 필수 /
      Ⅲ 부착 PS 강재 상부구조 균열폭·인장응력 /
      Ⅳ 하부구조(연직 활하중 대신 수평 풍하중) /
      Ⅴ 고정하중 + 수명 50% 지속하중
    출력: 사용 조합

  - 단계: "8"
    이름: 피로한계상태 조합
    근거: "KDS 24 12 11  4.1"
    작업: 판정
    식위치: "4.1(2) ⑬ — 피로설계트럭하중(KDS 24 12 21 4.3.2). 표에서 LL·IM·CF 만 고려"
    다음기준: "KDS 24 12 21  4.3.2"
    출력: 피로 조합

  - 단계: "9"
    이름: 하중계수 γ 적용 (표 4.1-1)
    근거: "KDS 24 12 11  4.1 + 표 4.1-1"
    작업: 산정
    식위치: "표 4.1-1 (도로교) 의 **각 조합 행**. 값의 상당수가 텍스트로 있으나
             상시하중 열(γp)과 TG·GD 는 〔그림〕 이다 — `kcsc_formula` 로 볼 것"
    출력: 조합별 γi

  - 단계: "10"
    이름: ★조합마다 — 상시하중 γp 의 최대·최소, 그리고 정·부 극한
    근거: "KDS 24 12 11  4.1"
    작업: 판정
    식위치: >
      ★이 둘은 **각 조합 안에서** 하는 일이다(조합 순회와 다른 층위).
      4.1(4) — 상시하중은 표 4.1-2 의 **두 값 중 하중조합효과가 큰 쪽**을 쓴다.
      다만 그 하중이 안정성·내하성능을 **증가**시키는 경우에는 **최소 계수**를 쓴다.
      (예: DC 는 1.25 / 0.90, 극한Ⅳ에서는 1.50)
      4.1(4) — **정과 부의 극한상태를 모두** 검토한다. 한 하중이 다른 하중의 효과를
      감소시키는 조합에서는 그 하중에 최소 계수를 적용한다.
      4.1(5) — TU·CR·SH 의 두 값 중 큰 값은 **변형량 계산**에만, 나머지는 작은 값.
    출력: 조합별 γp (정·부 각각)

  - 단계: "11"
    이름: 다차로재하계수 적용
    근거: "KDS 24 12 11  4.1"
    작업: 산정
    식위치: "4.1(3) — 필요시 KDS 24 12 21(4.3.1.2) 의 다차로재하계수를 곱한다"
    다음기준: "KDS 24 12 21  4.3.1.2"
    출력: 보정된 활하중

  - 단계: "12"
    이름: 조합별 총 설계하중 산정
    근거: "KDS 24 12 11  4.1"
    작업: 계산
    식위치: "식 (4.1-1) — Q = Σ ηi·γi·Qi 를 **조합마다** 계산한다.
             조합은 KDS 24 10 11(식 (1.3-1)) 에 따르고 마지막에 하중수정계수를 곱한다"
    출력: 조합별 Q

  - 단계: "13"
    이름: 조합별 단면력 정리 · 지배 조합 확인
    근거: "KDS 24 12 11  4.1"
    작업: 판정
    식위치: >
      검토 위치마다 조합별 단면력을 표로 정리하고 **어느 조합이 지배하는지** 확인한다.
      계산서에 전부 남길지, 지배 조합만 남길지는 설계자가 정한다 —
      다만 **조합을 훑는 것 자체는 빠뜨리면 안 된다**(4.1(3)).
    출력: 지배 조합 · 소요 단면력

  - 단계: "14"
    이름: 부재 검토로 넘긴다
    근거: "KDS 24 12 11  4.1"
    작업: 판정
    식위치: "산정한 소요강도로 부재를 검토한다. 강교는 KDS 24 14 31"
    다음트리: "강교 부재 / 전체 (진입 트리)"
    출력: 소요강도

  - 단계: "15"
    이름: 가설 시 하중계수 (해당하면)
    근거: "KDS 24 12 11  4.1.2"
    작업: 산정
    식위치: "4.1.2 — 구조물·부속물 중량 **1.25 이상**, 시공하중·설비하중·동적효과 **1.5 이상**,
             풍하중 **1.25 이상**, 나머지 1.0"
    출력: 가설 시 하중

  - 단계: "16"
    이름: 받침인상·포스트텐션 (해당하면)
    근거: "KDS 24 12 11  4.1.3"
    작업: 산정
    식위치: "4.1.3 — 설계인상력은 인상위치 최근접 지점 고정하중 반력의 **1.3배 이상**.
             교통통제가 없으면 활하중계수를 곱한 활하중 반력도 포함.
             포스트텐션 정착부 설계력은 최대 긴장력의 **1.2배**"
    출력: 인상력 · 정착부 설계력

안전주의: >
  ★★**도로교(표 4.1-1)와 철도교(표 4.1(철)-1)의 하중계수가 다르다.** 표를 잘못 고르면
  모든 조합이 통째로 틀린다. 이 트리는 **도로교 전용**이다.
  ★**적용 가능한 모든 하중조합을 검토해야 한다**(4.1(3)). 극한Ⅰ 하나만 보고 끝내면 안 된다.
  강교의 경우 **사용Ⅱ**(강구조물 항복·마찰이음부 미끄러짐)를 반드시 포함한다
  — KDS 24 14 31(4.1.2(2))이 그 조합을 지정한다.
  ★상시하중 γp 는 두 값 중 **하중조합효과가 큰 쪽**이다. 다만 그 하중이 안정성을 높이는
  방향이면 **최소 계수**를 쓴다(4.1(4)). 기계적으로 큰 값을 쓰면 위험측이 될 수 있다.
  TU·CR·SH 는 큰 값이 **변형량 계산에만** 쓰인다(4.1(5)).
  온도경사 γTG·침하 γSD 는 공사별 특별시방 우선. 없으면 4.1(7) ①~③.
  극단상황Ⅰ의 활하중계수는 공사별 특별시방으로 정한다(4.1(9)).

  ★하중수정계수 η 는 실무에서 **통상 1.0** 이다. 1.0 이 아닌 경우는 드물다.
  세그먼트방식 가설 교량의 사용한계상태 조합(4.1(8), 식 (4.1-2))은 이 트리에 없다 —
  실적 자료가 없어 넣지 않았다. 해당 공사가 생기면 원문 4.1(8) 을 따로 볼 것.

