부재: 인장부재
단면: 각형강관 (거셋플레이트 접합)
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 10  # 강구조 부재 설계기준 (하중저항계수설계법) 4.1 인장부재
목표검토: "설계인장강도 φt·Pn  ≥  소요인장강도 Pu"

입력:
  - {기호: B,   설명: "연결면에 대해 90°로 측정한 각형강관의 전체 폭 (★사례 6 의 B)", 단위: mm}
  - {기호: H,   설명: "연결면에서 측정한 각형강관의 전체 높이 (★사례 6 의 H)", 단위: mm}
  - {기호: t,   설명: "★설계벽두께 — ERW 0.93×공칭 / SAW 공칭", 단위: mm}
  - {기호: 제조법, 설명: "★전기저항용접 / 서브머지드 아크용접", 단위: "-"}
  - {기호: Ag,  설명: 총단면적,                       단위: mm^2}
  - {기호: An,  설명: "순단면적 (슬롯이면 Ag − 슬롯 전체 단면적)", 단위: mm^2}
  - {기호: Ae,  설명: 유효순단면적,                   단위: mm^2}
  - {기호: U,   설명: "전단뒤짐계수 (★각형강관은 표 4.1-1 사례 6)", 단위: "-"}
  - {기호: l,   설명: "접합(용접) 길이 — 사례 6 의 U 산정",  단위: mm}
  - {기호: 거셋배치, 설명: "★하나의 동일 중심 거셋 / 양측면 거셋 — 사례 6 안에서 갈린다", 단위: "-"}
  - {기호: L,   설명: 부재 길이,                      단위: mm}
  - {기호: r,   설명: "단면2차반경 (약축)",            단위: mm}
  - {기호: Fy,  설명: 강재 항복강도,                  단위: MPa}
  - {기호: Fu,  설명: 강재 인장강도,                  단위: MPa}
  - {기호: Pu,  설명: 소요인장강도 (계수하중),        단위: kN}
  - {기호: 적용구분, 설명: "★건축·일반 / 교량 (세장비 제한이 다르다)", 단위: "-"}

흐름:
  - 단계: "1"
    이름: 인장 + 휨 조합인지 확인
    근거: "KDS 14 31 10  4.4.1.2"
    작업: 판정
    식위치: "4.4.1.2 — 휨이 함께 작용하면 상관식으로 검토한다"
    분기:
      - {조건: "휨이 함께 작용", 결과: "조합력 트리로",
         다음트리: "조합력부재 (인장 + 휨) / H형강"}
      - {조건: "순수 인장 (또는 조합력 트리에서 Tr 산출용으로 불려옴)", 결과: "이 트리를 계속", 다음: "2"}

  - 단계: "2"
    이름: 설계벽두께·세장비
    근거: "KDS 14 31 10  4.1.1"
    작업: 판정
    식위치: >
      ★설계벽두께 — **ERW 는 공칭의 0.93배**(4.2.1.1.2(1)④). 단면적 Ag·An 을 이 t 로
      계산한다. 인장은 좌굴이 없어 영향이 압축·휨보다 작지만 **Ag·An 이 7% 달라진다.**
      세장비(4.1.1) — 건축·일반은 권장 300, **교량은 실제 제한**(4.1.1(2)) — 계산서에
      제한값을 명시하고 설계자가 판단. 각형강관은 약축 r 로 잡는다.
    출력: "t · 세장비 판단"

  - 단계: "3"
    이름: ★순단면적 — 슬롯 강관 규정
    근거: "KDS 14 31 10  4.1.2.2"
    작업: 계산
    식위치: >
      4.1.2.2(3) — **"거셋플레이트에 슬롯이 있는 강관을 용접하는 경우 강관의 순단면적은
      총단면적에서 슬롯의 전체 단면적을 뺀 것으로 한다."** — 원형강관과 같은 규정이
      각형강관에도 적용된다(「강관」). 슬롯은 **양쪽 두 군데**.
      4.1.2.2(4) — 슬롯용접 용접재는 순단면적에 포함하지 않는다.
      볼트접합이면 (1)(2) 의 구멍 공제식.
    분기:
      - {조건: "슬롯 거셋플레이트 용접", 결과: "An = Ag − A슬롯", 다음: "4"}
      - {조건: "볼트접합",              결과: "구멍 공제 (4.1-1)(4.1-2)", 다음: "4"}
      - {조건: "구멍·슬롯 없음",         결과: "An = Ag", 다음: "4"}
    출력: An

  - 단계: "4"
    이름: ★유효순단면적 — 각형강관은 사례 6
    근거: "KDS 14 31 10  4.1.2.3 + 표 4.1-1"
    작업: 산정
    식위치: >
      **식 (4.1-3)** Ae = An·U.
      ★★**표 4.1-1 사례 6 = 「각형강관」** — 사례 안에서 **두 갈래**로 갈린다:
        **하나의 동일 중심 거셋플레이트**가 있는 경우 → U 식 (B·H·l 함수, 이미지)
        **양측면에 거셋플레이트**가 있는 경우 → 다른 U 식(이미지)
      B 는 **연결면에 대해 90°로 잰 전체 폭**, H 는 **연결면에서 잰 전체 높이**
      (표 주 — 글자로 정의돼 있다). **방향을 바꿔 넣으면 U 가 틀린다.**
      ⛔사례 5 는 **원형강관**, 사례 2 는 "강관을 제외한" — 각형강관에 쓸 수 없다.
      ★4.1.2.3(2) 의 U 하한(연결요소 면적비)은 **강관과 같은 폐단면에는 적용하지
      않는다** — 원형강관과 같은 사정.
    분기:
      - {조건: "하나의 동일 중심 거셋", 결과: "사례 6 첫째 식", 다음: "5A"}
      - {조건: "양측면 거셋",           결과: "사례 6 둘째 식", 다음: "5A"}
      - {조건: "각 요소에 직접 전달",   결과: "사례 1", 다음: "5A"}
    출력: Ae

  # ── [5A]·[5B] 는 **병렬**이다. 둘 다 산정하고 [6] 에서 작은 값.
  - 단계: "5A"
    이름: "〔병렬〕 총단면의 항복 한계상태"
    근거: "KDS 14 31 10  4.1.3.1"
    작업: 산정
    식위치: "**식 (4.1-4)** — Pn = Fy·Ag. 저항계수 φt 는 원문"
    출력: φtPn(항복)

  - 단계: "5B"
    이름: "〔병렬〕 유효순단면의 파단 한계상태"
    근거: "KDS 14 31 10  4.1.3.2"
    작업: 산정
    식위치: "**식 (4.1-5)** — Pn = Fu·Ae. ★φt 가 항복(4.1.3.1)과 **다르다**"
    출력: φtPn(파단)

  - 단계: "6"
    이름: 설계인장강도 결정
    근거: "KDS 14 31 10  4.1.3"
    작업: 판정
    식위치: "4.1.3(1) — 두 한계상태 중 **작은 값**"
    출력: φtPn

  - 단계: "7"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.1.3"
    작업: 판정
    식위치: >
      Pu ≤ φt·Pn 이면 OK.
      ★**NG 면 여기서 끝난다.** 단면 변경은 계산서에서 설계자가 한다.
      **후행작업은 OK 인 경우에만.**
    출력: "OK / NG"

  - 단계: "8"
    이름: 후행작업 체크리스트 — OK 인 경우에만
    근거: "KDS 14 31 10  4.1"
    작업: 판정
    식위치: >
      **배타 선택이 아니라 체크리스트**다 — 해당하는 것을 **모두** 검토한다.
        □ **슬롯 거셋플레이트 용접**접합인가 → [9]  (용접 기준 소관)
        □ **이음·연결부**가 있는가 (볼트/용접 불문) → [10]
      해당 없으면 그대로 종료한다.
    출력: 해당 항목 목록

  - 단계: "9"
    이름: 슬롯 거셋플레이트라는 것을 기록 (해당하면)
    근거: "KDS 14 31 25  4.1.2"
    작업: 판정
    식위치: >
      슬롯 거셋플레이트는 **「용접」 상세**(4.1.2.2(3) "…용접하는 경우"). 슬롯에 끼운
      거셋 둘레 용접은 **필릿용접**(표 4.1-8). 연결부 설계 단계에서 용접 기준(4.1.2)으로
      검토한다. ★관 절개부의 **거셋 방향 tear-out** 을 볼 것.
    출력: "용접 상세임 (연결부 설계 단계에서 4.1.2)"

  - 단계: "10"
    이름: ★연결부 있음 — 「연결부 설계」 단계로 (해당하면)
    근거: "KDS 14 31 10  4.1.2.3"
    작업: 판정
    식위치: >
      ★★**여기서는 「연결부가 있다」는 것만 기록한다.** 실무 순서 — 부재별 단면검토를
      전부 마친 뒤 「연결부 설계」 단계(진입 트리 `강교 부재 / 전체` 의 [9])에서
      볼트/용접을 한 번만 갈라 처리한다. 블록전단은 연결 기준(KDS 14 31 25 4.1.4.3).
      ★**부재가 OK 여도 접합부에서 파괴되면 그 부재는 못 쓴다.**
    출력: "연결부 있음 (형식은 연결부 설계 단계에서)"

  - 단계: "11"
    이름: 종료
    근거: "KDS 14 31 10  4.1.3"
    작업: 판정
    식위치: "부재 검토와 해당하는 후행작업이 모두 끝났다"
    출력: "OK"

안전주의: >
  ★★**전단뒤짐계수는 표 4.1-1 사례 6 — 각형강관 전용**이고, **거셋이 하나(동일 중심)냐
  양측면이냐**로 식이 다르다. B 는 연결면에 90°로 잰 폭, H 는 연결면에서 잰 높이 —
  **방향을 바꿔 넣으면 U 가 틀린다.** 원형강관 사례 5·H형강 사례 2/7 을 쓰면 안 된다.
  ★★**설계벽두께 0.93배(ERW)** — Ag·An 에 걸린다(4.2.1.1.2(1)④).
  ★슬롯 강관 순단면적 = Ag − 슬롯 전체(양쪽) — 4.1.2.2(3) 은 「강관」 일반 규정이라
  각형에도 적용. 4.1.2.3(2) 의 U 하한은 폐단면 미적용.
  ★두 한계상태의 φt 가 다르다 — 작은 쪽이 지배.
  ★세장비 — 건축 권장 300 / 교량 실제 제한(4.1.1(2)). 적용구분을 먼저.
  ★슬롯 거셋플레이트는 용접 상세 → 연결부 설계 단계에서 용접 기준.
  ★교량이면 φ 는 KDS 24 14 31 4.1.4.2. ★철도교는 이 트리의 적용 범위 밖 — 철도교 안건이면 멈추고 원문을 볼 것.

