부재: 피로파괴한계상태
단면: 강교 (하중유발·변형유발 피로 + 파괴인성)
설계법: 한계상태설계법
근거: KDS 24 14 31  # 강교 설계기준(한계상태설계법) 4.1.3 피로 및 파괴한계상태 · 4.2 피로 및 파단
위임근거: "KDS 24 14 31  4.2"
목표검토: "γ·(Δf) ≤ ΔFn (하중유발피로) + 변형유발피로 상세 + 파괴인성(샤르피·판두께)"

입력:
  - {기호: Δf,  설명: "피로설계하중 통과 시 활하중 응력범위",  단위: MPa}
  - {기호: γ,   설명: "피로한계상태조합의 하중계수",           단위: "-"}
  - {기호: 상세범주, 설명: "A / B / B' / C / C' / D / E / E' (4.1.2.3 표)", 단위: "-"}
  - {기호: N,   설명: "설계수명 동안의 응력범위 반복횟수",     단위: 회}
  - {기호: 볼트, 설명: "인장피로를 받는 고장력볼트가 있는가",   단위: "-"}
  - {기호: 온도구역, 설명: "★교량 건설 지역의 온도구역 Ⅰ/Ⅱ/Ⅲ (표 4.2-1)", 단위: "-"}
  - {기호: t,   설명: "인장·교번응력 주부재의 판두께 (★온도구역별 상한)", 단위: mm}

흐름:
  - 단계: "1"
    이름: 피로 하중 — 조합과 활하중이 따로 규정된다
    근거: "KDS 24 14 31  4.1.3"
    작업: 판정
    식위치: >
      4.1.3(2) — **피로한계상태조합**(KDS 24 12 11 표 4.1-1)과
      **피로 활하중**(KDS 24 12 21 4.3.2)을 적용한다.
      ★피로 활하중은 강도검토의 활하중과 **다른 모델**이다(단일 트럭·별도 충격) —
      강도용 활하중으로 피로를 검토하면 안 된다.
    다음트리: "하중조합 / 도로교"
    다음: "2"
    출력: "γ · 피로 활하중"

  - 단계: "2"
    이름: ★하중유발피로 — 상세범주부터
    근거: "KDS 14 31 20  4.1.2.3"
    위임근거: "KDS 24 14 31  4.2"
    작업: 판정
    식위치: >
      4.1.2.3 — 구조상세를 **상세범주 A ~ E'** 로 분류한다(범주 표는 원문 —
      용접·볼트 상세별 그림 포함).
      ★**범주를 잘못 고르면 피로강도가 몇 배 차이 난다** (A 의 피로한계 165 MPa ↔
      E' 17.9 MPa). 상세범주 분류가 피로 검토의 절반이다.
      ★구속을 줄이는 상세(4.1.2.4)를 먼저 반영하면 범주가 좋아지는 경우가 있다.
    출력: 상세범주

  - 단계: "3"
    이름: 설계기준과 공칭피로강도
    근거: "KDS 14 31 20  4.1.2.2"
    위임근거: "KDS 24 14 31  4.2"
    작업: 판정
    식위치: >
      **식 (4.1-1)** — γ·(Δf) ≤ ΔFn. (하중계수 × 활하중 응력범위 ≤ 공칭피로강도)
      공칭피로강도 ΔFn (4.1.2.5):
        일정진폭 → **식 (4.1-2)** / 변동진폭 → **식 (4.1-3)·(4.1-4)** (N 이 들어간다)
      ★**표 4.1-2 (일정진폭 피로한계값 — 글자 표)**:
        A 165.0 / B 110.0 / B' 82.7 / C 69.0 / C' 82.7 / D 48.3 / E 31.0 / E' 17.9 MPa
        볼트(축방향인장): F8T 100.0 / F10T 110.0 / F13T 80.0
      ★**표 4.1-3 (무한수명 공칭피로강도)**:
        A 82.5 / B 55.0 / … / E' 9.0 · 볼트 50.0/55.0/40.0
      ★(4) — N 이 컷오프 반복횟수를 초과하거나 **트럭 교통량을 명확히 규정할 수 없는
      경우** 무한수명 값(표 4.1-3)을 적용할 수 있다 — 교통량 자료가 없으면 이 길이다.
      ★(5) — 불연속 판을 하중 방향과 수직으로 필릿·부분용입 용접한 상세의 모재는
      **식 (4.1-5)** 의 보정(판두께·각장 반영)이 붙는다.
    출력: "ΔFn · 판정"

  - 단계: "4"
    이름: ★변형유발피로 — 응력계산 없이 상세로 잡는 균열
    근거: "KDS 14 31 20  4.1.3"
    위임근거: "KDS 24 14 31  4.2"
    작업: 판정
    식위치: >
      4.1.3 — **하중이 아니라 「변형」이 유발하는 피로**: 2차 변형이 몰리는 자리의
      상세 규정이다(응력범위 계산으로는 안 잡힌다).
        4.1.3.1 **수직연결판** — 복부판·수직보강재와 플랜지의 접합 상세
        4.1.3.2 **수평연결판** · 4.1.3.3 **강바닥판**
      ★플레이트거더 트리들(LRFD·ASD)에서 나온 "중간수직보강재를 인장플랜지에 붙이지
      않는다(이격)" 같은 상세가 **이 갈래의 뿌리**다 — 상세를 지키는 것이 검토다.
    출력: 변형유발피로 상세 확인

  - 단계: "5"
    이름: 플레이트거더·전단연결재의 피로 (해당하면)
    근거: "KDS 24 14 31  4.1.3"
    작업: 판정
    식위치: >
      4.1.3(3) — 플레이트거더는 **KDS 14 31 10 (4.3.3.2.5)** 를 만족해야 한다
      (웨브 굽힘·좌굴의 피로 조항).
      4.1.3(4) — 합성거더의 **전단연결재 피로는 KDS 14 31 10 (4.3.3.2.10)**.
    출력: 거더 피로 검토

  - 단계: "6"
    이름: ★볼트의 인장피로 (해당하면)
    근거: "KDS 24 14 31  4.1.3"
    작업: 판정
    식위치: >
      4.1.3(5) — 축방향 피로하중을 받는 고장력볼트:
        응력범위 = 충격 포함 피로 활하중 **+ 프라잉력**, **볼트 공칭직경** 기준으로 산정.
        KDS 14 31 20 식 (4.1-1) 을 만족할 것 (표 4.1-2 의 볼트 행 — F10T 110 MPa 등).
      ★**프라잉 작용력은 외부 하중에 의한 작용력의 60% 를 초과하면 안 된다.**
      프라잉 인장력은 **식 (4.1-1)**(KDS 24 14 31 쪽 — 연단거리·용접단거리·판두께).
      ★**ASTM A307 저탄소강 볼트는 피로하중 연결부에 사용 금지** (명문).
    출력: 볼트 피로 검토

  - 단계: "7"
    이름: ★★파괴인성 — 온도구역과 판두께 상한
    근거: "KDS 14 31 20  4.2"
    위임근거: "KDS 24 14 31  4.2"
    작업: 판정
    식위치: >
      4.2 — **인장 또는 교번응력을 받는 주부재**의 강재는:
      (1) **표 4.2-1 온도구역 (글자 표)** — 최저 공용온도 기준:
        Ⅰ (−15℃ 이상): 부산·울산·광주·전남·경남·경북(일부 제외)·제주
        Ⅱ (−25~−15℃): 서울·인천·대구·대전·충남·전북·경북 내륙·경기(동부 제외)
        Ⅲ (그 미만): 그 밖의 내륙·산간 (원문 확인)
      (2) **표 4.2-2** — 온도구역별 **샤르피 흡수에너지 규격**과 **최대 허용판두께**.
      ★★**같은 강종이라도 추운 지역이면 쓸 수 있는 최대 판두께가 줄어든다** —
      단면 설계 전에 확인해야 하는 제약이다. 두께를 정해 놓고 나중에 걸리면 단면을
      다시 짠다.
      (3) — 해당 주부재는 **도면·공사시방서에 명시**해야 한다(의무).
    출력: "인성 규격·판두께 상한 확인"

  - 단계: "8"
    이름: 검토(판정)
    근거: "KDS 24 14 31  4.1.3"
    작업: 판정
    식위치: >
      하중유발피로(식 4.1-1)·변형유발피로 상세·거더/전단연결재/볼트 피로·파괴인성이
      모두 만족하면 OK.
      ★**NG 면 상세를 바꾸는 문제**인 경우가 많다(범주가 좋은 상세로) — 단면 키우기보다
      상세 개선이 먼저다. 판단은 설계자.
    출력: "OK / NG"

  - 단계: "9"
    이름: 종료 — 진입 트리로 복귀
    근거: "KDS 24 14 31  4.1.3"
    작업: 판정
    식위치: >
      피로·파괴한계상태 검토가 끝났다. 진입 트리 `강교 부재 / 전체` 의 [6](강도)·
      [7](사용)과 **병렬**이다.
    출력: "OK"

안전주의: >
  ★★★**피로는 강도검토와 완전히 별개의 트랙이다** — 강도가 여유로워도 피로로
  파괴된다. 하중 모델(피로 활하중)·조합(피로한계상태조합)·검토 대상(응력범위)이
  전부 다르다.

  ★★★**상세범주 분류가 피로 검토의 절반이다** — A(165) 와 E'(17.9)는 피로한계가
  **9배** 차이 난다. 범주 표(4.1.2.3)는 원문 그림까지 봐야 한다.
  ★★★**파괴인성의 판두께 상한은 단면 설계 「전」에 확인**해야 한다(표 4.2-2) —
  추운 지역(온도구역 Ⅱ·Ⅲ)일수록 같은 강종의 최대 허용판두께가 줄어든다.
  해당 주부재는 **도면·시방서 명시 의무**(4.2(3)).

  ★★**변형유발피로는 응력 계산으로 안 잡힌다** — 수직·수평연결판, 강바닥판의
  **상세 규정**(4.1.3)을 지키는 것이 검토다. 플레이트거더 트리의 "수직보강재-인장플랜지
  이격" 상세와 같은 뿌리.
  ★★**볼트 인장피로** — 응력범위에 **프라잉력 포함**(외부 하중의 60% 상한),
  **공칭직경** 기준, **A307 볼트 금지**.
  ★교통량을 명확히 규정할 수 없으면 **무한수명 값(표 4.1-3)** 을 쓴다 — 자료가 없다고
  피로를 건너뛰는 것이 아니다.
  ★표 4.1-2·4.1-3·4.2-1 은 글자 표라 값을 옮겼다. 식 (4.1-1)~(4.1-5)·상세범주 표·
  표 4.2-2 는 원문(이미지 포함) — `kcsc_formula('KDS 14 31 20','4.1.2.5')` 등으로 볼 것.
  ★철도교는 이 트리의 적용 범위 밖 — 철도교 안건이면 멈추고 원문을 볼 것.

검증일: "2026-08-06"
검증기준:
  "KDS 241431": "2018"
  "KDS 143120": "2024"
검증: 설계자확정
