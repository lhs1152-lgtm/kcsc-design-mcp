부재: 압축부재
단면: 원형강관 (원형단면)
설계법: 하중저항계수설계법 (LRFD)
근거: KDS 14 31 10  # 강구조 부재 설계기준 (하중저항계수설계법)
목표검토: "설계압축강도 φc·Pn  ≥  소요압축강도 Pu"

입력:
  - {기호: D,  설명: 원형강관 외경,        단위: mm}
  - {기호: t,  설명: 관 두께,              단위: mm}
  - {기호: Ag, 설명: 총단면적,             단위: mm^2}
  - {기호: r,  설명: 단면2차반경,          단위: mm}
  - {기호: L,  설명: 부재 길이,            단위: mm}
  - {기호: K,  설명: 유효길이계수,          단위: "-"}
  - {기호: Fy, 설명: 강재 항복강도,         단위: MPa}
  - {기호: E,  설명: 강재 탄성계수(=210000), 단위: MPa}
  - {기호: Pu, 설명: 소요압축강도(계수하중), 단위: kN}

흐름:
  # ★2026-08-06 순서 정정: 원래 세장비 단계가 `1.5` 로 분류 단계 **뒤에** 있었는데,
  #   단계 1 이 2A/2B 로 갈라지면서 아무도 1.5 에 닿지 못했다(도달 불가).
  #   세장비는 분류 결과와 무관하게 먼저 구하면 되므로 앞으로 옮기고 번호를 다시 매겼다.
  #   `design_validate` 의 도달성 검사가 잡아낸 것이다. 계산 내용은 바꾸지 않았다.
  - 단계: "1"
    이름: 유효길이·세장비
    근거: "KDS 14 31 10  4.2.2"
    작업: 계산
    식위치: "세장비 = K·L / r"
    출력: 세장비

  - 단계: "2"
    이름: 단면의 세장판 분류
    근거: "KDS 14 31 10  4.2.1.1.3 + 표 4.2-2 (9행: 원형강관)"
    작업: 판정
    식위치: "표 4.2-2 9행 — 원형강관 폭두께비 = D/t, 한계값 λr (식은 원문 이미지)"
    분기:
      - {조건: "D/t ≤ λr", 결과: 비세장판, 다음: "2A"}
      - {조건: "D/t > λr", 결과: 세장판,   다음: "2B"}

  - 단계: "2A"
    이름: "비세장판 → 휨좌굴 압축강도"
    근거: "KDS 14 31 10  4.2.3 (비세장판 단면의 휨좌굴에 대한 압축강도)"
    작업: 산정
    식위치: "4.2.3 — 공칭압축강도 Pn = Fcr·Ag, 휨좌굴응력 Fcr 식(세장비 기반)은 원문"
    출력: Pn

  - 단계: "2B"
    이름: "세장판 → 국부좌굴+휨좌굴 압축강도"
    근거: "KDS 14 31 10  4.2.7 (세장판 단면을 가진 부재의 압축강도)"
    작업: 산정
    식위치: "4.2.7 — 국부좌굴 감소 반영한 Pn (원형강관 감소계수 포함)은 원문"
    출력: Pn

  - 단계: "3"
    이름: 설계압축강도 산정
    근거: "KDS 14 31 10  4.2.1 (1)"
    작업: 계산
    식위치: "설계압축강도 = φc · Pn  (φc = 강도저항계수, 값은 원문)"
    출력: φcPn

  - 단계: "4"
    이름: 검토(판정)
    근거: "KDS 14 31 10  4.2.1"
    작업: 판정
    식위치: "Pu ≤ φc·Pn 이면 OK, 아니면 NG"
    출력: "OK / NG"

안전주의: >
  표 4.2-1 원형강관 행 = 비세장판 4.2.3(휨좌굴) / 세장판 4.2.7(국부좌굴+휨좌굴).
  λr·Fcr·φc 등 실제 값·식은 반드시 KDS 14 31 10 원문(이미지)에서 확인.
  이 트리는 '흐름 안내'용이며 계산·최종판단은 설계자.

# ─────────────────────────────────────────────────────────────────────────────
# ★이 파일은 패키지에 동봉된 **예제**다. 형식을 보여 주려고 넣어 둔 것이지
#   그대로 설계에 쓰라고 넣은 것이 아니다. 그래서 `검증: 예제` 로 박아 둔다.
#   자기 회사 트리는 ~/.kcsc-mcp/flows/ 에 넣는다 — 그게 그 회사의 자산이고 책임이다.
#
# ★설계법 주의: 이 트리는 **하중저항계수설계법(LRFD) 전용**이다.
#   설계법 세 가지는 서로 다른 기준 계열이다 — 뭉뚱그리면 안 된다.
#     허용응력설계법(ASD)      → KDS 14 30 10  강구조 부재 설계기준(허용응력설계법)
#     하중저항계수설계법(LRFD)  → KDS 14 31 10  ← 이 트리
#     한계상태설계법            → KDS 24 14 31  강교 설계기준(한계상태설계법)  ※교량 계열
#   (ASD·한계상태 트리는 아직 없다)
# ─────────────────────────────────────────────────────────────────────────────
검증: 예제
